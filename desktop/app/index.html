functions primarily to", "choices": {"A": "describe how rotating savings associations operate", "B": "present evidence that undermines the view that savings associations are merely substitutes for banks", "C": "introduce the commitment explanation that the author goes on to defend", "D": "argue that formal banking has failed to reach most people in the regions discussed", "E": "show that surveys of savings association members are unreliable"}, "answer": "B", "explanation": {"argument_skeleton": "P2: 'The prediction has not held up well... If the associations were merely substitutes for banks, members with accounts would have little reason to stay.'", "why_correct": "The paragraph reports persistent membership among people with bank accounts and draws the consequence: the substitution view cannot explain why they stay. It sets up the need for a better explanation.", "why_wrong": {"A": {"trap": "SHELL_GAME", "text": "The first paragraph describes how associations work."}, "C": {"trap": "HALF_RIGHT", "text": "It creates the need for a new explanation, but the commitment view itself arrives in the third paragraph."}, "D": {"trap": "DIRECTION_FLIP", "text": "The paragraph says banking has become 'widely available' in the regions discussed."}, "E": {"trap": "OUT_OF_SCOPE", "text": "The surveys are cited as evidence, not challenged."}}, "method_reminder": "Paragraph function: summarize what the paragraph does to the previous one. Here it tests a prediction and finds it fails.", "flashcard": {"front": "Paragraph 2: members with bank accounts still join savings circles. Its job?", "back": "Evidence against the 'substitute for banks' view, setting up the need for a better explanation."}}, "original": true}, {"id": "RC-SOC-001-4", "section": "RC", "type": "Inference", "difficulty": 3, "target_seconds": 65, "tags": ["inference", "definition"], "stem": "The author would be most likely to agree with which one of the following statements?", "choices": {"A": "People who hold bank accounts save more successfully than members of savings associations.", "B": "Savings associations that let members bid for early turns work less well as commitment devices than those that assign turns by lot.", "C": "Social pressure is the only reason that people keep their commitments.", "D": "Some people value arrangements precisely because those arrangements restrict their own access to their money.", "E": "As banking spreads further, participation in savings associations will rise."}, "answer": "D", "explanation": {"argument_skeleton": "P3: a commitment device is 'an arrangement people adopt precisely because it limits their own future choices.'", "why_correct": "The author's explanation is that members join because the association limits what they can do with their money before the pot arrives. That commits the author to D.", "why_wrong": {"A": {"trap": "IRRELEVANT_COMPARISON", "text": "No comparison of savings success is made; if anything, the author suggests bank accounts alone help less with discipline."}, "B": {"trap": "OUT_OF_SCOPE", "text": "Both ways of assigning turns are mentioned, but neither is ranked."}, "C": {"trap": "EXTREME", "text": "Social pressure backs the schedule, but 'the only reason' for keeping any commitment is far beyond the passage."}, "E": {"trap": "TOO_STRONG", "text": "The passage reports that participation 'has remained high', not that it will grow."}}, "method_reminder": "Inference: the author's own definitions commit them to claims. Restate the definition in other words and look for the match.", "flashcard": {"front": "Commitment device: an arrangement adopted 'because it limits their own future choices.' What does the author accept?", "back": "Some people value arrangements precisely because they restrict access to their own money."}}, "original": true}, {"id": "RC-SOC-001-5", "section": "RC", "type": "RC Strengthen/Weaken", "difficulty": 4, "target_seconds": 75, "tags": ["strengthen", "rival-explanation"], "stem": "Which one of the following, if true, would most strengthen the author's explanation of why people join savings associations?", "choices": {"A": "In regions where savings associations are common, banks charge high fees for basic accounts.", "B": "Some savings associations have operated continuously for more than a century.", "C": "Members who report the greatest difficulty saving on their own are the most likely to join savings associations, even when they hold bank accounts.", "D": "Most members of savings associations use the pot to make large purchases.", "E": "Many economists now regard bank accounts as a poor substitute for savings associations."}, "answer": "C", "explanation": {"argument_skeleton": "Author's explanation (P3): associations are commitment devices for people who find money 'easily spent'. Rival (P1): they substitute for bank access.", "why_correct": "If the people who most struggle to save on their own are the most likely to join, even with bank accounts, that is exactly what the commitment explanation predicts and the substitution view does not.", "why_wrong": {"A": {"trap": "REVERSAL", "text": "High bank fees support the rival view that associations stand in for banking, so this cuts the wrong way."}, "B": {"trap": "OUT_OF_SCOPE", "text": "Longevity fits either explanation."}, "D": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Saving for large purchases is consistent with both views and favors neither."}, "E": {"trap": "RECYCLED_LANGUAGE", "text": "An appeal to opinion that reuses the word 'substitute' but adds no evidence about why people join."}}, "method_reminder": "RC Strengthen: pick the fact the author's explanation predicts and the rival does not. Facts that fit both explanations do not help.", "flashcard": {"front": "Explanation: savings circles are commitment devices. Best strengthener?", "back": "People who struggle most to save on their own join most often, even when they have bank accounts."}}, "original": true}, {"id": "RC-SOC-001-6", "section": "RC", "type": "Application", "difficulty": 3, "target_seconds": 65, "tags": ["application", "definition"], "stem": "Which one of the following arrangements is most clearly a commitment device in the sense in which the author uses that term?", "choices": {"A": "A writer gives a friend a sum of money, to be returned only if the writer finishes a chapter by the end of the month.", "B": "A homeowner buys insurance against damage from floods.", "C": "A shopper uses a credit card to buy something she could not otherwise afford yet.", "D": "A student opens a savings account that pays a high rate of interest.", "E": "A group of neighbors pools money to buy a lawn mower that they will share."}, "answer": "A", "explanation": {"argument_skeleton": "P3: a commitment device is 'an arrangement people adopt precisely because it limits their own future choices.'", "why_correct": "The writer deliberately puts money out of reach, recoverable only by doing what she intends, which binds her future self. That is the defining feature of a commitment device.", "why_wrong": {"B": {"trap": "OUT_OF_SCOPE", "text": "Insurance pools risk. It does not limit the buyer's own future choices."}, "C": {"trap": "DIRECTION_FLIP", "text": "Credit expands what the shopper can do now, the opposite of self-restriction."}, "D": {"trap": "HALF_RIGHT", "text": "Saving, yes, but like the bank account the author describes, it lets her withdraw whenever she likes."}, "E": {"trap": "MISMATCHED_STRUCTURE", "text": "Pooling money in a group looks like a savings circle on the surface, but nothing here binds anyone's future choices."}}, "method_reminder": "Application: test each case against the definition's essential feature, here a self-imposed limit on future choices, not against surface resemblance.", "flashcard": {"front": "Which is a commitment device: insurance, a credit card, a savings account, or money held until a goal is met?", "back": "Money held until the goal is met. It deliberately limits your own future choices."}}, "original": true}]}, {"id": "RC-CMP-003", "passage_type": "social_science", "comparative": true, "difficulty": 4, "title": "Licensing the Sidewalk", "text": ["In many large cities, thousands of people sell food and goods from carts and folding tables on public sidewalks without any permit. Many are recent arrivals or workers shut out of other jobs, and a fine that a storefront business would barely notice can erase a vendor's earnings for a week. Advocates for these vendors increasingly argue that cities should bring them into the formal economy through licensing. A licensed vendor can be inspected, which protects customers; can be held to rules about where carts may stand, which protects pedestrians and nearby storefront businesses; and, most important, can no longer be fined, have goods confiscated, or be arrested simply for working.", "Licensing also gives vendors something they have rarely had: a recognized place in the city's civic life. Licensed vendors can form associations that negotiate with officials, and they can contest unfair enforcement through ordinary channels rather than relying on the goodwill of individual officers. Licensing gives cities better information as well: officials who know where vendors work and what they sell can plan sidewalks, trash collection, and inspections accordingly. Cities that have issued licenses widely have generally found that complaints about vending decline once vendors have a stake in following the rules.", "Licensing sounds like protection, but its effects depend on a detail that advocates often pass over: the number of licenses. Cities that license vendors almost always cap the number of permits, often at a figure set decades ago and far below the number of people actually vending. Where caps are low, a license becomes a scarce asset. Permit holders rent their licenses to others at many times the official fee, and newcomers, typically the poorest vendors, are left to work without a license, now in violation of a regime that is enforced more strictly precisely because it exists. Caps are rarely revisited, because existing permit holders, whose licenses would lose value, form an organized constituency against raising them.", "The better model is registration rather than licensing. Under registration, any vendor who meets basic health and placement standards is entitled to a permit, so there is no scarcity to exploit and no class of permanently unlicensed workers. It is also cheaper to administer, since officials verify standards rather than ration permits. Registration preserves what is valuable in the advocates' proposal, including inspection, placement rules, and recognized standing for vendors, while removing the cap that turns a protection into a privilege. A city that wants fewer carts on a crowded block can still say so through placement rules, which limit where vendors work rather than whether they may work at all."], "text_labels": ["Passage A", "", "Passage B", ""], "model_margin_notes": ["A: license vendors: inspection, placement, no penalties", "A: civic standing; complaints fall", "B: caps make licenses scarce; poorest left out", "B: registration keeps the benefits, drops the cap"], "main_point": "A: Cities should license street vendors, protecting customers, pedestrians and vendors and giving vendors civic standing. B: Capped licensing creates scarcity and excludes the poorest vendors; uncapped registration keeps the benefits.", "author_attitude": "A: confident advocacy. B: sympathetic to the goals, critical of capped licensing, constructive.", "structure": "A presents a reform and its benefits. B identifies a flaw in the reform as usually implemented and proposes a modified version.", "questions": [{"id": "RC-CMP-003-1", "section": "RC", "type": "Comparative", "difficulty": 3, "target_seconds": 70, "tags": ["comparative", "relationship"], "stem": "Which one of the following most accurately characterizes the relationship between the two passages?", "choices": {"A": "Passage B argues that street vending should remain unregulated, contrary to Passage A.", "B": "Passage B presents evidence that licensing reduces complaints about vending, in support of Passage A.", "C": "Passage A responds to an objection raised in Passage B.", "D": "The passages disagree about whether vendors should be inspected for health standards.", "E": "Passage B accepts the goals that Passage A ascribes to licensing but argues that capped licensing undermines them, and it proposes an alternative."}, "answer": "E", "explanation": {"argument_skeleton": "A: license vendors (inspection, placement, freedom from penalties, civic standing). B: caps make licenses scarce; registration 'preserves what is valuable in the advocates' proposal... while removing the cap.'", "why_correct": "B keeps A's aims (inspection, placement rules, standing), attacks one feature of licensing as practiced, the cap, and offers registration. E states all three moves.", "why_wrong": {"A": {"trap": "VALENCE_FLIP", "text": "B proposes registration, which still regulates vendors."}, "B": {"trap": "RECYCLED_LANGUAGE", "text": "The complaint statistic appears in A; B never mentions it."}, "C": {"trap": "DIRECTION_FLIP", "text": "The direction is reversed: B responds to A's proposal."}, "D": {"trap": "HALF_RIGHT", "text": "Both passages discuss inspection, but they agree on it; B lists it among the valuable features."}}, "method_reminder": "Comparative relationship: look for what the second passage keeps and what it changes. 'Same goals, different means' is a common pairing.", "flashcard": {"front": "A: license vendors. B: caps ruin licensing; register them instead. Relationship?", "back": "B shares A's goals but argues capped licensing defeats them, and proposes registration."}}, "original": true}, {"id": "RC-CMP-003-2", "section": "RC", "type": "Comparative", "difficulty": 4, "target_seconds": 70, "tags": ["comparative", "disagreement"], "stem": "The authors of the two passages would be most likely to disagree about which one of the following?", "choices": {"A": "whether vendors should be subject to rules about where they may set up", "B": "whether the poorest vendors are typically newcomers", "C": "whether licensing is the approach cities should take to regulating street vendors", "D": "whether vendors should have a recognized standing in civic life", "E": "whether registration would be preferable to an uncapped licensing system"}, "answer": "C", "explanation": {"argument_skeleton": "A: 'cities should bring them into the formal economy through licensing.' B: 'The better model is registration rather than licensing.'", "why_correct": "A recommends licensing; B says registration is the better model. Each author takes a side on C, and the sides conflict.", "why_wrong": {"A": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Both favor placement rules; B lists them among the valuable features."}, "B": {"trap": "OUT_OF_SCOPE", "text": "Only B addresses newcomers."}, "D": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Both value vendors' recognized standing."}, "E": {"trap": "OUT_OF_SCOPE", "text": "B's registration has no cap, and A never discusses caps or registration, so neither author compares these two systems."}}, "method_reminder": "Disagreement: each author must take a position, and the positions must conflict. Shared values and one-author facts are traps.", "flashcard": {"front": "A wants licensing; B wants registration. What do they disagree about?", "back": "Whether licensing is the right approach. Not inspection, placement rules, or civic standing, which both accept."}}, "original": true}, {"id": "RC-CMP-003-3", "section": "RC", "type": "Function", "difficulty": 3, "target_seconds": 60, "tags": ["function", "example"], "stem": "In Passage B, the discussion of permit holders who rent their licenses to others serves primarily to", "choices": {"A": "illustrate how a cap on licenses turns them into scarce assets that can be exploited", "B": "show that most licensed vendors have stopped selling goods themselves", "C": "suggest that the official fee for a license is set too low", "D": "provide evidence that complaints about vending decline after licensing", "E": "argue that renting licenses should be made illegal"}, "answer": "A", "explanation": {"argument_skeleton": "B: 'Where caps are low, a license becomes a scarce asset. Permit holders rent their licenses to others at many times the official fee.'", "why_correct": "Renting at many times the fee is what scarcity looks like in practice. The example shows the cap turning a permit into an asset that holders can exploit.", "why_wrong": {"B": {"trap": "EXTREME", "text": "The passage says permit holders rent licenses, not that most have stopped vending."}, "C": {"trap": "RECYCLED_LANGUAGE", "text": "It mentions the fee only to show how far rents exceed it; the fee's level is not the issue."}, "D": {"trap": "OUT_OF_SCOPE", "text": "The complaint statistic belongs to Passage A."}, "E": {"trap": "TOO_STRONG", "text": "B's remedy is registration, not a ban on renting."}}, "method_reminder": "Function: an example usually illustrates the claim stated just before it, here that a capped license 'becomes a scarce asset'.", "flashcard": {"front": "Permit holders rent licenses at many times the fee. Why does Passage B mention this?", "back": "To show caps turn licenses into scarce, exploitable assets."}}, "original": true}, {"id": "RC-CMP-003-4", "section": "RC", "type": "Inference", "difficulty": 3, "target_seconds": 65, "tags": ["inference", "hedged-language"], "stem": "Which one of the following can most reasonably be inferred from Passage B?", "choices": {"A": "Registration systems eliminate all unlicensed vending.", "B": "Under a licensing system with a low cap, some vendors may face harsher enforcement than they did before the system existed.", "C": "Most cities that cap licenses set their caps within the last decade.", "D": "Vendors who meet health and placement standards can usually obtain licenses under capped systems.", "E": "The author of Passage A opposes registration."}, "answer": "B", "explanation": {"argument_skeleton": "B: newcomers 'are left to work without a license, now in violation of a regime that is enforced more strictly precisely because it exists.'", "why_correct": "B says unlicensed newcomers now work under a regime enforced more strictly because it exists. So, compared with before, some vendors may face harsher enforcement. B keeps the hedge.", "why_wrong": {"A": {"trap": "EXTREME", "text": "B says registration leaves 'no class of permanently unlicensed workers', which is not the same as ending all unlicensed vending."}, "C": {"trap": "DIRECTION_FLIP", "text": "B says caps are often set 'decades ago'."}, "D": {"trap": "RECYCLED_LANGUAGE", "text": "Health and placement standards are the entry rule under registration. Under caps, meeting them does not guarantee a permit."}, "E": {"trap": "OUT_OF_SCOPE", "text": "Passage A never mentions registration."}}, "method_reminder": "Inference: find a sentence whose consequence is the answer, and prefer hedged answers ('may', 'some') over sweeping ones.", "flashcard": {"front": "Passage B: unlicensed newcomers face a regime 'enforced more strictly precisely because it exists.' Inference?", "back": "Some vendors may face harsher enforcement under a capped system than before it existed."}}, "original": true}, {"id": "RC-CMP-003-5", "section": "RC", "type": "Application", "difficulty": 4, "target_seconds": 75, "tags": ["application", "mechanism"], "stem": "Suppose a city with a capped licensing system doubles the number of permits it issues but keeps a cap at the new, higher figure. The author of Passage B would most likely say that this change", "choices": {"A": "fully resolves the problems the author identifies", "B": "makes the problems worse by increasing the value of each license", "C": "is irrelevant, because the number of licenses has no effect on vendors", "D": "would help only if the new figure reached the number of people actually vending, since any cap below that number would keep licenses scarce", "E": "would be preferable to adopting a registration system"}, "answer": "D", "explanation": {"argument_skeleton": "B: problems arise when caps are 'far below the number of people actually vending', so 'a license becomes a scarce asset'. Registration removes 'the cap that turns a protection into a privilege'.", "why_correct": "For B, scarcity comes from a cap set below the number of vendors. Doubling the cap eases scarcity only if it reaches that number; otherwise licenses stay scarce and newcomers stay excluded.", "why_wrong": {"A": {"trap": "EXTREME", "text": "B objects to caps as such, and a new cap could still fall short."}, "B": {"trap": "DIRECTION_FLIP", "text": "More permits make each one less scarce, not more valuable."}, "C": {"trap": "VALENCE_FLIP", "text": "B calls the number of licenses the crucial detail."}, "E": {"trap": "OUT_OF_SCOPE", "text": "B prefers registration, which removes the cap entirely; nothing suggests a higher cap would be better."}}, "method_reminder": "Application: run the hypothetical through the author's mechanism. Here the mechanism is cap below demand → scarcity → exclusion.", "flashcard": {"front": "A city doubles its vendor permits but keeps a cap. Passage B's verdict?", "back": "It helps only if the cap now reaches the number of vendors; below that, licenses stay scarce."}}, "original": true}, {"id": "RC-CMP-003-6", "section": "RC", "type": "Primary Purpose", "difficulty": 3, "target_seconds": 60, "tags": ["primary-purpose", "comparative"], "stem": "The author of Passage B is primarily concerned with", "choices": {"A": "defending the practice of fining vendors who work without permits", "B": "identifying a problem in a common form of a proposed reform and recommending a modified version of it", "C": "explaining why cities first began licensing street vendors", "D": "comparing how vendors fare in several different cities", "E": "arguing that street vending harms storefront businesses"}, "answer": "B", "explanation": {"argument_skeleton": "B: licensing's effects 'depend on a detail that advocates often pass over: the number of licenses.' Then: 'The better model is registration.'", "why_correct": "B finds the flaw in licensing as usually practiced, the cap, and proposes registration, which keeps the reform's benefits without it. B describes that pattern.", "why_wrong": {"A": {"trap": "VALENCE_FLIP", "text": "B criticizes how capped systems penalize unlicensed newcomers. It does not defend fines."}, "C": {"trap": "OUT_OF_SCOPE", "text": "The origins of licensing are never discussed."}, "D": {"trap": "OUT_OF_SCOPE", "text": "No city-by-city comparison is made."}, "E": {"trap": "RECYCLED_LANGUAGE", "text": "Storefront businesses appear only in Passage A, as beneficiaries of placement rules."}}, "method_reminder": "Primary Purpose for one passage of a pair: summarize what that author does in two verbs (here, diagnose and recommend) and match.", "flashcard": {"front": "Passage B finds caps ruin licensing and proposes registration. Its purpose?", "back": "To identify a flaw in a common version of a reform and recommend a modified version."}}, "original": true}]}, {"id": "RC-NAT-001", "passage_type": "natural_science", "comparative": false, "difficulty": 4, "title": "The Network Beneath the Forest", "text": ["Beneath a forest floor, the roots of most trees are joined to fungi in a partnership known as mycorrhiza: the fungus draws sugars from the tree and, in return, extends the tree's reach for water and minerals through a web of fine filaments. Because a single fungus can connect to several trees, and a single tree to several fungi, the roots of a forest may be linked into what researchers call a common mycorrhizal network. In recent decades this network has become the basis of a striking popular picture: trees, it is said, use the fungal web to share food with their offspring, warn neighbors of insect attacks, and support struggling members of their community. In some versions, the oldest trees act as hubs that nurture the young growing around them.", "Each element of that picture rests on findings of different strength. That networks exist is well established; researchers have traced individual fungi linking dozens of trees. That carbon can pass from one tree to another has also been shown, in experiments in which trees were fed carbon dioxide containing a traceable isotope that later turned up in neighboring seedlings. What remains far less certain is whether such transfers are large enough to matter to the receiving plant, and whether the carbon traveled through the fungus at all rather than leaking from roots into the soil and being absorbed by the seedlings directly. Most of these experiments, moreover, used young seedlings grown in greenhouses or small plots.", "The leap from transfer to purpose is weaker still. To say that a parent tree 'sends' carbon to its offspring implies that the tree directs resources toward particular recipients. Yet a fungus connected to many trees has interests of its own: it may move carbon wherever its own growth demands, regardless of which tree supplied it. A seedling that receives carbon may be benefiting not from a parent's generosity but from a fungus's business, much as a town may prosper from a trade route that no one built for its sake.", "None of this shows that the popular picture is false. It shows that the picture has run ahead of the evidence, and that the experiments needed to support it are harder than they look. Distinguishing transfer through the network from leakage through soil requires barriers fine enough to block fungal filaments while allowing water to pass, and distinguishing a tree's 'sharing' from a fungus's trading requires knowing which partner controls the flow. Few field studies to date have met either standard. Until such experiments are done in mature forests rather than in pots and small plots, the forest's network is best described as a fact whose meaning is unknown."], "model_margin_notes": ["Mycorrhizal networks; popular picture: trees share, warn, support", "Networks proven; transfer shown; amount and route uncertain", "Transfer is not purpose: the fungus may move carbon for itself", "Not false, but unproven; mature-forest experiments needed"], "main_point": "Fungal networks linking trees are well established, but popular claims that trees use them to share resources purposefully outrun the evidence.", "author_attitude": "Cautiously skeptical: doubts the popular picture without declaring it false.", "structure": "P1 the network and the popular picture. P2 sorts the findings by strength. P3 challenges the inference from transfer to purpose. P4 concludes the evidence is insufficient and names the experiments needed.", "questions": [{"id": "RC-NAT-001-1", "section": "RC", "type": "Main Point", "difficulty": 3, "target_seconds": 65, "tags": ["main-point"], "stem": "Which one of the following most accurately expresses the main point of the passage?", "choices": {"A": "Trees use fungal networks to share food with their offspring and to warn their neighbors of danger.", "B": "Common mycorrhizal networks do not actually exist in mature forests.", "C": "Although fungal networks linking trees clearly exist, popular claims that trees use them to share resources go beyond what the current evidence supports.", "D": "Isotope experiments have proven that carbon moves between trees through fungal filaments.", "E": "Fungi, rather than trees, control the movement of carbon through mycorrhizal networks."}, "answer": "C", "explanation": {"argument_skeleton": "P2: 'That networks exist is well established.' 'What remains far less certain...' P3: 'The leap from transfer to purpose is weaker still.' P4: 'the picture has run ahead of the evidence.'", "why_correct": "C keeps both sides of the author's verdict: the network is real, and the popular story about sharing outruns the evidence.", "why_wrong": {"A": {"trap": "EMPHASIS_ENDORSEMENT", "text": "This is the popular picture the author says has 'run ahead of the evidence'. Space in the first paragraph is not endorsement."}, "B": {"trap": "VALENCE_FLIP", "text": "The author calls the existence of networks 'well established'."}, "D": {"trap": "EXTREME", "text": "The author says it is uncertain whether the carbon traveled through the fungus at all."}, "E": {"trap": "TOO_STRONG", "text": "The author raises fungal control as a possibility that experiments would need to settle, not as a finding."}}, "method_reminder": "Main Point in science passages: separate what the author calls established from what is speculative. The thesis often lives on that boundary.", "flashcard": {"front": "Networks proven; sharing unproven. Main point?", "back": "The networks exist, but claims that trees use them to share resources outrun the evidence."}}, "original": true}, {"id": "RC-NAT-001-2", "section": "RC", "type": "Author's Attitude", "difficulty": 3, "target_seconds": 60, "tags": ["attitude"], "stem": "The author's attitude toward the popular picture described in the first paragraph is best described as", "choices": {"A": "cautious skepticism that stops short of rejecting it", "B": "enthusiastic endorsement", "C": "outright rejection of it as unfounded", "D": "indifference, since the questions it raises cannot be tested", "E": "reluctant acceptance based on recent experiments"}, "answer": "A", "explanation": {"argument_skeleton": "P4: 'None of this shows that the popular picture is false. It shows that the picture has run ahead of the evidence.'", "why_correct": "The author doubts the picture's claims but explicitly declines to call it false: skepticism, carefully limited.", "why_wrong": {"B": {"trap": "VALENCE_FLIP", "text": "The author says the picture has 'run ahead of the evidence'."}, "C": {"trap": "EXTREME", "text": "The author says 'None of this shows that the popular picture is false'."}, "D": {"trap": "VALENCE_FLIP", "text": "The author describes the experiments that could test it, so it is testable in principle, and the author plainly cares."}, "E": {"trap": "HALF_RIGHT", "text": "'Reluctant' fits the tone, but the author does not accept the picture."}}, "method_reminder": "Attitude: find the sentence where the author rules something in or out. 'None of this shows X is false' marks skepticism, not rejection.", "flashcard": {"front": "'None of this shows that the popular picture is false. It shows that the picture has run ahead of the evidence.' Attitude?", "back": "Cautious skepticism: doubts the picture without rejecting it."}}, "original": true}, {"id": "RC-NAT-001-3", "section": "RC", "type": "Function", "difficulty": 3, "target_seconds": 60, "tags": ["function", "analogy"], "stem": "The author's reference to a town that prospers from a trade route (third paragraph) serves primarily to", "choices": {"A": "show that fungi are more important to forests than trees are", "B": "suggest that trees deliberately build fungal networks for the benefit of their offspring", "C": "illustrate how carbon leaks from roots into the soil", "D": "illustrate how a recipient can benefit from a flow of resources that was not directed toward it for its own sake", "E": "establish that the popular picture of forest networks is false"}, "answer": "D", "explanation": {"argument_skeleton": "P3: 'A seedling that receives carbon may be benefiting not from a parent's generosity but from a fungus's business, much as a town may prosper from a trade route that no one built for its sake.'", "why_correct": "The town benefits from a route built for other purposes, just as a seedling might gain carbon moved by a fungus for its own reasons. The analogy separates benefit from purpose.", "why_wrong": {"A": {"trap": "IRRELEVANT_COMPARISON", "text": "The analogy concerns why resources flow, not which organism matters more."}, "B": {"trap": "DIRECTION_FLIP", "text": "It suggests the opposite: benefit without anyone intending it."}, "C": {"trap": "RECYCLED_LANGUAGE", "text": "Leakage is a different alternative, raised in the second paragraph."}, "E": {"trap": "EXTREME", "text": "The author says none of this shows the picture is false."}}, "method_reminder": "Analogy as a device: state the relationship it models (benefit without intent), then match it to the claim it supports.", "flashcard": {"front": "Why compare a seedling to a town on a trade route no one built for it?", "back": "To show a recipient can benefit from a flow of resources not directed toward it."}}, "original": true}, {"id": "RC-NAT-001-4", "section": "RC", "type": "Detail", "difficulty": 3, "target_seconds": 60, "tags": ["detail", "evidence-strength"], "stem": "According to the passage, the isotope experiments described in the second paragraph showed that", "choices": {"A": "the carbon transferred between trees is enough to benefit the seedlings that receive it", "B": "carbon moves between trees only through fungal filaments", "C": "parent trees direct carbon specifically toward their own offspring", "D": "fungi control the flow of carbon through the network", "E": "carbon taken up by one tree can later turn up in neighboring seedlings"}, "answer": "E", "explanation": {"argument_skeleton": "P2: 'trees were fed carbon dioxide containing a traceable isotope that later turned up in neighboring seedlings.'", "why_correct": "E restates the result: labeled carbon from one tree appeared in nearby seedlings. The experiments showed transfer and nothing more.", "why_wrong": {"A": {"trap": "TOO_STRONG", "text": "Whether transfers are 'large enough to matter' is exactly what remains 'far less certain'."}, "B": {"trap": "EXTREME", "text": "Whether the carbon traveled through the fungus at all is still open."}, "C": {"trap": "OUT_OF_SCOPE", "text": "Direction toward particular recipients is the 'leap from transfer to purpose' the author calls weaker still."}, "D": {"trap": "RECYCLED_LANGUAGE", "text": "Which partner controls the flow is something future experiments must determine."}}, "method_reminder": "Detail in science passages: separate what an experiment showed from what others infer from it. Answers that claim the inference are traps.", "flashcard": {"front": "What did the isotope experiments establish about forest networks?", "back": "Only that carbon from one tree can turn up in nearby seedlings. Not the route, the amount, or any purpose."}}, "original": true}, {"id": "RC-NAT-001-5", "section": "RC", "type": "RC Strengthen/Weaken", "difficulty": 5, "target_seconds": 85, "tags": ["strengthen", "evidence-gap"], "stem": "Which one of the following findings, if obtained in a mature forest, would most directly address the author's doubts about the claim that parent trees 'send' carbon to their offspring?", "choices": {"A": "Labeled carbon from a parent tree appears in seedlings growing near it.", "B": "Labeled carbon from parent trees reaches their own offspring in much larger amounts than it reaches unrelated seedlings that are equally connected to the same fungi.", "C": "Fungi connected to many trees grow faster than fungi connected to few trees.", "D": "Seedlings grown without fungi survive less often than seedlings grown with them.", "E": "Large amounts of carbon leak from tree roots into the surrounding soil."}, "answer": "B", "explanation": {"argument_skeleton": "P3: 'sends' implies 'the tree directs resources toward particular recipients'; a fungus 'may move carbon wherever its own growth demands, regardless of which tree supplied it.'", "why_correct": "The doubt is that carbon flows without regard to recipient. If a parent's carbon favors its own offspring over equally connected strangers, the flow is directed toward particular recipients, which is what 'sending' implies.", "why_wrong": {"A": {"trap": "RESTATES_PREMISE", "text": "Transfer to nearby seedlings is already shown. It does not show direction toward offspring."}, "C": {"trap": "OUT_OF_SCOPE", "text": "Faster fungal growth, if anything, fits the view that fungi pursue their own interests."}, "D": {"trap": "TRUE_BUT_IRRELEVANT", "text": "This shows the partnership helps seedlings, not that parents direct carbon to them."}, "E": {"trap": "REVERSAL", "text": "This supports the leakage alternative, deepening the author's doubts."}}, "method_reminder": "When an author doubts a claim, find the specific gap the author names, here direction toward particular recipients, and pick the finding that fills exactly that gap.", "flashcard": {"front": "The doubt: carbon may flow regardless of recipient. What finding addresses it?", "back": "Parents' carbon going preferentially to their own offspring over equally connected strangers."}}, "original": true}, {"id": "RC-NAT-001-6", "section": "RC", "type": "Inference", "difficulty": 3, "target_seconds": 60, "tags": ["inference"], "stem": "It can be inferred that the author regards experiments conducted 'in pots and small plots' (last paragraph) as", "choices": {"A": "worthless for understanding mycorrhizal networks", "B": "more reliable than experiments in mature forests would be", "C": "insufficient on their own to establish how networks function in mature forests", "D": "responsible for spreading the popular picture of forest networks", "E": "designed mainly to test the leakage hypothesis"}, "answer": "C", "explanation": {"argument_skeleton": "P4: 'Until such experiments are done in mature forests rather than in pots and small plots, the forest's network is best described as a fact whose meaning is unknown.'", "why_correct": "The author wants the decisive experiments done in mature forests, which implies that results from pots and small plots, however useful, cannot settle how networks behave there.", "why_wrong": {"A": {"trap": "EXTREME", "text": "The complaint is that such studies cannot settle the question for mature forests, not that they teach nothing."}, "B": {"trap": "DIRECTION_FLIP", "text": "The author's 'until' signals the opposite preference."}, "D": {"trap": "OUT_OF_SCOPE", "text": "Nothing links these experiments to the spread of the popular picture."}, "E": {"trap": "OUT_OF_SCOPE", "text": "Their purpose is never described."}}, "method_reminder": "Words like 'until' and 'rather than' reveal what the author thinks is missing. Infer the limitation, not a total dismissal.", "flashcard": {"front": "'Until such experiments are done in mature forests rather than in pots...' What does the author think of pot studies?", "back": "Insufficient on their own to show how networks work in real forests. Limited, not worthless."}}, "original": true}]}, {"id": "RC-NAT-002", "passage_type": "natural_science", "comparative": false, "difficulty": 4, "title": "Finding the Way Home", "text": ["Female loggerhead sea turtles return to nest on or near the beaches where they themselves hatched, sometimes after decades spent crossing entire ocean basins. Tagging studies have confirmed the pattern, tracking females back to within a few dozen kilometers of the beaches where they emerged as hatchlings. How a turtle relocates a single stretch of coastline after such an absence has long puzzled biologists. Visual landmarks are of little use to an animal that left its beach as a hatchling, at night, and the chemical cues that guide salmon back to their home streams are unlikely to persist across thousands of kilometers of open sea.", "One hypothesis holds that hatchlings imprint on the magnetic signature of their natal beach. The earth's magnetic field varies from place to place in both its intensity and the angle at which its field lines meet the surface, so each stretch of coast has a characteristic combination of the two. Because lines of equal intensity and lines of equal angle cross one another rather than running parallel, the combination is far more distinctive than either value alone. A turtle that recorded this combination as a hatchling could seek it out again as an adult, much as a traveler might find a house by its coordinates rather than by its appearance. Hatchlings crawl to the sea within minutes of emerging, so whatever they record about their beach must be recorded quickly. Laboratory studies support the hypothesis's premise: hatchlings exposed to magnetic fields that replicate different locations along their migratory route orient themselves in the directions that would keep them on course.", "A distinctive prediction follows. The earth's field is not fixed; it drifts slowly over the years. If turtles home on magnetic signatures, then as the signature associated with a particular beach shifts along the coast, nesting should shift with it. A study of nesting records spanning nearly two decades along one coastline found exactly this pattern: where drift caused the magnetic signatures of neighboring beaches to converge, nests became more densely clustered, and where the signatures diverged, nests spread out. No other proposed explanation of natal homing predicts that nesting density should track changes in an invisible, gradually shifting field.", "The hypothesis does not yet explain everything. A magnetic signature can identify a stretch of coast, but beaches on different continents may share similar combinations of intensity and angle, so a turtle relying on the signature alone could, in principle, be drawn to the wrong coast entirely. Most researchers therefore suspect that magnetic cues bring a turtle to the right region, after which other cues, perhaps chemical or visual, guide its final approach. Imprinting may thus be one stage of a layered navigational system rather than the whole of it."], "model_margin_notes": ["Puzzle: how turtles find natal beach; landmarks, smell unlikely", "Hypothesis: imprint on magnetic signature (intensity + angle)", "Prediction: nesting tracks field drift; confirmed", "Limit: similar signatures elsewhere; layered system"], "main_point": "Evidence, including a confirmed prediction about nesting patterns, supports the hypothesis that loggerheads home by imprinting on magnetic signatures, though magnetic cues are probably one stage of a layered system.", "author_attitude": "Favorable but measured: persuaded by the evidence, candid about the hypothesis's limits.", "structure": "P1 the homing puzzle. P2 the magnetic imprinting hypothesis and laboratory support. P3 a distinctive prediction confirmed by nesting data. P4 a limitation and a layered-system refinement.", "questions": [{"id": "RC-NAT-002-1", "section": "RC", "type": "Main Point", "difficulty": 3, "target_seconds": 65, "tags": ["main-point"], "stem": "Which one of the following most accurately expresses the main point of the passage?", "choices": {"A": "Loggerhead turtles find their natal beaches mainly by following chemical cues, as salmon do.", "B": "Evidence, including a confirmed prediction about nesting patterns, supports the view that turtles use magnetic signatures to return to the region of their natal beach, though other cues probably guide the final approach.", "C": "The earth's magnetic field drifts slowly over time.", "D": "Magnetic imprinting fully explains how loggerhead turtles find their natal beaches.", "E": "Laboratory studies have shown that hatchlings cannot orient themselves without magnetic cues."}, "answer": "B", "explanation": {"argument_skeleton": "P2: the imprinting hypothesis. P3: 'A distinctive prediction follows' and the nesting study 'found exactly this pattern.' P4: 'The hypothesis does not yet explain everything'; imprinting 'may thus be one stage of a layered navigational system.'", "why_correct": "B covers the hypothesis, its strongest support (the confirmed prediction), and the limitation the author ends on.", "why_wrong": {"A": {"trap": "VALENCE_FLIP", "text": "The passage doubts that chemical cues work across open sea; at most they may guide the final approach."}, "C": {"trap": "TOO_NARROW", "text": "A premise of the prediction, not the passage's point."}, "D": {"trap": "TENSION_COLLAPSE", "text": "The last paragraph says the hypothesis 'does not yet explain everything'. This keeps only the supportive half."}, "E": {"trap": "EXTREME", "text": "The lab studies show hatchlings orient using magnetic fields, not that they cannot orient without them."}}, "method_reminder": "Main Point: when a passage supports a view and then limits it, the right answer keeps both the support and the limit.", "flashcard": {"front": "Magnetic imprinting: confirmed prediction, but possible wrong-coast errors. Main point?", "back": "Magnetic signatures likely bring turtles to the right region; other cues probably finish the job."}}, "original": true}, {"id": "RC-NAT-002-2", "section": "RC", "type": "Organization", "difficulty": 3, "target_seconds": 65, "tags": ["organization"], "stem": "Which one of the following most accurately describes the organization of the passage?", "choices": {"A": "A puzzle is described, two rival hypotheses are compared, and the older one is rejected.", "B": "A hypothesis is presented, criticized on the basis of new evidence, and abandoned.", "C": "A phenomenon is described, several of its causes are listed, and a program of further research is recommended.", "D": "A puzzle is posed, a hypothesis addressing it is explained and supported by a confirmed prediction, and a limitation of the hypothesis is acknowledged.", "E": "A long-standing view is defended against objections that are shown to rest on a misunderstanding."}, "answer": "D", "explanation": {"argument_skeleton": "P1: the homing puzzle. P2: the imprinting hypothesis and lab support. P3: the drift prediction confirmed. P4: the wrong-coast limitation and a layered system.", "why_correct": "D follows the passage paragraph by paragraph: puzzle, hypothesis, confirmed prediction, limitation.", "why_wrong": {"A": {"trap": "HALF_RIGHT", "text": "The puzzle fits, but only one hypothesis is developed; visual and chemical cues are set aside in a sentence, not compared."}, "B": {"trap": "VALENCE_FLIP", "text": "The evidence supports the hypothesis; nothing is abandoned."}, "C": {"trap": "OUT_OF_SCOPE", "text": "No list of causes or research program appears."}, "E": {"trap": "OUT_OF_SCOPE", "text": "No objections are rebutted; the limitation is acknowledged, not dismissed."}}, "method_reminder": "Organization: name each paragraph's job in a word or two (puzzle, hypothesis, test, limit), then match.", "flashcard": {"front": "Puzzle, hypothesis, confirmed prediction, limitation. What should the right answer include?", "back": "The limitation at the end. Watch for answers that say the hypothesis is abandoned or rivals are compared."}}, "original": true}, {"id": "RC-NAT-002-3", "section": "RC", "type": "Function", "difficulty": 2, "target_seconds": 55, "tags": ["function", "illustration"], "stem": "The author mentions a traveler who finds a house by its coordinates (second paragraph) primarily in order to", "choices": {"A": "suggest that turtles rely on visual landmarks in addition to magnetic cues", "B": "show that humans and turtles navigate in fundamentally the same way", "C": "explain why magnetic signatures drift over time", "D": "argue that magnetic imprinting is the only plausible explanation of natal homing", "E": "clarify how a location could be identified by a combination of measurable values rather than by its appearance"}, "answer": "E", "explanation": {"argument_skeleton": "P2: 'much as a traveler might find a house by its coordinates rather than by its appearance.'", "why_correct": "Intensity and angle work like coordinates: two measurable values that pin down a place. The comparison makes the abstract idea of a magnetic signature concrete.", "why_wrong": {"A": {"trap": "DIRECTION_FLIP", "text": "The comparison stresses coordinates rather than appearance, the opposite of landmarks."}, "B": {"trap": "TOO_BROAD", "text": "It is an illustration, not a claim about how humans and turtles navigate in general."}, "C": {"trap": "OUT_OF_SCOPE", "text": "Drift is the next paragraph's topic."}, "D": {"trap": "EXTREME", "text": "The comparison explains the hypothesis. It does not argue that it is the only one."}}, "method_reminder": "Function of an illustration: ask which abstract idea it makes concrete. 'Coordinates rather than appearance' points straight to the magnetic signature.", "flashcard": {"front": "Why compare a turtle to a traveler finding a house by its coordinates?", "back": "To show a place can be identified by measurable values (field intensity and angle), not by how it looks."}}, "original": true}, {"id": "RC-NAT-002-4", "section": "RC", "type": "Inference", "difficulty": 3, "target_seconds": 60, "tags": ["inference"], "stem": "Which one of the following can most reasonably be inferred from the passage?", "choices": {"A": "If two beaches on different continents had very similar magnetic signatures, a turtle relying on magnetic cues alone might nest on the wrong one.", "B": "Turtles that hatch at night are unable to detect magnetic fields.", "C": "Nesting density along a coastline is unaffected by changes in the magnetic field.", "D": "Salmon use magnetic cues to find their home streams.", "E": "Female loggerheads nest on exactly the same beach in every nesting season."}, "answer": "A", "explanation": {"argument_skeleton": "P4: 'beaches on different continents may share similar combinations of intensity and angle, so a turtle relying on the signature alone could, in principle, be drawn to the wrong coast entirely.'", "why_correct": "The passage says a turtle relying on the signature alone could be drawn to the wrong coast when signatures match. A applies that directly, with the same hedge.", "why_wrong": {"B": {"trap": "OUT_OF_SCOPE", "text": "Nothing suggests hatching at night affects magnetic sense; the lab hatchlings responded to magnetic fields."}, "C": {"trap": "DIRECTION_FLIP", "text": "The nesting study found that density did track field changes."}, "D": {"trap": "OUTSIDE_KNOWLEDGE", "text": "The passage mentions salmon only for chemical cues. Their use of magnetism is never discussed."}, "E": {"trap": "EXTREME", "text": "The passage says turtles nest 'on or near' their natal beaches, so 'exactly the same beach' overreaches."}}, "method_reminder": "Inference: the safest answer applies a stated principle to a specific case without strengthening its qualifiers.", "flashcard": {"front": "Two distant beaches share a magnetic signature. What follows for a turtle using magnetism alone?", "back": "It could be drawn to the wrong beach, which is why other cues likely guide the final approach."}}, "original": true}, {"id": "RC-NAT-002-5", "section": "RC", "type": "RC Strengthen/Weaken", "difficulty": 4, "target_seconds": 80, "tags": ["weaken", "rival-explanation"], "stem": "Which one of the following, if true, would most weaken the support that the nesting study provides for the magnetic hypothesis?", "choices": {"A": "The nesting study was conducted along a coastline where magnetic drift has been unusually rapid.", "B": "Hatchlings in laboratory studies oriented correctly in fields replicating locations along their route.", "C": "Over the period of the study, the stretches of coast where nests became more densely clustered were those where erosion had most reduced the sand suitable for nesting, and the stretches where nests spread out were those where new sand had accumulated.", "D": "Some turtles in the study nested on beaches whose magnetic signatures had changed very little.", "E": "Other species of sea turtle also return to nest near the beaches where they hatched."}, "answer": "C", "explanation": {"argument_skeleton": "P3: where signatures converged, nests clustered; where they diverged, nests spread out. 'No other proposed explanation... predicts' this.", "why_correct": "C offers a rival cause for the very same pattern: erosion squeezing nests together and new sand spreading them out, in the places where the magnetic changes happened. If so, the nesting pattern no longer singles out the magnetic hypothesis.", "why_wrong": {"A": {"trap": "REVERSAL", "text": "Rapid drift makes the study a sharper test; if anything it strengthens the support."}, "B": {"trap": "RESTATES_PREMISE", "text": "This restates the laboratory evidence from the second paragraph and says nothing about the nesting study."}, "D": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Turtles nesting where signatures barely changed fits the hypothesis, which predicts little shift there."}, "E": {"trap": "OUT_OF_SCOPE", "text": "Other species' homing does not bear on what caused this pattern."}}, "method_reminder": "To weaken evidence for a hypothesis, find a rival explanation of the same data. The rival must match the pattern in place and time.", "flashcard": {"front": "Nests cluster where magnetic signatures converge. What weakens this as support for magnetic homing?", "back": "A rival cause that tracks the same places and times, such as erosion shrinking the nesting sand there."}}, "original": true}, {"id": "RC-NAT-002-6", "section": "RC", "type": "Detail", "difficulty": 2, "target_seconds": 50, "tags": ["detail"], "stem": "According to the passage, visual landmarks are unlikely to explain how loggerheads find their natal beaches because", "choices": {"A": "different beaches can share similar magnetic signatures", "B": "coastal landmarks change too quickly to be remembered", "C": "turtles see poorly underwater", "D": "turtles leave their natal beaches as hatchlings, at night", "E": "such cues do not persist across thousands of kilometers of open sea"}, "answer": "D", "explanation": {"argument_skeleton": "P1: 'Visual landmarks are of little use to an animal that left its beach as a hatchling, at night.'", "why_correct": "The passage gives exactly this reason: a hatchling leaving at night has little chance to learn what its beach looks like.", "why_wrong": {"A": {"trap": "RECYCLED_LANGUAGE", "text": "This is a limitation of the magnetic hypothesis, from the last paragraph."}, "B": {"trap": "OUT_OF_SCOPE", "text": "Changing landmarks are never mentioned."}, "C": {"trap": "OUTSIDE_KNOWLEDGE", "text": "Plausible, perhaps, but the passage never says it."}, "E": {"trap": "SHELL_GAME", "text": "This is the reason given against chemical cues, not visual ones."}}, "method_reminder": "Detail: match the reason to the right claim. Passages often give parallel reasons for rejecting different alternatives.", "flashcard": {"front": "Why are visual landmarks unlikely to guide loggerheads home?", "back": "They left the beach as hatchlings at night, so they never saw what it looked like."}}, "original": true}]}, {"id": "RC-CMP-004", "passage_type": "law", "comparative": true, "difficulty": 4, "title": "Breaking a Contract", "text": ["Contract law in the common-law tradition ordinarily responds to a breach not by compelling the breaching party to perform but by requiring it to pay damages sufficient to put the other party where it would have been had the contract been performed. Some legal economists defend this rule on the ground that it encourages efficient breach. Suppose a manufacturer agrees to sell a machine to one buyer for $10,000, and a second buyer then offers $15,000. If the manufacturer sells to the second buyer and pays the first buyer the $2,000 by which a comparable machine costs more elsewhere, the first buyer is no worse off, the manufacturer is better off, and the machine goes to the party who values it most.", "On this view, a rule compelling performance would merely force the parties into costly negotiations to reach the same result, and a rule punishing breach would deter transactions that leave everyone better off. Parties who want stronger protection can bargain for it in advance, for example by agreeing on a larger sum payable upon breach. The law's preference for damages is therefore not a reluctant compromise but a sensible design: it holds parties to the value of their promises without binding them to the promises themselves.", "The efficient-breach argument depends on the assumption that damages actually make the disappointed party whole. Often they do not. Courts award damages for what can be proved, and much of what a party loses through breach resists proof: the time spent finding a substitute, the disruption to its own commitments, the particular value it placed on the goods it bargained for. Courts are also reluctant to compensate for anything that resembles distress or disappointment, however real. A buyer who chose a machine because it fit an unusual production line may be compensated for the difference in market price and still be worse off. When damages systematically fall short, a breach that looks efficient on paper may simply shift losses onto the party that kept its word.", "Something else is missing from the economic account entirely. Parties who make contracts are not merely arranging transfers of value; they are relying on one another's word. A legal system that treats every promise as an option to perform or pay, at the promisor's election, teaches that promises are only prices. Courts already order specific performance for unique goods such as land and works of art, which shows that the remedy is workable. Courts should therefore be more willing than they now are to order specific performance where damages are hard to measure, and they should treat deliberate breach for profit as a wrong rather than as a routine business decision."], "text_labels": ["Passage A", "", "Passage B", ""], "model_margin_notes": ["A: damages, not performance; efficient breach example", "A: the damages rule is a sensible design", "B: damages often fall short; unprovable losses", "B: promises are not prices; more specific performance"], "main_point": "A: The law's preference for damages is sound because it permits efficient breach. B: Damages often fail to make parties whole, and promises carry moral weight, so courts should order specific performance more often and treat deliberate breach for profit as a wrong.", "author_attitude": "A: confident, approving of current law. B: critical of the economic account, measured in its proposal.", "structure": "A explains efficient breach with an example and defends the damages rule. B attacks A's key assumption, adds a moral consideration, and recommends changes.", "questions": [{"id": "RC-CMP-004-1", "section": "RC", "type": "Comparative", "difficulty": 4, "target_seconds": 75, "tags": ["comparative", "relationship"], "stem": "Which one of the following most accurately describes the relationship between the two passages?", "choices": {"A": "Passage B argues that efficient breach never occurs, whereas Passage A argues that it is common.", "B": "Passage B offers a further economic justification for the rule that Passage A defends.", "C": "Passage A responds to Passage B's argument that losses from breach are hard to prove.", "D": "Passage B challenges an assumption on which Passage A's argument depends and raises a consideration that the argument leaves out.", "E": "The passages agree about how often breach occurs but disagree about what the law currently requires."}, "answer": "D", "explanation": {"argument_skeleton": "A: damages leave the first buyer 'no worse off', so breach can be efficient. B: the argument 'depends on the assumption that damages actually make the disappointed party whole. Often they do not.' Then: 'Something else is missing from the economic account entirely.'", "why_correct": "B's two paragraphs do exactly two things: dispute A's assumption that damages make the party whole, and add the moral significance of relying on a promise, which the economic account omits.", "why_wrong": {"A": {"trap": "EXTREME", "text": "B says damages often fall short, not that efficient breach never occurs, and A makes no claim about frequency."}, "B": {"trap": "VALENCE_FLIP", "text": "B argues against A's justification, not for it."}, "C": {"trap": "DIRECTION_FLIP", "text": "B responds to A, not the reverse."}, "E": {"trap": "OUT_OF_SCOPE", "text": "Neither passage discusses how often breach occurs, and both describe the law's preference for damages the same way."}}, "method_reminder": "Comparative: label what the second passage does to the first (attacks an assumption, adds a consideration, extends, concedes). Then match the labels.", "flashcard": {"front": "A defends efficient breach; B says damages fall short and promises matter morally. Relationship?", "back": "B challenges A's key assumption (damages make you whole) and adds a consideration A omits (reliance on promises)."}}, "original": true}, {"id": "RC-CMP-004-2", "section": "RC", "type": "Author Response", "difficulty": 4, "target_seconds": 75, "tags": ["author-response", "comparative"], "stem": "The author of Passage B would most likely respond to the example of the machine in Passage A by pointing out that", "choices": {"A": "the second buyer should not have been allowed to bid for the machine", "B": "a rule compelling performance would only push the parties into costly negotiations", "C": "the first buyer may suffer losses, such as the time spent finding a substitute, that the $2,000 award does not cover", "D": "courts can easily determine the market price of a comparable machine", "E": "the manufacturer's breach should be punished with criminal penalties"}, "answer": "C", "explanation": {"argument_skeleton": "A: the first buyer receives $2,000 and 'is no worse off.' B: losses that 'resist proof' include 'the time spent finding a substitute, the disruption to its own commitments, the particular value it placed on the goods.'", "why_correct": "B's central objection is that awards cover only provable losses. Applied to A's example, the $2,000 price gap leaves out the buyer's search time, disruption, and any special value, so the buyer may not be 'no worse off'.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "B never questions the second buyer's offer."}, "B": {"trap": "VALENCE_FLIP", "text": "That is Passage A's argument for preferring damages."}, "D": {"trap": "SHELL_GAME", "text": "B could grant this. Its point is that the market price leaves other losses uncovered."}, "E": {"trap": "EXTREME", "text": "B calls deliberate breach for profit 'a wrong' but proposes specific performance, not criminal penalties."}}, "method_reminder": "Author-response questions: apply the second author's main objection to the first author's specific example.", "flashcard": {"front": "A: pay the buyer the $2,000 price gap and the buyer is no worse off. B's reply?", "back": "Unprovable losses (search time, disruption, special value) are not covered, so the buyer may be worse off."}}, "original": true}, {"id": "RC-CMP-004-3", "section": "RC", "type": "Function", "difficulty": 3, "target_seconds": 60, "tags": ["function", "example"], "stem": "In Passage B, the example of a buyer whose machine fit an unusual production line serves primarily to", "choices": {"A": "show that machines sold under contract are often defective", "B": "illustrate how a party can be compensated for the difference in market price and still be left worse off by a breach", "C": "argue that courts should never award damages based on market prices", "D": "suggest that buyers should avoid entering contracts for specialized equipment", "E": "support Passage A's claim that damages put the disappointed party where it would have been"}, "answer": "B", "explanation": {"argument_skeleton": "B: 'A buyer who chose a machine because it fit an unusual production line may be compensated for the difference in market price and still be worse off.'", "why_correct": "The example makes the abstract point concrete: the particular value of a machine that fits an unusual line is real but hard to prove, so market-based damages leave the buyer short.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "Defects are never mentioned."}, "C": {"trap": "EXTREME", "text": "B wants specific performance where damages are hard to measure, not an end to market-based awards."}, "D": {"trap": "TOO_STRONG", "text": "B gives no advice to buyers; the example is about what damages miss."}, "E": {"trap": "VALENCE_FLIP", "text": "The example is aimed against that claim."}}, "method_reminder": "Function: an example illustrates the sentence it follows. Here that sentence lists losses that 'resist proof'.", "flashcard": {"front": "Why does Passage B mention a machine that fit an unusual production line?", "back": "To show market-price damages can leave a buyer worse off, because special value resists proof."}}, "original": true}, {"id": "RC-CMP-004-4", "section": "RC", "type": "Inference", "difficulty": 4, "target_seconds": 70, "tags": ["inference", "comparative"], "stem": "It can be inferred that the author of Passage A would most likely agree with which one of the following?", "choices": {"A": "Courts should order specific performance whenever damages are hard to measure.", "B": "Damages awards usually exceed the losses actually caused by breach.", "C": "Most contracts are breached because a better offer arrives.", "D": "Promises have no value apart from the transactions they make possible.", "E": "A legal rule that deterred all breaches of contract could prevent some exchanges that would benefit everyone involved."}, "answer": "E", "explanation": {"argument_skeleton": "A: 'a rule punishing breach would deter transactions that leave everyone better off.'", "why_correct": "A says a rule punishing breach would deter transactions that leave everyone better off. A rule deterring all breaches would block the efficient ones, which is E.", "why_wrong": {"A": {"trap": "VALENCE_FLIP", "text": "This is Passage B's recommendation."}, "B": {"trap": "OUT_OF_SCOPE", "text": "A claims damages make the party whole, not that they overcompensate."}, "C": {"trap": "EXTREME", "text": "A uses one example. It makes no claim about why most contracts are breached."}, "D": {"trap": "TOO_STRONG", "text": "A holds parties 'to the value of their promises' but never denies that promises matter in other ways."}}, "method_reminder": "Inference about one author: find the sentence the answer paraphrases. 'Deter transactions that leave everyone better off' becomes 'prevent beneficial exchanges'.", "flashcard": {"front": "Passage A: 'a rule punishing breach would deter transactions that leave everyone better off.' What would A accept?", "back": "Deterring all breaches could block some exchanges that benefit everyone."}}, "original": true}, {"id": "RC-CMP-004-5", "section": "RC", "type": "Author's Attitude", "difficulty": 3, "target_seconds": 60, "tags": ["attitude", "comparative"], "stem": "The author of Passage B regards the law's current preference for damages over specific performance with", "choices": {"A": "qualified disapproval, favoring greater use of specific performance in certain cases", "B": "complete approval", "C": "indifference, since remedies seldom matter in practice", "D": "outright rejection, favoring the abolition of damages awards", "E": "reluctant acceptance, since no better alternative exists"}, "answer": "A", "explanation": {"argument_skeleton": "B: 'Courts should therefore be more willing than they now are to order specific performance where damages are hard to measure.'", "why_correct": "'More willing than they now are' and 'where damages are hard to measure' mark a limited criticism: B wants the balance shifted in certain cases, not damages abolished.", "why_wrong": {"B": {"trap": "VALENCE_FLIP", "text": "B argues that damages often fall short."}, "C": {"trap": "OUT_OF_SCOPE", "text": "B treats remedies as important enough to change."}, "D": {"trap": "EXTREME", "text": "B targets cases where damages are hard to measure, not damages in general."}, "E": {"trap": "HALF_RIGHT", "text": "B does accept damages in many cases, but proposes an alternative, specific performance, where they fall short."}}, "method_reminder": "Attitude: watch the qualifiers in the recommendation. 'More willing' and 'where' signal qualified, not total, disapproval.", "flashcard": {"front": "B: courts should be 'more willing than they now are' to order specific performance 'where damages are hard to measure.' Attitude?", "back": "Qualified disapproval of the current preference for damages, not outright rejection."}}, "original": true}, {"id": "RC-CMP-004-6", "section": "RC", "type": "Application", "difficulty": 3, "target_seconds": 65, "tags": ["application", "law"], "stem": "Which one of the following cases would the author of Passage B most likely cite as an appropriate occasion for ordering specific performance?", "choices": {"A": "A supplier fails to deliver standard office paper, which the buyer can easily obtain elsewhere at the same price.", "B": "A buyer refuses goods that arrived late and damaged.", "C": "A seller cannot deliver goods after a fire destroys them.", "D": "Two parties agree to cancel a contract that no longer serves either of them.", "E": "A builder abandons a contract to restore a family's historic house, whose sentimental value would be hard to prove in court, in order to take a more profitable job elsewhere."}, "answer": "E", "explanation": {"argument_skeleton": "B: specific performance 'where damages are hard to measure', and deliberate breach for profit treated 'as a wrong'.", "why_correct": "E has both features B emphasizes: losses that resist proof (sentimental value) and a deliberate breach for profit.", "why_wrong": {"A": {"trap": "DIRECTION_FLIP", "text": "Damages here are easy to measure, since the paper costs the same elsewhere: the opposite of B's case."}, "B": {"trap": "OUT_OF_SCOPE", "text": "A buyer rejecting defective goods is not a breach for profit."}, "C": {"trap": "OUT_OF_SCOPE", "text": "A fire makes performance impossible, so there is nothing to compel."}, "D": {"trap": "TRUE_BUT_IRRELEVANT", "text": "A mutual cancellation is not a breach at all."}}, "method_reminder": "Application: list the conditions the author attaches to the recommendation, then pick the case that meets every one.", "flashcard": {"front": "When does Passage B want courts to order performance?", "back": "When losses are hard to measure, especially in a deliberate breach for profit, like a builder abandoning a historic restoration."}}, "original": true}]}]};

  const blocked=picks.filter(id=>tierIdx(LIB.Q[id].type)<2).sort((a,b)=>LIB.Q[a].type<LIB.Q[b].type?-1:1);const inter=shuffle(picks.filter(id=>tierIdx(LIB.Q[id].type)>=2));

const RAW2SCALED=[120,120,120,120,120,120,120,120,120,120,122,123,124,125,126,127,128,130,131,132,133,134,136,137,138,139,140,141,142,143,144,145,146,147,148,148,149,150,151,152,152,153,154,155,156,156,157,158,159,160,160,161,162,163,163,164,165,166,166,167,168,169,169,170,171,172,172,173,174,175,176,176,177,178,179,180,180,180];

const MIX=[0,.12,.24,.30,.22,.12];
function expAcc(th){let e=0;for(let s=1;s<=5;s++)e+=MIX[s]*pWin(th,STAR_D[s]);return e}
function solveTheta(atts){let c=1,ds=[1060,1060];let lo=300,hi=1900;for(const a of atts){ds.push(STAR_D[a.d]||1060);c+=a.ok}for(let i=0;i<40;i++){const mid=(lo+hi)/2;let e=0;for(const D of ds)e+=pWin(mid,D);if(e<c)lo=mid;else hi=mid}const th=(lo+hi)/2;let info=0;for(const D of ds){const p=pWin(th,D);info+=p*(1-p)}const se=(400/Math.LN10)/Math.sqrt(Math.max(info,.5));return{th,se}}
function timedSets(){const sets={LR:new Set(),RC:new Set()};for(const a of A){if(!TIMED.has(a.m)||!a.set)continue;const q=LIB.Q[a.q];if(!q)continue;sets[q.section==='RC'?'RC':'LR'].add(a.set)}return{LR:sets.LR.size,RC:sets.RC.size}}
function projection(){const cut=now()-75*DAY;const lr=[],rc=[];for(const a of A){if(!TIMED.has(a.m)||a.t<cut||S.quarantine[a.q])continue;const q=LIB.Q[a.q];if(!q)continue;(q.section==='RC'?rc:lr).push(a)}
  const ts=timedSets();let model=null;
  if(ts.LR>=5&&ts.RC>=5){const L=solveTheta(lr.slice(-300)),R=solveTheta(rc.slice(-200));const eL=expAcc(L.th),eR=expAcc(R.th);const raw=eL*50+eR*27;const dL=(expAcc(L.th+L.se)-expAcc(L.th-L.se))/2*50,dR=(expAcc(R.th+R.se)-expAcc(R.th-R.se))/2*27;const sd=Math.sqrt(dL*dL+dR*dR)+1.2;model={mid:scaledFromRaw(raw),lo:scaledFromRaw(raw-1.3*sd),hi:scaledFromRaw(raw+1.3*sd),raw,eL,eR}}
  const real=S.realTests.slice().sort((a,b)=>a.date<b.date?-1:1).slice(-2).map(r=>+r.scaled).filter(Boolean);
  if(real.length){const rm=avg(real);if(model){const mid=Math.round(.7*rm+.3*model.mid);const half=Math.max(2,Math.round((model.hi-model.lo)/3));return{mid,lo:clamp(mid-half,120,180),hi:clamp(mid+half,120,180),src:'blend',ts,model,real}}return{mid:Math.round(rm),lo:clamp(Math.round(rm)-3,120,180),hi:clamp(Math.round(rm)+3,120,180),src:'real',ts,real}}
  if(model)return Object.assign({src:'model',ts},model);return{mid:null,ts,src:'none'}}

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}

function loadLocal(){S=freshState();A=[];IMPORTED=[];const c=lsGet(LS.core);if(c){try{S=migrate(JSON.parse(c))}catch(e){}}const a=lsGet(LS.att);if(a){try{A=JSON.parse(a)||[]}catch(e){A=[]}}const p=lsGet(LS.packs);if(p){try{IMPORTED=JSON.parse(p)||[]}catch(e){IMPORTED=[]}}}
function base(){return'data/users/'+Store.uid+'/'}
function saveSoon(ms){clearTimeout(Store.timer);Store.timer=setTimeout(saveNow,ms==null?350:ms)}
function saveNow(){clearTimeout(Store.timer);S.savedAt=now();S.lastSeen=now();S.rev=(S.rev||0)+1;const core=JSON.stringify(S);const ok1=lsSet(LS.core,core),ok2=lsSet(LS.att,JSON.stringify(A));Store.localOk=ok1&&ok2;
  if(Store.db&&Store.ready)cloudSave(core);else if(Store.db){}else{Store.lastSave=now();Store.status=Store.localOk?'local':'fail';renderSave()}}
async function writeChunked(name,str,rev){const CH=60000;const n=Math.max(1,Math.ceil(str.length/CH));for(let i=0;i<n;i++)await Store.db.doc(base()+name+'-'+i).set({s:str.slice(i*CH,(i+1)*CH)});const meta={n,savedAt:S.savedAt,v:APP.schema};if(rev!=null)meta.rev=rev;await Store.db.doc(base()+name).set(meta)}
async function readChunked(name){const m=await Store.db.doc(base()+name).get();if(!m.exists)return null;const d=m.data();let s='';for(let i=0;i<d.n;i++){const c=await Store.db.doc(base()+name+'-'+i).get();if(!c.exists)return null;s+=c.data().s}return{str:s,savedAt:d.savedAt,rev:d.rev||0}}
function cloudSave(core){if(Store.writing){Store.again=true;return}Store.writing=true;Store.status='saving';renderSave();const rev=S.rev;
  (async()=>{try{const m=await Store.db.doc(base()+'core').get();if(m.exists&&((m.data().rev||0)>(S.cloudRev||0))){Store.writing=false;Store.again=false;await reconcile();return}
    await writeChunked('core',core,rev);for(const i of Array.from(Store.dirtyAtt)){Store.dirtyAtt.delete(i);await Store.db.doc(base()+'att-'+i).set({s:JSON.stringify(A.slice(i*ATT_CHUNK,(i+1)*ATT_CHUNK)),i})}S.cloudRev=Math.max(S.cloudRev||0,rev);Store.remoteRev=S.cloudRev;lsSet(LS.core,JSON.stringify(S));Store.status='cloud';Store.err='';Store.lastSave=now()}catch(e){Store.status=Store.localOk?'cloudfail':'fail';Store.err=(e&&(e.code||e.message))||'error'}
    Store.writing=false;renderSave();if(Store.again){Store.again=false;saveNow()}})()}
async function writePack(pk){if(!Store.db)return;try{await writeChunked('pack-'+packKey(pk.pack),JSON.stringify(pk))}catch(e){Store.err=(e&&e.code)||'pack write failed';Store.status='cloudfail';renderSave()}}
function packKey(id){return String(id).replace(/[^A-Za-z0-9_\-]/g,'_').slice(0,80)}
function progOf(st,att){return (st.xp||0)+(att?att.length:0)*10}
async function loadRemote(remote){const rs=migrate(JSON.parse(remote.str));const att=[];for(let i=0;i<(rs.attChunks||0);i++){const d=await Store.db.doc(base()+'att-'+i).get();if(d.exists){try{att.push(...JSON.parse(d.data().s))}catch(e){}}}
  const packs=[];for(const pm of rs.packsMeta||[]){const r=await readChunked('pack-'+packKey(pm.id));if(r){try{packs.push(JSON.parse(r.str))}catch(e){}}}return{rs,att,packs}}
function stashBackup(why,coreStr,att){try{lsSet(LS.bak,JSON.stringify({at:now(),why,core:coreStr,att:att||[]}))}catch(e){}}
async function decide(remote){const R=await loadRemote(remote);const rrev=remote.rev||0,lp=progOf(S,A),rp=progOf(R.rs,R.att),synced=S.cloudRev!=null;let mode,conflict=false;
  if(synced){const moved=rrev>S.cloudRev,changed=(S.rev||0)>S.cloudRev;if(!moved)mode='push';else if(!changed)mode='take';else{conflict=true;mode=rp>=lp?'take':'push'}}
  else mode=rp>lp?'take':'push';
  Store.remoteRev=rrev;
  if(mode==='take'){if(lp>0&&(conflict||!synced)&&JSON.stringify(S)!==remote.str)stashBackup('device copy replaced by cloud',JSON.stringify(S),A);
    S=R.rs;A=R.att;IMPORTED=R.packs;S.cloudRev=rrev;S.rev=rrev;SEEN=null;indexContent();applySettings();lsSet(LS.core,JSON.stringify(S));lsSet(LS.att,JSON.stringify(A));lsSet(LS.packs,JSON.stringify(IMPORTED));Store.ready=true;Store.status='cloud';Store.lastSave=now();
    toast(conflict?'Another device had more progress, so I loaded that one. Your other copy is backed up in Preferences.':'Loaded your climb from your cloud save.','volt');render()}
  else{if(rp>0&&(conflict||!synced))stashBackup('cloud copy replaced by this device',remote.str,R.att);
    S.cloudRev=rrev;for(let i=0;i<Math.ceil(A.length/ATT_CHUNK);i++)Store.dirtyAtt.add(i);for(const pk of IMPORTED)await writePack(pk);Store.ready=true;if(conflict||(!synced&&rp>0))toast('This device had more progress than the cloud copy, so I kept this one. The cloud copy is backed up in Preferences.','volt');saveNow()}}
async function reconcile(){try{const remote=await readChunked('core');if(remote)await decide(remote);else{Store.ready=true;saveNow()}}catch(e){Store.db=null;Store.status=Store.localOk?'cloudfail':'fail';Store.err=(e&&(e.code||e.message))||'error';renderSave()}}
async function checkRemote(){if(!Store.db||!Store.ready||Store.writing)return;try{const m=await Store.db.doc(base()+'core').get();if(m.exists&&((m.data().rev||0)>(S.cloudRev||0)))await reconcile()}catch(e){}}
async function initCloud(){Store.cloudTried=true;
  try{const cl=window.claude;if(!cl||typeof cl.use!=='function'){if(typeof sbInit==='function'&&await sbInit())return;Store.status=Store.localOk?'local':'fail';renderSave();return}
    const db=await cl.use('db'),user=await cl.use('user');if(!db||!user){Store.status='local';renderSave();return}
    const id=await user.id();if(!id){Store.status='local';renderSave();return}
    Store.db=db;Store.uid=id;
    const remote=await readChunked('core');
    if(remote)await decide(remote);
    else{for(let i=0;i<Math.ceil(A.length/ATT_CHUNK);i++)Store.dirtyAtt.add(i);for(const pk of IMPORTED)await writePack(pk);Store.ready=true;saveNow()}
  }catch(e){Store.db=null;Store.ready=false;Store.status='cloudfail';Store.err=(e&&(e.code||e.message))||'error';renderSave()}}

function makeSet(o){return{id:rid(),label:o.label,mode:o.mode||'blind',items:(o.items||[]).filter(isQ),idx:0,timeLimit:o.timeLimit||null,perQ:o.perQ||null,twist:o.twist||null,margin:!!o.margin,ans:{},hl:{},elapsed:0,phase:'answer',br:{},brList:[],brIdx:0,paused:false,recorded:false,res:null,kind:o.kind||'',noBR:!!o.noBR,trap:o.trap||null,hunt:{}}}
