VIEWS.logbook=()=>{const rt=S.realTests.slice().sort((a,b)=>a.date<b.date?1:-1);const fmt=S.settings.format;
  const secForm=(i,type)=>`<div class="card flat"><h3>Section ${i+1} · ${type}</h3><div class="row" style="margin:8px 0"><label class="f">Raw correct<input type="number" id="lbR${i}" style="width:90px"></label><label class="f">Out of<input type="number" id="lbN${i}" style="width:90px" value="${type==='RC'?27:fmt==='new'?25:25}"></label></div><label class="f">Time pressure notes<input type="text" id="lbT${i}" placeholder="e.g. rushed the last passage"></label><div class="eyebrow" style="margin:10px 0 6px">Misses by type</div><div class="grid g2" style="gap:6px">${(type==='RC'?RC_MISS:LR_MISS).map(k=>`<label class="row" style="gap:6px;font-size:13px"><input type="number" min="0" style="width:56px" data-miss="${i}|${k}">${esc(k.replace('P:','').replace('_',' '))}</label>`).join('')}</div></div>`;
  return`<div class="stack"><div><div class="eyebrow">Logbook</div><h1 class="disp">Official PrepTests</h1><p class="sub" style="max-width:72ch;margin-top:6px">Take official PrepTests in the real LawHub interface (lawhub.lsac.org), then log them here. Official tests are the gold standard: they recalibrate the projection, adjust skill ratings, and are compared against your in-game numbers. The game's original questions build skills; LawHub measures them.</p></div>
  <div class="card"><h3>Log a test</h3><div class="grid g4" style="margin:10px 0"><label class="f">Date<input type="date" id="lbD" value="${dayKey()}"></label><label class="f">PrepTest<input type="text" id="lbP" placeholder="PrepTest 141"></label><label class="f">Format<select id="lbF"><option value="current">Current</option><option value="new" ${fmt==='new'?'selected':''}>New</option></select></label><label class="f">Scaled score<input type="number" id="lbS" min="120" max="180"></label></div>
  <div class="grid g3">${secForm(0,'LR')}${secForm(1,'LR')}${secForm(2,'RC')}</div><button class="btn primary" style="margin-top:12px" data-a="logTest">Save to Logbook</button></div>
  <div class="card"><h3>History</h3><div class="scroll"><table class="t"><tr><th>Date</th><th>Test</th><th>Scaled</th><th>Sections</th><th>In-game estimate then</th><th></th></tr>${rt.map(r=>{const h=S.projHist.filter(p=>p.d<=r.date).pop();return`<tr><td class="mono">${fmtDate(r.date)}</td><td>${esc(r.pt)}</td><td class="mono"><b>${r.scaled}</b></td><td class="mono">${(r.sections||[]).map(s=>s.type+' '+s.raw+'/'+s.total).join(' · ')}</td><td class="mono">${h?h.lo+' to '+h.hi:'n/a'}</td><td><button class="btn sm ghost" data-a="delTest" data-v="${r.id}">Remove</button></td></tr>`}).join('')||'<tr><td colspan="6" class="muted">No official tests yet. Your first one is the most useful number in this app.</td></tr>'}</table></div></div></div>`};
ACT.logTest=()=>{const sc=+$('#lbS').value;if(!sc||sc<120||sc>180){toast('Enter a scaled score from 120 to 180.');return}const secs=[0,1,2].map(i=>({type:i===2?'RC':'LR',raw:+($('#lbR'+i).value)||0,total:+($('#lbN'+i).value)||0,notes:$('#lbT'+i).value||'',misses:{}}));
  $$('[data-miss]').forEach(el=>{const v=+el.value;if(v>0){const [i,k]=el.dataset.miss.split('|');secs[+i].misses[k]=v}});
  const rec={id:rid(),date:$('#lbD').value||dayKey(),pt:$('#lbP').value||'PrepTest',format:$('#lbF').value,scaled:sc,sections:secs};S.realTests.push(rec);
  for(const s of secs)for(const k in s.misses)for(let j=0;j<s.misses[k];j++)rateUpdate(k,1060,false,0,.45);
  addXP(40);snapshotProjection();checkAch();saveNow();toast('Logged. Projection recalibrated.','volt');render()};
ACT.delTest=v=>confirmBox('Remove this test?','It will no longer count toward your projection.','Remove',()=>{S.realTests=S.realTests.filter(r=>r.id!==v);saveNow();render()});

/* ---------- Reports: weekly, ledger, plateau ---------- */
function weeklyDue(){return A.length>=10&&now()-(S.weeklyLast||S.createdAt)>=7*DAY}
function weekStats(from,to){const xs=liveA().filter(x=>x.t>=from&&x.t<to);const c=sum(xs.map(x=>x.ok));const re=xs.filter(x=>x.re!=null&&x.m!=='guided'&&x.m!=='speed');return{n:xs.length,acc:pct(c,xs.length),gap:re.length?pct(sum(re.map(x=>x.re)),re.length)-pct(sum(re.map(x=>x.ok)),re.length):0,xs}}
function buildWeekly(){const t=now();const cur=weekStats(t-7*DAY,t),prev=weekStats(t-14*DAY,t-7*DAY);const types=lrTypesAvail().filter(k=>(S.skills[k]||{}).n>=3);const weakest=types.slice().sort((a,b)=>mastery(a)-mastery(b));const strongest=types.slice().sort((a,b)=>mastery(b)-mastery(a));
  const wins=[];if(cur.n)wins.push(cur.n+' questions answered ('+cur.acc+'% correct).');if(prev.n&&cur.acc>prev.acc)wins.push('Accuracy up '+(cur.acc-prev.acc)+' points on last week.');if(strongest[0])wins.push(strongest[0]+' is your strongest type at '+mastery(strongest[0])+' mastery ('+tierName(strongest[0])+').');wins.push('Streak '+S.streak.cur+' days, '+weekRank().n+' of 7 days qualified.');
  const tw={};for(const x of cur.xs)if(x.tr)tw[x.tr]=(tw[x.tr]||0)+1;const topTrap=Object.entries(tw).sort((a,b)=>b[1]-a[1])[0];const weak=[];if(weakest[0])weak.push(weakest[0]+' at '+mastery(weakest[0])+' mastery.');if(topTrap)weak.push('Most chosen trap: '+trapName(topTrap[0])+' ('+topTrap[1]+'x).');if(cur.gap>8)weak.push('Conversion Gap of '+cur.gap+' points: you know more than you can do on the clock.');else if(mastery('P:humanities')<55)weak.push('Humanities passages at '+mastery('P:humanities')+' mastery.');
  const focus=weakest[0]||'Weaken';const plan=['Daily Climbs at your standard length, five days.','Two passes at the '+focus+' tower floors you have not cleared.','One Timed Trial on Saturday and one humanities passage on Sunday.',topTrap?'Visit the '+trapName(topTrap[0])+' exhibit and run its Trap Hunt.':'One Trap Hunt on your most common trap.'];
  const letter=`Jay, this week you put ${cur.n} questions on the record at ${cur.acc}%. ${prev.n?(cur.acc>=prev.acc?'That is movement in the right direction.':'That is down from last week, which happens; look at the causes, not the number.'):'This is your baseline week.'} The skill costing you the most is ${focus}. ${topTrap?'And the trap you keep stepping on is '+trapName(topTrap[0])+'. ':''}A 180 is built from removing the same two or three errors over and over until they are gone. Pick the one focus above and give it the week.`;
  const text=`ASCENT TO 180 · WEEKLY REPORT · ${dayKey()}\n\nWins\n${wins.map(w=>'- '+w).join('\n')}\n\nWeaknesses\n${weak.map(w=>'- '+w).join('\n')}\n\nFocus for next week: ${focus}\n\nPlan\n${plan.map(w=>'- '+w).join('\n')}\n\nCoach\n${letter}`;
  return{d:dayKey(),wins,weak,focus,plan,letter,text}}
VIEWS.reports=()=>{if(weeklyDue()){const r=buildWeekly();S.weekly.push(r);if(S.weekly.length>30)S.weekly.shift();S.weeklyLast=now();addXP(10);saveSoon()}const r=S.weekly[S.weekly.length-1];const led=ledgerMD();
  return`<div class="stack"><div><div class="eyebrow">Reports</div><h1 class="disp">Weekly report and ledger</h1></div>
  ${r?`<div class="card"><div class="row between"><h3>Week ending ${fmtDate(r.d)}</h3><button class="btn sm" data-a="copyFrom" data-v="wkText">Copy for Claude</button></div><div class="grid g3" style="margin-top:10px"><div><div class="eyebrow">Three wins</div><ul class="read">${r.wins.slice(0,3).map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div><div><div class="eyebrow">Weaknesses</div><ul class="read">${r.weak.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div><div><div class="eyebrow">Plan</div><ul class="read">${r.plan.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div></div><div class="callout" style="margin-top:12px"><p class="read" style="font-size:16.5px">${esc(r.letter)}</p></div><textarea id="wkText" rows="4" readonly style="margin-top:10px">${esc(r.text)}</textarea></div>`:`<div class="card flat"><h3>First report after 7 days and 10 answers</h3><p class="sub">It writes itself every week: three wins, three weaknesses, one focus, a plan and a short letter.</p></div>`}
  <div class="card"><h3>Plateau check</h3>${plateauHTML()}</div>
  <div class="card"><div class="row between"><h3>Progress Ledger</h3><div class="row"><button class="btn sm" data-a="copyLedger">Copy</button><button class="btn sm" data-a="dlLedger">Save as .md</button></div></div><p class="sub" style="font-size:13.5px;margin:4px 0 8px">Paste this into any Claude chat so it can pick up where the game left off, or ask it for a pack aimed at your weaknesses.</p><textarea id="ledgerText" rows="14" readonly>${esc(led)}</textarea></div>
  ${S.weekly.length>1?`<div class="card"><h3>Past reports</h3>${S.weekly.slice(0,-1).reverse().map(w=>`<details><summary style="cursor:pointer">${fmtDate(w.d)} · focus ${esc(w.focus)}</summary><pre class="read" style="white-space:pre-wrap;font-size:14px">${esc(w.text)}</pre></details>`).join('')}</div>`:''}</div>`};
ACT.copyLedger=()=>{S.counters.ledger++;checkAch();saveSoon();copyText($('#ledgerText').value,$('#ledgerText'))};
ACT.dlLedger=()=>{S.counters.ledger++;checkAch();saveSoon();offerFile('ascent-progress-ledger.md',ledgerMD(),'Progress Ledger')};
function ledgerMD(){const pr=projection();const li=levelInfo(S.xp);const types=lrTypesAvail().concat(['P:humanities','P:social_science','P:natural_science','P:law','P:comparative']).filter(k=>(S.skills[k]||{}).n>=1||k.startsWith('P:'));const weak=types.sort((a,b)=>mastery(a)-mastery(b)).slice(0,5);const tr={};for(const x of liveA())if(x.tr)tr[x.tr]=(tr[x.tr]||0)+1;const traps=Object.entries(tr).sort((a,b)=>b[1]-a[1]).slice(0,5);const w7=weekStats(now()-7*DAY,now());
  return`# Ascent to 180: Progress Ledger\nGenerated ${new Date().toLocaleString()}\n\n## Snapshot\n- Level ${li.lv} (${S.xp} XP). Streak ${S.streak.cur} days, best ${S.streak.best}, ${S.streak.freezes} freezes.\n- Projected range: ${pr.mid==null?'unmapped (not enough timed data or official tests)':pr.lo+' to '+pr.hi+' (center '+pr.mid+', source: '+pr.src+')'}.\n- Goal ${S.profile.goal}, floor ${S.profile.floor}, test date ${S.profile.testDate||'not set'}, format ${S.settings.format}.\n- Answers on record: ${liveA().length}. Last 7 days: ${w7.n} at ${w7.acc}%, Conversion Gap ${w7.gap} points.\n\n## Top five weaknesses (mastery 0 to 100)\n${weak.map(k=>'- '+k.replace('P:','passages: ')+': '+mastery(k)+' ('+tierName(k)+', n='+((S.skills[k]||{}).n||0)+')').join('\n')}\n\n## Top five traps chosen\n${traps.map(([k,n])=>'- '+trapName(k)+' ('+k+'): '+n).join('\n')||'- none yet'}\n\n## Official tests\n${S.realTests.slice(-5).map(r=>'- '+r.date+' '+r.pt+': '+r.scaled).join('\n')||'- none logged'}\n\n## Recent reflections\n${S.reflections.slice(-3).map(r=>'- '+r.d+': mistake '+r.mistake+'; went well '+r.well+'; focus '+r.focus).join('\n')||'- none'}\n\n## Summary\nJay is training for a 180 with a floor of ${S.profile.floor}. Current weakest areas are ${weak.slice(0,3).map(k=>k.replace('P:','')).join(', ')}. ${traps[0]?'The most frequent wrong-answer pull is '+trapName(traps[0][0])+'. ':''}Reason from first principles, never cite prep companies or forums, use no em dashes, and finish every explanation with a flashcard.\n\n## Next pack request\nGenerate an Ascent to 180 pack (schema_version 1) aimed at: ${weak.slice(0,3).map(k=>k.replace('P:','')).join(', ')}${traps[0]?', with wrong answers built on '+traps.slice(0,3).map(t=>t[0]).join(', '):''}.\n`}
function plateauHTML(){const t=now();const a=weekStats(t-14*DAY,t),b=weekStats(t-28*DAY,t-14*DAY);if(a.n<20||b.n<20)return`<p class="sub" style="font-size:13.5px">Runs once there are at least 20 answers in each of the last two fortnights (now ${a.n} and ${b.n}).</p>`;
  if(a.acc>b.acc+2)return`<p class="read">No plateau: accuracy rose from ${b.acc}% to ${a.acc}%. Keep the current mix.</p>`;
  const xs=a.xs;const easyMiss=xs.filter(x=>!x.ok&&x.d<=2&&x.cf==='sure').length;const slowRight=xs.filter(x=>x.ok&&x.sec>130).length;const hurt=xs.filter(x=>x.cr==='hurt').length;const early=xs.filter(x=>x.pos&&x.pos<=10),late=xs.filter(x=>x.pos&&x.pos>=16);const fat=early.length>5&&late.length>5?pct(sum(early.map(x=>x.ok)),early.length)-pct(sum(late.map(x=>x.ok)),late.length):0;
  let d,rx;if(a.gap>=10){d='Speed gap';rx='Blind Review accuracy is '+a.gap+' points above timed. Swap one Main Quest a day for a Timed Trial, and drill the first ten questions at 55 seconds.'}else if(easyMiss>=4){d='Careless errors';rx=easyMiss+' easy questions missed while rated Sure. Slow the first read, and predict before looking at choices (Advanced Citadel: No Prediction Allowed).'}else if(fat>=12){d='Fatigue';rx='Accuracy drops '+fat+' points late in sets. Add one section sim a week and keep breathing resets between sections.'}else if(slowRight>=8||hurt>=4){d='Overthinking';rx=slowRight+' correct answers took over 2:10 and '+hurt+' changes went right to wrong. Set a hard 2:30 ceiling and change answers only with a stated reason.'}else{d='Content gap';rx='Untimed accuracy is flat too, so the limit is understanding. Go back to the Lesson floors of your two weakest towers and the matching Forge module.'}
  return`<p class="read"><b>Plateau detected: ${esc(d)}.</b> Accuracy ${b.acc}% then ${a.acc}% over the last two fortnights.</p><p class="sub" style="margin-top:6px">${esc(rx)}</p>`}

/* ---------- Library: packs, generation, quarantine ---------- */
const TRAP_CODES=['OUT_OF_SCOPE','EXTREME','REVERSAL','HALF_RIGHT','IRRELEVANT_COMPARISON','SHELL_GAME','RECYCLED_LANGUAGE','TOO_WEAK','TOO_STRONG','TRUE_BUT_IRRELEVANT','VALENCE_FLIP','DIRECTION_FLIP','TENSION_COLLAPSE','DEVICE_PROMOTION','EMPHASIS_ENDORSEMENT','ADJACENT_DOUBT','TOO_NARROW','TOO_BROAD','MISTAKEN_REVERSAL','MISTAKEN_NEGATION','QUANTIFIER_SHIFT','CAUSAL_REVERSAL','RESTATES_PREMISE','WRONG_DIRECTION','DEEPENS_PARADOX','EXPLAINS_HALF','NOT_NECESSARY','INSUFFICIENT','DESCRIBES_PART','MISMATCHED_STRUCTURE','DETAIL_AS_PURPOSE','PREMISE_ATTACK','SCOPE_SHIFT','OUTSIDE_KNOWLEDGE'];
function validQ(q,rc){const e=[];if(!q||typeof q!=='object')return['not an object'];if(!q.id)e.push('missing id');if(!q.type)e.push('missing type');if(!rc&&!q.stimulus)e.push('missing stimulus');if(!q.stem)e.push('missing stem');if(!q.choices||LET.some(L=>!q.choices[L]))e.push('needs choices A to E');if(!LET.includes(q.answer))e.push('answer must be A to E');const d=+q.difficulty;if(!(d>=1&&d<=5))e.push('difficulty 1 to 5');if(!q.explanation||!q.explanation.why_correct)e.push('missing explanation.why_correct');else{const w=q.explanation.why_wrong||{};if(LET.filter(L=>L!==q.answer).some(L=>!w[L]||!w[L].text))e.push('why_wrong needs the four wrong letters')}return e}
function validatePack(o){const errs=[];if(!o||typeof o!=='object')return{errs:['Pack must be a JSON object.']};if(!o.pack)errs.push('Missing "pack" id.');if(o.schema_version!==1)errs.push('schema_version must be 1.');const qs=[],ps=[];let skipped=0;
  for(const q of o.questions||[]){const e=validQ(q,false);if(e.length){skipped++;if(errs.length<12)errs.push((q&&q.id||'question')+': '+e.join(', '))}else qs.push(Object.assign({section:'LR',target_seconds:85,original:true},q))}
  for(const p of o.passages||[]){if(!p||!p.id||!Array.isArray(p.text)||!Array.isArray(p.questions)){skipped++;errs.push((p&&p.id||'passage')+': needs id, text[], questions[]');continue}const okQs=[];for(const q of p.questions){const e=validQ(q,true);if(e.length){skipped++;if(errs.length<12)errs.push(q.id+': '+e.join(', '))}else okQs.push(Object.assign({section:'RC',target_seconds:75,original:true},q))}if(okQs.length)ps.push(Object.assign({},p,{questions:okQs}))}
  return{errs,pack:{pack:String(o.pack||'pack-'+rid()),title:o.title||o.pack,schema_version:1,generated:!!o.generated,questions:qs,passages:ps},skipped,nq:qs.length+sum(ps.map(p=>p.questions.length)),np:ps.length}}
function installPack(pk){IMPORTED=IMPORTED.filter(p=>p.pack!==pk.pack);IMPORTED.push(pk);S.packsMeta=S.packsMeta.filter(m=>m.id!==pk.pack);S.packsMeta.push({id:pk.pack,title:pk.title,nq:(pk.questions||[]).length+sum((pk.passages||[]).map(p=>p.questions.length)),np:(pk.passages||[]).length,at:now(),generated:!!pk.generated});
  const okLocal=lsSet(LS.packs,JSON.stringify(IMPORTED));indexContent();writePack(pk);checkAch();saveNow();if(!okLocal&&!Store.db)toast('This browser is out of storage for packs. Export a save backup.','gold')}
VIEWS.library=()=>`<div class="stack"><div><div class="eyebrow">Library</div><h1 class="disp">Packs</h1><p class="sub" style="max-width:72ch;margin-top:6px">The engine is fixed; content arrives in packs. Ask Claude for the next pack in any chat, paste the JSON here, and it joins your adaptive pool. Packs save with your progress.</p></div>
  <div class="card"><h3>Installed</h3><div class="scroll"><table class="t" style="margin-top:6px"><tr><th>Pack</th><th>Questions</th><th>Passages</th><th></th></tr>${LIB.packs.map(p=>`<tr><td>${esc(p.title)}${p.generated?' <span class="pill bad">generated, lower trust</span>':''}</td><td class="mono">${p.nq}</td><td class="mono">${p.np}</td><td>${isBuiltinPack(p.id)?'<span class="tag">built in</span>':`<button class="btn sm ghost" data-a="rmPack" data-v="${esc(p.id)}">Remove</button>`}</td></tr>`).join('')}</table></div></div>
  <div class="grid g2"><div class="card"><h3>Import a pack</h3><p class="sub" style="font-size:13.5px;margin:4px 0 8px">Paste the whole JSON, or choose a .json file.</p><textarea id="pkText" rows="8" placeholder='{"pack":"pack-02-weaken-strengthen","schema_version":1,"questions":[...]}'></textarea><div class="row" style="margin-top:8px"><button class="btn primary" data-a="importPack">Import</button><input type="file" id="pkFile" accept=".json,application/json"></div><div id="pkMsg" class="sub" style="margin-top:8px;font-size:13.5px"></div></div>
  <div class="card"><h3>Request the next pack</h3><p class="sub" style="font-size:13.5px;margin:4px 0 8px">Copies a request you paste into a Claude chat. It includes the schema and your current weak spots.</p><select id="rqPack" style="width:100%">${(CURR.packRoadmap||[]).map(p=>`<option>${esc(p)}</option>`).join('')}<option>Custom: my top weaknesses and traps</option></select><div class="row" style="margin-top:8px"><button class="btn" data-a="packReq">Copy request</button></div><textarea id="rqText" rows="5" readonly style="margin-top:8px"></textarea></div></div>
  <div class="card cl-only"><h3>Generate a fresh drill with Claude</h3><p class="sub" style="font-size:13.5px;margin:4px 0 8px">Optional and lower trust than curated packs: no second review happens before you see these. They carry a red badge, and Report Flaw quarantines any you doubt. Uses your Claude account and asks permission the first time.</p><div class="row"><select id="gnType">${['Weaken','Strengthen','Flaw','Necessary Assumption','Sufficient Assumption','Must Be True','Most Strongly Supported','Paradox','Principle','Method','Main Conclusion','Parallel Reasoning'].map(t=>`<option>${t}</option>`).join('')}</select><select id="gnDiff">${[2,3,4,5].map(n=>`<option value="${n}" ${n===3?'selected':''}>${n} stars</option>`).join('')}</select><select id="gnN"><option>3</option><option selected>4</option><option>5</option></select><button class="btn primary" data-a="genDrill">Generate</button><button class="btn ghost" data-a="genStop">Stop</button></div><div id="gnMsg" class="sub" style="margin-top:8px;font-size:13.5px;white-space:pre-wrap"></div></div>

  <details class="card"><summary style="cursor:pointer"><b>Pack schema (version 1)</b></summary><pre class="mono" style="white-space:pre-wrap;font-size:12px;margin-top:8px">${esc(CURR.schemaDoc||'')}</pre></details></div>`;
ACT.importPack=async()=>{let txt=$('#pkText').value.trim();const f=$('#pkFile').files&&$('#pkFile').files[0];if(!txt&&f)txt=await f.text();const msg=$('#pkMsg');if(!txt){msg.textContent='Paste a pack or choose a file.';return}let o;try{o=JSON.parse(txt)}catch(e){msg.textContent='Not valid JSON: '+e.message;return}const r=validatePack(o);if(isBuiltinPack(r.pack.pack)){msg.textContent='That pack is already built into the game, so there is nothing to import.';return}if(!r.nq){msg.innerHTML='Nothing importable. '+r.errs.map(esc).join('<br>');return}installPack(r.pack);S.counters.packs=(S.counters.packs||0)+1;toast('Imported '+r.nq+' questions'+(r.np?' in '+r.np+' passages':'')+'.','volt');render();const m2=$('#pkMsg');if(m2&&r.skipped)m2.innerHTML='Skipped '+r.skipped+' items:<br>'+r.errs.map(esc).join('<br>')};
ACT.rmPack=v=>confirmBox('Remove this pack?','Its questions leave the pool. Your answer history stays.','Remove',()=>{IMPORTED=IMPORTED.filter(p=>p.pack!==v);S.packsMeta=S.packsMeta.filter(m=>m.id!==v);lsSet(LS.packs,JSON.stringify(IMPORTED));indexContent();saveNow();render()});
ACT.packReq=()=>{const which=$('#rqPack').value;const led=ledgerMD();const t=`Build the next Ascent to 180 content pack: ${which}.\n\nRules: original questions only (never reproduce or paraphrase real LSAT items), exactly one defensible answer validated by the negation test, truth tables or Venn diagrams where relevant, answer letters balanced across A to E, no em dashes, reason from first principles, every wrong answer gets a trap code and a reason, every question gets a flashcard (back under 40 words). Output pure JSON only, schema_version 1, in this shape:\n\n${CURR.schemaDoc}\n\nMy current data:\n\n${led}`;$('#rqText').value=t;copyText(t,$('#rqText'))};
ACT.unq=v=>{delete S.quarantine[v];indexContent();saveSoon();render()};
ACT.qView=v=>showQuestionModal(v,{});
ACT.reportFlaw=v=>{openModal(`<h2 class="disp" style="font-size:24px">Report a flaw</h2><p class="sub" style="margin:6px 0 10px">What is wrong? Two defensible answers, a wrong key, an unclear stimulus. The question is quarantined: no scoring, no practice, listed under Flagged items in the Library.</p><textarea id="flawNote" rows="4" placeholder="B also weakens, because..."></textarea><div class="row" style="margin-top:10px"><button class="btn primary" data-a="flawGo" data-v="${esc(v)}">Quarantine it</button><button class="btn" data-a="closeModal">Cancel</button></div>`)};
ACT.flawGo=v=>{S.quarantine[v]={t:now(),note:($('#flawNote')||{}).value||''};delete S.cards[v];closeModal();toast('Quarantined. Thanks for keeping the library honest.');checkAch();saveNow();if(VIEW.name!=='play')render()};

/* ---------- Claude features (sample capability) ---------- */
let SAMPLE,SAMPLE_OK=false,GEN_CTL=null;
async function sampleCap(){if(SAMPLE!==undefined)return SAMPLE;try{SAMPLE=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){SAMPLE=null}SAMPLE_OK=!!SAMPLE;return SAMPLE}
function sampleMsg(e){const c=e&&e.code;return{not_granted:'Claude access was not allowed for this page. You can paste the question into a Claude chat instead.',sampling_disabled:'Claude is not available for this account here.',rate_limited:'Too many requests right now. Try again in a minute.',refused:'Claude declined that request.',cancelled:'Stopped.',session_expired:'Sign in again, then retry.',invalid_json:'The reply was not valid JSON. Try again.'}[c]||'Something went wrong reaching Claude. Try again later.'}
ACT.askWhy=async v=>{const out=$('#ask-'+v);if(!out)return;const sm=await sampleCap();if(!sm){out.textContent='Asking Claude is not available in this view. Paste the question into a Claude chat instead.';return}
  const q=LIB.Q[v];const last=A.filter(x=>x.q===v).pop()||{};let mine=last.ch||'';const set=curSet();if(set&&set.ans[v]&&set.ans[v].ch)mine=set.ans[v].ch;
  const ctx=q.section==='RC'?'PASSAGE:\n'+LIB.P[q.passage].text.join('\n\n').slice(0,6000):'STIMULUS:\n'+q.stimulus;
  const p=`You are an LSAT tutor for one student, Jay. Reason only from the logic of the text below. Do not cite prep companies, books or forums. Never use em dashes. In under 230 words: (1) state the argument skeleton or the passage idea that decides it, (2) explain why ${q.answer} is right, (3) ${mine&&mine!==q.answer?'explain exactly why '+mine+' (his pick) fails and what made it tempting':'explain the most tempting wrong answer'}. If you think the credited answer is flawed or a second answer is defensible, say so plainly. End with one flashcard: "Front: ..." and "Back: ..." (back under 40 words).\n\n${ctx}\n\nQUESTION: ${q.stem}\n${LET.map(L=>L+') '+q.choices[L]).join('\n')}\n\nCredited answer: ${q.answer}\nGame explanation: ${q.explanation.why_correct}\nJay's note: ${S.notes[v]||'none'}`;
  out.textContent='Thinking...';try{await sm(p,{onText:({text})=>{out.textContent=text},cache:{gcTime:86400000}})}catch(e){out.textContent=(e&&e.text)||sampleMsg(e)}};
ACT.writeFb=async()=>{const out=$('#wrFb');const sm=await sampleCap();if(!sm){out.textContent='Claude feedback is not available in this view.';return}const W=CURR.writing;const p=(W.prompts||[]).find(x=>x.id===WR.pid);
  const prompt=`You are reviewing an LSAT Argumentative Writing response. It is unscored by LSAC but law schools read it. Be direct and specific, no flattery, no em dashes, under 320 words. Score each rubric dimension 1 to 5 with one sentence each, then list the three most valuable fixes, then rewrite one weak sentence from the essay as an example.\n\nRUBRIC:\n${W.rubric.map(r=>'- '+r.name+': '+r.desc).join('\n')}\n\nPROMPT: ${p.title}\n${p.scenario}\nTask: ${p.task}\nPerspectives:\n${p.criteria.map(c=>'- '+c).join('\n')}\n\nESSAY:\n${WR.text}`;
  out.textContent='Thinking...';try{const r=await sm(prompt,{onText:({text})=>{out.textContent=text},cache:false});WR.fb=r.text;S.counters.writingFb++;checkAch();saveSoon()}catch(e){out.textContent=(e&&e.text)||sampleMsg(e)}};
ACT.genStop=()=>{if(GEN_CTL)GEN_CTL.abort()};
ACT.genDrill=async()=>{const msg=$('#gnMsg');const sm=await sampleCap();if(!sm){msg.textContent='Generation needs Claude access, which this view does not have.';return}const type=$('#gnType').value,diff=+$('#gnDiff').value,n=+$('#gnN').value;GEN_CTL=new AbortController();
  const prompt=`Write ${n} ORIGINAL LSAT Logical Reasoning questions of type "${type}" at difficulty ${diff} of 5. Never reproduce or paraphrase real LSAT questions. Each must have exactly one defensible answer: solve it blind, run the negation test for assumption questions, and make sure no wrong answer can be defended. Vary topics and spread correct answers across A to E. Never use em dashes. Stimuli 3 to 7 sentences in a dry academic register. Reply with only a JSON object {"questions":[...]} where each question is:\n{"id":"GEN-<random6>","section":"LR","type":"${type}","subtype":"...","difficulty":${diff},"target_seconds":85,"tags":["..."],"stimulus":"...","stem":"...","choices":{"A":"...","B":"...","C":"...","D":"...","E":"..."},"answer":"A-E","explanation":{"argument_skeleton":"Premise: ... Conclusion: ... Gap: ...","why_correct":"...","why_wrong":{"<each wrong letter>":{"trap":"ONE_OF:${TRAP_CODES.slice(0,22).join('|')}","text":"..."}},"method_reminder":"...","flashcard":{"front":"...","back":"under 40 words"}},"original":true}`;
  msg.textContent='Thinking. Careful questions take a minute or two...';try{const res=await sm.json(prompt,{modelTier:'complex',signal:GEN_CTL.signal,cache:false});const arr=(res&&res.questions)||(Array.isArray(res)?res:[]);const r=validatePack({pack:'gen-'+dayKey(),title:'Generated drills '+dayKey(),schema_version:1,generated:true,questions:arr.map(q=>Object.assign({},q,{id:'GEN-'+rid()}))});
    if(!r.nq){msg.textContent='The reply did not pass validation: '+r.errs.join('; ');return}const exist=IMPORTED.find(p=>p.pack===r.pack.pack);if(exist){r.pack.questions=exist.questions.concat(r.pack.questions)}installPack(r.pack);msg.textContent='Added '+r.nq+' questions. Starting the drill.';const ids=r.pack.questions.slice(-r.nq).map(q=>q.id);runSet('Generated drill',{label:'Generated · '+type,mode:'blind',items:ids},{kind:'generated'})}catch(e){msg.textContent=sampleMsg(e)}finally{GEN_CTL=null}};

/* ---------- Preferences and data ---------- */
VIEWS.prefs=()=>{const s=S.settings,p=S.profile;const seg=(key,opts)=>`<span class="seg">${opts.map(([v,l])=>`<button class="${String(s[key])===String(v)?'on':''}" data-a="setPref" data-v="${v}" data-k="${key}">${l}</button>`).join('')}</span>`;
  return`<div class="stack" style="max-width:980px"><div><div class="eyebrow">Preferences</div><h1 class="disp">Settings and save data</h1></div>
  <div class="card"><h3>Goals</h3><div class="grid g4" style="margin-top:8px"><label class="f">Goal<input type="number" data-bind="profile.goal" data-num value="${p.goal}"></label><label class="f">Floor<input type="number" data-bind="profile.floor" data-num value="${p.floor}"></label><label class="f">Test date<input type="date" data-bind="profile.testDate" value="${esc(p.testDate)}"></label><label class="f">Default climb<select data-bind="profile.minutes" data-num>${[20,45,90].map(m=>`<option value="${m}" ${p.minutes==m?'selected':''}>${m} min</option>`).join('')}</select></label></div></div>
  <div class="card"><h3>Test format</h3><p class="sub" style="font-size:13.5px;margin:4px 0 8px">Current format runs through June 2027. New format starts August 2027. This switches the simulators, pace guides and Test Facts.</p>${seg('format',[['current','Current (4 × 35 min)'],['new','New (RC 52 + LR 45 + LR 45)']])}</div>
  <div class="card"><h3>Mountain and sky</h3><div class="col" style="margin-top:8px"><div class="row between"><span>Scene</span>${seg('scene',[['live','Live'],['still','Still image'],['off','Off']])}</div><div class="row between"><span>Render quality</span>${seg('quality',[['auto','Auto'],['4k','4K (2160p)'],['native','Native'],['high','High'],['medium','Medium'],['low','Low']])}</div><div class="row between"><span>Climb cutscenes</span>${seg('cutscene',[['every','Every climb'],['camps','New camps only'],['off','Off']])}</div><div class="row between"><span>Sky</span>${seg('sky',[['auto','Your local time'],['dawn','Dawn'],['day','Day'],['dusk','Dusk'],['night','Night']])}</div><div class="row between"><span>Game layer during practice</span>${seg('focus',[[false,'Show pitches and O₂'],[true,'Focus mode']])}</div></div><p class="muted" style="font-size:12.5px;margin-top:10px">The mountain is rendered live on your graphics chip. Auto adapts to your graphics chip. Native renders at your screen's full pixel count and 4K renders about 8.3 million pixels (3840 x 2160), which looks sharpest but needs a strong GPU for the Live scene; pair 4K with Still image on most laptops. If a laptop runs warm, choose Low or Still image. Full simulations always hide the game layer.</p></div>
  <div class="card"><h3>Music</h3><div class="grid g2" style="margin-top:8px">${MUSIC.stations.map(st=>`<button class="mapzone" style="grid-template-columns:36px minmax(0,1fr) auto" data-a="musicStation" data-v="${st.id}">${icon('headphones',22)}<div><b>${esc(st.name)}</b><div class="sub" style="font-size:13px">${esc(st.desc)}</div></div>${S.settings.music.station===st.id?`<span class="pill ${MUSIC.playing?'volt':'gold'}">${MUSIC.playing?'Playing':'Selected'}</span>`:''}</button>`).join('')}</div>
   <div class="col" style="margin-top:12px"><div class="row between"><span>Volume</span><input type="range" id="musicVol" min="0" max="100" step="1" value="${Math.round(S.settings.music.vol*100)}" style="width:220px" aria-label="Music volume"></div><div class="row between"><span>During timed sections</span><span class="seg">${[['keep','Keep playing'],['lower','Lower'],['pause','Pause']].map(([v,l])=>`<button class="${S.settings.music.timed===v?'on':''}" data-a="setMusicTimed" data-v="${v}">${l}</button>`).join('')}</span></div><div class="row between"><span>Sound effects</span>${seg('sound',[[false,'Off'],[true,'On']])}</div></div><p class="muted" style="font-size:12.5px;margin-top:10px">Every track is generated live in your browser, so it never repeats exactly and needs no download.</p></div>
  <div class="card"><h3>Reading</h3><div class="col" style="margin-top:8px"><div class="row between"><span>Question and passage surface</span>${seg('theme',[['system','Match my device'],['light','Paper'],['dark','Night slate']])}</div><div class="row between"><span>Text size</span>${seg('fontScale',[[.92,'S'],[1,'M'],[1.1,'L'],[1.25,'XL']])}</div><div class="row between"><span>Reading font</span>${seg('readFont',[['serif','Literata serif'],['lexend','Lexend, reading ease']])}</div><div class="row between"><span>Motion</span>${seg('motion',[['system','System'],['reduce','Reduce']])}</div><div class="row between"><span>Timer by default</span>${seg('showTimer',[[true,'Show'],[false,'Hide']])}</div></div></div>
  <div class="card"><h3>Save data</h3><p class="sub" style="font-size:13.5px;margin:4px 0 10px">Status: ${esc({cloud:'saving to your account, so it follows you across devices',saving:'saving now',local:'saving in this browser only',cloudfail:'cloud save failing, browser save working',fail:'saving failed',starting:'connecting'}[Store.status]||Store.status)}. Last saved ${fmtAgo(Store.lastSave)}. Every answer autosaves.</p>
  ${typeof accountHTML==='function'?accountHTML():''}<div class="row"><button class="btn primary" data-a="exportSave">Export Save</button><button class="btn" data-a="importSaveOpen">Import Save</button><button class="btn ghost" data-a="resetAll">Reset everything</button></div>${lsGet(LS.bak)?`<div class="row" style="margin-top:10px"><button class="btn" data-a="restoreBak">Restore the backed-up copy</button><span class="muted" style="font-size:12.5px">${esc(bakInfo())}</span></div>`:''}</div></div>`};
function bakInfo(){try{const b=JSON.parse(lsGet(LS.bak));const st=JSON.parse(b.core);return'Level '+levelInfo(st.xp||0).lv+', '+(b.att||[]).length+' answers, saved '+new Date(b.at).toLocaleString()}catch(e){return''}}
ACT.restoreBak=()=>confirmBox('Restore the backed-up copy?','This swaps your current progress for the backed-up copy. Your current progress is backed up first, so you can swap back.','Restore',()=>{try{const b=JSON.parse(lsGet(LS.bak));const cur=JSON.stringify(S),curA=A;S=migrate(JSON.parse(b.core));A=b.att||[];S.attChunks=Math.ceil(A.length/ATT_CHUNK);S.cloudRev=Store.remoteRev||0;S.rev=(Store.remoteRev||0)+1;stashBackup('swapped',cur,curA);SEEN=null;indexContent();applySettings();for(let i=0;i<S.attChunks;i++)Store.dirtyAtt.add(i);saveNow();render();toast('Backed-up copy restored.','volt')}catch(e){toast('That backup could not be read.')}});
ACT.setMusicTimed=v=>{S.settings.music.timed=v;saveSoon();render()};
ACT.setPref=(v,el)=>{const k=el.dataset.k;let val=v;if(v==='true')val=true;else if(v==='false')val=false;else if(k==='fontScale')val=+v;S.settings[k]=val;applySettings();if(k==='ambient')ambient(!!val);saveSoon();render()};
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset.bind)return;const path=t.dataset.bind.split('.');let o=S;for(let i=0;i<path.length-1;i++)o=o[path[i]];let v=t.value;if(t.dataset.num!=null)v=+v;o[path[path.length-1]]=v;saveSoon()});
ACT.exportSave=()=>{S.counters.backup++;checkAch();saveNow();offerFile('ascent-save-'+dayKey()+'.json',exportBlob(),'Save backup')};
ACT.importSaveOpen=()=>openModal(`<h2 class="disp" style="font-size:24px">Import Save</h2><p class="sub" style="margin:6px 0 10px">Paste an export, or choose the .json file. This replaces the current progress on this device and in your cloud save.</p><textarea id="isText" rows="8"></textarea><input type="file" id="isFile" accept=".json,application/json" style="margin-top:8px"><div id="isMsg" class="sub" style="margin-top:6px"></div><div class="row" style="margin-top:10px"><button class="btn primary" data-a="importSaveGo">Replace and restore</button><button class="btn" data-a="closeModal">Cancel</button></div>`);
ACT.importSaveGo=async()=>{let txt=$('#isText').value.trim();const f=$('#isFile').files&&$('#isFile').files[0];if(!txt&&f)txt=await f.text();const err=importSaveText(txt);if(err){$('#isMsg').textContent=err;return}closeModal();toast('Save restored.','volt');render()};
ACT.resetAll=()=>confirmBox('Reset everything?','This erases progress, cards, history and imported packs on this device and in your cloud save. Export first if there is any chance you want it back.','Yes, erase',()=>confirmBox('Really erase?','There is no undo.','Erase now',()=>{const keep=S.settings;S=freshState();S.settings=keep;A=[];S.cloudRev=Store.remoteRev||0;S.rev=(Store.remoteRev||0)+1;IMPORTED=[];lsSet(LS.packs,'[]');indexContent();Store.dirtyAtt.add(0);saveNow();render()}));

/* ---------- Help and Test Facts ---------- */
VIEWS.help=()=>`<div class="stack" style="max-width:980px"><div><div class="eyebrow">Help</div><h1 class="disp">How the climb works</h1></div>${(CURR.help||[]).map(h=>`<div class="card"><h3>${esc(h.t)}</h3><div class="prose" style="margin-top:6px">${h.p.map(x=>`<p>${fmtText(x)}</p>`).join('')}</div></div>`).join('')}<div class="card"><h3>Keyboard</h3><p class="sub">A to E select · Shift + letter or S then letter strikes · 1, 2, 3 confidence · F flag · N next · P back · H highlight selection · T timer · Enter check or next · Space flips flashcards.</p></div></div>`;
VIEWS.facts=()=>{const F=CURR.facts||{};return`<div class="stack" style="max-width:980px"><div><div class="eyebrow">Test Facts</div><h1 class="disp">The real test</h1><p class="sub" style="margin-top:6px">${esc(F.confirm||'')}</p></div>${(F.sections||[]).map(s=>`<div class="card"><h3>${esc(s.t)}</h3><ul class="read" style="margin:8px 0 0 18px">${s.items.map(i=>`<li>${fmtText(i)}</li>`).join('')}</ul></div>`).join('')}</div>`};

/* ---------- global click delegation ---------- */
ACT.fullscreen=()=>{try{if(document.fullscreenElement){document.exitFullscreen()}else{const r=document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(()=>toast('Full screen is not allowed here. Try the browser menu or F11, or open the page in its own tab.'))}}catch(e){toast('Full screen is not available in this view. Try F11 or open the page in its own tab.')}};
document.addEventListener('fullscreenchange',()=>{const fs=!!document.fullscreenElement;document.documentElement.classList.toggle('isfs',fs);const b=document.getElementById('fsbtn');if(b)b.innerHTML=icon(fs?'minimize':'maximize',17)});
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('[data-a]');if(!el)return;if(el.disabled)return;const fn=ACT[el.dataset.a];if(!fn)return;if(el.tagName==='A')e.preventDefault();try{fn(el.dataset.v,el,e)}catch(err){console.error(err);toast('That action failed: '+err.message)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MODAL){closeModal();return}if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.ch[role=button]')&&VIEW.name==='play'){e.preventDefault();choose(e.target.dataset.ch)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S)saveNow();else if(!document.hidden&&S&&!(typeof VIEW!=='undefined'&&VIEW&&VIEW.name==='play'))checkRemote()});

/* ---------- boot ---------- */
let SCENE_ON=false;function start(hotData){if(!SCENE_ON&&typeof SCENE!=='undefined'){const cv=document.getElementById('scene');if(cv){SCENE_ON=true;try{SCENE.init(cv)}catch(e){console.warn(e)}}}loadLocal();S.lastSeenPrev=S.lastSeen;indexContent();applySettings();const h=(location.hash||'').slice(1);if(hotData&&hotData.view&&VIEWS[hotData.view.name])VIEW=hotData.view;else if(VIEWS[h])VIEW={name:h,p:null};if(VIEW.name==='play'&&!S.active)VIEW={name:'home',p:null};
  for(const id in S.quarantine)if(S.cards[id])delete S.cards[id];render();Store.status=Store.localOk?'starting':'fail';renderSave();initCloud();sampleCap();checkAch();snapshotProjection();setTimeout(()=>saveNow(),1500)}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({view:VIEW}))}catch(e){}
(function(){const hot=window.claude&&window.claude.hot;if(hot&&typeof hot.ready==='function')hot.ready(start);else start((hot&&hot.data)||{})})();

</script>
