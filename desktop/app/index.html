 either majority.", "why_correct": "B copies the move exactly: two 'most' claims about one group, the volunteers, then a 'most' claim about how one subgroup relates to the other. Same error: overlap is guaranteed, a majority is not.", "why_wrong": {"A": {"trap": "MISMATCHED_STRUCTURE", "text": "Valid: if most are chemists and every chemist has a doctorate, most have a doctorate."}, "C": {"trap": "MISMATCHED_STRUCTURE", "text": "Flawed, but differently: it chains 'most A are B' and 'most B are C' rather than describing one group twice."}, "D": {"trap": "QUANTIFIER_SHIFT", "text": "A similar overlap error, but with 'some', where even an overlap is not guaranteed. The original's quantifiers are 'most'."}, "E": {"trap": "MISMATCHED_STRUCTURE", "text": "Valid: two majorities of the same club must overlap, so 'some' follows. Same words, sound logic."}}, "method_reminder": "Parallel Flaw: name the error first ('two mosts guarantee some overlap, not most'), then find the answer that commits that same error with the same quantifiers.", "flashcard": {"front": "Most E are C; most E are N; so most C are N?", "back": "Flawed. Two majorities of E overlap, so only 'some C are N' follows. 'Most' needs more."}}, "original": true}, {"id": "LR-PA-008", "section": "LR", "type": "Parallel Flaw", "subtype": "post-hoc", "difficulty": 3, "target_seconds": 100, "tags": ["parallel-flaw", "causal", "post-hoc"], "stimulus": "Ever since the Brightwater Inn began offering free breakfast last spring, its occupancy rate has risen. Clearly, the free breakfast is what has drawn more guests to the inn.", "stem": "Which one of the following arguments contains a flaw most similar to the flaw in the argument above?", "choices": {"A": "Sales at the Corner Bookshop rose after it added a café, and most new customers told surveyors they came because of the café. So the café has drawn new customers to the shop.", "B": "Most hotels that offer free breakfast have high occupancy rates. The Seaside Hotel offers free breakfast. So the Seaside Hotel probably has a high occupancy rate.", "C": "Every restaurant on Front Street that added outdoor seating saw its sales rise. So adding outdoor seating would raise sales at any restaurant in the city.", "D": "After Dr. Ames began recommending morning walks to her patients, fewer of them reported trouble sleeping. Evidently, the walks are what improved her patients' sleep.", "E": "The owner of the Fulton Gym says that its new evening classes are the most popular in the city, and since she runs the gym, she would know. Clearly, the classes are the most popular in the city."}, "answer": "D", "explanation": {"argument_skeleton": "Free breakfast began; then occupancy rose. Conclusion: breakfast caused the rise. Flaw: treats sequence in time as proof of cause, ruling out nothing else.", "why_correct": "D draws the same causal conclusion from the same thin evidence: the walks began, then sleep improved, so the walks caused it. No other cause is considered in either argument, and cause and effect sit in the same order.", "why_wrong": {"A": {"trap": "MISMATCHED_STRUCTURE", "text": "The survey evidence links customers to the café directly, so this argument does more than note a sequence."}, "B": {"trap": "MISMATCHED_STRUCTURE", "text": "This applies a generalization to a case. It makes no causal claim from a sequence."}, "C": {"trap": "TOO_BROAD", "text": "A different flaw: it generalizes from one street to every restaurant in the city."}, "E": {"trap": "MISMATCHED_STRUCTURE", "text": "A different flaw: it trusts a source with a stake in the answer. No causal claim is made."}}, "method_reminder": "Parallel Flaw with causation: check that the answer infers cause from mere sequence, with cause and effect in the same order as the original.", "flashcard": {"front": "Free breakfast began, then occupancy rose, so breakfast drew guests. What must a parallel answer copy?", "back": "Post hoc reasoning: cause inferred from sequence alone, in the same direction, with no rival causes considered."}}, "original": true}, {"id": "LR-PA-009", "section": "LR", "type": "Parallel Flaw", "subtype": "unless", "difficulty": 4, "target_seconds": 110, "tags": ["parallel-flaw", "unless", "truth-table"], "stimulus": "The ferry will run tomorrow unless the wind exceeds forty knots. The wind will exceed forty knots tomorrow. So the ferry will not run tomorrow.", "stem": "The flawed pattern of reasoning in which one of the following is most similar to that in the argument above?", "choices": {"A": "The bakery will open on Monday unless its oven is still broken. Its oven is still broken. So the bakery will not open on Monday.", "B": "The parade will go ahead unless it rains. It will not rain. So the parade will go ahead.", "C": "The museum will close early only if the staff meeting runs late. The staff meeting will run late. So the museum will close early.", "D": "If the trail is muddy, the race will be postponed. The race will not be postponed. So the trail is not muddy.", "E": "The library will extend its hours unless its budget is cut. Its budget will be cut. So the library will certainly reduce its hours."}, "answer": "A", "explanation": {"argument_skeleton": "Wind at or below 40 → ferry runs. The wind will exceed 40. Conclusion: no ferry. Flaw: 'unless' guarantees the ferry when the wind is calm; it says nothing about what happens when the wind is high.", "why_correct": "A misreads 'unless' the same way. A working oven guarantees the bakery opens, but a broken oven does not guarantee it stays closed: it might bake elsewhere or sell yesterday's bread. Same rule form, same fact, same unwarranted conclusion.", "why_wrong": {"B": {"trap": "MISMATCHED_STRUCTURE", "text": "Valid: no rain triggers the guarantee, so the parade goes ahead."}, "C": {"trap": "MISTAKEN_REVERSAL", "text": "A different error: it treats a necessary condition (the meeting running late) as enough."}, "D": {"trap": "MISMATCHED_STRUCTURE", "text": "Valid contrapositive: no postponement means the trail is not muddy."}, "E": {"trap": "EXTREME", "text": "Close, but it concludes more than the negation: 'reduce its hours' goes beyond 'will not extend them', so the patterns differ."}}, "method_reminder": "Truth table for 'X unless Y': the only forbidden case is not Y and not X. If Y happens, X may or may not.", "flashcard": {"front": "'The ferry runs unless the wind tops 40 knots.' The wind tops 40. Can you conclude there is no ferry?", "back": "No. 'Unless' guarantees the ferry only when the wind stays lower. High wind leaves it open."}}, "original": true}, {"id": "LR-PR-003", "section": "LR", "type": "Principle", "subtype": "justify", "difficulty": 3, "target_seconds": 85, "tags": ["principle", "ethics", "research"], "stimulus": "Ethicist: Dr. Lindqvist discovered that a colleague had falsified data in a study that has not yet been published. The colleague has promised to withdraw the paper before publication. Even so, Dr. Lindqvist should report the falsification to the university's research office, since the colleague may falsify data again, and only the research office can review the colleague's other studies.", "stem": "Which one of the following principles, if valid, most helps to justify the ethicist's reasoning?", "choices": {"A": "Researchers should never collaborate with a colleague who has falsified data.", "B": "A promise to correct a wrong relieves others of any obligation to report that wrong.", "C": "Someone who learns of research misconduct should report it to the body able to review the wrongdoer's other work whenever the misconduct may recur, even if its immediate harm has been prevented.", "D": "Universities should give their research offices the power to review any faculty member's work.", "E": "Anyone who discovers falsified data should report it to the journal to which the paper was submitted."}, "answer": "C", "explanation": {"argument_skeleton": "Facts: a colleague falsified unpublished data and promises to withdraw the paper. Reasons: it may happen again; only the research office can review other studies. Conclusion: Lindqvist should report to the research office.", "why_correct": "C matches every element: misconduct discovered, a risk it will recur, a body able to review other work, and immediate harm already prevented. Applied to the facts, it yields exactly the ethicist's conclusion.", "why_wrong": {"A": {"trap": "EXTREME", "text": "A sweeping rule about collaboration, and silent on reporting."}, "B": {"trap": "REVERSAL", "text": "This would justify not reporting, the opposite conclusion."}, "D": {"trap": "OUT_OF_SCOPE", "text": "It concerns how universities are organized, not what Lindqvist should do."}, "E": {"trap": "SHELL_GAME", "text": "It points to the wrong recipient, and the paper is being withdrawn anyway."}}, "method_reminder": "Principle-justify: the right principle's conditions match the facts and its outcome matches the conclusion. Check each condition against the stimulus.", "flashcard": {"front": "Fraud caught before publication and withdrawal promised, yet 'report it'. Which principle fits?", "back": "Report misconduct to whoever can review the person's other work when it may recur, even if this harm was averted."}}, "original": true}, {"id": "LR-PR-004", "section": "LR", "type": "Principle", "subtype": "apply", "difficulty": 2, "target_seconds": 75, "tags": ["principle", "apply", "unless"], "stimulus": "Principle: A public agency should release a dataset to the public if releasing it would help citizens evaluate the agency's performance, unless releasing it would reveal information that could identify private individuals.", "stem": "Which one of the following judgments most closely conforms to the principle above?", "choices": {"A": "The housing agency should not release its building inspection reports, since they would not help citizens evaluate the agency's performance.", "B": "The health department should release its patient-by-patient records of clinic visits, since those records would help citizens evaluate the department's clinics.", "C": "The parks department should release its budget, because citizens have a right to know how public money is spent.", "D": "Every public agency should release all of its datasets that contain no information about private individuals.", "E": "The transit authority should release its on-time records for each bus route, since those records would help riders judge the authority's service and contain no information about individual riders."}, "answer": "E", "explanation": {"argument_skeleton": "Helps citizens evaluate performance, and reveals no identifying information → release. The principle never says when an agency should withhold.", "why_correct": "E satisfies both conditions, an evaluative benefit and no identifying information, and draws exactly the principle's conclusion: release.", "why_wrong": {"A": {"trap": "MISTAKEN_NEGATION", "text": "The principle says when to release, not when to withhold. Failing its condition proves nothing."}, "B": {"trap": "HALF_RIGHT", "text": "The evaluative benefit fits, but patient-by-patient records could identify individuals, triggering the exception."}, "C": {"trap": "OUT_OF_SCOPE", "text": "It relies on a different reason, a right to know, not the principle's conditions."}, "D": {"trap": "EXTREME", "text": "It drops the requirement that the data help citizens evaluate performance."}}, "method_reminder": "Apply-the-principle questions: check every condition, including any 'unless' exception, and make sure the answer concludes what the principle concludes, not its negation.", "flashcard": {"front": "Release data if it helps citizens evaluate the agency, unless it could identify individuals. Which judgment conforms?", "back": "One where the data helps evaluate and identifies no one, concluding 'release'. Not 'withhold because it does not help'."}}, "original": true}, {"id": "LR-PX-003", "section": "LR", "type": "Paradox", "subtype": "count-vs-severity", "difficulty": 2, "target_seconds": 75, "tags": ["paradox", "urban", "traffic"], "stimulus": "After the city of Dorran replaced the traffic lights at twenty intersections with roundabouts, the number of collisions at those intersections rose by 15 percent. Yet over the same period, the number of injuries from collisions at those intersections fell by half.", "stem": "Which one of the following, if true, most helps to resolve the apparent discrepancy described above?", "choices": {"A": "The number of vehicles passing through the twenty intersections rose during the period.", "B": "Collisions at roundabouts typically happen at low speeds and glancing angles, whereas collisions at signal-controlled intersections often involve vehicles striking each other head-on or at right angles at higher speeds.", "C": "Many drivers in Dorran dislike roundabouts and avoid routes that include them.", "D": "Roundabouts cost less to maintain than the traffic lights they replaced.", "E": "Dorran mailed every household a brochure explaining how to drive through a roundabout."}, "answer": "B", "explanation": {"argument_skeleton": "Fact 1: collisions at the converted intersections rose 15%. Fact 2: injuries there fell by half. Need: a reason more crashes could produce fewer injuries.", "why_correct": "B explains both facts at once: roundabouts trade rare, violent crashes for more frequent, gentle ones. The count goes up while severity goes down, so injuries fall.", "why_wrong": {"A": {"trap": "EXPLAINS_HALF", "text": "More traffic helps explain more collisions but makes fewer injuries even more puzzling."}, "C": {"trap": "DEEPENS_PARADOX", "text": "Fewer drivers should mean fewer collisions, which makes the rise harder to explain."}, "D": {"trap": "OUT_OF_SCOPE", "text": "Maintenance costs bear on neither fact."}, "E": {"trap": "TRUE_BUT_IRRELEVANT", "text": "A brochure explains neither more collisions nor fewer injuries."}}, "method_reminder": "Paradox: restate it as 'X, and yet Y'. The answer must make both true at once. Here the key is that a count of events says nothing about how severe each one is.", "flashcard": {"front": "Roundabouts: collisions up 15%, injuries down 50%. What resolves it?", "back": "Roundabout crashes are slow and glancing; signal crashes are fast and head-on. More crashes, less harm."}}, "original": true}, {"id": "LR-PX-004", "section": "LR", "type": "Paradox", "subtype": "demand-shift", "difficulty": 3, "target_seconds": 80, "tags": ["paradox", "economics", "demand"], "stimulus": "Over the past five years, the price of a ticket to games at Halvard Stadium has risen by 40 percent, and attendance there has also risen steadily. Over the same period, ticket prices at Corran Field, the region's other stadium, have not changed, and attendance there has fallen.", "stem": "Which one of the following, if true, most helps to explain the facts described above?", "choices": {"A": "Ticket prices at most stadiums in the country have risen over the past five years.", "B": "Halvard Stadium has more seats than Corran Field has.", "C": "Prices at Corran Field's concession stands have risen over the past five years.", "D": "Over the past five years, the team that plays at Halvard Stadium has won three league championships, while the team at Corran Field has finished last in its league every season.", "E": "Halvard Stadium announced each of its price increases well before the start of the season."}, "answer": "D", "explanation": {"argument_skeleton": "Fact 1: Halvard's prices up 40% and attendance up. Fact 2: Corran's prices flat and attendance down. Need: something that outweighs price in fans' choices.", "why_correct": "Fans buy tickets to see a team, not just a seat. If Halvard's team kept winning titles while Corran's finished last every season, demand for Halvard rose enough to absorb higher prices, and demand for Corran fell despite flat prices.", "why_wrong": {"A": {"trap": "IRRELEVANT_COMPARISON", "text": "National price trends do not explain why Halvard's attendance rose while Corran's fell."}, "B": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Capacity can explain the size of crowds, not why they grew at one stadium and shrank at the other."}, "C": {"trap": "EXPLAINS_HALF", "text": "Pricier concessions might help explain Corran's decline but do nothing for Halvard's growth despite higher prices."}, "E": {"trap": "OUT_OF_SCOPE", "text": "Advance notice of a price increase does not make fans want to pay it."}}, "method_reminder": "When price and quantity rise together, look for a shift in demand: something that made people want the product more at any price.", "flashcard": {"front": "Prices up 40%, attendance up; rival's prices flat, attendance down. Best resolver?", "back": "A demand shift: Halvard's team got much better and Corran's much worse, so fans wanted Halvard more at any price."}}, "original": true}, {"id": "LR-EV-002", "section": "LR", "type": "Evaluate", "subtype": "causal", "difficulty": 3, "target_seconds": 75, "tags": ["evaluate", "causal", "education"], "stimulus": "University administrator: Students who used our new online tutoring service last semester earned higher grades, on average, than students who did not use it. So the service is improving students' grades, and we should expand it.", "stem": "Which one of the following would be most useful to know in evaluating the administrator's argument?", "choices": {"A": "whether the students who used the service already had higher grades than other students before the service was introduced", "B": "whether the service is more popular with first-year students than with older students", "C": "whether other universities offer similar online tutoring services", "D": "whether every student who used the service earned higher grades than every student who did not", "E": "whether the service's tutors are themselves students at the university"}, "answer": "A", "explanation": {"argument_skeleton": "Premise: tutoring users earned higher average grades. Conclusion: the service raises grades, so expand it. Gap: users were not already stronger students.", "why_correct": "If users already outperformed non-users before the service existed, the grade gap reflects who chose tutoring, not what tutoring did, and the argument collapses. If they did not, the causal reading gains ground. Either answer matters.", "why_wrong": {"B": {"trap": "IRRELEVANT_COMPARISON", "text": "Popularity across class years does not bear on whether the service raises grades."}, "C": {"trap": "OUT_OF_SCOPE", "text": "Other universities' offerings are beside the point."}, "D": {"trap": "EXTREME", "text": "The claim is about averages. Neither answer to this all-versus-all question settles whether the service works."}, "E": {"trap": "OUT_OF_SCOPE", "text": "Who the tutors are does not tell us whether tutoring caused the grade difference."}}, "method_reminder": "Evaluate: pick the question whose two possible answers push the argument in opposite directions. For causal claims, ask about the groups' starting points.", "flashcard": {"front": "Tutoring users got higher grades, so tutoring works. Most useful to know?", "back": "Whether users already had higher grades before the service existed. Yes undermines the argument; no supports it."}}, "original": true}, {"id": "LR-PI-002", "section": "LR", "type": "Point at Issue", "subtype": "policy", "difficulty": 2, "target_seconds": 70, "tags": ["point-at-issue", "urban", "transit"], "stimulus": "Marisol: The city should extend late-night bus service on weekends. Restaurant and hospital workers who finish their shifts after midnight now have no affordable way home, and many of them earn low wages.\nTheo: Extending late-night service would be a mistake. The existing late-night routes average fewer than five riders per bus, and the money would do far more good spent on more frequent service at rush hour, when buses are packed.", "stem": "Marisol and Theo disagree over whether", "choices": {"A": "workers who finish their shifts after midnight now lack an affordable way home", "B": "ridership on the existing late-night routes is low", "C": "the city should extend late-night bus service on weekends", "D": "rush-hour service matters more than any other kind of transit service", "E": "many late-night workers earn low wages"}, "answer": "C", "explanation": {"argument_skeleton": "Marisol: extend late-night service (workers are stranded). Theo: extending it would be a mistake (low ridership; better spent at rush hour). They clash over the extension itself.", "why_correct": "Marisol says the city should extend the service; Theo says doing so would be a mistake. Both take a position on exactly C, and the positions conflict.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "Only Marisol addresses this; Theo never disputes it."}, "B": {"trap": "OUT_OF_SCOPE", "text": "Only Theo mentions ridership, and Marisol never contests it."}, "D": {"trap": "EXTREME", "text": "Theo argues only that rush hour is the better use of this money, not that it beats every other kind of service."}, "E": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Marisol asserts this, and Theo never denies it. He argues the money would help more people elsewhere."}}, "method_reminder": "Point at Issue: an answer qualifies only if both speakers express a view on it and the views conflict. Facts raised by one speaker alone fail.", "flashcard": {"front": "One speaker wants late-night buses for stranded workers; the other cites empty buses. Point at issue?", "back": "Whether to extend the late-night service. Each supporting fact is raised by only one speaker."}}, "original": true}, {"id": "LR-AG-002", "section": "LR", "type": "Agreement", "subtype": "concession", "difficulty": 3, "target_seconds": 75, "tags": ["agreement", "education", "concession"], "stimulus": "Nadia: Standardized tests should not be the main factor in college admissions. They measure a narrow range of skills, and students from wealthier families can pay for coaching that raises their scores.\nKofi: I disagree that tests should be dropped from admissions entirely. Grades vary so much from school to school that, without some common measure, admissions officers cannot fairly compare applicants. Still, I grant that coaching gives students from wealthier families an advantage on the tests.", "stem": "Nadia and Kofi are committed to agreeing with which one of the following?", "choices": {"A": "Standardized tests should be dropped from college admissions.", "B": "Students from wealthier families can gain an advantage on standardized tests through paid coaching.", "C": "Grades are a fairer basis than test scores for comparing applicants.", "D": "Standardized tests measure a narrow range of skills.", "E": "Standardized tests should be the main factor in college admissions."}, "answer": "B", "explanation": {"argument_skeleton": "Nadia: tests should not be the main factor (narrow skills; coaching favors the wealthy). Kofi: do not drop tests entirely (grades vary), but grants the coaching advantage.", "why_correct": "Nadia cites the coaching advantage as a reason; Kofi explicitly grants it ('Still, I grant'). B is the only claim both speakers endorse.", "why_wrong": {"A": {"trap": "EXTREME", "text": "Nadia says tests should not be the main factor, which is weaker than dropping them, and Kofi rejects dropping them."}, "C": {"trap": "OUT_OF_SCOPE", "text": "Nadia never discusses grades, and Kofi suggests grades are hard to compare."}, "D": {"trap": "OUT_OF_SCOPE", "text": "Only Nadia makes this claim; Kofi does not address it."}, "E": {"trap": "TOO_STRONG", "text": "Kofi defends keeping some common measure, not making tests the main factor, and Nadia rejects it."}}, "method_reminder": "Agreement: find a claim each speaker supports in their own words. Concession phrases ('I grant', 'admittedly') often mark the shared ground.", "flashcard": {"front": "One speaker says coaching helps wealthy test-takers; the other concedes it. Agreement answer?", "back": "The coaching advantage. Concessions like 'I grant' often mark what both speakers accept."}}, "original": true}], "passages": [{"id": "RC-HUM-003", "passage_type": "humanities", "comparative": false, "difficulty": 4, "title": "The Written-Out Cadenza", "text": ["In concertos of the late eighteenth century, the orchestra regularly fell silent near the end of a movement so that the soloist could play a cadenza, an unaccompanied passage that elaborated the movement's themes. Composers marked the spot in the score but usually left the passage itself unwritten, expecting the performer to supply it. Contemporary accounts suggest that audiences expected a soloist's cadenza to differ from one performance to the next. Today, however, most soloists play cadenzas that have been composed in advance, either by the composer, where one survives, or by a famous performer of a later generation, and they play the same cadenza night after night.", "Advocates of historically informed performance have urged soloists to return to improvisation, arguing that a cadenza composed in advance betrays the composer's intentions. The argument has force, but it rests on a fragile foundation. The composers' intentions are often unrecoverable, and where evidence survives, it is mixed: some composers wrote out cadenzas for their students, and at least one complained in a letter that performers' improvisations wandered too far from the movement's material. If authenticity means fidelity to what composers wanted, the case for improvisation is weaker than its advocates suppose.", "There is, nonetheless, a better reason to revive the practice, one that has less to do with the past than with what a cadenza does within a performance. A cadenza is the only point in a concerto at which the soloist stands alone, without the support or constraint of the orchestra, and audiences of the period seem to have listened to it as a test: would the performer find something new to say about themes the audience had just heard, and would the passage arrive safely back at the orchestra's entrance? Reviews from the period dwell on these moments, praising soloists who ventured something new and teasing those who retreated into safe formulas. A cadenza known in advance, played with polished perfection, removes the test. The audience hears a display of skill but not a display of judgment under pressure.", "Seen this way, the written-out cadenza changes the meaning of the moment rather than merely its notes. Improvisation would restore the possibility of failure, and with it the drama that the form was built to contain. Soloists who fear embarrassment might begin modestly, improvising within a framework they have prepared, much as the period's performers did. Even a carefully prepared cadenza can leave room for choices made in the moment, and those choices are what an audience can hear being made. What matters is not that the cadenza be invented on the spot in every detail, but that it remain genuinely open until it is played."], "model_margin_notes": ["Then: cadenzas improvised. Now: pre-composed, repeated", "Advocates: intentions argument. Author: fragile, evidence mixed", "Better reason: cadenza as a live test of judgment", "Restore risk; prepared frameworks fine; keep it open"], "main_point": "Although the argument from composers' intentions is weak, improvised cadenzas should be revived because improvisation restores the risk that made the cadenza a test of the soloist's judgment.", "author_attitude": "Skeptical of the authenticity argument, supportive of reviving improvisation for a different reason, and moderate about how it is done.", "structure": "P1 contrasts past and present practice. P2 presents and critiques the intentions argument. P3 offers a better reason: the cadenza as a live test. P4 draws the implications and allows prepared frameworks.", "questions": [{"id": "RC-HUM-003-1", "section": "RC", "type": "Main Point", "difficulty": 3, "target_seconds": 75, "tags": ["main-point"], "stem": "Which one of the following most accurately expresses the main point of the passage?", "choices": {"A": "Soloists should improvise their cadenzas because improvisation is what late eighteenth-century composers intended.", "B": "Although the appeal to composers' intentions offers weak support for improvised cadenzas, reviving improvisation is worthwhile because it restores the risk that gave the cadenza its dramatic meaning.", "C": "Written-out cadenzas display greater technical polish than improvised ones and should therefore be preferred.", "D": "Evidence about late eighteenth-century composers' intentions regarding cadenzas is mixed and often unrecoverable.", "E": "Audiences of the late eighteenth century listened to cadenzas as tests of a performer's judgment."}, "answer": "B", "explanation": {"argument_skeleton": "P2: the intentions argument 'rests on a fragile foundation.' P3: 'There is, nonetheless, a better reason to revive the practice.' P4: improvisation 'would restore the possibility of failure.'", "why_correct": "B captures both moves: the author rejects the authenticity argument yet still favors improvisation, for a different reason, namely that risk is what gives the cadenza its meaning.", "why_wrong": {"A": {"trap": "CRITICISM_SCOPE", "text": "This is the advocates' reasoning, which the author calls fragile. The author shares their conclusion, not their reason."}, "C": {"trap": "VALENCE_FLIP", "text": "The author treats polish without risk as a loss, not a reason to prefer written-out cadenzas."}, "D": {"trap": "TOO_NARROW", "text": "Accurate for the second paragraph only. It leaves out the author's positive case."}, "E": {"trap": "TOO_NARROW", "text": "A supporting point from the third paragraph, not the passage's overall claim."}}, "method_reminder": "Main Point: the right answer covers the author's position across the whole passage, including any 'not this reason, but that one' turn.", "flashcard": {"front": "Author rejects one argument for a practice, then defends the practice for another reason. Main point?", "back": "Both halves: the first argument is weak, but the practice is worth reviving for the better reason."}}, "original": true}, {"id": "RC-HUM-003-2", "section": "RC", "type": "Author's Attitude", "difficulty": 3, "target_seconds": 65, "tags": ["attitude"], "stem": "The author's attitude toward the advocates of historically informed performance discussed in the second paragraph can most accurately be described as", "choices": {"A": "contempt for their goals", "B": "unqualified agreement with their reasoning", "C": "suspicion that their real motives are commercial", "D": "sympathy with their recommendation combined with doubt about their main argument for it", "E": "admiration for their scholarship combined with rejection of their recommendation"}, "answer": "D", "explanation": {"argument_skeleton": "P2: 'The argument has force, but it rests on a fragile foundation.' P3: 'There is, nonetheless, a better reason to revive the practice.'", "why_correct": "The author wants improvisation revived, as the advocates do, but finds their appeal to composers' intentions weak. Agreement on the goal, doubt about the argument.", "why_wrong": {"A": {"trap": "EXTREME", "text": "Nothing so harsh: the author grants that the argument 'has force'."}, "B": {"trap": "VALENCE_FLIP", "text": "The author says the argument rests on a fragile foundation."}, "C": {"trap": "OUT_OF_SCOPE", "text": "Motives are never discussed."}, "E": {"trap": "CRITICISM_SCOPE", "text": "This reverses the split: the author accepts their recommendation and doubts their reasoning."}}, "method_reminder": "Attitude questions often hinge on which part the author accepts. Separate the conclusion from the reasoning and check each.", "flashcard": {"front": "'The argument has force, but it rests on a fragile foundation.' Then: 'a better reason to revive the practice.' Attitude?", "back": "Agrees with the recommendation, doubts the argument for it. Not rejection, not full agreement."}}, "original": true}, {"id": "RC-HUM-003-3", "section": "RC", "type": "Function", "difficulty": 3, "target_seconds": 65, "tags": ["function", "evidence"], "stem": "The author mentions a composer who complained in a letter about performers' improvisations primarily in order to", "choices": {"A": "provide evidence that composers did not uniformly favor improvised cadenzas", "B": "show that improvised cadenzas of the period were usually of poor quality", "C": "suggest that the composer would have preferred cadenzas written by later performers", "D": "show that performers of the period were judged mainly by how far their improvisations wandered", "E": "argue that historically informed performance should be abandoned"}, "answer": "A", "explanation": {"argument_skeleton": "P2: 'where evidence survives, it is mixed: some composers wrote out cadenzas for their students, and at least one complained in a letter...'", "why_correct": "The letter is offered as part of the 'mixed' evidence about composers' wishes. It undercuts the advocates' assumption that composers wanted improvisation.", "why_wrong": {"B": {"trap": "TOO_BROAD", "text": "One composer's complaint cannot show that improvisations were usually poor."}, "C": {"trap": "OUT_OF_SCOPE", "text": "Nothing suggests a preference for later performers' cadenzas."}, "D": {"trap": "RECYCLED_LANGUAGE", "text": "It reuses 'wandered' to make a claim about how performers were judged, which the letter does not address."}, "E": {"trap": "EXTREME", "text": "The author never urges abandoning historically informed performance, only doubts one argument for improvisation."}}, "method_reminder": "Function: find the claim the detail supports. Here the sentence right before it announces that the evidence is 'mixed'.", "flashcard": {"front": "Why cite one composer's complaint about improvised cadenzas?", "back": "To show composers' wishes were mixed, weakening the claim that improvisation is what they wanted."}}, "original": true}, {"id": "RC-HUM-003-4", "section": "RC", "type": "Inference", "difficulty": 4, "target_seconds": 75, "tags": ["inference"], "stem": "The author would most likely agree with which one of the following statements about a soloist who improvises a cadenza within a framework prepared in advance?", "choices": {"A": "The soloist fails to honor the composer's intentions.", "B": "The soloist's cadenza is no different in effect from a fully written-out cadenza.", "C": "The soloist is likely to play with less technical polish than a soloist who performs a written-out cadenza.", "D": "The soloist should eventually abandon the framework and improvise every detail.", "E": "The soloist can still preserve what the author regards as the essential feature of the cadenza."}, "answer": "E", "explanation": {"argument_skeleton": "P4: 'Soloists who fear embarrassment might begin modestly, improvising within a framework they have prepared... What matters is not that the cadenza be invented on the spot in every detail, but that it remain genuinely open until it is played.'", "why_correct": "The author explicitly endorses prepared frameworks and says the essential thing is that the cadenza stay open until performed. A framework that still leaves room for live choices keeps that feature.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "The author sets intentions aside as an unreliable guide, so this is not the author's concern."}, "B": {"trap": "VALENCE_FLIP", "text": "The author presents frameworks as a way to keep the openness that written-out cadenzas lose."}, "C": {"trap": "IRRELEVANT_COMPARISON", "text": "The passage never compares the polish of these two kinds of performers."}, "D": {"trap": "EXTREME", "text": "The author says the cadenza need not be invented 'in every detail'."}}, "method_reminder": "Inference: the right answer rephrases a commitment the author states. Look for the sentence that says what 'matters'.", "flashcard": {"front": "Author: what matters is that the cadenza 'remain genuinely open until it is played.' Is a prepared framework acceptable?", "back": "Yes. It keeps the essential feature, openness, without requiring every detail to be invented live."}}, "original": true}, {"id": "RC-HUM-003-5", "section": "RC", "type": "Organization", "difficulty": 3, "target_seconds": 70, "tags": ["organization"], "stem": "Which one of the following most accurately describes the organization of the passage?", "choices": {"A": "A practice is described, two rival explanations of its origin are compared, and one is shown to be supported by new evidence.", "B": "A historical change is described, its causes are analyzed, and a prediction is made about its future course.", "C": "A current practice is contrasted with an earlier one, an argument for restoring the earlier practice is found wanting, and a different argument for restoring it is offered.", "D": "A proposal is presented, objections to it are raised, and the proposal is rejected.", "E": "A theory about eighteenth-century audiences is advanced and then tested against the evidence of composers' letters."}, "answer": "C", "explanation": {"argument_skeleton": "P1: then (improvised) vs now (pre-composed). P2: the authenticity argument and its fragile foundation. P3 and P4: the better reason, restoring risk.", "why_correct": "C tracks each step: the contrast between past and present, the critique of the intentions argument, and the author's alternative case for the same restoration.", "why_wrong": {"A": {"trap": "HALF_RIGHT", "text": "The passage does open with a practice, but no rival explanations of its origin appear."}, "B": {"trap": "OUT_OF_SCOPE", "text": "The causes of the change are never analyzed, and nothing is predicted."}, "D": {"trap": "VALENCE_FLIP", "text": "The author ends up supporting the proposal to restore improvisation."}, "E": {"trap": "DEVICE_PROMOTION", "text": "Audiences and the letter are supporting details, not the passage's framework."}}, "method_reminder": "Organization: write a one-line summary of each paragraph first, then match the sequence. Every step in the answer must occur, in order.", "flashcard": {"front": "Old vs new practice; one argument for going back fails; a better argument succeeds. Which structure?", "back": "Contrast, critique, alternative case. Watch for answers that say the proposal is rejected."}}, "original": true}, {"id": "RC-HUM-003-6", "section": "RC", "type": "Analogy", "difficulty": 4, "target_seconds": 75, "tags": ["analogy"], "stem": "Which one of the following is most analogous to the change that the author attributes to the use of written-out cadenzas?", "choices": {"A": "A tightrope walker begins performing with a hidden safety line, so that the walk looks the same as before but no longer carries any risk of a fall.", "B": "A chef replaces the ingredients of a traditional recipe with cheaper substitutes that change the dish's flavor.", "C": "A novelist publishes a revised edition of a book that corrects errors found in the first edition.", "D": "A singer learns a song in a new language so that a wider audience can understand it.", "E": "A theater company begins improvising its entire play each night from audience suggestions."}, "answer": "A", "explanation": {"argument_skeleton": "P3: 'A cadenza known in advance, played with polished perfection, removes the test.' P4: it 'changes the meaning of the moment rather than merely its notes.'", "why_correct": "The written-out cadenza keeps the surface the same, a brilliant solo, while removing the possibility of failure that gave it meaning. The hidden safety line does the same to the tightrope walk.", "why_wrong": {"B": {"trap": "HALF_RIGHT", "text": "A change to a tradition, but one that alters the substance itself. The author's point is that the surface stays the same while the risk disappears."}, "C": {"trap": "OUT_OF_SCOPE", "text": "Correcting errors involves no loss of risk or meaning."}, "D": {"trap": "OUT_OF_SCOPE", "text": "Translation for a wider audience has nothing to do with removing a test."}, "E": {"trap": "DIRECTION_FLIP", "text": "This adds risk to a performance, the reverse of the change the author describes."}}, "method_reminder": "Analogy: state the relationship abstractly first ('same surface, risk removed, meaning changed'), then find the answer with that relationship, whatever its topic.", "flashcard": {"front": "Written-out cadenza: same brilliant solo, no chance of failure. Best analogy?", "back": "Anything where the surface stays the same but the risk that gave it meaning disappears, like a hidden safety line."}}, "original": true}]}, {"id": "RC-HUM-004", "passage_type": "humanities", "comparative": false, "difficulty": 3, "title": "Reading in the Margins", "text": ["Historians of reading have long faced an awkward problem: reading usually leaves no trace. One exception has drawn increasing attention. Many surviving books from the sixteenth and seventeenth centuries are crowded with handwritten notes, underlinings, and symbols left by their owners, and scholars have mined these marginalia for evidence of how individual readers responded to what they read. Because such notes were written in the reader's own hand and rarely meant for anyone else's eyes, they have seemed to promise unusually candid evidence. A note of protest beside a passage, or a column of crosses marking favored lines, seems to open a window onto a particular mind at work.", "That window, however, is less transparent than it appears. Much early modern annotation followed methods that readers were explicitly taught. Schoolmasters trained pupils to mark passages worth remembering, to summarize arguments in the margin, and to copy striking phrases into notebooks organized under subject headings for later use in their own writing. Printed manuals described standard symbols, such as a pointing hand for an important passage, and recommended them to readers of every station. Some books even printed model notes in their margins, and surviving copies show readers dutifully copying such notes into other books by hand. A margin full of pointing hands may therefore record not an individual reader's enthusiasms but a reader's diligence in applying a common technique.", "This does not make marginalia useless to the historian; it changes what they are evidence of. If annotation was a learned practice, then the patterns of annotation in a collection of books can reveal how reading was taught and how widely particular methods spread. Shifts in the conventions over the decades can even help scholars date annotations that bear no date. A scholar who finds the same symbols in books owned by a lawyer in London and a merchant in a provincial town learns something about the reach of the schoolroom and the printed manual. The notes become evidence less of private response than of shared habit.", "Individual responses are not thereby lost. Against the background of standard practice, departures become visible: a reader who uses the conventional symbols but adds a sarcastic comment, or who marks passages that no manual would recommend, stands out precisely because the conventions were so widely shared. Such departures are less common than the older approach implied, but they are more revealing for being measured against a known norm. The historian who begins with the conventions, then, is better placed to recognize the individual reader, not worse placed."], "model_margin_notes": ["Old use: marginalia as a window onto individual minds", "But annotation was taught; symbols were standard", "So notes show shared habits and how methods spread", "Departures from convention reveal individuals"], "main_point": "Because annotation was a taught practice, marginalia are chiefly evidence of shared reading habits, though knowing the conventions also lets historians recognize genuinely individual responses.", "author_attitude": "Corrective but constructive: challenges the standard use of marginalia without dismissing their value.", "structure": "P1 the standard use. P2 the complication: taught conventions. P3 the revised value: evidence of shared habits. P4 individual responses recovered through departures from convention.", "questions": [{"id": "RC-HUM-004-1", "section": "RC", "type": "Primary Purpose", "difficulty": 3, "target_seconds": 65, "tags": ["primary-purpose"], "stem": "The primary purpose of the passage is to", "choices": {"A": "argue that historians of reading should stop using marginalia as evidence", "B": "describe the methods schoolmasters used to teach reading in the sixteenth century", "C": "reconsider what marginalia can reveal about early modern reading in light of the fact that annotation was a taught practice", "D": "compare the reading habits of lawyers with those of merchants", "E": "defend the traditional use of marginalia as a direct record of individual readers' responses"}, "answer": "C", "explanation": {"argument_skeleton": "P2: 'That window, however, is less transparent than it appears.' P3: 'This does not make marginalia useless... it changes what they are evidence of.' P4: individual responses 'are not thereby lost.'", "why_correct": "The author revises the standard use of marginalia: because annotation was taught, notes mainly show shared habits, and knowing those habits makes genuine individual responses easier to spot. C names that reconsideration.", "why_wrong": {"A": {"trap": "EXTREME", "text": "The author says marginalia are not useless; they are evidence of something different."}, "B": {"trap": "TOO_NARROW", "text": "Schoolroom methods support the argument but are not its subject."}, "D": {"trap": "DEVICE_PROMOTION", "text": "The lawyer and merchant are a single example, not a comparison the passage pursues."}, "E": {"trap": "VALENCE_FLIP", "text": "The author challenges that traditional use rather than defending it."}}, "method_reminder": "Primary Purpose: choose a verb that fits the author's stance (reconsider, challenge, defend) and an object that covers the whole passage.", "flashcard": {"front": "Notes in old books were taught habits, so they show shared practice, and departures show individuals. Primary purpose?", "back": "To reconsider what marginalia are evidence of, not to discard them or defend the old reading."}}, "original": true}, {"id": "RC-HUM-004-2", "section": "RC", "type": "Vocabulary in Context", "difficulty": 3, "target_seconds": 60, "tags": ["vocabulary", "metaphor"], "stem": "The author's statement that the 'window' is 'less transparent than it appears' (beginning of the second paragraph) most nearly means that marginalia", "choices": {"A": "do not reveal individual readers' responses as directly as they seem to", "B": "are often hard to read because the ink has faded", "C": "were deliberately written to conceal their writers' true views", "D": "are less numerous than historians once believed", "E": "are more useful to historians of printing than to historians of reading"}, "answer": "A", "explanation": {"argument_skeleton": "P1: marginalia seem 'to open a window onto a particular mind at work.' P2: 'That window, however, is less transparent than it appears,' because much annotation followed taught methods.", "why_correct": "The window metaphor stands for direct access to an individual reader's mind. Calling it less transparent means taught conventions stand between the notes and the person, so the notes reveal less about the individual than they seem to.", "why_wrong": {"B": {"trap": "OUT_OF_SCOPE", "text": "A literal reading of 'transparent'. Legibility is never discussed."}, "C": {"trap": "EXTREME", "text": "Readers followed conventions; nothing suggests deliberate concealment."}, "D": {"trap": "OUT_OF_SCOPE", "text": "Quantity is not at issue; the passage calls surviving books 'crowded' with notes."}, "E": {"trap": "IRRELEVANT_COMPARISON", "text": "Historians of printing are never mentioned."}}, "method_reminder": "Vocabulary in context: read the metaphor against the sentences around it. The passage's own explanation, here the taught methods, defines the word.", "flashcard": {"front": "Marginalia as a 'window' onto a mind that is 'less transparent than it appears.' Meaning?", "back": "They show individual responses less directly than they seem, because taught conventions shape them."}}, "original": true}, {"id": "RC-HUM-004-3", "section": "RC", "type": "Function", "difficulty": 3, "target_seconds": 65, "tags": ["function", "example"], "stem": "The author mentions a lawyer in London and a merchant in a provincial town (third paragraph) primarily in order to", "choices": {"A": "show that readers in different professions responded to the same books in the same way", "B": "suggest that marginalia were more common in cities than in provincial towns", "C": "illustrate how a reader's departures from convention become visible", "D": "argue that only educated professionals annotated their books", "E": "illustrate how shared annotation methods can reveal how far particular ways of teaching reading spread"}, "answer": "E", "explanation": {"argument_skeleton": "P3: finding 'the same symbols' in books owned by the lawyer and the merchant teaches the scholar 'something about the reach of the schoolroom and the printed manual.'", "why_correct": "The two owners are far apart in place and occupation, yet use the same symbols. That shows a taught method's reach, which is exactly the new kind of evidence the third paragraph describes.", "why_wrong": {"A": {"trap": "RECYCLED_LANGUAGE", "text": "Same symbols show shared training, not shared responses. The author's point is precisely that the two differ."}, "B": {"trap": "OUT_OF_SCOPE", "text": "No comparison of city and provincial annotation is made."}, "C": {"trap": "SHELL_GAME", "text": "Departures from convention are the fourth paragraph's topic. This example shows conformity."}, "D": {"trap": "EXTREME", "text": "The passage says manuals were recommended to readers 'of every station'."}}, "method_reminder": "Function: an example usually serves the claim stated just before or after it. Here the claim is about 'the reach of the schoolroom and the printed manual'.", "flashcard": {"front": "Same symbols in a London lawyer's and a provincial merchant's books. Why mention them?", "back": "To show how far taught annotation methods spread: evidence of shared habits, not private responses."}}, "original": true}, {"id": "RC-HUM-004-4", "section": "RC", "type": "Detail", "difficulty": 2, "target_seconds": 55, "tags": ["detail"], "stem": "According to the passage, schoolmasters trained pupils to do which one of the following?", "choices": {"A": "write sarcastic comments beside passages they disagreed with", "B": "copy striking phrases into notebooks organized under subject headings for later use in their own writing", "C": "invent personal symbols to mark the passages they found most important", "D": "avoid writing in books that belonged to others", "E": "summarize each book in a single sentence on its title page"}, "answer": "B", "explanation": {"argument_skeleton": "P2: 'Schoolmasters trained pupils to mark passages worth remembering, to summarize arguments in the margin, and to copy striking phrases into notebooks organized under subject headings for later use in their own writing.'", "why_correct": "B restates one of the three practices the second paragraph attributes to schoolmasters.", "why_wrong": {"A": {"trap": "RECYCLED_LANGUAGE", "text": "Sarcastic comments appear in the fourth paragraph as departures from convention, not taught practice."}, "C": {"trap": "HALF_RIGHT", "text": "Marking passages was taught, but the symbols were standard ones described in manuals, not personal inventions."}, "D": {"trap": "OUTSIDE_KNOWLEDGE", "text": "A plausible custom, but the passage never mentions it."}, "E": {"trap": "OUT_OF_SCOPE", "text": "Pupils summarized arguments in the margin, not whole books on title pages."}}, "method_reminder": "Detail: find the sentence and match it. Watch for answers that blend a real detail with a twist, like 'personal' symbols.", "flashcard": {"front": "What did schoolmasters teach pupils to do with striking phrases?", "back": "Copy them into notebooks organized under subject headings, for use in their own writing."}}, "original": true}, {"id": "RC-HUM-004-5", "section": "RC", "type": "Inference", "difficulty": 3, "target_seconds": 65, "tags": ["inference", "hedged-language"], "stem": "Which one of the following can most reasonably be inferred from the passage about a sixteenth-century book whose margins contain many pointing hands but no other notes?", "choices": {"A": "Its owner disagreed with most of the passages that are marked.", "B": "Its owner was probably a schoolmaster.", "C": "Its markings reveal its owner's private enthusiasms more reliably than written comments would.", "D": "Its markings may reflect its owner's application of a widely taught technique rather than the owner's personal tastes.", "E": "It was printed later than books whose margins contain written summaries."}, "answer": "D", "explanation": {"argument_skeleton": "P2: a pointing hand was a standard symbol 'for an important passage'; 'A margin full of pointing hands may therefore record not an individual reader's enthusiasms but a reader's diligence in applying a common technique.'", "why_correct": "The passage says nearly this about margins full of pointing hands. D keeps the author's hedge ('may'), which is what the evidence supports.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "A pointing hand marks an important passage, not disagreement."}, "B": {"trap": "TOO_STRONG", "text": "Pointing hands were recommended to readers of every station; nothing points to a schoolmaster."}, "C": {"trap": "VALENCE_FLIP", "text": "The author says standard symbols reveal less about personal enthusiasm, not more."}, "E": {"trap": "OUT_OF_SCOPE", "text": "Nothing in the passage concerns printing dates."}}, "method_reminder": "Inference: the best answer often restates a qualified claim from the passage. Keep the qualifier; drop answers that harden it.", "flashcard": {"front": "A margin full of standard pointing hands. What does it most safely show?", "back": "Possibly diligence in a taught technique rather than personal taste. Keep the 'may'."}}, "original": true}, {"id": "RC-HUM-004-6", "section": "RC", "type": "Author Response", "difficulty": 4, "target_seconds": 75, "tags": ["author-response", "application"], "stem": "Suppose a historian concludes that the owner of a set of seventeenth-century books admired a particular author, because the owner marked that author's passages with many standard symbols. The author of the passage would most likely advise the historian first to", "choices": {"A": "count how many books in the set were written by that author", "B": "determine whether the owner's markings depart in any way from the conventions readers were taught", "C": "abandon the attempt to learn about the owner from the markings", "D": "compare the owner's markings with those in books owned by a London lawyer", "E": "find out whether the owner learned to annotate from a schoolmaster or from a printed manual"}, "answer": "B", "explanation": {"argument_skeleton": "P4: 'Against the background of standard practice, departures become visible... The historian who begins with the conventions, then, is better placed to recognize the individual reader.'", "why_correct": "Standard symbols alone may show only diligence. The author's method is to start from the conventions and look for departures, which are what reveal an individual response such as admiration.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "Counting the author's books does not show what the markings mean."}, "C": {"trap": "EXTREME", "text": "The author insists individual responses are 'not thereby lost'."}, "D": {"trap": "RECYCLED_LANGUAGE", "text": "This borrows the passage's example without addressing what the markings show about this owner."}, "E": {"trap": "IRRELEVANT_COMPARISON", "text": "Schoolmasters and manuals taught the same kinds of conventions, so which one the owner learned from does not reveal admiration."}}, "method_reminder": "Author Response: apply the method the author recommends. Here it is 'begin with the conventions, then look for departures'.", "flashcard": {"front": "Many standard symbols beside one author's passages. What should the historian check first?", "back": "Whether the markings depart from taught conventions. Conformity may be diligence; departures show the individual."}}, "original": true}]}, {"id": "RC-CMP-002", "passage_type": "humanities", "comparative": true, "difficulty": 4, "title": "Memory as Evidence", "text": ["Oral history, the recording of people's spoken recollections of events they witnessed, has given historians access to lives that left few written records. The voices it preserves are often those that official archives ignored. Its practitioners sometimes write as though spoken testimony deserved special trust, as the authentic voice of ordinary experience. But a recollection recorded fifty years after an event is not a window onto that event. Memory is reconstructive: each time an episode is recalled, it is rebuilt from fragments and shaped by everything the person has since learned, heard, and come to believe.", "The appropriate response is not to discard oral testimony but to treat it as historians treat any other source. A diary entry is checked against letters, official records, and other diaries; an oral account should be checked in the same way. Agreement among independent narrators can strengthen an account, just as agreement among independent documents does, while a single narrator's uncorroborated claim deserves no more weight than an uncorroborated diary entry. Where a narrator's account of dates, places, or the order of events conflicts with documents made at the time, the documents should generally prevail, and the testimony should be used chiefly for what it alone can supply, such as details of daily life that no one thought worth writing down.", "When a former dockworker recalls a strike from the 1950s and places it in the wrong year, or merges two separate walkouts into one, the historian who treats the testimony as a defective record notes the error and moves on. Yet the error itself may be the most informative part of the account. Narrators tend to rearrange events in ways that reveal what those events came to mean to them: a defeat remembered as a victory, a minor dispute promoted to the moment when everything changed. The historian who looks only for accuracy sees in such rearrangements nothing but decay.", "Such reshaping is not noise to be filtered out; it is evidence of a kind that documents cannot provide. A payroll ledger can tell us when the strike began. Only the memories of those who took part can tell us how the strike came to figure in their understanding of their own lives and of their community's history. A dockworker who remembers a lost strike as a victory is telling us something true about how his community chose to understand its defeat. To check oral testimony against documents is necessary, but to stop there is to mistake the source's greatest strength for its weakness."], "text_labels": ["Passage A", "", "Passage B", ""], "model_margin_notes": ["A: memory is reconstructive; testimony is no window", "A: check like any source; documents prevail; use for unrecorded details", "B: the error may be the most informative part", "B: reshaping is evidence of meaning; checking is necessary, not enough"], "main_point": "A: Oral testimony is reconstructive and should be checked against documents like any source, then used for what it alone supplies. B: Discrepancies in oral testimony reveal what events meant, so checking is necessary but not sufficient.", "author_attitude": "A: skeptical and corrective toward enthusiasts. B: appreciative; accepts checking but argues it misses the source's strength.", "structure": "A states a problem with oral testimony and prescribes standard source criticism. B grants checking but recasts errors as evidence of meaning.", "questions": [{"id": "RC-CMP-002-1", "section": "RC", "type": "Comparative", "difficulty": 4, "target_seconds": 75, "tags": ["comparative", "relationship"], "stem": "Which one of the following most accurately describes the relationship between the two passages?", "choices": {"A": "Passage B rejects Passage A's claim that memory is reconstructive.", "B": "Passage A argues that oral testimony is useless, whereas Passage B argues that it is valuable.", "C": "Passage B offers additional examples in support of Passage A's main conclusion.", "D": "Passage B accepts that oral testimony should be checked against documents but argues that the discrepancies such checking reveals can themselves be valuable evidence.", "E": "Passage A is concerned with written sources, whereas Passage B is concerned with oral sources."}, "answer": "D", "explanation": {"argument_skeleton": "A: memory is reconstructive, so check testimony against documents and let documents prevail. B: the error 'may be the most informative part'; checking 'is necessary, but to stop there is to mistake the source's greatest strength for its weakness.'", "why_correct": "B grants A's practice of checking ('necessary') but refuses to stop there: the misremembering A would correct is, for B, evidence of what events came to mean. D captures both the agreement and the extension.", "why_wrong": {"A": {"trap": "VALENCE_FLIP", "text": "B relies on memory reshaping events. It never denies that memory is reconstructive."}, "B": {"trap": "EXTREME", "text": "A explicitly says not to discard oral testimony."}, "C": {"trap": "HALF_RIGHT", "text": "B does use an example, but to argue that A's approach misses something, not to support it."}, "E": {"trap": "OUT_OF_SCOPE", "text": "Both passages are about oral testimony; A mentions diaries only as a model for checking."}}, "method_reminder": "Comparative relationship: find one point of agreement and one point of difference, then pick the answer that states both.", "flashcard": {"front": "A: check oral testimony against documents. B: checking is necessary, but errors are evidence too. Relationship?", "back": "B accepts A's checking and extends it: discrepancies reveal what events meant to the narrators."}}, "original": true}, {"id": "RC-CMP-002-2", "section": "RC", "type": "Comparative", "difficulty": 4, "target_seconds": 75, "tags": ["comparative", "author-response"], "stem": "The author of Passage B would most likely regard Passage A's recommendation that documents generally prevail over conflicting oral accounts as", "choices": {"A": "mistaken, because oral testimony is usually more accurate about dates than documents are", "B": "reasonable as far as it goes but incomplete, since it treats a conflict only as an error to be corrected rather than also as evidence", "C": "irrelevant, because historians should not be concerned with dates", "D": "correct and sufficient for making full use of oral testimony", "E": "inconsistent with Passage A's own claim that memory is reconstructive"}, "answer": "B", "explanation": {"argument_skeleton": "B: 'A payroll ledger can tell us when the strike began.' 'To check oral testimony against documents is necessary, but to stop there is to mistake the source's greatest strength for its weakness.'", "why_correct": "B concedes that documents settle facts like dates (the payroll ledger) and calls checking necessary. Its complaint is that stopping at correction throws away the most informative part, so A's rule is fine but incomplete.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "B never claims testimony is more accurate about dates; it grants the ledger's authority on when the strike began."}, "C": {"trap": "EXTREME", "text": "B accepts that dates matter. It just wants more from testimony than dates."}, "D": {"trap": "VALENCE_FLIP", "text": "B says that stopping at checking mistakes the source's strength for its weakness."}, "E": {"trap": "RECYCLED_LANGUAGE", "text": "A's rule follows naturally from its claim about memory, and B never alleges any inconsistency."}}, "method_reminder": "Author-to-author questions: find where the second author addresses the first author's point, even indirectly, and note both what is granted and what is added.", "flashcard": {"front": "B on 'let documents prevail over misremembered dates'?", "back": "Fine as far as it goes, but incomplete: the misremembering is itself evidence of meaning."}}, "original": true}, {"id": "RC-CMP-002-3", "section": "RC", "type": "Comparative", "difficulty": 4, "target_seconds": 75, "tags": ["comparative", "agreement"], "stem": "Which one of the following statements would both authors most likely accept?", "choices": {"A": "Oral testimony deserves more trust than written documents.", "B": "Errors in oral testimony are the most informative part of such testimony.", "C": "Oral testimony can supply information that documents made at the time do not.", "D": "Historians should stop collecting testimony about events more than fifty years old.", "E": "Documents made at the time of an event are always accurate about its date."}, "answer": "C", "explanation": {"argument_skeleton": "A: testimony should be used for 'what it alone can supply, such as details of daily life that no one thought worth writing down.' B: reshaping 'is evidence of a kind that documents cannot provide.'", "why_correct": "A values testimony for unrecorded details of daily life; B values it for meanings no document records. They differ about what that information is, but both hold that testimony supplies something documents do not.", "why_wrong": {"A": {"trap": "VALENCE_FLIP", "text": "A explicitly rejects 'special trust' in spoken testimony."}, "B": {"trap": "TOO_STRONG", "text": "B says errors 'may be' the most informative part, and A treats them as errors to correct."}, "D": {"trap": "OUT_OF_SCOPE", "text": "Neither author proposes limiting what testimony is collected."}, "E": {"trap": "EXTREME", "text": "A says documents should 'generally' prevail, which falls short of 'always accurate'."}}, "method_reminder": "Both-accept questions: test each answer against each author separately. Hedged, modest claims survive; strong ones usually fail one author.", "flashcard": {"front": "What do a skeptic and a champion of oral history both accept here?", "back": "Testimony supplies information documents lack: for A, unrecorded daily details; for B, what events meant."}}, "original": true}, {"id": "RC-CMP-002-4", "section": "RC", "type": "Function", "difficulty": 3, "target_seconds": 60, "tags": ["function", "model"], "stem": "The author of Passage A refers to a diary entry primarily in order to", "choices": {"A": "illustrate the ordinary practice of checking a source against other sources, which the author recommends extending to oral testimony", "B": "show that diaries are more reliable than oral testimony", "C": "provide an example of a source that preserves details of daily life", "D": "argue that written sources are also reconstructive", "E": "concede a point made by practitioners of oral history"}, "answer": "A", "explanation": {"argument_skeleton": "A: 'A diary entry is checked against letters, official records, and other diaries; an oral account should be checked in the same way.'", "why_correct": "The diary is the model: historians already cross-check it, and A says oral accounts deserve the same treatment, no more and no less.", "why_wrong": {"B": {"trap": "IRRELEVANT_COMPARISON", "text": "A ranks no source above another here; the point is equal treatment."}, "C": {"trap": "RECYCLED_LANGUAGE", "text": "Details of daily life are what oral testimony supplies, according to A, not diaries."}, "D": {"trap": "OUT_OF_SCOPE", "text": "A never claims written sources are reconstructive."}, "E": {"trap": "SHELL_GAME", "text": "No concession is made. The diary supports A's own recommendation."}}, "method_reminder": "Function: look for 'in the same way'. A detail introduced as a model shows how the author wants the main subject handled.", "flashcard": {"front": "'A diary entry is checked against letters...; an oral account should be checked in the same way.' Role of the diary?", "back": "A model of routine source criticism, which A says should apply to oral testimony too."}}, "original": true}, {"id": "RC-CMP-002-5", "section": "RC", "type": "Analogy", "difficulty": 4, "target_seconds": 70, "tags": ["analogy", "comparative"], "stem": "Which one of the following is most analogous to the way the author of Passage B proposes to treat a narrator's misremembering of events?", "choices": {"A": "A scientist discards readings from an instrument that is found to be faulty.", "B": "A judge disregards a witness's testimony after it is shown to conflict with video evidence.", "C": "A biographer interviews a subject's friends to confirm the subject's account of a key event.", "D": "A linguist records the speech of elderly people before their dialect disappears.", "E": "A historian of mapmaking studies the errors in an old map of distant lands to learn what its makers believed about those lands."}, "answer": "E", "explanation": {"argument_skeleton": "B: 'the error itself may be the most informative part of the account.' Narrators rearrange events 'in ways that reveal what those events came to mean to them.'", "why_correct": "The map's errors, like the narrator's, are read for what they reveal about the people who produced them. The distortion becomes the evidence.", "why_wrong": {"A": {"trap": "VALENCE_FLIP", "text": "Discarding faulty readings treats error as noise, the approach B calls incomplete."}, "B": {"trap": "EXTREME", "text": "Throwing out conflicting testimony entirely goes even further than the approach B criticizes."}, "C": {"trap": "HALF_RIGHT", "text": "Confirming an account is checking, which B accepts, but B's distinctive move is reading the errors themselves."}, "D": {"trap": "OUT_OF_SCOPE", "text": "Preserving speech involves no reading of errors."}}, "method_reminder": "Analogy: name the relationship abstractly ('a mistake studied for what it reveals about its maker'), then match it.", "flashcard": {"front": "B treats misremembering as evidence of meaning. Best analogy?", "back": "Studying an old map's errors to learn what its makers believed. The distortion itself is the evidence."}}, "original": true}, {"id": "RC-CMP-002-6", "section": "RC", "type": "Vocabulary in Context", "difficulty": 3, "target_seconds": 60, "tags": ["vocabulary", "comparative"], "stem": "In Passage B, the phrase 'a defective record' refers to", "choices": {"A": "a document from the time of an event that contains errors", "B": "a recording of testimony that has been damaged and is partly inaudible", "C": "testimony regarded as an imperfect report whose departures from the facts are simply mistakes", "D": "testimony that a narrator has deliberately falsified", "E": "the view of memory that Passage A rejects"}, "answer": "C", "explanation": {"argument_skeleton": "B: 'the historian who treats the testimony as a defective record notes the error and moves on. Yet the error itself may be the most informative part.'", "why_correct": "The phrase names an attitude toward testimony: a report that should match the facts, so any mismatch is just a defect. That is the approach B goes on to challenge.", "why_wrong": {"A": {"trap": "RECYCLED_LANGUAGE", "text": "The phrase describes how a historian treats testimony, not a document."}, "B": {"trap": "OUT_OF_SCOPE", "text": "A literal reading. Physical damage to recordings is never discussed."}, "D": {"trap": "EXTREME", "text": "Nothing suggests narrators falsify on purpose; B describes memory reshaping events."}, "E": {"trap": "VALENCE_FLIP", "text": "A rejects 'special trust' in testimony. The defective-record view is closer to A's own approach."}}, "method_reminder": "Phrase in context: read the sentence that uses the phrase and the one after it. The contrast ('Yet...') shows what the phrase stands for.", "flashcard": {"front": "B: the historian who treats testimony 'as a defective record notes the error and moves on.' Meaning?", "back": "Treating testimony as an imperfect report whose mismatches with the facts are just mistakes to correct."}}, "original": true}]}, {"id": "RC-SOC-001", "passage_type": "social_science", "comparative": false, "difficulty": 3, "title": "Why Join a Savings Circle?", "text": ["In many parts of the world, people save through rotating savings and credit associations. A group of, say, twelve members agrees to contribute a fixed sum at each monthly meeting, and at each meeting the entire pot goes to one member, until every member has received it once. Members typically know one another as neighbors, coworkers, or fellow congregants. Economists long treated these associations as a stopgap: a way for people without access to banks to accumulate the lump sums needed for large purchases. On this view, the associations should fade as formal banking spreads, since a bank account offers the same accumulation without the obligations of a group.", "The prediction has not held up well. In several regions where bank branches and mobile banking have become widely available, participation in savings associations has remained high, and surveys find that many members also hold bank accounts. Nor is the pattern confined to remote villages; associations remain common among urban wage earners who live within sight of a bank branch. If the associations were merely substitutes for banks, members with accounts would have little reason to stay.", "A more promising explanation begins with a difficulty familiar to almost everyone: money that is easily reached is easily spent. A bank account lets its holder save but does nothing to make her save; money deposited on Monday can be withdrawn on Tuesday for some pressing need, real or imagined. A savings association, by contrast, imposes a schedule backed by social pressure. Members who miss a contribution must face the others at the next meeting, and members who have already received the pot are bound to keep paying. The obligation runs in every direction at once, since each member's payment is another member's pot. Seen in this light, the association is less a substitute for a bank than a commitment device: an arrangement people adopt precisely because it limits their own future choices.", "The commitment explanation also clarifies a feature of the associations that the substitution view finds puzzling. Members who receive the pot late in the cycle do no better, financially, than they would by saving alone at home; they simply get their own money back. Yet such members rarely complain, and some associations let members bid for early turns while others assign turns by lot. Neither arrangement appears to change how long members stay. If the point were access to credit, late recipients would be the losers of the arrangement. If the point is discipline, everyone gains, because everyone ends the cycle with a sum that most would not otherwise have managed to set aside."], "model_margin_notes": ["Savings circles; old view: stopgap for the unbanked", "Prediction fails: members with bank accounts stay", "Better: commitment device that limits future choices", "Explains late recipients: discipline, so everyone gains"], "main_point": "Savings associations persist where banking is available because they work as commitment devices that help members save, not merely as substitutes for banks.", "author_attitude": "Confident and analytical; rejects the substitution view in favor of the commitment explanation.", "structure": "P1 the old view and its prediction. P2 evidence that the prediction failed. P3 the commitment explanation. P4 a further puzzle the new explanation resolves.", "questions": [{"id": "RC-SOC-001-1", "section": "RC", "type": "Main Point", "difficulty": 2, "target_seconds": 65, "tags": ["main-point"], "stem": "Which one of the following most accurately expresses the main point of the passage?", "choices": {"A": "Rotating savings associations persist where banking is available because they serve as commitment devices that help members save, rather than merely as substitutes for banks.", "B": "Rotating savings associations will disappear as formal banking spreads.", "C": "Many members of rotating savings associations also hold bank accounts.", "D": "Economists have misunderstood the role of social pressure in every form of saving.", "E": "Bank accounts do nothing to help people save money."}, "answer": "A", "explanation": {"argument_skeleton": "P1: economists' stopgap view. P2: 'The prediction has not held up well.' P3: 'the association is less a substitute for a bank than a commitment device.' P4: the commitment view explains late recipients.", "why_correct": "A states the author's thesis and the puzzle it answers: associations persist alongside banks because they work as commitment devices, not merely as bank substitutes.", "why_wrong": {"B": {"trap": "VALENCE_FLIP", "text": "This is the substitution view's prediction, which the second paragraph says 'has not held up well'."}, "C": {"trap": "TOO_NARROW", "text": "A supporting fact from the second paragraph, not the main point."}, "D": {"trap": "TOO_BROAD", "text": "The passage concerns savings associations, not every form of saving."}, "E": {"trap": "EXTREME", "text": "The passage says a bank account 'lets its holder save', just without making her save."}}, "method_reminder": "Main Point: the thesis usually answers the puzzle the passage sets up. Here the puzzle is why associations survive where banks are available.", "flashcard": {"front": "Savings circles persist where banks exist. Main point of the passage?", "back": "They work as commitment devices that help people save, not merely as substitutes for banks."}}, "original": true}, {"id": "RC-SOC-001-2", "section": "RC", "type": "Detail", "difficulty": 2, "target_seconds": 55, "tags": ["detail"], "stem": "According to the passage, members who receive the pot late in the cycle", "choices": {"A": "end the cycle with more money than they contributed", "B": "are usually members who could not afford to bid for early turns", "C": "must pay a fee if they miss a contribution", "D": "benefit more from the association than early recipients do", "E": "do no better financially than they would by saving at home on their own"}, "answer": "E", "explanation": {"argument_skeleton": "P4: 'Members who receive the pot late in the cycle do no better, financially, than they would by saving alone at home; they simply get their own money back.'", "why_correct": "E restates the passage: late recipients just get their own money back, as they would by saving alone.", "why_wrong": {"A": {"trap": "DIRECTION_FLIP", "text": "They 'simply get their own money back'; nothing is gained beyond their contributions."}, "B": {"trap": "OUT_OF_SCOPE", "text": "Bidding is mentioned, but nothing says who ends up with late turns or why."}, "C": {"trap": "RECYCLED_LANGUAGE", "text": "The penalty described is social, facing the others at the next meeting, not a fee."}, "D": {"trap": "IRRELEVANT_COMPARISON", "text": "The passage says everyone gains under the commitment view. It never says late recipients gain more."}}, "method_reminder": "Detail: anchor to the exact sentence. Answers that add a mechanism (a fee) or a comparison (more than) the text never states are traps.", "flashcard": {"front": "Financially, how do late recipients in a savings circle fare?", "back": "No better than saving alone at home: they simply get their own money back."}}, "original": true}, {"id": "RC-SOC-001-3", "section": "RC", "type": "Function", "difficulty": 3, "target_seconds": 60, "tags": ["function", "paragraph"], "stem": "The second paragraph
