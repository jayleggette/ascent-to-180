. Both take a position, and the positions conflict.", "why_wrong": {"A": {"trap": "BOTH_AGREE", "text": "Marco says green space is 'certainly' scarce."}, "B": {"trap": "ONE_SPEAKER", "text": "Only Marco mentions contamination."}, "C": {"trap": "TOO_BROAD", "text": "Neither speaker addresses the whole city."}, "E": {"trap": "TOO_BROAD", "text": "Marco speaks only of this cleanup's cost compared with housing."}}, "method_reminder": "Apply the 'both must have an opinion' test, then check the opinions conflict.", "flashcard": {"front": "Second speaker opens with 'certainly X, but...'. What does that tell you?", "back": "They agree on X. The disagreement lies after the 'but'."}}, "original": true}, {"id": "LR-AG-001", "section": "LR", "type": "Agreement", "subtype": "agree", "difficulty": 3, "target_seconds": 80, "tags": ["dialogue", "policy", "energy"], "stimulus": "Priya: Requiring new office buildings to meet strict energy standards will raise construction costs, but the savings on heating and cooling will repay those costs within a decade. So the requirement is worth adopting.\nTomas: The standards will indeed raise construction costs. But developers will pass those costs on to tenants, and many small businesses will be priced out of new buildings. The requirement should not be adopted in its current form.", "stem": "Priya and Tomas are committed to agreeing that", "choices": {"A": "requiring the energy standards will raise construction costs for new office buildings", "B": "the savings on heating and cooling will repay the added costs within a decade", "C": "many small businesses will be priced out of new buildings", "D": "the requirement should be adopted", "E": "developers should bear the costs of the energy standards themselves"}, "answer": "A", "explanation": {"argument_skeleton": "Priya: costs rise, savings repay them, adopt. Tomas: costs 'indeed' rise, tenants pay, do not adopt as is.", "why_correct": "Both say construction costs will rise; Tomas's 'indeed' signals the shared premise.", "why_wrong": {"B": {"trap": "ONE_SPEAKER", "text": "Only Priya claims payback."}, "C": {"trap": "ONE_SPEAKER", "text": "Only Tomas raises small businesses."}, "D": {"trap": "REVERSAL", "text": "This is where they disagree."}, "E": {"trap": "OUT_OF_SCOPE", "text": "Neither says who should bear the costs."}}, "method_reminder": "For agreement, look for concession words in the second speaker: indeed, certainly, admittedly.", "flashcard": {"front": "Agreement question: where do you look first?", "back": "At what the second speaker concedes before disagreeing."}}, "original": true}], "passages": [{"id": "RC-HUM-001", "passage_type": "humanities", "comparative": false, "difficulty": 4, "title": "The Ruin and the Present", "text": ["For much of the twentieth century, art historians read the eighteenth-century vogue for painted ruins as an art of mourning. The crumbling arches and overgrown columns that crowded the canvases of the period, the argument ran, gave visual form to a culture newly anxious about the impermanence of its own achievements. The evidence for this reading was not thin: diaries of the period describe visitors moved to tears before such canvases, and moralizing verses were sometimes printed beneath engravings made from them. On this view the ruin painter was a moralist, and the ruin itself an emblem of vanity: whatever is built will fall.", "This reading is not wrong, but it is incomplete, and its incompleteness has distorted our sense of what these paintings were for. Many of the most admired ruin pictures were commissioned by the same patrons who were funding new roads, canals, and public buildings, and they hung in rooms designed to display that new construction. Inventories of several such collections record ruin paintings hung opposite architectural drawings of the patrons' own projects. The rooms were not chapels; they were showcases. A painting of a fallen temple in such a room could hardly have been a simple lament. It invited comparison, and the comparison was flattering: the patron's age, it suggested, had inherited the ambitions of antiquity and possessed the engineering to surpass them.", "The paintings themselves support this double reading. Consider the habit, common among the period's ruin painters, of placing small contemporary figures among the fallen stones: a surveyor with his instruments, a shepherd resting in the shade of a broken wall, a party of travelers sketching. Earlier critics treated these figures as foils that dramatized the scale of the vanished past. But the figures are rarely dwarfed or diminished; they are at ease, often busy, sometimes measuring the very structures that loom over them. In one much-copied canvas a draftsman sits on a fallen capital, calmly recording the profile of the column it once crowned. The past in these images is not only a warning. It is also a resource, something to be studied, quarried, and improved upon.", "None of this requires us to discard the melancholy that earlier historians found. The ruin painting held two attitudes at once, and its power came from refusing to choose between them. To see in it only mourning is to miss the confidence of the age that bought it; to see in it only confidence is to miss why that age wanted its confidence painted against a backdrop of collapse. The most accomplished of these painters seem to have understood that ambition is most persuasive when it is shown beside what it fears."], "model_margin_notes": ["Old view: ruin paintings = art of mourning", "Author: old view incomplete; patrons' rooms invited flattering comparison", "Evidence in paintings: busy modern figures, past as resource", "Thesis: paintings hold mourning AND confidence at once"], "main_point": "Eighteenth-century ruin paintings expressed both melancholy about decay and confidence about the present, and reading them as only mourning (or only confidence) misses their meaning.", "author_attitude": "Qualified acceptance of the traditional reading (not wrong, but incomplete), confident in the double reading.", "structure": "Traditional interpretation; argument from context that it is incomplete; argument from the paintings' figures; synthesis that keeps both attitudes.", "questions": [{"id": "RC-HUM-001-1", "section": "RC", "type": "Main Point", "difficulty": 4, "target_seconds": 75, "tags": ["main-point", "tension"], "stem": "Which one of the following most accurately expresses the main point of the passage?", "choices": {"A": "Eighteenth-century ruin paintings expressed a culture's anxiety about the impermanence of its achievements.", "B": "Eighteenth-century patrons commissioned ruin paintings chiefly to celebrate their own building projects.", "C": "Eighteenth-century ruin paintings joined mourning for the past with confidence about the present, and reading them as purely elegiac misses half of their meaning.", "D": "The small contemporary figures in ruin paintings show that painters meant to diminish the achievements of antiquity.", "E": "Twentieth-century art historians were mistaken to find any melancholy in eighteenth-century ruin paintings."}, "answer": "C", "explanation": {"argument_skeleton": "Passage: old reading (mourning) is incomplete; context and figures show confidence too; final paragraph insists on both.", "why_correct": "Paragraph 4 states the thesis: the paintings 'held two attitudes at once'. C keeps both halves and names the error the passage corrects.", "why_wrong": {"A": {"trap": "TENSION_COLLAPSE", "text": "The traditional half only. Paragraph 2 calls it incomplete."}, "B": {"trap": "TENSION_COLLAPSE", "text": "The confidence half only, and 'chiefly' overstates it; paragraph 4 warns against seeing only confidence."}, "D": {"trap": "DEVICE_PROMOTION", "text": "The figures are evidence in paragraph 3, and they are said to study and improve on the past, not diminish it."}, "E": {"trap": "VALENCE_FLIP", "text": "The author says the reading 'is not wrong' and keeps the melancholy."}}, "method_reminder": "If your main-point sentence contains 'both' or 'at once', the answer must keep both sides.", "flashcard": {"front": "Passage ends: the work 'held two attitudes at once'. Main point answer must?", "back": "Keep both attitudes. One-sided answers are Tension Collapse, however accurate each half is."}}, "original": true}, {"id": "RC-HUM-001-2", "section": "RC", "type": "Author's Attitude", "difficulty": 3, "target_seconds": 60, "tags": ["attitude", "valence"], "stem": "The author's attitude toward the interpretation described in the first paragraph is best described as", "choices": {"A": "qualified acceptance: correct as far as it goes, but partial", "B": "outright rejection of its central claim", "C": "reluctant agreement based on the paintings' subject matter alone", "D": "skepticism about whether any evidence could support it", "E": "admiration for its account of the contemporary figures"}, "answer": "A", "explanation": {"argument_skeleton": "Paragraph 2 opens: 'This reading is not wrong, but it is incomplete.' Paragraph 4: 'None of this requires us to discard the melancholy.'", "why_correct": "Not wrong plus incomplete equals qualified acceptance. The author keeps the reading and adds to it.", "why_wrong": {"B": {"trap": "VALENCE_FLIP", "text": "The author explicitly says it is not wrong."}, "C": {"trap": "HALF_RIGHT", "text": "Agreement is right, but nothing says it rests on subject matter alone, or that it is reluctant."}, "D": {"trap": "EXTREME", "text": "The author grants the reading is partly correct."}, "E": {"trap": "VALENCE_FLIP", "text": "Paragraph 3 disputes the earlier critics' treatment of the figures."}}, "method_reminder": "Quote the author's own verdict sentence; attitude answers paraphrase it.", "flashcard": {"front": "'This reading is not wrong, but it is incomplete.' Attitude?", "back": "Qualified acceptance. Not rejection, not endorsement."}}, "original": true}, {"id": "RC-HUM-001-3", "section": "RC", "type": "Function", "difficulty": 4, "target_seconds": 70, "tags": ["function", "device"], "stem": "The author mentions the surveyor, the shepherd, and the travelers in the third paragraph primarily in order to", "choices": {"A": "show that ruin painters often included portraits of their patrons", "B": "illustrate how earlier critics correctly identified the role of such figures", "C": "argue that the paintings were intended mainly as records of surveying work", "D": "demonstrate that eighteenth-century viewers disliked melancholy subjects", "E": "provide evidence from the paintings themselves that they presented the past as something to be used and surpassed"}, "answer": "E", "explanation": {"argument_skeleton": "Paragraph 3 opens 'The paintings themselves support this double reading' and closes 'It is also a resource, something to be studied, quarried, and improved upon.'", "why_correct": "The figures are evidence internal to the paintings for the confident half of the double reading: busy, at ease, measuring the ruins.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "Nothing identifies the figures as patrons."}, "B": {"trap": "VALENCE_FLIP", "text": "The author says earlier critics misread the figures as foils."}, "C": {"trap": "DEVICE_PROMOTION", "text": "One figure is a surveyor; that does not make the paintings surveying records."}, "D": {"trap": "OUT_OF_SCOPE", "text": "Viewers' tastes are never discussed, and the author keeps the melancholy."}}, "method_reminder": "Function questions: find the claim the detail supports. Usually it is the sentence right before or after.", "flashcard": {"front": "Why does an author mention specific figures in a painting?", "back": "As evidence for a claim nearby. Answer with that claim, never with the figures themselves."}}, "original": true}, {"id": "RC-HUM-001-4", "section": "RC", "type": "Inference", "difficulty": 3, "target_seconds": 65, "tags": ["inference"], "stem": "It can be inferred that the author would most likely agree with which one of the following statements about the rooms in which many ruin paintings hung?", "choices": {"A": "They were designed primarily to display ancient artifacts.", "B": "They encouraged viewers to compare ancient achievements with contemporary ones.", "C": "They were decorated to evoke a mood of mourning.", "D": "They contained no works other than ruin paintings.", "E": "They were designed by the painters of the ruins."}, "answer": "B", "explanation": {"argument_skeleton": "Paragraph 2: rooms displayed new construction; paintings hung opposite drawings of patrons' projects; the painting 'invited comparison'.", "why_correct": "Ruins hung opposite drawings of new projects in rooms built to display construction: the arrangement invited comparison. B is one short step from paragraph 2.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "The rooms were 'designed to display that new construction', not ancient artifacts."}, "C": {"trap": "VALENCE_FLIP", "text": "The rooms framed the paintings flatteringly, not mournfully."}, "D": {"trap": "EXTREME", "text": "The rooms also held architectural drawings."}, "E": {"trap": "OUT_OF_SCOPE", "text": "Who designed the rooms is never said."}}, "method_reminder": "Inference: the answer sits one step from a specific line. Find the line first.", "flashcard": {"front": "RC Inference standard?", "back": "Supported by a specific line, one short step. Plausible but unlocated means wrong."}}, "original": true}, {"id": "RC-HUM-001-5", "section": "RC", "type": "Organization", "difficulty": 4, "target_seconds": 70, "tags": ["organization", "structure"], "stem": "Which one of the following best describes the organization of the passage?", "choices": {"A": "A theory is presented, evidence against it is offered, and the theory is rejected in favor of its opposite.", "B": "Two competing theories are described, and the author declines to choose between them.", "C": "A historical trend is described, its causes are listed, and its decline is explained.", "D": "A traditional interpretation is presented, its incompleteness is argued from historical context and from the works themselves, and a reading that keeps both attitudes is proposed.", "E": "A single painting is described in detail, and its symbolism is interpreted paragraph by paragraph."}, "answer": "D", "explanation": {"argument_skeleton": "Margin notes in order: old view; incomplete (context); evidence (figures); synthesis.", "why_correct": "D matches every step in order, including the two kinds of evidence and the both/and ending.", "why_wrong": {"A": {"trap": "TENSION_COLLAPSE", "text": "The old theory is kept, not rejected for its opposite."}, "B": {"trap": "HALF_RIGHT", "text": "The author does not decline to choose; she proposes a reading that combines them."}, "C": {"trap": "OUT_OF_SCOPE", "text": "No causes of a trend or its decline are listed."}, "E": {"trap": "DEVICE_PROMOTION", "text": "The passage discusses a genre, not one painting."}}, "method_reminder": "Read your margin notes in order and check the answer's last step first.", "flashcard": {"front": "Organization question: fastest check?", "back": "Match your margin notes in order. Eliminate any answer whose last step does not match the last paragraph."}}, "original": true}, {"id": "RC-HUM-001-6", "section": "RC", "type": "Analogy", "difficulty": 5, "target_seconds": 80, "tags": ["analogy", "tension"], "stem": "Which one of the following is most analogous to the ruin paintings as the author understands them?", "choices": {"A": "A memorial to a village flooded by a reservoir, placed beside the dam whose water now supplies the region", "B": "A history textbook chapter that lists the causes of an empire's fall", "C": "An advertisement that praises a new bridge without any reference to the past", "D": "A museum display that reconstructs an ancient temple exactly as it originally stood", "E": "A novel set entirely in antiquity, with no modern characters"}, "answer": "A", "explanation": {"argument_skeleton": "Relationship to match: an image of loss that also celebrates present power and achievement, held together.", "why_correct": "The memorial mourns the lost village while standing beside the engineering that replaced it. Loss and confidence in one object, like the ruin paintings.", "why_wrong": {"B": {"trap": "TENSION_COLLAPSE", "text": "Analysis of decline only; no present-day confidence."}, "C": {"trap": "TENSION_COLLAPSE", "text": "Confidence only; no sense of loss."}, "D": {"trap": "OUT_OF_SCOPE", "text": "A restoration shows no ruin and no present."}, "E": {"trap": "OUT_OF_SCOPE", "text": "No present-day element at all."}}, "method_reminder": "Abstract the relationship first, then look for it in a new topic.", "flashcard": {"front": "RC Analogy: what do you match?", "back": "The abstract relationship (loss plus pride held together), never the topic."}}, "original": true}]}, {"id": "RC-HUM-002", "passage_type": "humanities", "comparative": false, "difficulty": 5, "title": "Can a Metaphor Be Paraphrased?", "text": ["A long tradition in criticism holds that metaphors cannot be paraphrased. To say that “time is a thief” is not, on this view, to say anything that could be restated literally, as in “time passes and we lose things”; the literal version is not a weaker statement of the same content but a different statement altogether. Defenders of this position, whom we may call irreducibilists, point out that any paraphrase must select some features of the comparison and ignore others, while the metaphor leaves the selection open. The complaint is not that paraphrases are inaccurate but that they are always partial. A reader confronted with “time is a thief” may think of stealth, of loss, of the night, of the impossibility of recovering what is taken, and no list of these associations ever seems complete.", "The irreducibilists have drawn a powerful lesson from this incompleteness. If no paraphrase can exhaust a metaphor, they argue, then the metaphor's meaning must lie outside literal language entirely, in a kind of perception that words can prompt but not contain. Poetry, on this account, does not state truths so much as train us to see; and the critic who paraphrases a poem has not explained it but replaced it. Some irreducibilists go further, suggesting that the habit of paraphrase dulls the very capacity for seeing that poetry exists to cultivate.", "Yet the argument proves too much. Literal statements, too, resist complete paraphrase: a careful legal definition can be restated, but every restatement shifts emphasis, invites different inferences, and leaves some reader's question unanswered. The same is true of a scientific definition or a set of directions to a train station: each can be restated in many ways, and none of the restatements settles every question the original raises. If incompleteness of paraphrase showed that meaning lies beyond language, it would show this of ordinary prose as readily as of poetry. What the irreducibilists have identified is not a special property of metaphor but a general feature of interpretation: no restatement is ever final.", "This does not leave the irreducibilists with nothing. Metaphors do invite an unusually open-ended search for relevant features, and a reader who reduces “time is a thief” to a single literal claim has misread it. But the remedy is better paraphrase, not the abandonment of paraphrase. The critic's task is to set out the range of features a metaphor makes salient and to argue for their relative weight, a task that is difficult and never finished, and that is nonetheless a task of explanation in words. Its results can be compared, contested, and improved, which is more than can be said of a perception that words are supposed to prompt but never capture."], "model_margin_notes": ["Irreducibilists: metaphors cannot be paraphrased; associations open", "Their lesson: meaning lies beyond language; paraphrase replaces", "Author objects: proves too much; literal text also resists paraphrase", "Concession + remedy: metaphors are open-ended, so paraphrase better"], "main_point": "Metaphors' resistance to complete paraphrase does not show their meaning lies beyond language, because all statements resist complete paraphrase; critics should improve paraphrase rather than abandon it.", "author_attitude": "Accepts the irreducibilists' observation, rejects the conclusion they draw from it; constructive rather than dismissive.", "structure": "Opposing view and its observation; the conclusion drawn from it; objection (the argument proves too much); concession and alternative program.", "questions": [{"id": "RC-HUM-002-1", "section": "RC", "type": "Main Point", "difficulty": 4, "target_seconds": 75, "tags": ["main-point", "emphasis"], "stem": "Which one of the following most accurately expresses the main point of the passage?", "choices": {"A": "Metaphors convey a kind of perception that literal language cannot contain.", "B": "Although metaphors invite open-ended interpretation, their resistance to complete paraphrase does not place their meaning beyond language, and critics should improve paraphrase rather than abandon it.", "C": "Critics who paraphrase poems replace them rather than explain them.", "D": "Legal definitions are as difficult to paraphrase as poetic metaphors.", "E": "No interpretation of a metaphor can be shown to be better than another."}, "answer": "B", "explanation": {"argument_skeleton": "Paragraphs 1 and 2 report the irreducibilist view at length; paragraph 3 rejects its inference; paragraph 4 concedes a point and proposes better paraphrase.", "why_correct": "B captures the objection in paragraph 3, the concession and the remedy in paragraph 4.", "why_wrong": {"A": {"trap": "EMPHASIS_ENDORSEMENT", "text": "The view given the most space is the one the author rejects."}, "C": {"trap": "VALENCE_FLIP", "text": "The irreducibilists' claim; the author calls paraphrase 'a task of explanation'."}, "D": {"trap": "DEVICE_PROMOTION", "text": "The legal definition is an example supporting the objection."}, "E": {"trap": "EXTREME", "text": "The author says critics should 'argue for' the relative weight of features, so better readings exist."}}, "method_reminder": "Space on the page is not agreement. Find the author's own voice: 'Yet the argument proves too much.'", "flashcard": {"front": "Two paragraphs describe a view; paragraph 3 starts 'Yet...'. Whose view is the main point?", "back": "The author's, after the 'Yet'. The opening paragraphs set up the view being answered."}}, "original": true}, {"id": "RC-HUM-002-2", "section": "RC", "type": "Author's Attitude", "difficulty": 4, "target_seconds": 65, "tags": ["attitude", "criticism-scope"], "stem": "Which one of the following best describes the author's attitude toward the irreducibilists?", "choices": {"A": "complete agreement with their conclusions", "B": "dismissal of their observations as false", "C": "uncertainty about whether paraphrase is possible at all", "D": "acceptance of their observation that paraphrase is incomplete, combined with rejection of the conclusion they draw from it", "E": "admiration for their treatment of literal language"}, "answer": "D", "explanation": {"argument_skeleton": "Paragraph 3 grants incompleteness ('Literal statements, too...') and denies the inference ('proves too much'). Paragraph 4: 'This does not leave the irreducibilists with nothing.'", "why_correct": "The author accepts the observation and rejects the inference. That precise split is D.", "why_wrong": {"A": {"trap": "EMPHASIS_ENDORSEMENT", "text": "The author rejects their conclusion."}, "B": {"trap": "CRITICISM_SCOPE", "text": "The author accepts their observation; it is their inference that fails."}, "C": {"trap": "TOO_WEAK", "text": "The author is confident paraphrase is possible and should be improved."}, "E": {"trap": "OUT_OF_SCOPE", "text": "The irreducibilists say nothing about literal language; the author raises it against them."}}, "method_reminder": "Separate what the author grants from what the author denies.", "flashcard": {"front": "Author: 'They are right that X, but X does not show Y.' Attitude?", "back": "Accepts the observation, rejects the inference. Watch for answers that flip which part is rejected."}}, "original": true}, {"id": "RC-HUM-002-3", "section": "RC", "type": "Function", "difficulty": 4, "target_seconds": 65, "tags": ["function"], "stem": "The author refers to “a careful legal definition” primarily in order to", "choices": {"A": "suggest that legal language is a kind of poetry", "B": "show that legal definitions are less precise than metaphors", "C": "illustrate the irreducibilists' claim that meaning lies beyond language", "D": "argue that paraphrase should be abandoned in legal interpretation", "E": "show that the incompleteness of paraphrase is not peculiar to metaphor"}, "answer": "E", "explanation": {"argument_skeleton": "Paragraph 3: literal statements also resist paraphrase, so incompleteness is 'a general feature of interpretation'.", "why_correct": "The legal definition is a literal statement that resists complete paraphrase, which shows the property is general rather than special to metaphor.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "The author makes no claim that legal language is poetic."}, "B": {"trap": "IRRELEVANT_COMPARISON", "text": "No ranking of precision is made."}, "C": {"trap": "EMPHASIS_ENDORSEMENT", "text": "The example is used against the irreducibilists."}, "D": {"trap": "CONTRADICTS", "text": "The author defends paraphrase."}}, "method_reminder": "Ask what claim the example supports. Here: 'the argument proves too much'.", "flashcard": {"front": "Author uses a non-poetic example inside an argument about poetry. Usual purpose?", "back": "To show the property claimed to be special is actually general, so it proves too much."}}, "original": true}, {"id": "RC-HUM-002-4", "section": "RC", "type": "Inference", "difficulty": 4, "target_seconds": 70, "tags": ["inference", "application"], "stem": "The author would most likely say that a critic who restates “time is a thief” as “time passes and we lose things” has", "choices": {"A": "offered a paraphrase that is incomplete but could be improved by setting out more of the features the metaphor makes salient", "B": "correctly captured the full meaning of the metaphor", "C": "replaced the metaphor rather than explained it", "D": "shown that the metaphor has no literal content", "E": "demonstrated that literal statements are more precise than metaphors"}, "answer": "A", "explanation": {"argument_skeleton": "Paragraph 4: reducing the metaphor to 'a single literal claim' misreads it; 'the remedy is better paraphrase'.", "why_correct": "The single-claim restatement is a misreading, and the author's remedy is fuller paraphrase that sets out the range of features. A matches both.", "why_wrong": {"B": {"trap": "VALENCE_FLIP", "text": "The author says such a reduction misreads the metaphor."}, "C": {"trap": "EMPHASIS_ENDORSEMENT", "text": "The irreducibilists would say this, not the author."}, "D": {"trap": "EXTREME", "text": "Nothing suggests the metaphor lacks literal content."}, "E": {"trap": "OUT_OF_SCOPE", "text": "The author never ranks literal language above metaphor."}}, "method_reminder": "Hypothetical author response: predict from the author's stated remedy, not from your own view.", "flashcard": {"front": "How do you predict what an author would say about a new case?", "back": "Apply the author's stated view and remedy to it, one step only."}}, "original": true}, {"id": "RC-HUM-002-5", "section": "RC", "type": "Detail", "difficulty": 3, "target_seconds": 55, "tags": ["detail", "attribution"], "stem": "According to the passage, the irreducibilists argue that", "choices": {"A": "metaphors are less important than literal statements", "B": "critics should set out the range of features a metaphor makes salient", "C": "the open-endedness of a metaphor's associations shows that its meaning lies outside literal language", "D": "paraphrase of ordinary prose is as incomplete as paraphrase of poetry", "E": "poetry states truths more precisely than prose does"}, "answer": "C", "explanation": {"argument_skeleton": "Paragraph 2: 'If no paraphrase can exhaust a metaphor... then the metaphor's meaning must lie outside literal language entirely.'", "why_correct": "C restates the irreducibilists' inference from paragraph 2.", "why_wrong": {"A": {"trap": "VALENCE_FLIP", "text": "They elevate metaphor, if anything."}, "B": {"trap": "SHELL_GAME", "text": "This is the author's remedy in paragraph 4, attributed to the wrong people."}, "D": {"trap": "RECYCLED_LANGUAGE", "text": "Wording from the author's objection in paragraph 3."}, "E": {"trap": "CONTRADICTS", "text": "Paragraph 2: poetry 'does not state truths so much as train us to see'."}}, "method_reminder": "Attribution questions: check whose voice each claim belongs to.", "flashcard": {"front": "Detail question asks what a group argues. Common trap?", "back": "The author's own view, or the author's objection, attributed to the group."}}, "original": true}, {"id": "RC-HUM-002-6", "section": "RC", "type": "RC Strengthen/Weaken", "difficulty": 5, "target_seconds": 80, "tags": ["strengthen"], "stem": "Which one of the following, if true, would most strengthen the author's argument in the third paragraph?", "choices": {"A": "Many poets dislike seeing their metaphors paraphrased.", "B": "Some metaphors are easier to paraphrase than others.", "C": "Readers associate far more features with metaphors than with literal statements.", "D": "When readers paraphrase ordinary literal sentences, their restatements differ from one another about as often as their paraphrases of metaphors do.", "E": "Courts frequently revise their legal definitions."}, "answer": "D", "explanation": {"argument_skeleton": "Claim to support: incompleteness of paraphrase is general to interpretation, not special to metaphor.", "why_correct": "If literal sentences produce as much divergence in paraphrase as metaphors, the resistance is general, exactly the author's point.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "Poets' preferences do not bear on the logic of paraphrase."}, "B": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Variation among metaphors does not show literal statements resist paraphrase too."}, "C": {"trap": "REVERSAL", "text": "This suggests metaphor is special after all, which weakens the author."}, "E": {"trap": "OUT_OF_SCOPE", "text": "Revision of definitions is not incompleteness of paraphrase."}}, "method_reminder": "In RC Strengthen, isolate the exact claim and support its gap, as in LR.", "flashcard": {"front": "Author claims a property is general, not special. Best strengthener?", "back": "Evidence the property shows up equally in the ordinary cases."}}, "original": true}]}, {"id": "RC-LAW-001", "passage_type": "law", "comparative": false, "difficulty": 3, "title": "Adverse Possession Reconsidered", "text": ["Under the doctrine of adverse possession, a person who openly occupies land belonging to someone else, without permission and continuously for a period fixed by statute, can acquire legal title to it. The required period varies by jurisdiction, commonly from ten to twenty years, and the occupation must usually be exclusive as well as open. To students meeting the rule for the first time, it often looks like a license for trespass. The standard justifications are more modest. Courts have long said that the doctrine rewards those who put land to productive use, penalizes owners who neglect their property, and, above all, quiets title: after enough time, the law prefers to confirm settled expectations rather than reopen old disputes whose evidence has faded.", "Critics have recently argued that the first two justifications no longer fit the doctrine's actual effects. In many cities the land acquired through adverse possession is not neglected farmland but narrow strips along property lines: a driveway that crosses a boundary by a meter, a fence built a few feet onto a neighbor's lot. In some jurisdictions such strip claims now outnumber all other adverse possession claims combined. The “possessor” in such cases rarely intended to take anything and has done nothing especially productive; the “neglectful” owner may simply never have commissioned a survey. Rewarding one and penalizing the other, the critics conclude, is arbitrary.", "The critics are right about the facts but draw the wrong conclusion. Boundary cases are precisely where the third justification is strongest. A fence that has stood for thirty years has shaped how both neighbors use their land: what they planted, where they built, what a buyer was shown when either lot was sold. Unwinding that arrangement on the strength of an old survey would disturb many expectations to vindicate one technical claim. Courts deciding such cases often say less about the possessor's conduct than about the neighbors' long acquiescence, and rightly so. The doctrine's value in these cases lies not in rewarding the possessor but in protecting the reliance that time has created on both sides of the line.", "If the critics' objection has force, it is against the first two justifications rather than against the doctrine. A legislature persuaded by them might reasonably restrict claims based on deliberate seizure of land, where the language of reward and penalty does real work, while preserving the doctrine for the boundary disputes that now make up most of its business. Such a legislature would not be retreating from adverse possession so much as aligning it with its strongest rationale."], "model_margin_notes": ["Rule + three justifications; quieting title the key one", "Critics: modern cases are boundary strips; reward/penalty arbitrary", "Author: facts right, conclusion wrong; reliance justifies boundary cases", "Proposal: restrict deliberate seizures, keep boundary cases"], "main_point": "Although critics correctly describe modern adverse possession cases as mostly boundary disputes, those are the cases where the doctrine's interest in protecting settled expectations justifies it most.", "author_attitude": "Agrees with the critics' facts, disagrees with their conclusion; constructive, offers a reform.", "structure": "Rule and justifications; critics' objection; author's rebuttal from the third justification; proposed reform.", "questions": [{"id": "RC-LAW-001-1", "section": "RC", "type": "Main Point", "difficulty": 3, "target_seconds": 65, "tags": ["main-point"], "stem": "Which one of the following most accurately expresses the main point of the passage?", "choices": {"A": "Adverse possession should be abolished because it rewards trespass.", "B": "The productive-use justification remains the strongest defense of adverse possession.", "C": "Most adverse possession cases now involve disputes over narrow strips along property lines.", "D": "Critics of adverse possession have misdescribed the cases it now governs.", "E": "Although critics correctly describe most modern adverse possession cases, those cases are where the doctrine's interest in settled expectations justifies it most strongly."}, "answer": "E", "explanation": {"argument_skeleton": "Paragraph 3: 'The critics are right about the facts but draw the wrong conclusion. Boundary cases are precisely where the third justification is strongest.'", "why_correct": "E keeps both parts of the author's verdict: the critics' facts stand, and those facts are exactly where quieting title matters most.", "why_wrong": {"A": {"trap": "VALENCE_FLIP", "text": "The author defends the doctrine."}, "B": {"trap": "SHELL_GAME", "text": "The author relies on the third justification, not productive use."}, "C": {"trap": "TOO_NARROW", "text": "A fact the passage uses, not its point."}, "D": {"trap": "CRITICISM_SCOPE", "text": "The author says the critics are right about the facts."}}, "method_reminder": "In law passages, the author often grants the facts and fights about the rule's rationale.", "flashcard": {"front": "'Right about the facts, wrong about the conclusion.' Which answer type traps you?", "back": "Reversed scope of criticism: an answer saying the author disputes the facts."}}, "original": true}, {"id": "RC-LAW-001-2", "section": "RC", "type": "Author's Attitude", "difficulty": 3, "target_seconds": 55, "tags": ["attitude", "criticism-scope"], "stem": "The author's attitude toward the critics discussed in the second paragraph is best described as", "choices": {"A": "wholesale endorsement of their argument", "B": "contempt for their factual claims", "C": "agreement with their account of the facts but disagreement with the conclusion they draw", "D": "agreement with their conclusion but disagreement about the facts", "E": "indifference, since they address a rare kind of case"}, "answer": "C", "explanation": {"argument_skeleton": "Paragraph 3, first sentence.", "why_correct": "The author accepts their description of modern cases and rejects the inference that the doctrine is arbitrary.", "why_wrong": {"A": {"trap": "VALENCE_FLIP", "text": "The author rejects their conclusion."}, "B": {"trap": "CRITICISM_SCOPE", "text": "The facts are the part the author accepts."}, "D": {"trap": "CRITICISM_SCOPE", "text": "Exactly reversed."}, "E": {"trap": "CONTRADICTS", "text": "Boundary disputes 'now make up most of its business'."}}, "method_reminder": "Name what the author accepts and what the author rejects before reading the choices.", "flashcard": {"front": "Two-part attitude (accepts facts, rejects conclusion). The classic trap?", "back": "The same two parts swapped: accepts the conclusion, rejects the facts."}}, "original": true}, {"id": "RC-LAW-001-3", "section": "RC", "type": "Function", "difficulty": 3, "target_seconds": 55, "tags": ["function", "example"], "stem": "The example of the fence that has stood for thirty years serves primarily to", "choices": {"A": "illustrate how possessors deliberately seize neighboring land", "B": "show how a long-standing arrangement creates reliance on both sides of a boundary", "C": "prove that property surveys are unreliable", "D": "demonstrate that boundary disputes are rare", "E": "argue that fences should not be built near property lines"}, "answer": "B", "explanation": {"argument_skeleton": "Paragraph 3: the fence 'shaped how both neighbors use their land'; value lies in 'protecting the reliance that time has created on both sides'.", "why_correct": "The fence illustrates reliance built up over time on both sides, the basis of the author's defense.", "why_wrong": {"A": {"trap": "CONTRADICTS", "text": "Paragraph 2: possessors in such cases 'rarely intended to take anything'."}, "C": {"trap": "EXTREME", "text": "An old survey being overridden does not make surveys unreliable."}, "D": {"trap": "CONTRADICTS", "text": "They are most of the doctrine's business."}, "E": {"trap": "OUT_OF_SCOPE", "text": "No advice about building fences appears."}}, "method_reminder": "Examples serve the claim in the same paragraph. Name that claim.", "flashcard": {"front": "Law passage example: a long-standing fence. Typical function?", "back": "To show reliance built over time, the core of the 'quiet title' rationale."}}, "original": true}, {"id": "RC-LAW-001-4", "section": "RC", "type": "Application", "difficulty": 4, "target_seconds": 70, "tags": ["application", "policy"], "stem": "Which one of the following legislative changes would the author be most likely to support?", "choices": {"A": "abolishing adverse possession entirely", "B": "requiring a new survey with every property sale while abolishing adverse possession for boundary disputes", "C": "lengthening the statutory period for all claims", "D": "restricting claims based on deliberate seizure of land while keeping the doctrine for boundary disputes", "E": "allowing claims only when the possessor has made productive use of the land"}, "answer": "D", "explanation": {"argument_skeleton": "Paragraph 4: a legislature 'might reasonably restrict claims based on deliberate seizure... while preserving the doctrine for the boundary disputes'.", "why_correct": "D restates the reform the author endorses as reasonable.", "why_wrong": {"A": {"trap": "VALENCE_FLIP", "text": "The author defends the doctrine."}, "B": {"trap": "CONTRADICTS", "text": "It removes the doctrine exactly where the author says it is strongest."}, "C": {"trap": "OUT_OF_SCOPE", "text": "The passage never discusses the length of the period."}, "E": {"trap": "SHELL_GAME", "text": "Built on the productive-use rationale the author says does not fit boundary cases."}}, "method_reminder": "Application: the author usually states the principle near the end. Apply it literally.", "flashcard": {"front": "Which policy would the author support? Where do you look first?", "back": "The last paragraph, where authors usually state their proposal."}}, "original": true}, {"id": "RC-LAW-001-5", "section": "RC", "type": "Detail", "difficulty": 2, "target_seconds": 45, "tags": ["detail"], "stem": "According to the passage, the third justification for adverse possession is that the doctrine", "choices": {"A": "confirms settled expectations rather than reopening disputes whose evidence has faded", "B": "rewards those who put land to productive use", "C": "penalizes owners who neglect their property", "D": "encourages owners to commission surveys", "E": "prevents trespass"}, "answer": "A", "explanation": {"argument_skeleton": "Paragraph 1 lists three justifications; the third is quieting title.", "why_correct": "A paraphrases paragraph 1's 'above all, quiets title' clause.", "why_wrong": {"B": {"trap": "RECYCLED_LANGUAGE", "text": "The first justification, in the passage's own words."}, "C": {"trap": "SHELL_GAME", "text": "The second justification."}, "D": {"trap": "OUT_OF_SCOPE", "text": "Surveys are mentioned, but not as a purpose of the doctrine."}, "E": {"trap": "CONTRADICTS", "text": "The doctrine is said to look like a license for trespass."}}, "method_reminder": "Lists in law passages are numbered by position. Count to the right item.", "flashcard": {"front": "Detail question about 'the third' item in a list. Main risk?", "back": "Picking an earlier item copied word for word."}}, "original": true}, {"id": "RC-LAW-001-6", "section": "RC", "type": "Inference", "difficulty": 4, "target_seconds": 65, "tags": ["inference"], "stem": "It can be inferred that the author regards the language of reward and penalty as", "choices": {"A": "irrelevant to every adverse possession case", "B": "apt for cases of deliberate seizure but ill-suited to most boundary disputes", "C": "the strongest justification for the doctrine", "D": "a recent invention of the doctrine's critics", "E": "equally apt for every kind of adverse possession case"}, "answer": "B", "explanation": {"argument_skeleton": "Paragraph 4: in deliberate seizures 'the language of reward and penalty does real work'; paragraph 3: in boundary cases the value 'lies not in rewarding the possessor'.", "why_correct": "Real work in deliberate seizures, not the point in boundary cases: B.", "why_wrong": {"A": {"trap": "EXTREME", "text": "It 'does real work' in deliberate seizures."}, "C": {"trap": "CONTRADICTS", "text": "The author calls quieting title the strongest, 'above all'."}, "D": {"trap": "CONTRADICTS", "text": "Courts 'have long said' it."}, "E": {"trap": "EXTREME", "text": "The author distinguishes the two kinds of cases."}}, "method_reminder": "Inference across paragraphs: combine two located lines, nothing more.", "flashcard": {"front": "Author says a rationale 'does real work' in one kind of case. What does that imply about others?", "back": "It is weaker elsewhere, but not useless everywhere. Avoid extreme versions."}}, "original": true}]}, {"id": "RC-CMP-001", "passage_type": "social_science", "comparative": true, "difficulty": 4, "title": "Filtering and Displacement", "text": ["Economists studying housing markets have long described a process called filtering. When new housing is built, it is typically priced for higher-income households, and those households move out of older units to occupy it. The units they vacate become available to households with somewhat lower incomes, who in turn vacate still older units, and so on down a chain of moves. Economists sometimes compare the process to the market for used cars, in which vehicles first sold to wealthier buyers eventually become the affordable cars of others. The process depends on vacancy: each move opens a unit only because someone left it.", "Over time, then, housing built for the affluent becomes housing for the middle class and eventually for lower-income households. The practical implication is straightforward. Cities that permit abundant new construction, even of expensive units, expand the supply of affordable housing indirectly, while cities that restrict construction force higher-income households to compete for older units, bidding up their rents. Where construction is blocked, the chain never starts, and older units that might have filtered down are instead upgraded to serve the affluent. Studies tracking individual moves have found chains of this kind in many metropolitan areas, and regions with more construction have generally seen slower rent growth. Critics who object that new luxury buildings do nothing for low-income renters are thus looking in the wrong place: the benefit appears not in the new building but several moves away.", "The filtering account describes a real mechanism, but the timescale on which it operates matters as much as its direction. The direction of the process is not seriously in dispute; its speed is. Chains of moves that begin with a new high-end building may take a decade or more to free up units that low-income households can afford, and along the way older units are often renovated, merged, or demolished, removing them from the chain. Researchers who have followed particular buildings find that units lost to renovation can break a chain entirely.", "Meanwhile, the neighborhoods where new high-end buildings appear can change quickly: new amenities attract further investment, landlords raise rents in anticipation, and long-time residents may be displaced well before any benefit filters down to them. Residents displaced in the first years of such a change rarely return, even if rents later stabilize, and a regional statistic can conceal their loss entirely. None of this means new construction is harmful at the scale of a region. It means that a regional gain can coexist with a neighborhood loss, and that the households bearing the loss are not necessarily the ones who will eventually gain. Policy that relies on filtering alone asks the most vulnerable renters to wait the longest. Pairing new construction with protections against displacement where it occurs would capture the regional benefit while addressing the local cost."], "text_labels": ["Passage A", "", "Passage B", ""], "model_margin_notes": ["A: filtering mechanism, chain of moves", "A: so permit construction; critics look in wrong place", "B: accepts mechanism; slow, chains break", "B: regional gain + local loss; pair building with anti-displacement"], "main_point": "A: new construction, even expensive, expands affordable housing through filtering. B: filtering is real but slow and leaky, so pair construction with anti-displacement protections.", "author_attitude": "A: confident, dismissive of critics. B: accepts A's mechanism, qualifies it, constructive.", "structure": "A explains a mechanism and its policy implication. B accepts the mechanism, adds timing and local effects, and proposes a complementary policy.", "questions": [{"id": "RC-CMP-001-1", "section": "RC", "type": "Comparative", "difficulty": 4, "target_seconds": 70, "tags": ["comparative", "relationship"], "stem": "Which one of the following most accurately describes the relationship between the two passages?", "choices": {"A": "Passage B rejects the mechanism that Passage A describes.", "B": "Passage B offers further evidence for Passage A's conclusion without qualifying it.", "C": "Passage A responds to objections raised in Passage B.", "D": "Passage B accepts the mechanism Passage A describes but argues that its timing and local effects call for additional policy.", "E": "The two passages describe entirely different phenomena."}, "answer": "D", "explanation": {"argument_skeleton": "A says filtering works, so build. B says filtering is real, slow and leaky, so build and protect.", "why_correct": "B opens by calling filtering 'a real mechanism', then adds timing, chain breaks and displacement, and ends with a complementary policy. D captures all three moves.", "why_wrong": {"A": {"trap": "VALENCE_FLIP", "text": "B calls it 'a real mechanism'."}, "B": {"trap": "HALF_RIGHT", "text": "B builds on A, but qualifies it heavily."}, "C": {"trap": "DIRECTION_FLIP", "text": "A answers unnamed critics, not B; B responds to A's account."}, "E": {"trap": "EXTREME", "text": "Both discuss the same filtering process."}}, "method_reminder": "Write 'A says, B says, B ___ A' before reading the choices.", "flashcard": {"front": "Comparative relationship: B grants A's mechanism and adds conditions. Label?", "back": "B qualifies or extends A. Not 'rejects', not 'merely supports'."}}, "original": true}, {"id": "RC-CMP-001-2", "section": "RC", "type": "Comparative", "difficulty": 4, "target_seconds": 70, "tags": ["comparative", "agreement"], "stem": "The authors of both passages would most likely agree that", "choices": {"A": "permitting new construction can benefit a region's housing market as a whole", "B": "new luxury buildings cause displacement in the neighborhoods where they are built", "C": "filtering frees up affordable units within a few years", "D": "housing policy should rely on filtering alone", "E": "renovation removes most older units from the housing supply"}, "answer": "A", "explanation": {"argument_skeleton": "A: construction expands affordable supply. B: 'None of this means new construction is harmful at the scale of a region' and policy 'would capture the regional benefit'.", "why_correct": "Both affirm a regional benefit from new construction: A directly, B by referring to the 'regional benefit' its policy would capture.", "why_wrong": {"B": {"trap": "ONE_SPEAKER", "text": "Only B raises displacement, and says residents 'may' be displaced."}, "C": {"trap": "CONTRADICTS", "text": "B says a decade or more; A gives no timescale."}, "D": {"trap": "CONTRADICTS", "text": "B explicitly rejects relying on filtering alone."}, "E": {"trap": "EXTREME", "text": "B says units are 'often' renovated, not that most are lost."}}, "method_reminder": "For agreement, find a line in each passage that commits its author to the claim.", "flashcard": {"front": "Comparative agreement: what must be true of the right answer?", "back": "Each author commits to it somewhere. One-author claims are traps."}}, "original": true}, {"id": "RC-CMP-001-3", "section": "RC", "type": "Function", "difficulty": 3, "target_seconds": 55, "tags": ["function"], "stem": "In Passage A, the statement that critics are “looking in the wrong place” serves to", "choices": {"A": "concede that critics have identified a real harm", "B": "suggest that new buildings are often poorly located", "C": "argue that the benefits of new construction appear elsewhere in the chain of moves rather than in the new building itself", "D": "introduce evidence about neighborhood displacement", "E": "dismiss the needs of low-income renters as unimportant"}, "answer": "C", "explanation": {"argument_skeleton": "Same sentence: 'the benefit appears not in the new building but several moves away'.", "why_correct": "The phrase redirects the critics to where A says the benefit actually shows up: further down the chain.", "why_wrong": {"A": {"trap": "VALENCE_FLIP", "text": "A dismisses the critics' objection rather than conceding it."}, "B": {"trap": "RECYCLED_LANGUAGE", "text": "Takes 'place' literally; the phrase is about where benefits appear."}, "D": {"trap": "SHELL_GAME", "text": "Displacement is Passage B's topic."}, "E": {"trap": "EXTREME", "text": "A argues low-income renters do benefit, eventually."}}, "method_reminder": "Figurative phrases: translate into a literal claim from the same sentence.", "flashcard": {"front": "A phrase like 'looking in the wrong place'. How do you answer its function?", "back": "Translate it literally using its own sentence. Watch for answers that take the metaphor literally."}}, "original": true}, {"id": "RC-CMP-001-4", "section": "RC", "type": "Author Response", "difficulty": 4, "target_seconds": 70, "tags": ["comparative", "response"], "stem": "The author of Passage B would most likely respond to the final sentence of Passage A by pointing out that", "choices": {"A": "new luxury buildings provide no benefit to anyone", "B": "the critics are right that filtering does not occur", "C": "studies tracking individual moves are unreliable", "D": "luxury buildings should be prohibited in low-income neighborhoods", "E": "a benefit several moves away may arrive too late for the residents who bear costs near the new building"}, "answer": "E", "explanation": {"argument_skeleton": "A ends: the benefit appears 'several moves away'. B: chains take a decade or more; residents 'may be displaced well before any benefit filters down to them'.", "why_correct": "B accepts that the benefit is real but distant in time and place, and that the people near the new building may bear costs before it arrives. E is B's reply.", "why_wrong": {"A": {"trap": "EXTREME", "text": "B grants a regional benefit."}, "B": {"trap": "CONTRADICTS", "text": "B calls filtering a real mechanism."}, "C": {"trap": "OUT_OF_SCOPE", "text": "B never questions the studies."}, "D": {"trap": "EXTREME", "text": "B proposes protections against displacement, not prohibition."}}, "method_reminder": "Author response: use the responding author's stated view, one step only.", "flashcard": {"front": "How would Author B answer Author A?", "back": "With B's own stated qualification, applied to A's specific claim."}}, "original": true}, {"id": "RC-CMP-001-5", "section": "RC", "type": "Detail", "difficulty": 3, "target_seconds": 50, "tags": ["detail"], "stem": "According to Passage B, which one of the following can interrupt a filtering chain?", "choices": {"A": "a rise in regional construction", "B": "the renovation, merger, or demolition of older units", "C": "slower rent growth across a region", "D": "the arrival of higher-income households in new buildings", "E": "protections against displacement"}, "answer": "B", "explanation": {"argument_skeleton": "Passage B, first paragraph: units 'renovated, merged, or demolished' are removed from the chain; renovation 'can break a chain entirely'.", "why_correct": "B is stated almost verbatim in the first paragraph of Passage B.", "why_wrong": {"A": {"trap": "CONTRADICTS", "text": "Construction starts chains rather than breaking them."}, "C": {"trap": "OUT_OF_SCOPE", "text": "A mentions slower rent growth as an outcome, not an interruption."}, "D": {"trap": "DIRECTION_FLIP", "text": "That is how a chain begins."}, "E": {"trap": "SHELL_GAME", "text": "B's policy proposal, not a chain breaker."}}, "method_reminder": "Detail questions: go back to the line, every time.", "flashcard": {"front": "Comparative Detail question names one passage. What do you do with the other?", "back": "Ignore it. Answers drawn from the wrong passage are a standard trap."}}, "original": true}, {"id": "RC-CMP-001-6", "section": "RC", "type": "Primary Purpose", "difficulty": 4, "target_seconds": 60, "tags": ["purpose", "comparative"], "stem": "The primary purpose of Passage B is to", "choices": {"A": "refute the claim that new construction slows regional rent growth", "B": "describe the history of the filtering concept", "C": "qualify an account of how new housing benefits lower-income households and propose a complementary policy", "D": "argue that displacement is the main cause of rising rents", "E": "summarize research on neighborhood amenities"}, "answer": "C", "explanation": {"argument_skeleton": "Passage B: accepts the mechanism, adds timing and local costs, recommends pairing construction with protections.", "why_correct": "C has the right verbs, qualify and propose, and the right objects.", "why_wrong": {"A": {"trap": "VALENCE_FLIP", "text": "B never disputes the regional effect."}, "B": {"trap": "OUT_OF_SCOPE", "text": "No history of the concept is given."}, "D": {"trap": "EXTREME", "text": "Displacement is a local cost, not called the main cause of rising rents."}, "E": {"trap": "TOO_NARROW", "text": "Amenities are one detail in one sentence."}}, "method_reminder": "Purpose answers: match the verb first (qualify, propose, refute, describe).", "flashcard": {"front": "Primary Purpose: what do you check first in each choice?", "back": "The verb. Then whether the object covers the whole passage."}}, "original": true}]}]};
const PACK01B={"pack": "pack-01b-starter-rest", "title": "Pack 01B: Rest of the Starter", "schema_version": 1, "questions": [{"id": "LR-ST-006", "section": "LR", "type": "Strengthen", "subtype": "causal", "difficulty": 3, "target_seconds": 85, "tags": ["causal", "mechanism", "urban", "public-health"], "stimulus": "Last year the city of Pell replaced every diesel bus on its Route 9 line with an electric bus. Over the following two years, asthma-related emergency room visits among residents living along Route 9 fell by 18 percent, while such visits in the rest of the city did not change. City officials concluded that switching Route 9 to electric buses reduced asthma attacks among the residents along the route.", "stem": "Which one of the following, if true, most strengthens the officials' conclusion?", "choices": {"A": "Residents along Route 9 have filed fewer complaints about bus noise since the electric buses entered service.", "B": "The city plans to convert three more bus routes to electric buses next year.", "C": "Air monitors at stops along Route 9 recorded a substantial drop in diesel particulates after the switch, while monitors elsewhere in the city recorded no change.", "D": "Every city that has adopted electric buses has reported higher ridership afterward.", "E": "During the same period, a hospital near Route 9 opened an urgent care clinic that treats many patients who would otherwise have gone to an emergency room."}, "answer": "C", "explanation": {"argument_skeleton": "Premise: after Route 9 went electric, asthma ER visits along it fell 18%, while visits elsewhere held steady. Conclusion: the bus switch caused the drop. Gap: the buses, rather than something else along the route, changed what residents breathed.", "why_correct": "C supplies the missing mechanism. The pollutant tied to asthma fell exactly where the visits fell, right after the switch, and only there. That matches the pattern in the emergency room data and makes the bus switch the likeliest cause.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "Noise is not the issue. Fewer noise complaints say nothing about what caused fewer asthma attacks."}, "B": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Future plans cannot explain a drop that already happened."}, "D": {"trap": "EXTREME", "text": "The sweeping 'every city' sounds powerful, but ridership has nothing to do with asthma along Route 9."}, "E": {"trap": "REVERSAL", "text": "This weakens the argument: the new clinic offers another reason emergency room visits fell, even if asthma attacks did not."}}, "method_reminder": "Causal strengtheners either confirm the mechanism or rule out another cause. A mechanism answer must match the place and the timing of the effect.", "flashcard": {"front": "Electric buses arrive, then asthma visits on that route fall. Best strengthener?", "back": "Evidence the mechanism operated there: local diesel particulates dropped after the switch, and only on that route."}}, "original": true}, {"id": "LR-ST-007", "section": "LR", "type": "Strengthen", "subtype": "analogy", "difficulty": 3, "target_seconds": 90, "tags": ["analogy", "ecology"], "stimulus": "Ecologist: After wolves were reintroduced to the Corvin Valley, elk there began avoiding the open riverbanks, and the riverside willows that the elk had browsed to stubs for decades grew back within ten years. Elk have browsed the willows along the Ashby River to stubs in the same way. So reintroducing wolves to the Ashby River valley would probably allow its willows to recover as well.", "stem": "Which one of the following, if true, most strengthens the ecologist's argument?", "choices": {"A": "Along the Ashby River, stands of willow that researchers fenced off from elk grew back vigorously within a few years.", "B": "After wolves returned to the Corvin Valley, the number of coyotes there fell sharply.", "C": "The Ashby River valley covers roughly twice the area of the Corvin Valley.", "D": "Willows are the most ecologically important plants in every river valley in the region.", "E": "Much of the Ashby River's bank has eroded so badly that willow seedlings cannot take root there."}, "answer": "A", "explanation": {"argument_skeleton": "Premise: in Corvin, wolves returned, elk left the riverbanks, and willows recovered. Premise: Ashby's willows are browsed down the same way. Conclusion: wolves would let Ashby's willows recover. Gap: browsing is what holds Ashby's willows back, so removing it would work there too.", "why_correct": "A shows that along the Ashby, simply removing elk browsing lets willows recover. That is the link the analogy needs: if browsing is the only obstacle, a predator that drives elk off the riverbanks should work at Ashby as it did at Corvin.", "why_wrong": {"B": {"trap": "OUT_OF_SCOPE", "text": "Coyotes play no part in the argument about willows."}, "C": {"trap": "IRRELEVANT_COMPARISON", "text": "Size alone gives no reason to expect a different result. The argument depends on what limits the willows, not on how big the valley is."}, "D": {"trap": "EXTREME", "text": "'Most important in every valley' is sweeping, and importance says nothing about whether the willows would recover."}, "E": {"trap": "REVERSAL", "text": "This weakens the argument by naming a second obstacle that wolves cannot remove."}}, "method_reminder": "To strengthen an analogy, show that the two cases match on the factor that drives the result, or rule out a difference that would block it.", "flashcard": {"front": "Wolves fixed the willows in one valley, so they will in another. Best support?", "back": "Show the second valley matches where it matters: when browsing stops there (fenced plots), willows recover."}}, "original": true}, {"id": "LR-ST-008", "section": "LR", "type": "Strengthen", "subtype": "hypothesis", "difficulty": 2, "target_seconds": 75, "tags": ["hypothesis", "biology"], "stimulus": "Ornithologist: Gray jays in the Holt Forest store food for the winter by wedging it into crevices in tree bark, and they choose spruce trees for this far more often than pines. I hypothesize that the jays prefer spruce because spruce resin slows the spoiling of the stored food.", "stem": "Which one of the following, if true, most strongly supports the ornithologist's hypothesis?", "choices": {"A": "Spruce trees outnumber pines in the Holt Forest by about three to one.", "B": "Gray jays in the Holt Forest never store food anywhere other than in spruce trees.", "C": "Several other bird species in the Holt Forest store food in pines.", "D": "Gray jays depend on stored food to survive the winter.", "E": "In a controlled test, meat wedged into spruce bark spoiled much more slowly than identical meat wedged into pine bark."}, "answer": "E", "explanation": {"argument_skeleton": "Observation: Holt jays store food mainly in spruce. Hypothesis: spruce resin keeps the food from spoiling. Gap: nothing yet shows that spruce actually preserves food better than pine.", "why_correct": "E tests the hypothesis directly. If food lasts longer in spruce bark than in pine bark, the preservation explanation gains real support, and the jays' preference makes sense for the reason proposed.", "why_wrong": {"A": {"trap": "REVERSAL", "text": "This weakens the hypothesis with a simpler explanation: the jays may just use the most common tree."}, "B": {"trap": "EXTREME", "text": "Making the preference absolute only restates the observation more strongly. It does nothing to show why the jays prefer spruce."}, "C": {"trap": "IRRELEVANT_COMPARISON", "text": "Other species' habits do not test whether spruce preserves food."}, "D": {"trap": "TRUE_BUT_IRRELEVANT", "text": "This explains why storing food matters, but it does not favor spruce over pine."}}, "method_reminder": "To support a hypothesis, look for a confirmed prediction that the hypothesis makes. Restating the observation, however forcefully, adds nothing.", "flashcard": {"front": "Jays store food in spruce; hypothesis: resin preserves it. Best support?", "back": "A test showing food lasts longer in spruce than in pine. A stronger statement of the preference is not evidence for the reason."}}, "original": true}, {"id": "LR-ST-009", "section": "LR", "type": "Strengthen", "subtype": "rates", "difficulty": 3, "target_seconds": 80, "tags": ["causal", "rates", "urban", "transport"], "stimulus": "Since the town of Meridian lowered the downtown speed limit from 30 to 20 miles per hour, the number of pedestrian injuries downtown has fallen by half. Some residents insist that injuries fell only because fewer people now walk downtown. But the town council is right to conclude that the lower speed limit has made walking downtown safer.", "stem": "Which one of the following, if true, most strengthens the town council's conclusion?", "choices": {"A": "Before the speed limit was lowered, most pedestrian injuries in Meridian occurred outside the downtown area.", "B": "Automated counters show that the number of people walking downtown has risen slightly since the speed limit was lowered.", "C": "Many people who walk downtown say they feel safer than they did before the speed limit was lowered.", "D": "Driving through downtown now takes several minutes longer than it did before the speed limit was lowered.", "E": "Shortly after the speed limit was lowered, a new bypass road opened and diverted much of the car traffic away from downtown."}, "answer": "B", "explanation": {"argument_skeleton": "Premise: pedestrian injuries downtown halved after the limit dropped. Objection: fewer people walk downtown. Conclusion: the lower limit made walking downtown safer. Gap: injuries fell per walker, not just in total, and the limit is why.", "why_correct": "B answers the residents' objection. If the number of walkers rose while injuries halved, the injury rate per walker fell even more than the raw count did. Walking really did become safer, and the timing points to the new limit.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "Injuries outside downtown are not what the conclusion is about."}, "C": {"trap": "SHELL_GAME", "text": "Feeling safer is not being safer, and the claim does not address whether fewer people walk."}, "D": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Slower drives are a predictable side effect, but they do not show that walkers are safer."}, "E": {"trap": "REVERSAL", "text": "This weakens the council's conclusion by offering a rival cause: less car traffic, not the lower limit."}}, "method_reminder": "When a count changes, ask whether the base changed. A strengthener often shows the base held steady or moved the other way.", "flashcard": {"front": "Injuries halved; critics say fewer people walk. Best strengthener?", "back": "Show the number of walkers held steady or rose, so the injury rate per walker truly fell."}}, "original": true}, {"id": "LR-ST-010", "section": "LR", "type": "Strengthen", "subtype": "causal", "difficulty": 4, "target_seconds": 90, "tags": ["causal", "self-selection", "business"], "stimulus": "Online retailer: Customers who use our new 'save for later' feature buy 30 percent more from us over a year than customers who do not use it. So if we promote the feature to all of our customers, our sales will increase.", "stem": "Which one of the following, if true, most strengthens the retailer's argument?", "choices": {"A": "Customers who use the feature visited the site far more often than other customers even before the feature existed.", "B": "The feature costs very little to maintain.", "C": "Some items that customers save for later are never purchased.", "D": "When the feature was offered to a randomly chosen half of a large group of new customers, those offered it went on to buy substantially more than those who were not.", "E": "Every customer who has tried the feature has used it again."}, "answer": "D", "explanation": {"argument_skeleton": "Premise: feature users buy 30% more. Conclusion: promoting the feature to everyone will raise sales. Gap: the feature causes the extra buying, rather than heavy buyers being the ones who choose the feature.", "why_correct": "D is a randomized test. Because chance, not shopping habits, decided who got the feature, the extra purchases can be credited to the feature itself, which is exactly what promoting it to everyone assumes.", "why_wrong": {"A": {"trap": "REVERSAL", "text": "This weakens the argument: users were already heavy shoppers before the feature existed, so the feature may not be causing anything."}, "B": {"trap": "OUT_OF_SCOPE", "text": "Cost bears on profit, not on whether the feature raises sales."}, "C": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Some unbought items are compatible with users buying more overall. This changes nothing."}, "E": {"trap": "EXTREME", "text": "Universal repeat use shows people like the feature, not that it makes them buy more."}}, "method_reminder": "Correlation to causation: the strongest strengthener rules out self-selection. Random assignment does that in one stroke.", "flashcard": {"front": "Feature users buy more, so push the feature to everyone. Strongest support?", "back": "A randomized trial: customers given the feature by chance bought more. That rules out self-selection."}}, "original": true}, {"id": "LR-ST-011", "section": "LR", "type": "Strengthen", "subtype": "historical-evidence", "difficulty": 4, "target_seconds": 95, "tags": ["except", "historical-evidence"], "stimulus": "Historian: Letters that soldiers wrote home during the Caldor campaign were long assumed to have been read and censored by army officials, so historians treated them as unreliable evidence of what soldiers really thought. That assumption is probably mistaken. Many of the surviving letters contain blunt complaints about officers, rations, and pay.", "stem": "Each of the following, if true, strengthens the historian's argument EXCEPT:", "choices": {"A": "Some soldiers wrote their letters in a regional dialect that the campaign's officers could not read.", "B": "Officials who censored soldiers' mail in other campaigns of the period routinely struck out complaints about officers.", "C": "Letters from the campaign that bear army mail-office stamps contain complaints just as often as letters carried home privately by travelers.", "D": "No surviving order or regulation from the campaign mentions inspecting soldiers' mail.", "E": "Several letters describe planned troop movements, information that censors of the era were specifically instructed to remove."}, "answer": "A", "explanation": {"argument_skeleton": "Premise: many surviving letters contain blunt complaints. Conclusion: the letters probably were not censored. Gap: censors, if there were any, would have removed such complaints.", "why_correct": "A offers another way complaints could survive even if officials did read the mail: some letters were unreadable to the censors. The complaints then stop counting as evidence against censorship, so A does not strengthen the argument. If anything, it weakens it.", "why_wrong": {"B": {"trap": "REVERSAL", "text": "This strengthens: if censors removed complaints, surviving complaints suggest no one censored these letters."}, "C": {"trap": "REVERSAL", "text": "This strengthens: letters that went through official channels show no sign of complaints being removed."}, "D": {"trap": "REVERSAL", "text": "This strengthens, modestly: there is no record of any censorship policy."}, "E": {"trap": "REVERSAL", "text": "This strengthens: material censors were told to remove survived, so the letters were probably not censored."}}, "method_reminder": "EXCEPT questions: four answers do the job. Test each one and keep the answer that weakens or does nothing.", "flashcard": {"front": "Complaints in soldiers' letters suggest no censorship. Which kind of fact fails to help?", "back": "One giving complaints another route past the censors, such as letters the censors could not read."}}, "original": true}, {"id": "LR-WK-008", "section": "LR", "type": "Weaken", "subtype": "plan", "difficulty": 3, "target_seconds": 80, "tags": ["plan", "deterrence", "urban"], "stimulus": "To reduce littering in its parks, the city of Brannock plans to double the fine for littering, from $100 to $200. City officials argue that because the higher fine raises the cost of littering, people will litter less often.", "stem": "Which one of the following, if true, most seriously weakens the officials' argument?", "choices": {"A": "Most of the litter in Brannock's parks consists of food wrappers and drink containers.", "B": "Neighboring cities that fine litterers $300 have cleaner parks than Brannock does.", "C": "Some people litter in Brannock's parks because the trash cans there are often full.", "D": "No fine, however large, has ever completely eliminated littering in any city.", "E": "Park rangers in Brannock have issued almost no littering citations in the past five years, and the city has no plans to hire more rangers."}, "answer": "E", "explanation": {"argument_skeleton": "Premise: doubling the fine raises the cost of littering. Conclusion: littering will drop. Gap: people actually expect to pay the fine, so its size affects their choices.", "why_correct": "A fine deters only if people expect to pay it. If almost no one is ever cited and enforcement will not grow, the expected cost of littering stays near zero whether the fine is $100 or $200.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "What the litter consists of does not bear on whether a bigger fine deters it."}, "B": {"trap": "IRRELEVANT_COMPARISON", "text": "Other cities may differ in many ways, and their cleaner parks, if anything, fit the officials' argument."}, "C": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Another cause of littering does not show the fine will fail to reduce the littering it targets."}, "D": {"trap": "EXTREME", "text": "The plan aims to reduce littering, not end it. An attack on total elimination misses the claim."}}, "method_reminder": "To weaken a plan, find the condition it silently needs. A penalty deters through its size times the chance of actually paying it.", "flashcard": {"front": "Plan: double the littering fine. Best weakener?", "back": "Almost no one gets caught. A bigger fine times a near-zero chance of paying is still near zero."}}, "original": true}, {"id": "LR-WK-009", "section": "LR", "type": "Weaken", "subtype": "causal", "difficulty": 2, "target_seconds": 75, "tags": ["causal", "third-factor", "survey"], "stimulus": "A survey found that adults who regularly attend live music performances report higher life satisfaction than adults who do not. The researchers concluded that attending live music boosts life satisfaction, and they recommended that the city subsidize concert tickets.", "stem": "Which one of the following, if true, most seriously weakens the researchers' reasoning?", "choices": {"A": "Some people attend live music performances mainly because friends invite them.", "B": "Adults with higher incomes and more leisure time report higher life satisfaction and are also far more likely than others to attend live performances.", "C": "Recorded music is far more popular than live music among adults in the city.", "D": "Concert ticket prices in the city have risen faster than inflation over the past decade.", "E": "Some adults who frequently attend live music report low life satisfaction."}, "answer": "B", "explanation": {"argument_skeleton": "Premise: concertgoers report higher life satisfaction. Conclusion: concerts boost satisfaction, so subsidize tickets. Gap: nothing else explains both the concertgoing and the satisfaction.", "why_correct": "B names a third factor. Income and free time raise satisfaction on their own and also make concertgoing likely, so the correlation could exist even if concerts did nothing for anyone's satisfaction.", "why_wrong": {"A": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Why people attend does not break the link between attending and satisfaction."}, "C": {"trap": "IRRELEVANT_COMPARISON", "text": "The popularity of recorded music is beside the point."}, "D": {"trap": "REVERSAL", "text": "Rising prices, if anything, support the case for a subsidy. They do not touch the causal claim."}, "E": {"trap": "TOO_WEAK", "text": "A few unhappy concertgoers are compatible with a higher average. Exceptions do not undercut a group difference."}}, "method_reminder": "Correlation arguments fall to a third factor that causes both, or to reverse causation. Name the factor and check that it touches both sides.", "flashcard": {"front": "Concertgoers are happier, so concerts make people happier. Weakener?", "back": "A third factor: income and free time raise both satisfaction and concert attendance."}}, "original": true}, {"id": "LR-WK-010", "section": "LR", "type": "Weaken", "subtype": "share-vs-rate", "difficulty": 4, "target_seconds": 90, "tags": ["numbers", "share-vs-rate", "economics"], "stimulus": "Over the past ten years, the share of new businesses in Ostrava County founded by residents over 55 has doubled, from 10 percent to 20 percent. Clearly, older residents of the county have become much more entrepreneurial.", "stem": "Which one of the following, if true, most seriously weakens the argument?", "choices": {"A": "Businesses founded by people over 55 are more likely to survive five years than businesses founded by younger people.", "B": "In neighboring counties, the share of new businesses founded by people over 55 has also risen.", "C": "Over the past ten years, the number of county residents over 55 has roughly tripled, while the total number of new businesses founded each year has stayed about the same.", "D": "Most of the businesses founded by county residents over 55 are small consulting firms.", "E": "Every county resident over 55 who founded a business in the past ten years had previously retired from another job."}, "answer": "C", "explanation": {"argument_skeleton": "Premise: older founders' share of new business
