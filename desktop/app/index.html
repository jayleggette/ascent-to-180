/* ----- the Daily Climb ----- */
function buildClimb(len){const ex=new Set();const steps=[{type:'warmup'}];
  const nMain=len===20?6:len===45?10:16;const main=adaptiveMix(nMain,ex);main.forEach(x=>ex.add(x));
  steps.push({type:'set',set:makeSet({label:'Main Quest',mode:'blind',items:main})});
  const exP=[];if(len===90){const p=pickPassage({humanities:true});if(p){exP.push(p);steps.push({type:'set',set:makeSet({label:'Main Quest: passage with margin notes',mode:'blind',items:passQs(p),margin:true})})}}
  if(len>=45){const rcDay=len===90||dayNum()%2===1;if(rcDay){const p=pickPassage({humanities:true,exclude:exP});if(p)steps.push({type:'set',set:makeSet({label:'Timed Trial: one passage in 8:45',mode:'timed',items:passQs(p),timeLimit:525})})}
    if(!rcDay||len===90){const t=pickQs(LIB.lr,8,{exclude:ex});steps.push({type:'set',set:makeSet({label:'Timed Trial: 8 in 11',mode:'timed',items:t,timeLimit:660})})}}
  steps.push({type:'autopsy'},{type:'reflect'},{type:'rewards'});

/* ----- answer state helpers ----- */
function ansOf(set,id){return set.ans[id]||(set.ans[id]={ch:'',conf:'',fl:0,sec:0,chg:0,first:null,struck:[],pred:'',hint:0,checked:false})}
function curQid(set){if(set.phase==='br')return set.brList[set.brIdx];return set.items[set.idx]}
function choose(L){const set=curSet();if(!set)return;const id=curQid(set);const q=LIB.Q[id];if(!q)return;
  if(set.phase==='br'){const b=set.br[id]||(set.br[id]={ch:''});b.ch=L;saveSoon();renderPlayer();return}
  const a=ansOf(set,id);if(a.checked)return;if(set.twist==='predict'&&!a.revealed)return;if(set.twist==='nochange'&&a.ch){toast('No second looks in this fight. First answer stands.');return}
  if(a.struck.includes(L))a.struck=a.struck.filter(x=>x!==L);
  if(a.first==null)a.first=L;else if(a.ch&&a.ch!==L)a.chg++;a.ch=L;sfx('tick');

function strike(L){const set=curSet();if(!set||set.phase!=='answer')return;const a=ansOf(set,curQid(set));if(a.checked)return;a.struck=a.struck.includes(L)?a.struck.filter(x=>x!==L):a.struck.concat(L);if(a.struck.includes(L)&&a.ch===L){}renderPlayer();saveSoon()}
function setConf(c){const set=curSet();if(!set)return;const a=ansOf(set,curQid(set));if(set.phase!=='answer'||a.checked)return;a.conf=c;saveSoon();renderPlayer()}
function toggleFlag(){const set=curSet();if(!set||set.phase!=='answer')return;const a=ansOf(set,curQid(set));a.fl=a.fl?0:1;saveSoon();renderPlayer()}
function checkCurrent(){const set=curSet();const id=curQid(set);const q=LIB.Q[id];const a=ansOf(set,id);if(!a.ch&&set.mode!=='speed'){toast('Pick an answer first.');return}
  if(a.checked)return;a.checked=true;if(!a.conf)a.conf='think';const rec=recordAnswer(q,a,set.mode,set.id,set.idx+1);a.ok=rec.ok;sfx(rec.ok?'ok':'slip');if(typeof onCheck==='function')onCheck(set,q,a,rec.ok);

function goIdx(i){const set=curSet();if(!set)return;if(set.phase==='br'){set.brIdx=clamp(i,0,set.brList.length-1)}else set.idx=clamp(i,0,set.items.length-1);set.qStart=now();renderPlayer();scrollTop()}
function nextQ(){const set=curSet();if(!set)return;
  if(set.phase==='answer'){const id=curQid(set);const a=ansOf(set,id);
    if((set.mode==='guided'||set.mode==='speed')&&!a.checked){if(a.ch)checkCurrent();else if(set.mode==='speed'){checkCurrent()}else toast('Check your answer first.');return}
    if(set.trap&&a.huntPending){toast('Name the trap first, or skip it.');return}
    if(!a.conf&&a.ch)a.conf='think';
    if(set.idx<set.items.length-1){goIdx(set.idx+1);return}
    if(set.mode==='sim'){openReview();return}
    finishAnswerPhase(false);return}
  if(set.phase==='br'){if(set.brIdx<set.brList.length-1){goIdx(set.brIdx+1);return}finishBR()}}
function prevQ(){const set=curSet();if(!set)return;if(set.phase==='br')goIdx(set.brIdx-1);else goIdx(set.idx-1)}
function finishAnswerPhase(timeUp){const set=curSet();if(!set||set.phase!=='answer')return;closeModal();
  if(timeUp){toast('Time. Pencils down.','gold');sfx('bad')}
  for(const id of set.items){const a=ansOf(set,id);if(!a.conf)a.conf=a.ch?'think':'guess'}
  if(set.mode==='guided'||set.mode==='speed'||set.trap){for(const id of set.items){const a=ansOf(set,id);if(!a.checked){a.checked=true;const r=recordAnswer(LIB.Q[id],a,set.mode,set.id,set.items.indexOf(id)+1);a.ok=r.ok}}set.phase='done';set.recorded=true;set.res=setResults(set);afterSet(set);nextStep();return}
  const list=set.items.filter(id=>{const a=ansOf(set,id);const q=LIB.Q[id];return a.fl||a.conf!=='sure'||a.ch!==q.answer});
  if(!list.length||set.noBR){recordSet(set);set.phase='done';afterSet(set);nextStep();return}

  set.res=setResults(set);S.counters.sets=(S.counters.sets||0)+1;if(TIMED.has(set.mode))S.counters.timedSets=(S.counters.timedSets||0)+1;checkAch();saveNow()}
function setResults(set){let c=0,cb=0,n=set.items.length;for(const id of set.items){const q=LIB.Q[id];const a=ansOf(set,id);const ok=a.ch===q.answer;c+=ok?1:0;const b=set.br[id];cb+=(b&&b.ch)?(b.ch===q.answer?1:0):(ok?1:0)}return{c,n,cb,gap:cb-c,sec:Math.round(set.elapsed)}}
function afterSet(set){const r=set.res;if(!r)return;const s=SES();s.sets.push(set.id);
  if(r.n>=8&&r.c===r.n)unlock('perfect_set');if(r.n>=8&&r.cb===r.n)unlock('br_perfect');if(set.mode==='timed'&&r.n>=4&&r.c===r.n)unlock('flawless_trial');if(TIMED.has(set.mode)&&r.n>=8&&r.gap===0)unlock('gap_close');

    const okArr=set.items.map(id=>ansOf(set,id).ch===LIB.Q[id].answer?1:0);if(okArr.length>=15&&sum(okArr.slice(-5))>=sum(okArr.slice(0,5)))unlock('iron');

function marginsHTML(st){const p=LIB.P[st.p];if(!p)return'';const mine=S.margin[p.id]||[];

ACT.marginsDone=()=>{const s=SES();const st=curStep();if(st&&st.p&&(S.margin[st.p]||[]).some(x=>x&&x.trim()))addXP(8);checkAch();nextStep()};
function stepName(x){return x.type==='set'?x.set.label:{warmup:'Warm-up',autopsy:'Autopsy',reflect:'Reflection',rewards:'Rewards',results:'Results',break:'Break',margins:'Margin notes'}[x.type]||x.type}
function playerHTML(set){const id=curQid(set);const q=LIB.Q[id];if(!q)return`<div class="card">This question is no longer in your library.<button class="btn" data-a="skipMissing">Skip</button></div>`;
  const a=ansOf(set,id);const br=set.phase==='br';const b=br?(set.br[id]||{}):null;const showTimer=S.settings.showTimer&&set.twist!=='blackout'&&!br;
  const total=br?set.brList.length:set.items.length;const idx=br?set.brIdx:set.idx;
  const reveal=a.checked&&(set.mode==='guided'||set.mode==='speed'||set.trap);

  let choices='';if(!needPred){choices=LET.map(L=>{const cls=['ch'];const pick=br?b.ch:a.ch;if(pick===L)cls.push('sel');if(!br&&a.struck.includes(L))cls.push('struck');let mark='';if(reveal){if(L===q.answer){cls.push('right');mark='<span class="mark" style="color:var(--volt)">Correct</span>'}else if(L===a.ch){cls.push('wrong');mark='<span class="mark" style="color:var(--bad)">Your pick</span>'}}
      return`<div class="${cls.join(' ')}" role="button" tabindex="0" data-a="pick" data-v="${L}" data-ch="${L}" aria-pressed="${pick===L}" aria-label="Choice ${L}"><span class="L">${L}</span><span class="tx">${esc(q.choices[L])}${mark?'<br>'+mark:''}</span>${br?'<span></span>':`<button class="sk" data-a="strike" data-v="${L}" aria-label="Strike out choice ${L}" title="Strike out (right-click, long-press, or Shift+${L})">✕</button>`}</div>`}).join('')}
  const qn=br?set.brList.map((x,i)=>`<button class="${i===idx?'cur':''} ${(set.br[x]&&set.br[x].ch)?'ans':''}" data-a="goq" data-v="${i}" aria-label="Review item ${i+1}">${i+1}</button>`).join(''):set.items.map((x,i)=>{const aa=set.ans[x]||{};return`<button class="${i===idx?'cur':''} ${aa.ch?'ans':''} ${aa.fl?'fl':''}" data-a="goq" data-v="${i}" aria-label="Question ${i+1}${aa.fl?', flagged':''}">${i+1}</button>`}).join('');
  const typeLine=`<span class="typetag">${esc(q.section==='RC'?'RC · '+q.type:q.type)}</span> <span class="stars">${'★'.repeat(q.difficulty||3)}${'☆'.repeat(5-(q.difficulty||3))}</span>${q.pack&&String(q.pack).startsWith('gen-')?' <span class="pill bad">Generated live, unreviewed</span>':''}`;
  const brNote=br?`<div class="callout v"><b>Blind Review.</b> No clock. Answers stay hidden until you finish. First pass: <b>${esc(a.ch||'blank')}</b> (${esc(CONF_L[a.conf]||'unrated')}${a.fl?', flagged':''}). Re-solve it from the stimulus, not from memory.</div><label class="f">One-line reasoning note (why your pick is right)<textarea rows="2" data-brnote="${id}" placeholder="The gap is..., so the answer must...">${esc(b.note||'')}</textarea></label>`:'';
  const tools=`<div class="row" style="gap:6px"><button class="btn sm ${HLMODE?'primary':''}" data-a="hlmode" title="Highlighter mode (click words)">Highlighter</button><button class="btn sm" data-a="hlsel" title="Highlight selected text (H)">Highlight selection <span class="kbd">H</span></button><button class="btn sm ghost" data-a="hlclear">Clear</button></div>`;

  const hintBox=set.mode==='guided'&&!reveal?hintHTML(q,a):'';
  const pred=needPred?`<div class="callout"><b>Predict before you look.</b> Write what the right answer must do. The choices appear after.</div><textarea id="predTx" rows="3" data-pred="${id}" placeholder="The answer will...">${esc(a.pred||'')}</textarea><button class="btn primary" data-a="revealCh">Reveal choices</button>`:(set.twist==='predict'&&a.pred?`<div class="fc"><span class="eyebrow">Your prediction</span><div>${esc(a.pred)}</div></div>`:'');

    :reveal?`${set.trap&&a.huntPending?'':`<button class="btn primary" data-a="nextq">${idx<total-1?'Next':'Finish set'} <span class="kbd">N</span></button>`}`
    :(set.mode==='guided'?`<button class="btn primary" data-a="check">Check answer <span class="kbd">Enter</span></button>`:`<button class="btn" data-a="prevq" ${idx===0?'disabled':''}>Back</button><button class="btn primary" data-a="nextq">${idx<total-1?'Next':(set.mode==='sim'?'Section review':'Finish set')} <span class="kbd">N</span></button>`);

  return`<div class="player" id="player">
  <div class="pbar"><b>${esc(set.label)}</b><span class="muted mono">${br?'Blind Review ':''}${idx+1} / ${total}</span>${tw?`<span class="pill gold">${esc(tw)}</span>`:''}<span style="flex:1"></span>
  ${!br?`<button class="btn sm flagbtn ${a.fl?'on':''}" data-a="flag" aria-pressed="${!!a.fl}">${a.fl?'Flagged':'Flag'} <span class="kbd">F</span></button>`:''}

function pausedHTML(){return`<div class="modalwrap"><div class="modal"><h2 class="disp">Paused</h2><p class="sub" style="margin:8px 0 14px">The clock is stopped. On test day there is no pause, so use this sparingly.</p><button class="btn primary" data-a="pause">Resume</button></div></div>`}
function hintHTML(q,a){const t=(CURR.towers||[]).find(x=>(x.types||[]).includes(q.type))||{};const steps=t.steps||['Find the conclusion first.','Name the gap between evidence and conclusion.','Predict, then match.'];const shown=a.hint||0;

  const rows=LET.filter(L=>L!==q.answer).map(L=>{const w=ww[L]||{};return`<div class="ww"><b>${L}</b><div>${(w.trap?String(w.trap).split(/[,+ ]+/).filter(Boolean).map(t=>`<span class="pill ${mine===L?'bad':''}" title="${esc(trapDesc(t))}">${esc(trapName(t))}</span> `).join(''):'')}${esc(w.text||'')}</div></div>`}).join('');

function trapName(c){const t=(CURR.trapIndex||{})[c];return t?t.name:String(c||'').replace(/_/g,' ').toLowerCase().replace(/^\w/,m=>m.toUpperCase())}

function renderPlayer(){if(VIEW.name!=='play')return;const el=$('#view');if(!el)return;const y=$('.pleft')?$('.pleft').scrollTop:0,y2=$('.pright')?$('.pright').scrollTop:0;el.innerHTML=viewPlay();const l=$('.pleft'),r=$('.pright');if(l)l.scrollTop=y;if(r)r.scrollTop=y2;const set=curSet();if(set)paintTimer(set)}

/* ----- section review (digital interface) ----- */

/* ----- warm-up ----- */

    <div class="row" style="margin-top:12px">${w.flip?`<button class="btn" data-a="warmGrade" data-v="0">Missed it</button><button class="btn primary" data-a="warmGrade" data-v="1">Got it</button><button class="btn" data-a="warmGrade" data-v="2">Easy</button>`:`<button class="btn primary" data-a="warmFlip">Flip</button>`}<button class="btn ghost" data-a="warmSkip">Skip warm-up</button></div></div>

  return`<div class="card"><h3>Warm-up done</h3><button class="btn primary" data-a="warmDone">Continue</button></div>`}

/* ----- autopsy ----- */
const WHY_TAGS=['Misread the stimulus','Missed the conclusion','Weak prediction','Fell for a trap','Formal logic slip','Rushed under time','Changed a right answer','Out of time','Lucky guess (right but unsure)','Other'];
function sessionSets(s){return s.steps.filter(x=>x.type==='set'&&x.set.recorded).map(x=>x.set)}
function autopsyItems(){const s=SES();if(!s)return[];const out=[];for(const set of sessionSets(s))for(const id of set.items){const a=set.ans[id]||{};const q=LIB.Q[id];if(!q)continue;if(a.ch!==q.answer||a.conf!=='sure'||a.fl)out.push({set:set.id,id,a,ok:a.ch===q.answer})}return out}
function autopsyHTML(s){const items=s.autopsy||(s.autopsy=autopsyItems().map(x=>({set:x.set,id:x.id})));s.ai=s.ai||0;
  if(!items.length)return`<div class="card" style="max-width:720px"><h2 class="disp">Clean autopsy</h2><p class="sub" style="margin:8px 0 14px">Every answer was right and rated Sure. Rare air. Log it and move on.</p><button class="btn primary" data-a="autopsyDone">Continue</button></div>`;
  if(s.ai>=items.length)return`<div class="card" style="max-width:720px"><h2 class="disp">Autopsy complete</h2><p class="sub" style="margin:8px 0 14px">${items.length} items examined. Each miss and each shaky answer is now a flashcard on a spaced schedule.</p><button class="btn primary" data-a="autopsyDone">Continue</button></div>`;
  const it=items[s.ai];const set=sessionSets(s).find(x=>x.id===it.set);const a=set?set.ans[it.id]:{};const q=LIB.Q[it.id];const why=(S.why[it.id]||{}).tag;
  return`<div class="player" style="min-height:0"><div class="pbar"><b>Autopsy</b><span class="muted mono">${s.ai+1} / ${items.length}</span><span class="pill ${a.ch===q.answer?'volt':'bad'}">${a.ch===q.answer?'Right but unsure':'Missed'}</span><span class="pill">You: ${esc(a.ch||'blank')} · ${esc(CONF_L[a.conf]||'')}${set&&set.br[it.id]&&set.br[it.id].ch?' · Blind Review: '+esc(set.br[it.id].ch):''}</span></div>
  <div class="pleft"><div class="stim">${stimHTML({hl:{},phase:'x'},q)}</div></div>
  <div class="pright"><div class="typetag">${esc(q.type)}</div><div class="stem">${esc(q.stem)}</div><div class="choices">${LET.map(L=>`<div class="ch ${L===q.answer?'right':(L===a.ch?'wrong':'')}"><span class="L">${L}</span><span class="tx">${esc(q.choices[L])}</span><span></span></div>`).join('')}</div>

  <div class="card flat"><h3>Why did this one get away?</h3><div class="row" style="gap:6px;margin-top:8px">${WHY_TAGS.map(t=>`<button class="pill ${why===t?'gold':''}" style="cursor:pointer" data-a="whyTag" data-v="${esc(t)}" data-id="${it.id}">${esc(t)}</button>`).join('')}</div></div>
  <div class="row"><button class="btn" data-a="autopsyPrev" ${s.ai===0?'disabled':''}>Back</button><button class="btn primary" data-a="autopsyNext">${s.ai<items.length-1?'Next item':'Finish autopsy'}</button></div></div></div>`}
ACT.whyTag=(v,el)=>{const id=el.dataset.id;S.why[id]={tag:v,t:now()};saveSoon();render()};
ACT.autopsyNext=()=>{const s=SES();const it=s.autopsy[s.ai];if(it&&!S.why[it.id]){toast('Tag the cause first. That tag is what makes the error log useful.');return}s.ai++;render();scrollTop()};

/* ----- reflection ----- */
function reflectHTML(s){const r=s.refl||(s.refl={});const weak=lrTypesAvail().sort((a,b)=>mastery(a)-mastery(b)).slice(0,4).concat(['Humanities passages','Timing']);
  const grp=(key,title,opts)=>`<div class="card flat"><h3>${title}</h3><div class="row" style="gap:6px;margin-top:8px">${opts.map(o=>`<button class="pill ${r[key]===o?'gold':''}" style="cursor:pointer" data-a="refl" data-v="${esc(o)}" data-k="${key}">${esc(o)}</button>`).join('')}</div></div>`;

function sessionSummaryRows(s){return sessionSets(s).map(set=>{const r=set.res||{c:0,n:0,cb:0,gap:0};return`<tr><td>${esc(set.label)}</td><td class="mono">${r.c}/${r.n}</td><td class="mono">${set.mode==='guided'||set.mode==='speed'?'n/a':r.cb+'/'+r.n}</td><td class="mono">${set.mode==='guided'||set.mode==='speed'?'n/a':(r.gap>0?'+':'')+r.gap}</td><td class="mono">${fmtClock(r.sec)}</td></tr>`}).join('')}
function coachNote(s){const sets=sessionSets(s);const c=sum(sets.map(x=>x.res?x.res.c:0)),n=sum(sets.map(x=>x.res?x.res.n:0)),cb=sum(sets.map(x=>x.res?x.res.cb:0));const gap=cb-c;
  const traps={};for(const set of sets)for(const id of set.items){const q=LIB.Q[id],a=set.ans[id]||{};if(q&&a.ch&&a.ch!==q.answer){const t=trapOf(q,a.ch);if(t)traps[t]=(traps[t]||0)+1}}const top=Object.entries(traps).sort((x,y)=>y[1]-x[1])[0];
  let m=`${c} of ${n} on the clock`+(gap>0?`, ${cb} after Blind Review. That gap of ${gap} is understanding you already own but have not converted to speed. Timed Trials close it.`:gap===0&&n?'. No gap between timed and untimed work today, so speed is not your limiter on this material.':'.');
  if(top)m+=` Your most expensive trap today was ${trapName(top[0])} (${top[1]}). Read its exhibit in the Trap Museum before tomorrow.`;return m}

  if(!s.rewarded){s.rewarded=1;S.counters.climbs++;today().climb=1;const away=s.meta.away;addXP(s.meta.len===90?70:50);qualify();if(away&&away>=5)unlock('comeback');checkAch();saveNow()}
  return`<div class="stack" style="max-width:900px">${typeof cacheCardHTML==='function'?cacheCardHTML(s):''}<div class="hero" style="min-height:0;padding:22px 24px"><div class="eyebrow">Daily Climb complete</div><h1 class="disp burst" style="margin:6px 0">+${S.xp-s.xp0} XP</h1><div class="row"><span class="pill gold">Level ${li.lv}</span><div class="xpbar" style="width:200px"><i style="width:${li.pct}%"></i></div><span class="pill volt">Streak ${S.streak.cur}</span><span class="pill">${S.streak.freezes} freeze${S.streak.freezes===1?'':'s'} stored</span></div></div>

  <div class="row"><button class="btn primary" data-a="endSession">Back to Base Camp</button>${s.meta.len===20?`<button class="btn" data-a="bonusTrial">Bonus: Timed Trial, 8 in 11</button>`:''}</div></div>`}
function resultsHTML(s){const sets=sessionSets(s);let extra='';const m=s.meta||{};
  if(!s.resolved){s.resolved=1;resolveMeta(s)}
  if(s.outcome)extra=`<div class="callout ${s.outcome.ok?'v':''}" style="margin-bottom:12px"><b>${esc(s.outcome.title)}</b> ${esc(s.outcome.text)}</div>`;
  const list=sets.map(set=>set.items.map((id,i)=>{const q=LIB.Q[id];const a=set.ans[id]||{};const ok=a.ch===q.answer;const b=set.br[id];return`<tr class="click" data-a="reviewQ" data-v="${id}" data-set="${set.id}"><td class="mono">${i+1}</td><td>${esc(q.type)}</td><td class="stars">${'★'.repeat(q.difficulty||3)}</td><td class="mono">${esc(a.ch||'-')} ${ok?'<span style="color:var(--volt)">✓</span>':'<span style="color:var(--bad)">✗</span>'}</td><td class="mono">${b&&b.ch?esc(b.ch)+(b.ch===q.answer?' ✓':' ✗'):'-'}</td><td class="mono">${fmtClock(a.sec||0)}</td><td>${esc(CONF_L[a.conf]||'')}</td></tr>`}).join('')).join('');
  return`<div class="stack"><div class="row between"><h2 class="disp">${esc(s.title)}: results</h2><button class="btn primary" data-a="endSession">Done</button></div>${extra}

function resolveMeta(s){const m=s.meta||{};const sets=sessionSets(s);const c=sum(sets.map(x=>x.res?x.res.c:0)),n=sum(sets.map(x=>x.res?x.res.n:0));const p=n?c/n:0;
  if(m.tower){const ts=towerState(m.tower);const t=(CURR.towers||[]).find(x=>x.id===m.tower);const fl=m.floor;const rec={c,n,t:now()};
    if(fl==='challenge'){ts.challenged=true;if(p>=.8){ts.cleared=true;ts.lesson=true;['f2','f3','f4'].forEach(k=>ts[k]=ts[k]||{c,n,t:now(),skip:1});ts.f5=ts.f5||{c,n,t:now(),passed:true,skip:1};unlock('challenge_out');s.outcome={ok:1,title:'Challenge Out passed.',text:`${c}/${n}. ${t?t.name:''} is cleared. Its floors stay open for practice.`}}else s.outcome={ok:0,title:'Not this time.',text:`${c}/${n}. You need 80% to skip the tower. Climb the floors instead; the Lesson is short.`}}
    else{const prev=ts['f'+fl];if(!prev||c/n>=(prev.c/prev.n))ts['f'+fl]=rec;
      if(fl===5){rec.passed=p>=.7;ts.f5=rec;if(rec.passed){ts.cleared=true;s.outcome={ok:1,title:'Guardian defeated.',text:`${c}/${n}. The tower is yours. Mixed sets will keep it sharp.`}}else s.outcome={ok:0,title:'The Guardian holds.',text:`${c}/${n}. You need 70%. Review the misses in the explanations below, then try again tomorrow.`}}
      else{const need=fl===2?0:.6;s.outcome=p>=need?{ok:1,title:'Floor '+fl+' complete.',text:`${c}/${n}. Floor ${fl+1} is open.`}:{ok:0,title:'Floor '+fl+' needs another pass.',text:`${c}/${n}. You need 60% to open the next floor.`}}}}
  if(m.forgeModule){}
  if(m.sim){const lr=m.simSection;if(m.full){S.counters.fullTests++;const est=estimateFromSets(sets);S.counters.fullTestBest=Math.max(S.counters.fullTestBest||0,est);s.outcome={ok:1,title:'Full test complete.',text:`Rough in-game scaled estimate ${est}. This uses an approximate conversion curve, so treat it as a range of a few points, and trust official LawHub tests over it.`}}}
  if(m.diag){const est=Math.round(clamp(140+p*40,140,180));s.outcome={ok:1,title:'Mini Diagnostic complete.',text:`${c}/${n} (${pct(c,n)}%). As a very rough in-game band, this looks like the ${est-4} to ${est+4} range. Twelve questions cannot measure an LSAT score, so take the official diagnostic on LawHub and log it in the Logbook.`};S.profile.miniDiag={c,n,t:now()}}
  if(m.speed){s.outcome={ok:c>=8,title:'Speed Run: '+c+'/'+n,text:c>=9?'Fast and accurate. Bank this pace for the first ten questions of a section.':'Speed without accuracy is just guessing faster. Slow down slightly on the stimulus and speed up on elimination.'}}
  checkAch();saveNow()}
function estimateFromSets(sets){let lr=0,lrn=0,rc=0,rcn=0;for(const set of sets)for(const id of set.items){const q=LIB.Q[id];const ok=(set.ans[id]||{}).ch===q.answer?1:0;if(q.section==='RC'){rc+=ok;rcn++}else{lr+=ok;lrn++}}const raw=(lrn?lr/lrn:0)*50+(rcn?rc/rcn:0)*27;return scaledFromRaw(raw)}

const ROUTE=[[40,250],[140,222],[230,198],[320,176],[400,156],[470,136],[545,116],[615,94],[680,72],[745,52],[815,30]];
const yOf=sc=>250-(clamp(sc,120,180)-120)/60*220;
function routePoint(y){for(let i=1;i<ROUTE.length;i++){const a=ROUTE[i-1],b=ROUTE[i];if(y<=a[1]&&y>=b[1]){const t=(a[1]-y)/(a[1]-b[1]);return[a[0]+(b[0]-a[0])*t,y]}}return y>250?ROUTE[0]:ROUTE[ROUTE.length-1]}
function ridgeSVG(pr){const pts=[[0,270],[0,236],[60,244],[110,214],[150,224],[205,188],[250,198],[300,166],[350,172],[392,142],[438,150],[480,118],[520,126],[566,98],[600,104],[650,72],[690,80],[735,46],[770,52],[815,24],[850,44],[880,40],[915,76],[950,70],[1000,104],[1000,270]];
  const far=[[0,270],[0,180],[90,150],[170,170],[260,120],[340,140],[430,96],[520,128],[610,84],[700,110],[790,70],[880,96],[960,60],[1000,82],[1000,270]];

  const alt=pr.mid==null?120:pr.mid;const p=routePoint(yOf(alt));const band=pr.mid==null?'':`<rect x="0" y="${yOf(pr.hi)}" width="1000" height="${Math.max(2,yOf(pr.lo)-yOf(pr.hi))}" fill="var(--voltsoft)"/>`;

  <line x1="0" x2="1000" y1="${yOf(goal)}" y2="${yOf(goal)}" stroke="var(--goldf)" stroke-width="1.2" stroke-dasharray="6 5"/><text x="978" y="${yOf(goal)-6}" text-anchor="end" font-family="var(--f-mono)" font-size="11" fill="var(--gold)">your floor ${goal}</text>
  <polygon points="${poly(pts)}" fill="var(--card2)" stroke="var(--ink)" stroke-width="1.4" stroke-linejoin="round"/>
  <polyline points="${poly(ROUTE)}" fill="none" stroke="var(--ink3)" stroke-width="1.5" stroke-dasharray="3 5"/>
  <g transform="translate(815,24)"><line x1="0" y1="0" x2="0" y2="-22" stroke="var(--ink)" stroke-width="1.5"/><path d="M0 -22 L18 -16 L0 -10 Z" fill="var(--goldf)"/></g>

  <g class="ridge-climber" id="climber" data-x="${p[0]}" data-y="${p[1]}" style="transform:translate(40px,250px)"><circle r="8" fill="var(--voltf)" stroke="var(--card)" stroke-width="3"/></g></svg>`}
function animateRidge(){const c=$('#climber');if(!c)return;const x=c.dataset.x,y=c.dataset.y;if(reducedMotion()){c.style.transform=`translate(${x}px,${y}px)`;return}requestAnimationFrame(()=>requestAnimationFrame(()=>{c.style.transform=`translate(${x}px,${y}px)`}))}

    :`<small>Altitude</small><span class="num">${metersOf(pr.mid).toLocaleString('en-US')}<em>m</em></span><p>Estimated LSAT ${pr.lo} to ${pr.hi}, from ${({model:'the in-game model',real:'your official tests',blend:'official tests and the in-game model'}[pr.src])}. The summit, 180, stands at 8,849 m.</p>`;

    :`<div class="stp"><b>Starting altitude set</b><p class="mut">${S.profile.miniDiag&&!S.realTests.length?'From your Mini Diagnostic.':'From your LSAT diagnostic score.'}</p></div>`;
  const s2=fresh?`<div class="stp"><b>Today's climb</b><p class="mut">Unlocks after step 1.</p></div>`
    :`<div class="stp"><b>Today's climb</b><p>${mins} minutes: warm-up, main quest${mins>=45?', timed trial':''}, autopsy, reflection. Best next step: <b>${esc(rec.title)}</b>.</p><button class="btn primary xl" data-a="climb" data-v="${mins}">Start today's climb</button><div class="alts"><span class="muted">Short on time?</span>${[20,45,90].filter(m=>m!==mins).map(m=>`<button class="btn sm" data-a="climb" data-v="${m}">${m} min</button>`).join('')}</div></div>`;
  const s3=`<div class="stp"><b>Review what you missed</b><p class="mut">${due?due+' flashcard'+(due===1?'':'s')+' due. Reviewing them locks in what you got wrong.':'Nothing due. Misses from your climbs show up here.'}</p>${due&&!fresh?`<button class="btn sm" data-a="nav" data-v="review">Review ${due} card${due===1?'':'s'}</button>`:''}</div>`;
  const path=`<div class="card path"><div class="k">Your path</div><ol class="steps"><li class="${fresh?'now':'done'}"><span class="n">${fresh?'1':'&#10003;'}</span>${s1}</li><li class="${fresh?'':'now'}"><span class="n">2</span>${s2}</li><li class="${due&&!fresh?'':'later'}"><span class="n">3</span>${s3}</li></ol></div>`;
  return`<div id="marks" aria-hidden="true">${marksHTML()}</div><section class="camp">
  <div class="alti">${alt}</div>
  <div class="campR">${resume}${path}${welcome}${wk}${homeBanners(true)}</div>
  <div class="campB"><div class="tiles">

   <div class="tile"><small>${icon('flag',14)}Test day</small><b>${testDays!=null?Math.max(0,testDays):'None'}</b><span>${testDays!=null?'days, '+esc(currentPhase().name.replace(/^Phase \d+ · /,'')):'<a href="#prefs" data-a="nav" data-v="prefs">Set a date</a>'}</span></div>

  </section>
  <section class="below"><details class="more"><summary>More ways to train and your progress</summary><h3 class="sechd">More ways to train</h3><div class="grid g3">
   ${t?`<div class="card crux"><div class="k">Next crux</div><h3>${esc(cx[0])}</h3><div class="route">On the ${esc(t.name)} route</div><div class="floors" role="img" aria-label="${fl} of 5 pitches done">${[0,1,2,3,4].map(i=>`<i class="${i<fl?'on':''}"></i>`).join('')}</div><div class="tag">${fl} of 5 pitches done</div><p class="weak">Weak to <b>${esc(cx[1])}</b></p><button class="btn gold" data-a="nav" data-v="tower" data-p="${t.id}">Climb the route</button></div>`:''}
   <div class="card"><div class="eyebrow">Next best action</div><h3 style="margin:4px 0">${esc(rec.title)}</h3><p class="sub" style="font-size:13.5px">${esc(rec.why)}</p><button class="btn sm" style="margin-top:10px" data-a="${rec.a}" data-v="${esc(rec.v||'')}" ${rec.p?`data-p="${esc(rec.p)}"`:''}>${esc(rec.cta)}</button></div>
   <div class="card"><h3>Practice now</h3><div class="row" style="margin-top:10px;gap:8px"><button class="btn sm" data-a="nav" data-v="citadel">Pick a route</button><button class="btn sm" data-a="freePractice">Free Practice</button><button class="btn sm" data-a="speedRun">Speed Run</button><button class="btn sm" data-a="miniDiag">Mini Diagnostic</button><button class="btn sm" data-a="nav" data-v="archipelago">A passage</button><button class="btn sm" data-a="nav" data-v="museum">Trap Hunt</button><button class="btn sm" data-a="immersionToday">Humanities Immersion</button><button class="btn sm" data-a="nav" data-v="scribe">Writing</button></div><p class="muted" style="font-size:12.5px;margin-top:10px">Library: ${LIB.lr.length} LR questions, ${LIB.pass.length} passages (${LIB.rc.length} RC questions), ${(CURR.forgeItems||[]).length} logic drills.</p></div></div>

   ${ev||(wkDone()&&!WK().claimed)?`<div class="card"><h3>Events</h3><div class="col" style="margin-top:10px;gap:10px">${ev?`<div class="row between"><span>${esc(ev.name)}</span><span class="tag">${Math.round(EVENT_BONUS*100)}% more grit, ${evDaysLeft(ev)}d left</span></div><button class="btn sm" data-a="nav" data-v="outfitter">See event gear</button>`:''}${wkDone()&&!WK().claimed?`<button class="btn sm gold" data-a="nav" data-v="outfitter">Claim your Expedition crest</button>`:''}</div></div>`:''}</div></details></section>`};
function recommendation(){const a=A.length;if(!a&&!(S.profile.miniDiag))return{title:'Run the Mini Diagnostic',why:'Twelve questions seed the adaptive engine with your real starting point. It is rough, so the official LawHub diagnostic still matters.',cta:'Start Mini Diagnostic',a:'miniDiag'};
  const w=lrTypesAvail().sort((x,y)=>mastery(x)-mastery(y))[0];const t=(CURR.towers||[]).find(x=>(x.types||[]).includes(w));
  if(!S.forge.conditional||!S.forge.conditional.cleared)return{title:'Forge: conditional logic',why:'Sufficient and necessary conditions sit under Inference, Assumption and Flaw questions. Clear this module early.',cta:'Open the Forge',a:'nav',v:'forge'};
  if(t&&!towerState(t.id).lesson)return{title:'Read the '+t.name+' lesson',why:w+' is your weakest skill. The lesson is under 400 words and opens the guided floor.',cta:'Enter tower',a:'nav',v:'tower',p:t.id};
  if(passageStats('humanities').n<3)return{title:'A humanities passage',why:'Humanities is your weakest reading area. One passage a day builds comfort with abstract prose.',cta:'Open Humanities Island',a:'nav',v:'island',p:'humanities'};
  return{title:'Climb the '+(t?t.name:'weakest')+' tower',why:'Your weakest skill gets the most return per minute right now.',cta:'Enter tower',a:'nav',v:'tower',p:t?t.id:'weaken'}}
function onboardingHTML(){const p=S.profile;return`<div class="stack" style="max-width:860px"><div><div class="eyebrow">Base Camp</div><h1 class="disp" style="margin:6px 0">Ascent to 180</h1><p class="read" style="font-size:18px;max-width:62ch">A training system for one climber. Every question you answer moves a rating; every miss becomes a flashcard; every week ends with a report. Setup takes under three minutes.</p></div>

function onboardSave(){const sc=+($('#dgS')||{}).value||0;const l1=+($('#dgL1')||{}).value||0,l2=+($('#dgL2')||{}).value||0,r=+($('#dgR')||{}).value||0;if(sc){S.realTests.push({id:rid(),date:dayKey(),pt:'Diagnostic',format:'current',scaled:sc,sections:[{type:'LR',raw:l1,total:25,misses:{},notes:''},{type:'LR',raw:l2,total:25,misses:{},notes:''},{type:'RC',raw:r,total:27,misses:{},notes:''}]});S.profile.diagDone=true}S.profile.onboarded=true;seedConceptCards();addXP(20);checkAch();saveNow()}

ACT.miniDiag=()=>{const types=['Weaken','Strengthen','Flaw','Must Be True','Most Strongly Supported','Necessary Assumption','Sufficient Assumption','Main Conclusion','Paradox'];const ex=new Set();const items=[];for(const t of types){const q=pickQs(LIB.byType[t]||[],1,{exclude:ex})[0];if(q){ex.add(q);items.push(q)}}const p=pickPassage({});const rcq=p?passQs(p).slice(0,3):[];
  startSession({kind:'diag',title:'Mini Diagnostic',steps:[{type:'set',set:makeSet({label:'Mini Diagnostic: Logical Reasoning',mode:'blind',items,noBR:true})},{type:'set',set:makeSet({label:'Mini Diagnostic: Reading',mode:'blind',items:rcq,noBR:true})},{type:'results'}],meta:{diag:1}})};

VIEWS.map=()=>`<div class="stack"><div><div class="eyebrow">World Map</div><h1 class="disp">The mountain, ring by ring</h1><p class="sub" style="max-width:70ch;margin-top:6px">Zones read from the summit down. Rings fill with mastery, not with time spent.</p></div><div class="col">${zoneProgress().map(([id,name,why,p])=>`<button class="mapzone ${zoneLocked(id)?'locked':''}" data-a="nav" data-v="${id}">${ringSVG(p,52,name)}<div><div class="disp" style="font-size:22px">${esc(name)}</div><div class="sub" style="font-size:13.5px">${esc(why)}</div></div><span class="pill ${zoneLocked(id)?'':'gold'}">${zoneLocked(id)?'Locked':'Enter'}</span></button>`).join('')}</div></div>`;

function lessonHTML(L){if(!L)return'';let h='<div class="prose">';if(L.task)h+=`<p><b>The task.</b> ${fmtText(L.task)}</p>`;if(L.method)h+=`<h4>Method</h4><ol>${L.method.map(m=>`<li>${fmtText(m)}</li>`).join('')}</ol>`;if(L.predict)h+=`<h4>Predict</h4><p>${fmtText(L.predict)}</p>`;if(L.correct)h+=`<h4>What the right answer looks like</h4><p>${fmtText(L.correct)}</p>`;if(L.traps)h+=`<h4>Wrong-answer patterns</h4><ul>${L.traps.map(m=>`<li>${fmtText(m)}</li>`).join('')}</ul>`;if(L.speed)h+=`<h4>Speed tip</h4><p>${fmtText(L.speed)}</p>`;if(L.errors)h+=`<h4>Your three most likely errors</h4><ol>${L.errors.map(m=>`<li>${fmtText(m)}</li>`).join('')}</ol>`;if(L.body)h+=L.body.map(p=>`<p>${fmtText(p)}</p>`).join('');if(L.example)h+=`<h4>Worked example</h4><div class="callout"><p>${fmtText(L.example.stim)}</p><p style="margin-top:6px"><b>${fmtText(L.example.q)}</b></p><p style="margin-top:6px">${fmtText(L.example.walk)}</p></div>`;return h+'</div>'}

VIEWS.citadel=()=>{const tw=CURR.towers||[];const cleared=tw.filter(t=>towerState(t.id).cleared).length;const adv=cleared>=4;
  return`<div class="stack"><div><div class="eyebrow">Citadel of Reasoning</div><h1 class="disp">One tower per question type</h1><p class="sub" style="max-width:72ch;margin-top:6px">Logical Reasoning is about two thirds of the scored test. Each tower has five floors: Lesson, Guided Practice, Independent Practice with Blind Review, a Timed Trial, and the Guardian. Any tower can be skipped with a Challenge Out at 80%.</p></div>
  <div class="grid g3">${tw.map(t=>{const ts=towerState(t.id);const m=towerMastery(t);const n=towerPool(t).length;const fl=[ts.lesson,ts.f2,ts.f3&&ts.f3.c/ts.f3.n>=.6,ts.f4&&ts.f4.c/ts.f4.n>=.6,ts.f5&&ts.f5.passed];
    return`<div class="card"><div class="row between"><div class="disp" style="font-size:22px">${esc(t.name)}</div>${ts.cleared?'<span class="pill volt">Cleared</span>':t.prio?`<span class="pill gold">Priority ${t.prio}</span>`:''}</div><div class="row between" style="margin:8px 0 4px"><span class="tag">${tierName(towerKeys(t)[0])} · mastery ${m}</span><span class="tag">${n} questions</span></div>${meter(m)}<div class="row" style="gap:5px;margin:10px 0">${fl.map((f,i)=>`<span class="pill ${f?'volt':''}" title="Floor ${i+1}">${i+1}</span>`).join('')}</div><button class="btn sm primary" data-a="nav" data-v="tower" data-p="${t.id}">Enter tower</button></div>`}).join('')}</div>
  <div class="card"><div class="row between"><h3>Advanced Citadel</h3><span class="pill ${adv?'volt':''}">${adv?'Open':'Opens after 4 towers are cleared ('+cleared+'/4)'}</span></div><div class="grid g3" style="margin-top:10px">${[['siege','Mixed Siege','Random types. Name the type in 10 seconds, then solve.'],['diffclimb','Difficulty Climb','Only 4 and 5-star questions.'],['lastfive','The Last Five','The hard end of a section, with a skip discipline.'],['armor','Language Armor','The densest stimuli in your library.'],['nopred','No Prediction Allowed','Choices stay hidden until you write a prediction.']].map(([id,n,d])=>`<div class="card flat"><h3>${n}</h3><p class="sub" style="font-size:13px;margin:4px 0 10px">${d}</p><button class="btn sm" data-a="advanced" data-v="${id}" ${adv?'':'disabled'}>Start</button></div>`).join('')}</div></div></div>`};
VIEWS.tower=id=>{const t=(CURR.towers||[]).find(x=>x.id===id)||(CURR.towers||[])[0];if(!t)return'';const ts=towerState(t.id);const pool=towerPool(t);const m=towerMastery(t);const L=(CURR.lessons||{})[t.id];
  const f=(n,title,desc,open,done,act)=>`<div class="card ${open?'':'flat'}"><div class="row between"><div><div class="eyebrow">Floor ${n}</div><h3 class="disp" style="font-size:22px">${title}</h3></div>${done?'<span class="pill volt">Done</span>':open?'':'<span class="pill">Locked</span>'}</div><p class="sub" style="font-size:13.5px;margin:6px 0 10px">${desc}</p>${act&&open?act:''}</div>`;
  const r=k=>ts[k]?` Best ${ts[k].c}/${ts[k].n}.`:'';
  return`<div class="stack"><div class="row between"><div><button class="btn sm ghost" data-a="nav" data-v="citadel">Citadel</button><h1 class="disp" style="margin-top:6px">${esc(t.name)}</h1><p class="sub">${tierName(towerKeys(t)[0])} · mastery ${m} · ${pool.length} questions in your library</p></div><button class="btn" data-a="towerRun" data-v="${t.id}" data-f="challenge">Challenge Out (80%)</button></div>
  <div class="card"><div class="row between"><h3>Floor 1 · The Lesson</h3>${ts.lesson?'<span class="pill volt">Read</span>':''}</div>${lessonHTML(L)}${t.id==='weaken'?hierarchyHTML():''}${t.id==='flaw'?`<p style="margin-top:10px"><button class="btn sm" data-a="nav" data-v="flaws">Open the Flaw Catalog</button></p>`:''}${!ts.lesson?`<button class="btn primary" style="margin-top:12px" data-a="lessonRead" data-v="${t.id}">I have read it. Open Floor 2.</button>`:''}</div>
  <div class="grid g2">${f(2,'Guided Practice','6 to 10 questions with step prompts and instant feedback.'+r('f2'),ts.lesson,!!ts.f2,`<button class="btn primary sm" data-a="towerRun" data-v="${t.id}" data-f="2">Start</button>`)}
  ${f(3,'Independent Practice','10 to 15 untimed questions, confidence ratings, Blind Review. 60% opens Floor 4.'+r('f3'),!!ts.f2,ts.f3&&ts.f3.c/ts.f3.n>=.6,`<button class="btn primary sm" data-a="towerRun" data-v="${t.id}" data-f="3">Start</button>`)}
  ${f(4,'Timed Trial','8 to 10 questions at test pace. 60% opens the Guardian.'+r('f4'),ts.f3&&ts.f3.c/ts.f3.n>=.6,ts.f4&&ts.f4.c/ts.f4.n>=.6,`<button class="btn primary sm" data-a="towerRun" data-v="${t.id}" data-f="4">Start</button>`)}
  ${f(5,'The Guardian','8 to 12 hard questions under time with a twist: '+esc(twistName(t.twist))+'. 70% clears the tower.'+r('f5'),ts.f4&&ts.f4.c/ts.f4.n>=.6,ts.f5&&ts.f5.passed,`<button class="btn gold sm" data-a="towerRun" data-v="${t.id}" data-f="5">Face the Guardian</button>`)}</div>
  ${pool.length<10?`<div class="banner warn">This tower has ${pool.length} questions in your library, so floors run short. Ask Claude for the matching pack (see Library) to fill it out.</div>`:''}</div>`};
function twistName(t){return{predict:'No Prediction Allowed',nochange:'No Second Looks',clock:'Clockwork, 75 seconds each',blackout:'Blackout clock',wager:'Confidence Wager'}[t]||'Clockwork'}
function hierarchyHTML(){const H=CURR.hierarchy||[];return`<div class="card flat" style="margin-top:14px"><h3>The Weakener Hierarchy</h3><p class="sub" style="font-size:13.5px;margin:4px 0 10px">Your five levels, from the flashcards you built earlier. When two answers both weaken, the higher level wins. "Weaker" is not "wrong": a Level 4 answer is wrong only when a Level 1 to 3 answer is on the page.</p><div class="col">${H.map(h=>`<div class="row" style="align-items:flex-start;gap:12px"><span class="pill gold mono" style="min-width:58px;justify-content:center">L${h.level}</span><div><b>${esc(h.name)}</b><div class="sub" style="font-size:14px">${esc(h.desc)}</div><div class="muted" style="font-size:13px">Example: ${esc(h.ex)}</div></div></div>`).join('')}</div></div>`}

ACT.towerRun=(v,el)=>{const t=(CURR.towers||[]).find(x=>x.id===v);const fl=el.dataset.f;const pool=towerPool(t);if(!pool.length){toast('No questions for this tower yet. Import its pack from the Library.');return}
  let o;if(fl==='challenge')o={label:'Challenge Out',mode:'timed',items:pickQs(pool,8,{challenge:true}),timeLimit:8*85,noBR:true};

  else{const it=pickQs(pool,10,{challenge:true,minStars:3});const items=it.length>=4?it:pickQs(pool,10,{challenge:true});o={label:'Floor 5 · Guardian',mode:'boss',items,twist:t.twist||'clock',timeLimit:t.twist==='clock'?null:Math.round(items.length*80),perQ:t.twist==='clock'?75:null}}
  runSet(t.name+' tower',o,{kind:'tower',tower:t.id,floor:fl==='challenge'?'challenge':+fl})};

ACT.freePractice=()=>{openModal(`<h2 class="disp" style="font-size:26px">Free Practice</h2><div class="grid g2" style="margin-top:10px"><label class="f">Type<select id="fpType"><option value="">Any LR type</option>${lrTypesAvail().sort().map(t=>`<option>${esc(t)}</option>`).join('')}</select></label><label class="f">Difficulty<select id="fpDiff"><option value="0">Adaptive</option>${[1,2,3,4,5].map(n=>`<option value="${n}">${n} star and up</option>`).join('')}</select></label><label class="f">Questions<input id="fpN" type="number" min="1" max="30" value="8"></label><label class="f">Mode<select id="fpMode"><option value="blind">Untimed with Blind Review</option><option value="timed">Timed (85 s each)</option><option value="guided">Guided, instant feedback</option></select></label></div><div class="row" style="margin-top:14px"><button class="btn primary" data-a="fpGo">Start</button><button class="btn" data-a="closeModal">Cancel</button></div>`)};

let FR=null;
function forgeName(id){const m=(CURR.forge||[]).find(x=>x.id===id);return m?m.name:id}
VIEWS.forge=()=>{if(FR)return forgeRunHTML();const mods=CURR.forge||[];return`<div class="stack"><div><div class="eyebrow">Logic Forge</div><h1 class="disp">Formal logic, struck into reflex</h1><p class="sub" style="max-width:72ch;margin-top:6px">Seven short modules. Each has a lesson and a timed drill. A module is cleared at 80% in one run. The ideas here sit under Inference, Assumption, Flaw and Parallel questions.</p></div>
  <div class="grid g2">${mods.map(m=>{const st=S.forge[m.id]||{};const n=(CURR.forgeItems||[]).filter(f=>f.module===m.id).length;return`<div class="card"><div class="row between"><div class="disp" style="font-size:22px">${esc(m.name)}</div>${st.cleared?'<span class="pill volt">Cleared</span>':''}</div><p class="sub" style="font-size:13.5px;margin:6px 0 10px">${esc(m.blurb)}</p><div class="row"><button class="btn sm" data-a="nav" data-v="forgeLesson" data-p="${m.id}">Lesson</button><button class="btn sm primary" data-a="forgeGo" data-v="${m.id}" ${n?'':'disabled'}>Drill (${n})</button>${st.best!=null?`<span class="tag">best ${st.best}%</span>`:''}</div></div>`}).join('')}</div>
  <div class="card flat"><h3>Necessary or Sufficient? Speed round</h3><p class="sub" style="font-size:13.5px;margin:6px 0 10px">Mixed conditional items, 20 seconds each.</p><button class="btn sm" data-a="forgeGo" data-v="speed">Start speed round</button></div></div>`};
VIEWS.forgeLesson=id=>{const m=(CURR.forge||[]).find(x=>x.id===id)||{};return`<div class="stack" style="max-width:900px"><button class="btn sm ghost" data-a="nav" data-v="forge" style="align-self:flex-start">Logic Forge</button><h1 class="disp">${esc(m.name||'')}</h1><div class="card">${lessonHTML(m.lesson)}<div class="row" style="margin-top:14px"><button class="btn primary" data-a="forgeGo" data-v="${esc(id)}">Drill this module</button></div></div></div>`};
ACT.forgeGo=v=>{let items=(CURR.forgeItems||[]).filter(f=>v==='speed'?(f.module==='conditional'||f.module==='necsuff'):f.module===v);items=shuffle(items).slice(0,v==='speed'?12:10);if(!items.length)return;S.forge[v]=S.forge[v]||{};if(v!=='speed')S.forge[v].lesson=true;FR={mod:v,items:items.map(f=>f.id),i:0,pick:null,ok:0,start:now(),secs:v==='speed'?20:null};go('forge')};
function forgeRunHTML(){const f=(CURR.forgeItems||[]).find(x=>x.id===FR.items[FR.i]);if(!f){const p=pct(FR.ok,FR.items.length);return`<div class="card" style="max-width:720px"><div class="eyebrow">${esc(forgeName(FR.mod))}</div><h2 class="disp" style="margin:6px 0">${FR.ok}/${FR.items.length} · ${p}%</h2><p class="sub">${p>=80?'Module cleared. The pattern is becoming reflex.':'Below 80%. Reread the lesson section for the items you missed, then run it again.'}</p><div class="row" style="margin-top:12px"><button class="btn primary" data-a="forgeEnd">Back to the Forge</button><button class="btn" data-a="forgeGo" data-v="${esc(FR.mod)}">Run again</button></div></div>`}
  const lim=FR.secs||f.seconds||45;const left=Math.max(0,lim-(now()-FR.start)/1000);
  return`<div class="card" style="max-width:780px"><div class="row between"><span class="eyebrow">${esc(forgeName(f.module))} · ${FR.i+1}/${FR.items.length}</span><span class="timer" id="forgeT">${fmtClock(left)}</span></div><div class="bigq" style="margin:12px 0">${esc(f.prompt)}</div><div class="col">${f.options.map((o,i)=>`<button class="opt ${FR.pick!=null?(i===f.answer?'right':(i===FR.pick?'wrong':'')):''}" data-a="forgePick" data-v="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>${FR.pick!=null?`<div class="callout v" style="margin-top:12px">${esc(f.explain)}</div><button class="btn primary" style="margin-top:12px" data-a="forgeNext">Next</button>`:''}</div>`}
ACT.forgePick=v=>{if(FR.pick!=null)return;FR.pick=+v;const f=(CURR.forgeItems||[]).find(x=>x.id===FR.items[FR.i]);const ok=+v===f.answer;if(ok){FR.ok++;addXP(3)}sfx(ok?'ok':'bad');rateUpdate('F:'+f.module,STAR_D[f.difficulty||2],ok,0,.7);render()};
ACT.forgeNext=()=>{FR.i++;FR.pick=null;FR.start=now();if(FR.i>=FR.items.length){const p=pct(FR.ok,FR.items.length);if(FR.mod!=='speed'){const st=S.forge[FR.mod];st.best=Math.max(st.best||0,p);st.runs=(st.runs||0)+1;if(p>=80&&!st.cleared){st.cleared=true;toast('Module cleared: '+forgeName(FR.mod),'gold')}}checkAch();saveSoon()}render()};
ACT.forgeEnd=()=>{FR=null;render()};
setInterval(()=>{const el=$('#forgeT');if(el&&FR&&FR.pick==null){const f=(CURR.forgeItems||[]).find(x=>x.id===FR.items[FR.i]);if(!f)return;const lim=FR.secs||f.seconds||45;const left=lim-(now()-FR.start)/1000;el.textContent=fmtClock(left);if(left<=0){FR.pick=-1;sfx('bad');render()}}const ft=$('#flashT');if(ft&&S&&S.active&&S.active.warm){const w=S.active.warm;const f=(CURR.forgeItems||[]).find(x=>x.id===w.flash);if(f&&w.fpick==null){const left=(f.seconds||60)-(now()-w.fstart)/1000;ft.textContent=fmtClock(left);if(left<=0){w.fpick=-1;render()}}}const bt=$('#breakT');if(bt){const st=curStep();if(st&&st.type==='break'){const left=(st.secs||600)-(now()-st.start)/1000;bt.textContent=fmtClock(left);if(left<=0)nextStep()}}},500);

  ${k==='humanities'?`<div class="card flat"><h3>Humanities Hurdle</h3><p class="sub" style="font-size:13.5px;margin:6px 0 10px">Boss series: back-to-back humanities passages under time. Opens after you finish two humanities passages.</p><button class="btn sm gold" data-a="hurdle" ${passageStats('humanities').n>=2?'':'disabled'}>Start the Hurdle</button></div>`:''}</div>`};
ACT.passGo=(v,el)=>{const m=el.dataset.m;const items=passQs(v);runSet(LIB.P[v].title,{label:m==='timed'?'Passage · 8:45':'Passage · untimed, margin notes',mode:m==='timed'?'timed':'blind',items,timeLimit:m==='timed'?525:null,margin:m!=='timed'},{kind:'passage',passage:v},m!=='timed'?[{type:'margins',p:v}]:[])};
ACT.hurdle=()=>{const ids=LIB.pass.filter(id=>passKind(LIB.P[id])==='humanities');const pick=shuffle(ids).slice(0,3);const steps=pick.map((p,i)=>({type:'set',set:makeSet({label:'Hurdle '+(i+1)+': '+LIB.P[p].title,mode:'timed',items:passQs(p),timeLimit:525})}));steps.push({type:'results'});startSession({kind:'hurdle',title:'Humanities Hurdle',steps,meta:{}})};
ACT.logReading=()=>{const t=($('#rlT')||{}).value||'';const m=+($('#rlM')||{}).value||0;if(!t.trim()||!m){toast('Add a title and minutes.');return}S.readingLog.push({d:dayKey(),title:t.trim(),min:m});addXP(Math.min(30,Math.round(m/2)));saveSoon();render()};
function pacingRC(){const fmt=S.settings.format;const tot=fmt==='new'?52*60:35*60;const n=fmt==='new'?6:4;const per=tot/n;let marks='';for(let i=1;i<=n;i++){const x=40+(i/n)*560;marks+=`<line x1="${x}" x2="${x}" y1="26" y2="46" stroke="var(--line2)"/><text x="${x}" y="62" text-anchor="middle">${fmtClock(per*i)}</text><text x="${x-280/n}" y="20" text-anchor="middle">P${i}</text>`}
  return`<svg class="chart" viewBox="0 0 640 72" role="img" aria-label="Reading Comprehension pacing: ${n} passages in ${tot/60} minutes, about ${fmtClock(per)} each"><rect x="40" y="30" width="560" height="12" rx="4" fill="var(--seq1)"/>${marks}<text x="40" y="62" text-anchor="middle">0:00</text></svg><p class="sub" style="font-size:13.5px;margin-top:6px">${fmt==='new'?'New format':'Current format'}: about ${fmtClock(per)} per passage including questions. Read with notes for 3 to 4 minutes, then about 40 to 60 seconds per question. If a passage passes its mark, guess, flag and move.</p>`}

/* ---------- Immersion and dense drills ---------- */
let IM=null;
ACT.immersionToday=()=>{const all=CURR.immersion||[];if(!all.length)return;const done=S.drafts.immersion||{};const next=all.find(x=>!done[x.id])||all[dayNum()%all.length];IM={id:next.id,qi:0,pick:null,ok:0,mode:'read'};go('immersion')};
VIEWS.immersion=()=>{if(!IM)return VIEWS.archipelago();const it=(CURR.immersion||[]).find(x=>x.id===IM.id);if(!it)return'';
  const q=it.qs[IM.qi];return`<div class="grid g2"><div class="card"><div class="eyebrow">Humanities Immersion</div><h2 class="disp" style="margin:6px 0 10px">${esc(it.title)}</h2><div class="stim">${esc(it.text)}</div></div><div class="card">${q?`<div class="eyebrow">Question ${IM.qi+1} of ${it.qs.length}</div><div class="stem" style="margin:8px 0 10px">${esc(q.stem)}</div><div class="col">${q.options.map((o,i)=>`<button class="opt ${IM.pick!=null?(i===q.answer?'right':(i===IM.pick?'wrong':'')):''}" data-a="imPick" data-v="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>${IM.pick!=null?`<div class="callout v" style="margin-top:10px">${esc(q.explain)}</div><button class="btn primary" style="margin-top:10px" data-a="imNext">${IM.qi<it.qs.length-1?'Next':'Finish'}</button>`:''}`:`<h3>Done: ${IM.ok}/${it.qs.length}</h3><p class="sub" style="margin:6px 0 12px">Model paraphrase: ${esc(it.para||'')}</p><button class="btn primary" data-a="imEnd">Back to the Archipelago</button>`}</div></div>`};
ACT.imPick=v=>{if(IM.pick!=null)return;IM.pick=+v;const it=(CURR.immersion||[]).find(x=>x.id===IM.id);const ok=+v===it.qs[IM.qi].answer;if(ok){IM.ok++;addXP(4)}rateUpdate('P:humanities',1000,ok,0,.35);sfx(ok?'ok':'bad');render()};
ACT.imNext=()=>{IM.qi++;IM.pick=null;const it=(CURR.immersion||[]).find(x=>x.id===IM.id);if(IM.qi>=it.qs.length){S.drafts.immersion=S.drafts.immersion||{};S.drafts.immersion[IM.id]=dayKey();checkAch();saveSoon()}render()};
ACT.imEnd=()=>{IM=null;go('archipelago')};
let DN=null;
ACT.denseGo=()=>{const all=CURR.immersion||[];const it=all[Math.floor(Math.random()*all.length)];DN={id:it.id,shown:false};go('dense')};
VIEWS.dense=()=>{if(!DN)return VIEWS.archipelago();const it=(CURR.immersion||[]).find(x=>x.id===DN.id);return`<div class="grid g2"><div class="card"><div class="eyebrow">Dense-text drill</div><h2 class="disp" style="margin:6px 0">${esc(it.title)}</h2><div class="stim">${esc(it.text)}</div></div><div class="card"><label class="f">Your paraphrase, plain words, two or three sentences<textarea id="dnTx" rows="6" placeholder="The author claims... because... but...">${esc((S.drafts.dense||{})[it.id]||'')}</textarea></label><button class="btn primary" style="margin-top:10px" data-a="denseShow">Compare with the model</button>${DN.shown?`<div class="callout v" style="margin-top:12px"><b>Model.</b> ${esc(it.para)}</div><p class="sub" style="margin-top:8px">Check three things: did you keep the author's own position separate from views reported, the strength of the claim, and any both/and tension?</p><button class="btn" style="margin-top:8px" data-a="denseEnd">Done</button>`:''}</div></div>`};
ACT.denseShow=()=>{const t=($('#dnTx')||{}).value||'';S.drafts.dense=S.drafts.dense||{};S.drafts.dense[DN.id]=t;DN.shown=true;if(t.trim().length>30)addXP(6);saveSoon();render()};
ACT.denseEnd=()=>{DN=null;go('archipelago')};

/* ---------- Trap Museum ---------- */
VIEWS.museum=()=>{const T=CURR.traps||[];const grp=g=>T.filter(t=>t.group===g);const cnt=c=>LIB?[...LIB.lr,...LIB.rc].filter(id=>isQ(id)&&trapKeys(LIB.Q[id]).includes(c)).length:0;
  const tile=t=>`<button class="mapzone" style="grid-template-columns:minmax(0,1fr) auto" data-a="nav" data-v="exhibit" data-p="${t.code}"><div><div class="disp" style="font-size:20px">${esc(t.name)}</div><div class="sub" style="font-size:13px">${esc(t.short)}</div></div><div class="col" style="align-items:flex-end;gap:4px">${S.museum[t.code]?'<span class="pill volt">Visited</span>':'<span class="pill">New</span>'}${hazardLine(t.code)}<span class="tag">${cnt(t.code)} specimens in your library</span></div></button>`;
  return`<div class="stack"><div><div class="eyebrow">Trap Museum</div><h1 class="disp">Every way a wrong answer lies</h1><p class="sub" style="max-width:72ch;margin-top:6px">Each exhibit explains one wrong-answer archetype, shows a specimen from your library, and runs a Trap Hunt: answer the question, then name which choice was the trap. Your documented RC traps are first.</p></div><h3>Reading Comprehension wing</h3><div class="grid g2">${grp('RC').map(tile).join('')}</div><h3>Logical Reasoning wing</h3><div class="grid g2">${grp('LR').map(tile).join('')}</div></div>`};
VIEWS.exhibit=code=>{const t=(CURR.trapIndex||{})[code];if(!t)return VIEWS.museum();if(!S.museum[code]){S.museum[code]=now();checkAch();saveSoon()}const ids=[...LIB.lr,...LIB.rc].filter(id=>isQ(id)&&trapKeys(LIB.Q[id]).includes(code));const sp=ids[0]?LIB.Q[ids[0]]:null;let L=null;if(sp)for(const k of LET){if(String((sp.explanation.why_wrong[k]||{}).trap||'').includes(code)){L=k;break}}
  return`<div class="stack" style="max-width:980px"><button class="btn sm ghost" data-a="nav" data-v="museum" style="align-self:flex-start">Trap Museum</button><h1 class="disp">${esc(t.name)}</h1><div class="card"><div class="prose"><p>${fmtText(t.long)}</p><h4>How to spot it</h4><p>${fmtText(t.spot)}</p><h4>How it sounds</h4><ul>${(t.sounds||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div></div>
  ${sp?`<div class="card"><h3>Specimen</h3><p class="muted" style="font-size:13px;margin-bottom:8px">From ${esc(sp.id)} (${esc(sp.type)}). Choice ${L} carries the trap.</p>${sp.section==='RC'?`<p class="sub">From the passage "${esc(LIB.P[sp.passage].title)}".</p>`:`<div class="stim" style="font-size:16px">${esc(sp.stimulus)}</div>`}<div class="stem" style="margin:10px 0">${esc(sp.stem)}</div><div class="ch wrong" style="cursor:default"><span class="L">${L}</span><span class="tx">${esc(sp.choices[L])}<br><span class="sub" style="font-family:var(--f-ui);font-size:13.5px">${esc(sp.explanation.why_wrong[L].text)}</span></span><span></span></div></div>`:`<div class="banner">No specimen of this trap in your library yet.</div>`}
  <div class="row"><button class="btn primary" data-a="trapHunt" data-v="${code}" ${ids.length?'':'disabled'}>Trap Hunt (${Math.min(8,ids.length)} questions)</button></div></div>`};
ACT.trapHunt=v=>{const ids=[...LIB.lr,...LIB.rc].filter(id=>isQ(id)&&trapKeys(LIB.Q[id]).includes(v));const items=shuffle(ids).slice(0,8);runSet('Trap Hunt: '+trapName(v),{label:'Trap Hunt · '+trapName(v),mode:'guided',items,trap:v},{kind:'trap'})};

/* ---------- Clock Tower ---------- */
VIEWS.clock=()=>{const fmt=S.settings.format;const C=CURR.clock||{};return`<div class="stack"><div><div class="eyebrow">Clock Tower</div><h1 class="disp">Time is a skill</h1><p class="sub" style="max-width:72ch;margin-top:6px">Showing the <b>${fmt==='new'?'new (August 2027 onward)':'current (through June 2027)'}</b> format. Switch in Preferences.</p></div>
  <div class="grid g2"><div class="card"><h3>Logical Reasoning pace</h3>${pacingLR()}</div><div class="card"><h3>Reading pace</h3>${pacingRC()}</div></div>
  <div class="card"><h3>Skip-and-return protocol</h3>${lessonHTML(C.skip)}</div>
  <div class="grid g2"><div class="card"><h3>Raw versus scaled</h3>${lessonHTML(C.scoring)}</div><div class="card"><h3>The cost of a miss</h3><p class="sub" style="font-size:13.5px;margin:4px 0 8px">Approximate, from a typical conversion curve. Every official PrepTest publishes its own curve, and the Logbook uses your real ones.</p>${costTable()}</div></div>
  <div class="card"><h3>Drills</h3><div class="grid g4" style="margin-top:10px">${[['pace','Pace Trainer','8 LR in 11:00'],['sprint','Passage Sprint','1 passage in 8:45'],['speed','Speed Run','10 questions, 60 s each'],['lastfive','The Last Five','5 hard ones, 9:00, skip discipline']].map(([id,n,d])=>`<div class="card flat"><h3>${n}</h3><p class="sub" style="font-size:13px;margin:4px 0 10px">${d}</p><button class="btn sm primary" data-a="clockDrill" data-v="${id}">Start</button></div>`).join('')}</div></div></div>`};
function pacingLR(){const fmt=S.settings.format;const tot=fmt==='new'?45*60:35*60;const n=fmt==='new'?32:25;const cps=fmt==='new'?[[10,9*60],[20,22*60],[26,32*60],[32,45*60]]:[[10,9*60+30],[20,23*60],[25,35*60]];
  const x=s=>40+s/tot*560;return`<svg class="chart" viewBox="0 0 640 80" role="img" aria-label="Logical Reasoning checkpoints"><rect x="40" y="34" width="560" height="12" rx="4" fill="var(--seq1)"/>${cps.map(([q,s])=>`<line x1="${x(s)}" x2="${x(s)}" y1="28" y2="52" stroke="var(--ink2)"/><text x="${x(s)}" y="22" text-anchor="middle">Q${q}</text><text x="${x(s)}" y="68" text-anchor="middle">${fmtClock(s)}</text>`).join('')}<text x="40" y="68" text-anchor="middle">0:00</text></svg><p class="sub" style="font-size:13.5px;margin-top:6px">${n} questions in ${tot/60} minutes, about ${Math.round(tot/n)} seconds each on average. Bank the first ten at 50 to 60 seconds, run the middle at about 85, and give the hardest five the time you banked. Hard maximum per question: 2:30, then flag, guess, move.</p>`}
function costTable(){let rows='';for(let m=0;m<=14;m++){const s=scaledFromRaw(77-m);const s2=scaledFromRaw(76-m);rows+=`<tr><td class="mono">-${m}</td><td class="mono">${s}</td><td class="mono">${m<14?(s-s2?'-'+(s-s2):'0'):''}</td></tr>`}return`<div class="scroll"><table class="t"><tr><th>Misses</th><th>About</th><th>Next miss costs</th></tr>${rows}</table></div>`}
ACT.clockDrill=v=>{if(v==='pace'){const it=pickQs(LIB.lr,8);runSet('Pace Trainer',{label:'Pace Trainer · 8 in 11',mode:'timed',items:it,timeLimit:660},{kind:'trial'})}else if(v==='sprint'){const p=pickPassage({humanities:true});if(!p)return toast('No passages yet.');runSet('Passage Sprint',{label:'Passage Sprint · 8:45',mode:'timed',items:passQs(p),timeLimit:525},{kind:'trial'})}else if(v==='speed')ACT.speedRun();else ACT.advanced('lastfive')};

/* ---------- Gauntlet ---------- */
VIEWS.gauntlet=()=>{const fmt=S.settings.format;const lrN=fmt==='new'?32:25,lrT=fmt==='new'?45:35,rcN=fmt==='new'?6:4,rcT=fmt==='new'?52:35;const avLR=LIB.lr.filter(isQ).length,avP=LIB.pass.length;
  return`<div class="stack"><div><div class="eyebrow">Endurance Gauntlet</div><h1 class="disp">Sections and full tests</h1><p class="sub" style="max-width:72ch;margin-top:6px">${fmt==='new'?'New format: Reading first (52 min, 6 passages), then two Logical Reasoning sections (45 min, 32 questions), with 10-minute breaks after sections one and two.':'Current format: four 35-minute sections (two LR, one RC, one unscored variable), with a 10-minute break between sections two and three.'} Treat every section as scored.</p></div>
  ${avLR<lrN||avP<rcN?`<div class="banner warn">Your library has ${avLR} LR questions and ${avP} passages. Sims run with what you have, at the official time per question, and reuse questions you have seen. Packs 15 and up add full-length original sections.</div>`:''}
  <div class="grid g3"><div class="card"><h3>LR section</h3><p class="sub" style="font-size:13.5px;margin:4px 0 10px">${lrN} questions, ${lrT} minutes.</p><button class="btn primary sm" data-a="sim" data-v="LR">Start</button></div><div class="card"><h3>RC section</h3><p class="sub" style="font-size:13.5px;margin:4px 0 10px">${rcN} passages, ${rcT} minutes.</p><button class="btn primary sm" data-a="sim" data-v="RC">Start</button></div><div class="card"><h3>Full test</h3><p class="sub" style="font-size:13.5px;margin:4px 0 10px">All sections with the real break. About ${fmt==='new'?'2.6':'2.5'} hours.</p><button class="btn gold sm" data-a="sim" data-v="FULL" ${(S.counters.sims||0)>=2?'':'disabled'}>Start</button>${(S.counters.sims||0)<2?'<div class="tag" style="margin-top:6px">Opens after 2 section sims</div>':''}</div></div>
  <div class="card"><h3>Stamina plan</h3>${lessonHTML((CURR.mindIndex||{}).stamina&&(CURR.mindIndex||{}).stamina.lesson)}</div></div>`};
function simLR(n,used){return pickQs(LIB.lr,n,{exclude:used,challenge:true})}
function simRC(np,used){const out=[];const ex=[];for(let i=0;i<np;i++){const p=pickPassage({exclude:ex});if(!p)break;ex.push(p);out.push(...passQs(p))}return out}
ACT.sim=v=>{const fmt=S.settings.format;const used=new Set();
  const lrSet=lab=>{const n=fmt==='new'?32:25;const it=simLR(n,used);it.forEach(x=>used.add(x));return{type:'set',set:makeSet({label:lab,mode:'sim',items:it,timeLimit:Math.round(it.length*(fmt==='new'?84.4:84))})}};
  const rcSet=lab=>{const it=simRC(fmt==='new'?6:4);return{type:'set',set:makeSet({label:lab,mode:'sim',items:it,timeLimit:Math.round(it.length*(fmt==='new'?78:77.8))})}};
  let steps;if(v==='LR')steps=[lrSet('LR section')];else if(v==='RC')steps=[rcSet('RC section')];
  else if(fmt==='new')steps=[rcSet('Section 1 · Reading'),{type:'break',secs:600},lrSet('Section 2 · LR'),{type:'break',secs:600},lrSet('Section 3 · LR')];
  else steps=[lrSet('Section 1 · LR'),rcSet('Section 2 · RC'),{type:'break',secs:600},lrSet('Section 3 · LR'),lrSet('Section 4 · variable')];
  steps.push({type:'results'});startSession({kind:'sim',title:v==='FULL'?'Full test simulation':v+' section simulation',steps,meta:{sim:1,full:v==='FULL',simSection:v}})};

/* ---------- Summit ---------- */
VIEWS.summit=()=>{const open=summitUnlocked();const core=(CURR.towers||[]).filter(t=>t.core);return`<div class="stack"><div><div class="eyebrow">The Summit</div><h1 class="disp">The 180 Trials</h1><p class="sub" style="max-width:72ch;margin-top:6px">Three full-length simulations at your target. The Summit opens when every core skill is Adept or better and you have passed a full simulation at or above your floor of ${S.profile.floor}.</p></div>
  <div class="card"><h3>Conditions</h3><div class="col" style="margin-top:8px">${core.map(t=>`<div class="row between"><span>${esc(t.name)}</span><span class="pill ${towerMastery(t)>=40?'volt':''}">${tierName(towerKeys(t)[0])}</span></div>`).join('')}${['humanities','social_science','natural_science','law'].map(k=>`<div class="row between"><span>${esc(islandName(k))}</span><span class="pill ${mastery('P:'+k)>=40?'volt':''}">${tierName('P:'+k)}</span></div>`).join('')}<div class="row between"><span>Full simulation at ${S.profile.floor} or higher</span><span class="pill ${(S.counters.fullTestBest||0)>=S.profile.floor?'volt':''}">${S.counters.fullTestBest||'not yet'}</span></div></div></div>
  ${open?`<div class="grid g3">${[1,2,3].map(i=>`<div class="card"><h3 class="disp" style="font-size:22px">Trial ${i}</h3><p class="sub" style="font-size:13.5px;margin:4px 0 10px">Full test, real breaks, no pauses.</p><button class="btn gold sm" data-a="trial" data-v="${i}">Begin</button></div>`).join('')}</div>`:''}</div>`};
ACT.trial=v=>{S.counters.trials=Math.max(S.counters.trials||0,+v);ACT.sim('FULL')};

/* ---------- Scribe's Guild ---------- */
let WR=null;
VIEWS.scribe=()=>{if(WR)return writingHTML();const W=CURR.writing||{};return`<div class="stack"><div><div class="eyebrow">Scribe's Guild</div><h1 class="disp">LSAT Argumentative Writing</h1><p class="sub" style="max-width:72ch;margin-top:6px">${fmtText(W.what||'')}</p></div>
  <div class="grid g2"><div class="card"><h3>The approach</h3>${lessonHTML(W.template)}</div><div class="card"><h3>Rubric</h3><div class="col" style="margin-top:8px">${(W.rubric||[]).map(r=>`<div><b>${esc(r.name)}</b><div class="sub" style="font-size:13.5px">${esc(r.desc)}</div></div>`).join('')}</div></div></div>
  <div class="card"><h3>Prompts</h3><div class="scroll"><table class="t" style="margin-top:6px"><tr><th>Prompt</th><th>Done</th><th></th></tr>${(W.prompts||[]).map(p=>`<tr><td><b>${esc(p.title)}</b><div class="sub" style="font-size:13px">${esc(p.scenario.slice(0,140))}...</div></td><td>${S.writing.some(w=>w.pid===p.id)?'<span class="pill volt">Yes</span>':''}</td><td><button class="btn sm primary" data-a="writeGo" data-v="${p.id}">Write</button></td></tr>`).join('')}</table></div></div>
  ${S.writing.length?`<div class="card"><h3>Your responses</h3><div class="scroll"><table class="t">${S.writing.slice().reverse().map((w,i)=>`<tr class="click" data-a="writeView" data-v="${S.writing.length-1-i}"><td>${esc(w.d)}</td><td>${esc(((W.prompts||[]).find(p=>p.id===w.pid)||{}).title||w.pid)}</td><td class="mono">${w.words} words</td><td class="mono">${w.self?sum(Object.values(w.self))+'/25':''}</td></tr>`).join('')}</table></div></div>`:''}</div>`};
ACT.writeGo=v=>{WR={pid:v,phase:'pre',start:now(),pre:{},text:'',self:{},fb:''};go('scribe')};
ACT.writeView=v=>{const w=S.writing[+v];WR=Object.assign({phase:'review'},JSON.parse(JSON.stringify(w)));go('scribe')};
function writingHTML(){const W=CURR.writing||{};const p=(W.prompts||[]).find(x=>x.id===WR.pid);if(!p){WR=null;return''}const lim=WR.phase==='pre'?15*60:35*60;const left=Math.max(0,lim-(now()-WR.start)/1000);const words=(WR.text.trim().match(/\S+/g)||[]).length;

function planPhases(){const start=dayNum();const end=S.profile.testDate?keyToNum(S.profile.testDate):keyToNum('2027-06-05');const total=Math.max(28,end-start);const P=[['Phase 0 · Baseline',.06,'Official diagnostic on LawHub, log it, configure the game.'],['Phase 1 · Foundations',.24,'Logic Forge, the Weaken, Strengthen, Inference and Flaw towers, the Roadmap Method, one humanities passage a day. Three to five sessions a week.'],['Phase 2 · Skill Building',.3,'Remaining towers, all islands, Trap Museum, weekly Timed Trials, a section sim every other week. First official PrepTest in week 6 of this phase.'],['Phase 3 · Timed Mastery',.2,'Speed under accuracy, Guardians, section sims twice a week, an official PrepTest every 7 to 10 days.'],['Phase 4 · Test Simulation',.2,'Full tests weekly under real conditions, review days, a one-week taper with no new material.']];let d=start;return P.map(([n,f,txt])=>{const len=Math.round(total*f);const ph={name:n,from:d,to:d+len,txt};d+=len;return ph})}

function G(){return S.game}

function liveSet(set){return set.mode==='guided'||set.mode==='speed'||!!set.trap}

function stripHTML(set){if(S.settings.focus||set.mode==='sim'||set.phase!=='answer')return'';const n=set.items.length;if(n<2)return'';const need=Math.ceil(n*0.7);const live=liveSet(set);const g=set.g||{mom:0,o2:5};
  const answered=set.items.filter(id=>(set.ans[id]||{}).ch).length;const correct=set.items.filter(id=>{const a=set.ans[id];return a&&a.checked&&a.ok}).length;const prog=live?correct/n:answered/n;
  return`<div class="pitch" id="pitch"><div class="pname">${icon(set.mode==='boss'?'swords':'mountain',16)}<b>${esc(cruxNameForSet(set))}</b><small>${live?`${correct} of ${need} holds to send`:`Blind pitch, ${answered} of ${n} answered. Results at the top.`}</small></div>
  <div class="pbar2" title="${live?'Send line at '+need+' correct':'Rope paid out'}"><i style="width:${(prog*100).toFixed(1)}%"></i>${live?`<em style="left:${(need/n*100).toFixed(1)}%"></em>`:''}</div>
  <div class="o2" title="Oxygen. Each slip costs one bottle.">${live?`<span>O₂</span>${[0,1,2,3,4].map(i=>`<b class="${i<g.o2?'on':''}"></b>`).join('')}`:'<span class="muted">O₂ readings after the pitch</span>'}</div>${live&&g.mom>=2?`<div class="mom">${icon('zap',14)}Momentum ×${g.mom}</div>`:''}</div>`}
function onCheck(set,q,a,ok){const g=set.g||(set.g={mom:0,o2:5,best:0});if(ok){g.mom++;g.best=Math.max(g.best,g.mom);G().bestMom=Math.max(G().bestMom||0,g.best);{const gain=Math.round((2+((q.difficulty||3)>=4?1:0))*gritMul()*10)/10;G().grit+=gain;wkTrack(0,1,0)}floatAt('#choices','+'+(30+(q.difficulty||3)*12)+' m','up');if(g.mom>=3&&g.mom%3===0)sfx('send')}
  else{g.mom=0;g.o2=Math.max(0,g.o2-1);const t=trapOf(q,a.ch);slipFx(t?trapName(t):'')}}

let DQ=[],LVQ=null;
function queueDebrief(set){if(!set||!set.res||set.items.length<3||set.debriefed)return;set.debriefed=1;
  const items=set.items.map(id=>{const q=LIB.Q[id]||{};const a=set.ans[id]||{};const ok=a.ch===q.answer;return{ok,trap:ok||!a.ch?'':trapOf(q,a.ch),blank:!a.ch,d:q.difficulty||3}});
  const n=items.length,c=items.filter(x=>x.ok).length,need=Math.ceil(n*0.7);const s=SES();const tid=s&&s.meta&&s.meta.tower;const boss=set.mode==='boss'&&!!tid;
  let g=liveSet(set)?0:items.reduce((t,x)=>t+(x.ok?2+(x.d>=4?1:0):0),0);const sent=c>=need;if(sent)g+=boss?40:10;const conv=Math.max(0,(set.res.cb||0)-(set.res.c||0));g+=conv*3;
  g=Math.round(g*gritMul());const gg=G();gg.grit+=g;if(sent)gg.sent=(gg.sent||0)+1;wkTrack(sent,0,boss&&sent);if(boss&&sent)gg.cruxSent[tid]=now();
  DQ.push({label:boss?'Crux: '+cruxOf(tid)[0]:set.label,items,n,c,need,sent,boss,grit:g,conv,sim:set.mode==='sim',live:liveSet(set)});saveSoon()}

function profileSVG(d){const W=560,H=150,pad=18;const n=d.items.length;let y=0;const pts=[[pad,H-pad]];const max=Math.max(d.need,d.c,1);const sx=(W-2*pad)/n,sy=(H-2*pad-14)/max;
  d.items.forEach((it,i)=>{if(it.ok)y++;pts.push([pad+(i+1)*sx,H-pad-y*sy])});const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const line=H-pad-d.need*sy;
  const holds=d.items.map((it,i)=>{const p=pts[i+1];return`<g class="hold ${it.ok?'ok':'bad'}" style="--i:${i}"><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${it.ok?4.5:5}"/>${it.ok?'':`<path d="M${(p[0]-3).toFixed(1)} ${(p[1]-3).toFixed(1)}l6 6m0-6l-6 6"/>`}</g>`}).join('');

function showDebrief(d){const slips={};d.items.forEach((it,i)=>{if(!it.ok){const k=it.blank?'Left blank':(it.trap?trapName(it.trap):'Wrong answer');(slips[k]=slips[k]||[]).push(i+1)}});

  const verdict=d.sent?(d.boss?'Crux sent':'Pitch sent'):(d.c/d.n>=0.5?'Turned back below the send line':'Retreat to camp');

/* ---------- hazards: how often each trap catches you ---------- */
let HZ=null,HZn=-1;
function hazardStats(){if(HZ&&HZn===A.length)return HZ;HZ={};HZn=A.length;for(const a of A){const q=LIB.Q[a.q];if(!q)continue;const tk=trapKeys(q);for(const t of tk){const h=HZ[t]||(HZ[t]={dodged:0,caught:0});if(a.tr&&a.tr===t)h.caught++;else h.dodged++}}return HZ}
function hazardLine(code){const h=hazardStats()[code];if(!h||!(h.dodged+h.caught))return'<span class="tag">Not met yet</span>';const rate=h.caught/(h.dodged+h.caught);const lvl=rate>=0.3?'bad':rate>=0.15?'gold':'volt';return`<span class="pill ${lvl}">${rate>=0.3?'High threat':rate>=0.15?'Moderate':'Under control'}</span><span class="tag">Dodged ${h.dodged}, caught you ${h.caught}</span>`}
function topHazards(n){const H=hazardStats();return Object.entries(H).filter(([,h])=>h.caught>0).sort((a,b)=>b[1].caught/(b[1].dodged+b[1].caught+2)-a[1].caught/(a[1].dodged+a[1].caught+2)).slice(0,n)}

const TITLE_TEXT={};CAT.filter(i=>i.cat==='ttl').forEach(i=>TITLE_TEXT[i.key]=i.name);
function byId(id){return CAT.find(i=>i.id===id)}
function inCat(cat){return CAT.filter(i=>i.cat===cat)}
function GE(){const g=G();const e=g.equip||(g.equip={});e.avt=e.avt||'guy';['suit','helm','gog','pack','axe','rope','emote'].forEach(k=>{e[k]=e[k]||'std'});e.o2=e.o2||'none';e.lamp=e.lamp||'ember';e.sky=e.sky||'none';e.acc=e.acc||'gold';e.frm=e.frm||'none';e.flg=e.flg||'dot';e.ttl=e.ttl||'none';return e}
function lifeGrit(){const g=G();return (g.grit||0)+(g.spent||0)}
function cruxCount(){return Object.keys(G().cruxSent||{}).length}
function earnMet(r){if(!r)return false;if(r.crux)return cruxCount()>=r.crux;if(r.life)return lifeGrit()>=r.life;if(r.streak)return (S.streak.best||0)>=r.streak;if(r.crest)return (G().crests||0)>=r.crest;return false}
function earnText(it){const r=it.earn;if(r.crux)return cruxCount()+' of '+r.crux+' cruxes sent';if(r.life)return lifeGrit().toLocaleString('en-US')+' of '+r.life.toLocaleString('en-US')+' lifetime grit';if(r.streak)return 'Best streak '+(S.streak.best||0)+' of '+r.streak+' days';return (G().crests||0)+' of '+r.crest+' Expeditions'}
function owns(id){const it=byId(id);if(!it)return false;return !!G().owned[id]||it.price===0&&!it.earn||earnMet(it.earn)}
function lvOk(it){return levelInfo(S.xp).lv>=(it.lvl||0)}
function itemName(id){const it=byId(id);return it?it.name:id}
function titleOf(){const k=GE().ttl;return k&&k!=='none'?(TITLE_TEXT[k]||''):''}

const EVENTS=[
  {id:'firstsnow',name:'First Snow',from:[10,15],to:[11,5],blurb:'The first storms of the season have reached the high camps.'},
  {id:'solstice',name:'Solstice Vigil',from:[11,14],to:[11,28],blurb:'The longest night of the year. Climb under the aurora.'},
  {id:'newyear',name:'New Year Push',from:[11,29],to:[0,7],blurb:'Start the year above camp. Every pitch pays more.'},
  {id:'thaw',name:'Spring Thaw',from:[2,14],to:[2,28],blurb:'Snow melts and the lower routes open.'},
  {id:'midnightsun',name:'Midnight Sun',from:[5,14],to:[5,28],blurb:'The sun barely sets. Long days on the rock.'},
  {id:'harvest',name:'Harvest Moon',from:[8,16],to:[8,30],blurb:'A low amber moon over the range.'}
];
const EVENT_BONUS=0.2;
function evById(id){return EVENTS.find(e=>e.id===id)}
function evActive(ev,d){d=d||new Date();const k=d.getMonth()*100+d.getDate(),a=ev.from[0]*100+ev.from[1],b=ev.to[0]*100+ev.to[1];return a<=b?(k>=a&&k<=b):(k>=a||k<=b)}
function activeEvent(d){return EVENTS.find(e=>evActive(e,d))||null}
function dayStart(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function evDaysLeft(ev,d){d=dayStart(d||new Date());let e=new Date(d.getFullYear(),ev.to[0],ev.to[1]);if(e<d)e=new Date(d.getFullYear()+1,ev.to[0],ev.to[1]);return Math.round((e-d)/864e5)+1}
function evDaysUntil(ev,d){d=dayStart(d||new Date());let s=new Date(d.getFullYear(),ev.from[0],ev.from[1]);if(s<d)s=new Date(d.getFullYear()+1,ev.from[0],ev.from[1]);return Math.round((s-d)/864e5)}
function nextEvent(d){return EVENTS.filter(e=>!evActive(e,d)).sort((a,b)=>evDaysUntil(a,d)-evDaysUntil(b,d))[0]||null}
function evWhen(id){const ev=evById(id);if(!ev)return 'Event';if(evActive(ev))return ev.name+' now';const n=evDaysUntil(ev);return ev.name+' in '+n+' day'+(n===1?'':'s')}
function gritMul(){return 1+(activeEvent()?EVENT_BONUS:0)}
/* ---------- weekly Expedition ---------- */
const WK_GOALS=[{k:'sent',label:'Send 6 pitches',n:6},{k:'ok',label:'Answer 80 questions correctly',n:80},{k:'crux',label:'Send 1 crux',n:1}];
const WK_REWARD=400;
function weekId(){const d=new Date();const day=(d.getDay()+6)%7;const m=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day);return m.getFullYear()+'-'+(m.getMonth()+1)+'-'+m.getDate()}
function WK(){const g=G();const id=weekId();if(!g.wk||g.wk.id!==id)g.wk={id,sent:0,ok:0,crux:0,claimed:false};return g.wk}
function wkTrack(sent,correct,crux){const w=WK();if(sent)w.sent++;w.ok+=correct||0;if(crux)w.crux++}
function wkDone(){const w=WK();return WK_GOALS.every(x=>(w[x.k]||0)>=x.n)}
ACT.wkClaim=()=>{const w=WK();if(w.claimed||!wkDone())return;w.claimed=true;const g=G();g.grit+=WK_REWARD;g.crests=(g.crests||0)+1;toast('Expedition complete. +'+WK_REWARD+' grit and a crest.','gold');sfx('cache');saveSoon();render()};

function cacheRoll(){const g=25+Math.floor(Math.random()*36);const pool=t=>CAT.filter(i=>i.tier===t&&!i.evt&&!i.earn&&i.price>0&&!owns(i.id)&&lvOk(i));let drop=null;const r=Math.random();if(r<0.08){const p=pool('common');if(p.length)drop=pick(p).id}else if(r<0.10){const p=pool('rare');if(p.length)drop=pick(p).id}return{g,drop}}

CLB.G={

/* ---- the ice axe, built along +Y (spike to head) with the pick pointing +Z; the grip is at the origin ---- */

function hbars(rows,o){o=o||{};if(!rows.length)return`<p class="muted">Not enough data yet.</p>`;const W=640,lab=o.lab||190,rh=26,H=rows.length*rh+24;const x=v=>lab+(W-lab-60)*clamp(v,0,o.max||100)/(o.max||100);

  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'Bar chart')}">${g}${b}</svg>`}
function pairBars(rows,o){o=o||{};if(!rows.length)return`<p class="muted">Not enough data yet.</p>`;const W=640,lab=190,rh=38,H=rows.length*rh+24;const x=v=>lab+(W-lab-60)*clamp(v,0,100)/100;let g='';for(const t of[0,25,50,75,100])g+=`<line x1="${x(t)}" x2="${x(t)}" y1="4" y2="${H-18}" stroke="var(--line)"/><text x="${x(t)}" y="${H-4}" text-anchor="middle">${t}%</text>`;
  const b=rows.map((r,i)=>{const y=6+i*rh;return`<g data-tip="${esc(r.label+': timed '+r.a+'%, Blind Review '+r.b+'% (n='+r.n+')')}"><rect x="0" y="${y-2}" width="${W}" height="${rh}" fill="transparent"/><text x="${lab-8}" y="${y+18}" text-anchor="end" style="font-family:var(--f-ui);font-size:12px;fill:var(--ink2)">${esc(r.label)}</text><rect x="${lab}" y="${y+2}" width="${Math.max(2,x(r.a)-lab)}" height="11" rx="4" fill="var(--c1)"/><rect x="${lab}" y="${y+15}" width="${Math.max(2,x(r.b)-lab)}" height="11" rx="4" fill="var(--c2)"/><text x="${Math.max(x(r.a),x(r.b))+6}" y="${y+18}">${r.b-r.a>0?'+':''}${r.b-r.a}</text></g>`}).join('');
  return`<div class="legend" style="margin-bottom:6px"><span><i style="background:var(--c1)"></i>Timed</span><span><i style="background:var(--c2)"></i>Blind Review</span></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Timed versus Blind Review accuracy by skill">${g}${b}</svg>`}
function trendChart(h){if(h.length<2)return`<p class="muted">The trend appears after your projection has been recorded on two different days.</p>`;const W=640,H=200,L=40,R=16,T=12,B=26;const xs=i=>L+(W-L-R)*i/(h.length-1);const lo=Math.max(120,Math.min(...h.map(p=>p.lo))-3),hi=Math.min(180,Math.max(...h.map(p=>p.hi))+3);const y=v=>T+(H-T-B)*(1-(v-lo)/Math.max(1,hi-lo));
  const band=h.map((p,i)=>xs(i)+','+y(p.hi)).join(' ')+' '+h.slice().reverse().map((p,j)=>xs(h.length-1-j)+','+y(p.lo)).join(' ');const line=h.map((p,i)=>xs(i)+','+y(p.mid)).join(' ');let g='';const step=Math.max(1,Math.round((hi-lo)/4));for(let v=Math.ceil(lo);v<=hi;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const last=h[h.length-1];const dots=h.map((p,i)=>`<circle cx="${xs(i)}" cy="${y(p.mid)}" r="9" fill="transparent" data-tip="${esc(fmtDate(p.d)+': '+p.lo+' to '+p.hi)}"/>`).join('');
