 95, "tags": ["causal", "comparison-group", "education"], "stimulus": "After the Kestrel County school district introduced a mandatory ninth-grade course in personal finance, the share of its graduates who defaulted on student loans within three years of graduating fell from 14 percent to 9 percent. The district superintendent cited this as evidence that the course reduces loan defaults.", "stem": "Which one of the following, if true, most seriously weakens the superintendent's argument?", "choices": {"A": "Some graduates who took the course nonetheless defaulted on their loans.", "B": "The course was taught by teachers with varied levels of financial training.", "C": "During the period, the district's graduates were more likely than before to attend colleges with high tuition.", "D": "Student loan interest rates nationwide were slightly lower during the period than in prior years.", "E": "Over the same period, loan default rates fell by a similar amount among graduates of neighboring districts that offered no personal finance course."}, "answer": "E", "explanation": {"argument_skeleton": "Premise: defaults fell from 14% to 9% after the course began. Conclusion: the course reduces defaults. Gap: nothing other than the course explains the drop.", "why_correct": "E shows the same drop where there was no course. The effect happened without the cause, so the course is not needed to explain it. Level 1, the strongest attack, and it also absorbs any nationwide factor like D.", "why_wrong": {"A": {"trap": "TOO_WEAK", "text": "Exceptions do not refute a claim about reducing the rate."}, "B": {"trap": "ADJACENT_DOUBT", "text": "Mechanism doubt: it questions the course's quality but does not explain the drop."}, "C": {"trap": "REVERSAL", "text": "Higher tuition should push defaults up, so a drop despite it strengthens the course's case."}, "D": {"trap": "TOO_WEAK", "text": "A real alternative cause (Level 3), but only slight. E shows the whole drop happening without the course."}}, "method_reminder": "Two weakeners on the page? Rank them. Effect without the cause beats an alternative cause.", "flashcard": {"front": "Defaults fell after a course. Neighboring districts without it fell the same. Level?", "back": "Level 1: the effect without the cause. It eliminates the course as the explanation."}}, "original": true}, {"id": "LR-WK-007", "section": "LR", "type": "Weaken", "subtype": "except", "difficulty": 3, "target_seconds": 95, "tags": ["except", "causal", "health"], "stimulus": "A study of 300 office workers found that those who took a short walk after lunch reported fewer afternoon headaches than those who did not. The researchers concluded that a walk after lunch helps prevent afternoon headaches.", "stem": "Each of the following, if true, weakens the researchers' conclusion EXCEPT:", "choices": {"A": "The walkers and the non-walkers in the study had similar diets, sleep habits, and caffeine intake.", "B": "Workers who feel a headache beginning tend to avoid physical activity, including walking.", "C": "The walkers were more likely than the non-walkers to have jobs that let them step away from their screens throughout the day.", "D": "Most of the walks were taken outdoors in daylight, and daylight exposure alone has been found to reduce headache frequency.", "E": "Workers who did not walk after lunch were more likely to skip lunch entirely, and skipping meals is a common cause of headaches."}, "answer": "A", "explanation": {"argument_skeleton": "Premise: walkers report fewer afternoon headaches. Conclusion: walking prevents them. Gap: no other difference between the groups explains it, and headaches do not cause non-walking.", "why_correct": "A rules out several confounders, so it strengthens the conclusion. On an EXCEPT question the four weakeners are wrong and the one choice that does not weaken is right.", "why_wrong": {"B": {"trap": "REVERSAL", "text": "Reverse causation: oncoming headaches stop people from walking. This weakens, so it is one of the four."}, "C": {"trap": "REVERSAL", "text": "A confounder: screen breaks could reduce headaches. This weakens."}, "D": {"trap": "REVERSAL", "text": "Daylight, not walking, may do the work. This weakens."}, "E": {"trap": "REVERSAL", "text": "Skipped meals give the non-walkers another cause of headaches. This weakens."}}, "method_reminder": "Rewrite the stem without EXCEPT, mark each choice, and pick the odd one out.", "flashcard": {"front": "Weaken EXCEPT: what can the right answer be?", "back": "Anything that does not weaken: a strengthener or an irrelevant fact."}}, "original": true}, {"id": "LR-ST-001", "section": "LR", "type": "Strengthen", "subtype": "baseline", "difficulty": 2, "target_seconds": 75, "tags": ["causal", "agriculture"], "stimulus": "Tomato plants grown in the north greenhouse produced 25 percent more fruit this season than those in the south greenhouse. The only change the staff made this year was installing new LED grow lights in the north greenhouse. The head gardener concluded that the new lights increased fruit production.", "stem": "Which one of the following, if true, most strengthens the head gardener's conclusion?", "choices": {"A": "The new LED lights use less electricity than the lights they replaced.", "B": "Last year, under identical lighting, the two greenhouses produced nearly equal amounts of fruit.", "C": "Some tomato varieties naturally produce more fruit than others.", "D": "Cucumber plants in the north greenhouse produced no more fruit than usual this season.", "E": "The lights were recommended by the greenhouse's equipment supplier."}, "answer": "B", "explanation": {"argument_skeleton": "Premise: north produced 25% more than south after the north got new lights. Conclusion: the lights raised production. Gap: the north greenhouse was not already more productive.", "why_correct": "If the greenhouses matched last year, the gap appeared when the lights did. B rules out a pre-existing difference, the most obvious alternative.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "Energy use is not fruit production."}, "C": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Varieties differ in general, but nothing says the greenhouses grew different varieties."}, "D": {"trap": "REVERSAL", "text": "If the lights help plants, cucumbers should have benefited too, so this slightly weakens."}, "E": {"trap": "OUT_OF_SCOPE", "text": "Who recommended the lights says nothing about their effect."}}, "method_reminder": "A before-and-after comparison is strongest when the groups matched before.", "flashcard": {"front": "Group A outperforms B after a change. Classic strengthener?", "back": "Show A and B were equal before the change. That rules out a pre-existing difference."}}, "original": true}, {"id": "LR-ST-002", "section": "LR", "type": "Strengthen", "subtype": "sampling", "difficulty": 3, "target_seconds": 85, "tags": ["sampling", "linguistics"], "stimulus": "Linguist: In recordings of 50 speakers from the Varn valley, every speaker under 30 pronounced the word for “river” with a final vowel that speakers over 60 omit. This indicates that the pronunciation of the word is changing across generations in the valley as a whole.", "stem": "Which one of the following, if true, most strengthens the linguist's argument?", "choices": {"A": "The same final vowel also appears in a language spoken in a neighboring valley.", "B": "All of the recordings were made during a single summer.", "C": "In other regions, pronunciation changes have typically spread from cities to rural areas.", "D": "The 50 speakers were chosen to reflect the valley's mix of villages, occupations, and family backgrounds.", "E": "The word for “river” is among the most frequently used words in the valley's language."}, "answer": "D", "explanation": {"argument_skeleton": "Premise: in 50 recorded speakers, young and old pronounce the word differently. Conclusion: the pronunciation is changing across generations in the whole valley. Gap: the 50 speakers represent the valley.", "why_correct": "The conclusion is about the valley as a whole. D shows the sample was built to mirror the valley, which closes the generalization gap.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "A neighboring language says nothing about change within this valley."}, "B": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Recording season gives no reason to think the sample is or is not representative."}, "C": {"trap": "OUT_OF_SCOPE", "text": "How changes spread elsewhere does not bear on whether this sample reflects this valley."}, "E": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Frequency of the word does not support generalizing from these speakers."}}, "method_reminder": "When the conclusion generalizes, the strongest support makes the sample look like the population.", "flashcard": {"front": "Small sample, conclusion about the whole region. Strengthener?", "back": "Show the sample is representative of the region."}}, "original": true}, {"id": "LR-ST-003", "section": "LR", "type": "Strengthen", "subtype": "intervention", "difficulty": 3, "target_seconds": 85, "tags": ["causal", "urban", "environment"], "stimulus": "Researchers found that neighborhoods in the city of Corbin with more street trees per block had lower average summer surface temperatures. They concluded that street trees reduce summer surface temperatures in Corbin's neighborhoods.", "stem": "Which one of the following, if true, most strengthens the researchers' conclusion?", "choices": {"A": "Within individual neighborhoods, blocks that gained trees through a city planting program became measurably cooler than nearby, otherwise similar blocks that gained none.", "B": "Corbin's wealthier neighborhoods tend to have both more street trees and more irrigated lawns.", "C": "Street trees also reduce stormwater runoff during heavy rain.", "D": "Average surface temperatures in Corbin have risen over the past decade.", "E": "Residents of neighborhoods with many street trees report high satisfaction with their neighborhoods."}, "answer": "A", "explanation": {"argument_skeleton": "Premise: more trees per block correlates with cooler neighborhoods. Conclusion: trees cause the cooling. Gap: the correlation is not driven by something else about tree-rich neighborhoods.", "why_correct": "A adds a near-experiment: adding trees to otherwise similar blocks produced cooling. That is direct evidence the trees themselves do the work.", "why_wrong": {"B": {"trap": "REVERSAL", "text": "Irrigated lawns are another cooling factor in the same places, so this weakens."}, "C": {"trap": "OUT_OF_SCOPE", "text": "Runoff is a different benefit."}, "D": {"trap": "TRUE_BUT_IRRELEVANT", "text": "A citywide trend says nothing about differences between neighborhoods."}, "E": {"trap": "OUT_OF_SCOPE", "text": "Satisfaction is not temperature."}}, "method_reminder": "The strongest causal support is an intervention: add the cause, see the effect, holding the rest equal.", "flashcard": {"front": "Correlation study. What strengthens most?", "back": "Evidence from an intervention or comparison: add the cause to similar cases and the effect follows."}}, "original": true}, {"id": "LR-ST-004", "section": "LR", "type": "Strengthen", "subtype": "analogy", "difficulty": 4, "target_seconds": 95, "tags": ["plan", "analogy", "transit", "urban"], "stimulus": "A regional transit agency plans to increase ridership on its commuter rail line by cutting rail fares 20 percent. Critics point out that a similar fare cut on the agency's bus network five years ago produced almost no change in bus ridership. The agency nonetheless maintains that the rail fare cut will increase rail ridership.", "stem": "Which one of the following, if true, most strengthens the agency's position?", "choices": {"A": "The agency's bus network carries more riders each day than its commuter rail line.", "B": "Fare cuts reduce the revenue the agency collects per rider.", "C": "Many commuters who drive say they would keep driving even if transit were free.", "D": "Several other transit agencies have recently cut commuter rail fares.", "E": "Surveys show that cost is the reason most often given by potential riders for driving instead of taking the commuter rail, whereas people who avoided the buses most often cited slow and unreliable service."}, "answer": "E", "explanation": {"argument_skeleton": "Critics' premise: a fare cut failed on buses. Agency's conclusion: a fare cut will work on rail. Gap: rail riders respond to price in a way bus riders did not.", "why_correct": "E breaks the critics' analogy. Bus non-riders were deterred by service, which a fare cut cannot fix; rail non-riders are deterred by cost, which a fare cut addresses.", "why_wrong": {"A": {"trap": "IRRELEVANT_COMPARISON", "text": "Relative ridership levels say nothing about how rail riders respond to price."}, "B": {"trap": "OUT_OF_SCOPE", "text": "Revenue is a separate question from ridership."}, "C": {"trap": "REVERSAL", "text": "If drivers ignore price, the fare cut is less likely to work. This weakens."}, "D": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Other agencies cutting fares tells us nothing about results."}}, "method_reminder": "When an argument fights an analogy, the best support shows a relevant difference between the cases.", "flashcard": {"front": "Critics say: it failed in case X. How do you strengthen 'it will work in case Y'?", "back": "Show a relevant difference: what blocked success in X is absent in Y."}}, "original": true}, {"id": "LR-ST-005", "section": "LR", "type": "Strengthen", "subtype": "named-cause", "difficulty": 2, "target_seconds": 75, "tags": ["history", "medicine"], "stimulus": "Medical historian: The city's decline in deaths from tuberculosis began in the 1890s, before any effective treatment for the disease existed. Therefore, improvements in housing and nutrition, rather than medical treatment, were responsible for the early decline.", "stem": "Which one of the following, if true, most strengthens the historian's argument?", "choices": {"A": "Tuberculosis is caused by a bacterium.", "B": "Effective drug treatments for tuberculosis did not become available until the 1940s.", "C": "During the 1890s, household crowding in the city fell sharply and food consumption per person rose.", "D": "Records of the causes of death in the 1890s were less complete than modern records.", "E": "Some wealthy families in the city enjoyed good housing throughout the 1880s."}, "answer": "C", "explanation": {"argument_skeleton": "Premise: the decline began before effective treatment. Conclusion: housing and nutrition improvements caused it. Gap: those improvements actually happened when the decline began.", "why_correct": "The premise only rules out treatment. C shows that the two named causes did change at the right time, giving positive support for them.", "why_wrong": {"A": {"trap": "TRUE_BUT_IRRELEVANT", "text": "The cause of the disease does not tell us why deaths declined."}, "B": {"trap": "RESTATES_PREMISE", "text": "This repeats the premise that treatment came later; it adds nothing about housing or nutrition."}, "D": {"trap": "REVERSAL", "text": "Unreliable records cast doubt on the decline itself, so this weakens."}, "E": {"trap": "OUT_OF_SCOPE", "text": "A few families before the period say nothing about change during it."}}, "method_reminder": "Ruling out one cause does not prove another. Support the named cause directly.", "flashcard": {"front": "Argument rules out cause X and credits cause Y. Missing support?", "back": "Evidence that Y actually occurred, at the right time and scale."}}, "original": true}, {"id": "LR-IN-001", "section": "LR", "type": "Must Be True", "subtype": "conditional", "difficulty": 2, "target_seconds": 75, "tags": ["conditional", "museum"], "stimulus": "Every exhibit in the museum's new wing was loaned by a private collector. The museum does not insure any exhibit that was loaned by a private collector. The museum insures every one of its exhibits that is displayed outdoors.", "stem": "If the statements above are true, which one of the following must also be true?", "choices": {"A": "Some exhibits displayed outdoors were loaned by private collectors.", "B": "Every exhibit the museum insures is displayed outdoors.", "C": "All exhibits loaned by private collectors are in the new wing.", "D": "No exhibit in the new wing is displayed outdoors.", "E": "Most of the museum's exhibits are displayed outdoors."}, "answer": "D", "explanation": {"argument_skeleton": "New wing → private loan → not insured. Outdoors → insured. Contrapositive: not insured → not outdoors.", "why_correct": "Chain it: new wing → private → not insured → not outdoors. So no exhibit in the new wing is displayed outdoors.", "why_wrong": {"A": {"trap": "CONTRADICTS", "text": "Outdoors means insured, and insured means not privately loaned. This must be false."}, "B": {"trap": "MISTAKEN_REVERSAL", "text": "Reverses outdoors → insured."}, "C": {"trap": "MISTAKEN_REVERSAL", "text": "Reverses new wing → private loan."}, "E": {"trap": "OUT_OF_SCOPE", "text": "Nothing tells us how many exhibits are outdoors."}}, "method_reminder": "Diagram each rule, take contrapositives, and chain the shared terms.", "flashcard": {"front": "A → B, B → not C, D → C. What follows about A and D?", "back": "A → not C → not D. No A is D."}}, "original": true}, {"id": "LR-IN-002", "section": "LR", "type": "Must Be True", "subtype": "quantifier", "difficulty": 3, "target_seconds": 85, "tags": ["quantifier", "most-most"], "stimulus": "Most of the applicants for the Harrow Fellowship submitted writing samples. Most of the applicants for the Harrow Fellowship were interviewed. Every applicant who was interviewed had at least two letters of recommendation.", "stem": "If the statements above are true, which one of the following must be true?", "choices": {"A": "At least one applicant who submitted a writing sample had at least two letters of recommendation.", "B": "Most applicants who submitted writing samples were interviewed.", "C": "Every applicant with at least two letters of recommendation was interviewed.", "D": "Some applicants who were not interviewed did not submit writing samples.", "E": "Most applicants who submitted writing samples had at least two letters of recommendation."}, "answer": "A", "explanation": {"argument_skeleton": "Most applicants: writing sample. Most applicants: interviewed. Interviewed → two letters.", "why_correct": "Two 'most' groups drawn from the same applicants must overlap, so at least one applicant both submitted a sample and was interviewed. That applicant has two letters.", "why_wrong": {"B": {"trap": "QUANTIFIER_SHIFT", "text": "The overlap is guaranteed to be at least one, not most of the sample submitters."}, "C": {"trap": "MISTAKEN_REVERSAL", "text": "Reverses interviewed → two letters."}, "D": {"trap": "TOO_STRONG", "text": "Every non-interviewed applicant could have submitted a sample."}, "E": {"trap": "QUANTIFIER_SHIFT", "text": "With ten applicants, six submitting and six interviewed, only two submitters need be interviewed."}}, "method_reminder": "Most plus most about the same group guarantees an overlap of at least one, nothing more.", "flashcard": {"front": "Most A are B; most A are C. Strongest valid inference?", "back": "Some A are both B and C. Not 'most', just at least one."}}, "original": true}, {"id": "LR-IN-003", "section": "LR", "type": "Must Be True", "subtype": "conditional-chain", "difficulty": 3, "target_seconds": 85, "tags": ["conditional", "urban", "permits"], "stimulus": "Every food truck that operates in Central Plaza holds a downtown permit. No food truck that sells alcohol holds a downtown permit. Every food truck that holds a downtown permit has passed a fire inspection within the past year.", "stem": "If the statements above are true, which one of the following must be true?", "choices": {"A": "Every food truck that has passed a fire inspection within the past year holds a downtown permit.", "B": "No food truck that sells alcohol has passed a fire inspection within the past year.", "C": "Some food trucks that hold downtown permits do not operate in Central Plaza.", "D": "Every food truck without a downtown permit sells alcohol.", "E": "Every food truck that operates in Central Plaza has passed a fire inspection within the past year and does not sell alcohol."}, "answer": "E", "explanation": {"argument_skeleton": "Plaza → Permit → Inspection. Alcohol → not Permit, so Permit → not Alcohol.", "why_correct": "A Central Plaza truck has a permit, so it has passed inspection, and a permit holder does not sell alcohol. Both halves follow.", "why_wrong": {"A": {"trap": "MISTAKEN_REVERSAL", "text": "Reverses permit → inspection."}, "B": {"trap": "MISTAKEN_NEGATION", "text": "Alcohol trucks lack permits, but they could still have passed inspections."}, "C": {"trap": "TOO_STRONG", "text": "Nothing guarantees permit holders outside the plaza exist."}, "D": {"trap": "MISTAKEN_REVERSAL", "text": "Reverses alcohol → no permit."}}, "method_reminder": "Chain rules through the shared term, and attach contrapositives where a 'no' rule touches the chain.", "flashcard": {"front": "No A is B; C → B. What follows?", "back": "C → B → not A. No C is A."}}, "original": true}, {"id": "LR-IN-004", "section": "LR", "type": "Most Strongly Supported", "subtype": "history", "difficulty": 3, "target_seconds": 85, "tags": ["history", "printing"], "stimulus": "In the decades after movable type reached the city of Velde, the number of books printed there rose tenfold, while the number of scribes employed by the city's monasteries fell by only a third. Records show that during the same decades the monasteries increasingly commissioned scribes to produce illuminated manuscripts for wealthy patrons, books the printing presses of the time could not reproduce.", "stem": "The statements above most strongly support which one of the following?", "choices": {"A": "Printed books in Velde were cheaper than handwritten books.", "B": "Demand for kinds of books that printing could not reproduce helped some of Velde's scribes keep their positions after printing arrived.", "C": "Wealthy patrons in Velde preferred illuminated manuscripts to printed books for every purpose.", "D": "Velde's monasteries opposed the introduction of the printing press.", "E": "Without commissions for illuminated manuscripts, all of Velde's monastic scribes would have lost their positions."}, "answer": "B", "explanation": {"argument_skeleton": "Facts: printing rose tenfold; scribes fell only a third; monasteries increasingly commissioned illuminated manuscripts presses could not make.", "why_correct": "The modest drop in scribes alongside rising commissions for work presses could not do supports the modest claim in B. It says 'helped some', which the facts justify.", "why_wrong": {"A": {"trap": "OUTSIDE_KNOWLEDGE", "text": "Likely true historically, but nothing in the stimulus mentions prices."}, "C": {"trap": "EXTREME", "text": "'Every purpose' goes far beyond increased commissions."}, "D": {"trap": "OUT_OF_SCOPE", "text": "The monasteries' attitude toward printing is never mentioned."}, "E": {"trap": "EXTREME", "text": "'All' would have lost positions is a strong counterfactual the facts cannot support."}}, "method_reminder": "Most Strongly Supported rewards the modest claim the facts justify, not the dramatic one they suggest.", "flashcard": {"front": "MSS: two answers fit; one says 'helped some', one says 'all would have'. Pick?", "back": "The modest one. The text must justify every word."}}, "original": true}, {"id": "LR-IN-005", "section": "LR", "type": "Most Strongly Supported", "subtype": "ecology", "difficulty": 3, "target_seconds": 85, "tags": ["ecology", "science"], "stimulus": "Ecologist: In lakes where the invasive zebra mussel has become established, water clarity typically increases because the mussels filter plankton from the water. Clearer water lets sunlight penetrate deeper, and in such lakes aquatic plants have colonized depths where they previously could not grow. Several fish species that spawn among submerged plants have increased in number in these lakes, even though the loss of plankton has reduced populations of fish that feed mainly on plankton.", "stem": "The ecologist's statements, if true, most strongly support which one of the following?", "choices": {"A": "Zebra mussels increase the total number of fish in the lakes they colonize.", "B": "Lakes without zebra mussels have no plants growing at deep levels.", "C": "The establishment of zebra mussels in a lake can benefit some fish species while harming others.", "D": "Fish that feed mainly on plankton will eventually disappear from lakes with zebra mussels.", "E": "Introducing zebra mussels is an effective way to improve lake ecosystems."}, "answer": "C", "explanation": {"argument_skeleton": "Mussels → clearer water → deeper plants → more plant-spawning fish. Mussels → less plankton → fewer plankton-feeding fish.", "why_correct": "Both chains run from the mussels: one helps plant spawners, the other hurts plankton feeders. 'Can benefit some while harming others' is exactly what the facts show.", "why_wrong": {"A": {"trap": "TOO_STRONG", "text": "Some species rose and some fell; the net total is unknown."}, "B": {"trap": "EXTREME", "text": "The text says plants colonized new depths, not that no deep plants exist elsewhere."}, "D": {"trap": "EXTREME", "text": "Reduced populations do not mean eventual disappearance."}, "E": {"trap": "OUT_OF_SCOPE", "text": "A value judgment the ecologist never makes."}}, "method_reminder": "Follow each causal chain to its end and look for the answer that summarizes both.", "flashcard": {"front": "One cause, two chains with opposite effects. Typical MSS answer?", "back": "A modest 'can help some and harm others' summary, not a net judgment."}}, "original": true}, {"id": "LR-IN-006", "section": "LR", "type": "Most Strongly Supported", "subtype": "literary", "difficulty": 4, "target_seconds": 95, "tags": ["humanities", "literature", "abstract"], "stimulus": "Critics often praise the novelist Imre Dalton for the realism of his dialogue, citing its fragments, interruptions, and repetitions. Yet transcripts of ordinary conversation contain far more of these features than Dalton's dialogue does, and readers presented with such transcripts generally find them tedious rather than lifelike. Dalton's dialogue seems realistic, then, partly because it omits much of what real conversation contains.", "stem": "Which one of the following is most strongly supported by the information above?", "choices": {"A": "Dalton's critics have misjudged the quality of his dialogue.", "B": "Readers find all transcripts of ordinary conversation tedious.", "C": "Dialogue containing no fragments or interruptions will strike readers as realistic.", "D": "The impression of realism in fictional dialogue can depend on selecting from, rather than reproducing, the features of actual speech.", "E": "Dalton studied transcripts of conversation before writing his novels."}, "answer": "D", "explanation": {"argument_skeleton": "Dalton's dialogue seems real; it has fewer speech features than real talk; full transcripts seem tedious; so the effect comes partly from omission.", "why_correct": "D generalizes the passage's own conclusion with a hedge ('can depend'). Selection, not reproduction, produces the impression of realism in Dalton's case.", "why_wrong": {"A": {"trap": "SHELL_GAME", "text": "The passage agrees the dialogue seems realistic; it questions why, not whether it is good."}, "B": {"trap": "EXTREME", "text": "'Generally' does not become 'all'."}, "C": {"trap": "TOO_STRONG", "text": "Omitting some features helps; omitting all of them is never said to work."}, "E": {"trap": "OUT_OF_SCOPE", "text": "Dalton's working method is never mentioned."}}, "method_reminder": "Abstract stimuli: restate the conclusion in plain words, then look for its hedged general form.", "flashcard": {"front": "Humanities LR: the answer generalizes the conclusion. What must it keep?", "back": "The hedge. 'Can depend on' and 'partly' survive; 'always' and 'all' do not."}}, "original": true}, {"id": "LR-IN-007", "section": "LR", "type": "Must Be False", "subtype": "conditional", "difficulty": 3, "target_seconds": 85, "tags": ["conditional", "education", "cannot-be-true"], "stimulus": "At Ridgeway College, every student who majors in chemistry completes a laboratory thesis. No student who completes a laboratory thesis completes an off-campus internship for credit. Some students who major in economics complete off-campus internships for credit.", "stem": "If the statements above are true, which one of the following CANNOT be true?", "choices": {"A": "Some economics majors complete laboratory theses.", "B": "Some chemistry majors at Ridgeway complete off-campus internships for credit.", "C": "Some students who complete off-campus internships for credit also major in history.", "D": "No economics major completes a laboratory thesis.", "E": "Every student who completes an off-campus internship for credit majors in economics."}, "answer": "B", "explanation": {"argument_skeleton": "Chemistry → thesis → no internship. Some economics majors → internship.", "why_correct": "A chemistry major must complete a thesis, and thesis writers cannot complete internships for credit. So no chemistry major completes one. B contradicts the chain.", "why_wrong": {"A": {"trap": "MISTAKEN_NEGATION", "text": "Only some economics majors intern; the others could write theses. This could be true."}, "C": {"trap": "OUT_OF_SCOPE", "text": "History majors are unrestricted. This could be true."}, "D": {"trap": "TOO_STRONG", "text": "Consistent with the facts but not required. Could be true."}, "E": {"trap": "QUANTIFIER_SHIFT", "text": "Nothing rules it out. Could be true."}}, "method_reminder": "Cannot Be True: four choices are merely possible. The answer breaks a chain you can diagram.", "flashcard": {"front": "Must Be False: what do the four wrong answers have in common?", "back": "Each could be true. Only the answer contradicts the stimulus or its valid chains."}}, "original": true}, {"id": "LR-FL-001", "section": "LR", "type": "Flaw", "subtype": "necessary-sufficient", "difficulty": 2, "target_seconds": 70, "tags": ["conditional", "mistaken-reversal"], "stimulus": "Every company that won the city's sustainability award last year had installed rooftop solar panels. Harlow Brewing installed rooftop solar panels last year. So Harlow Brewing must have won the sustainability award.", "stem": "The reasoning in the argument is flawed because the argument", "choices": {"A": "treats a condition that every award winner met as though meeting it guaranteed winning the award", "B": "relies on the testimony of a source with an interest in the outcome", "C": "fails to consider that some companies without solar panels may have won the award", "D": "generalizes from the case of a single company to all companies in the city", "E": "takes for granted that the award's criteria were the same last year as in earlier years"}, "answer": "A", "explanation": {"argument_skeleton": "Premise: winner → solar panels. Premise: Harlow has panels. Conclusion: Harlow won. Gap: panels → winner, the reversal.", "why_correct": "Solar panels are necessary for winning, not sufficient. Concluding Harlow won because it has panels is the Mistaken Reversal, and A describes it in the test's language.", "why_wrong": {"B": {"trap": "OUT_OF_SCOPE", "text": "No source or testimony appears in the argument."}, "C": {"trap": "CONTRADICTS", "text": "The premise says every winner had panels, so this possibility is already ruled out."}, "D": {"trap": "OUT_OF_SCOPE", "text": "The conclusion is about Harlow only; there is no generalization."}, "E": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Earlier years play no role in the reasoning."}}, "method_reminder": "Diagram the rule, then check which side of the arrow the argument starts from.", "flashcard": {"front": "All winners did X. Y did X, so Y won. Flaw name?", "back": "Necessary taken as sufficient (Mistaken Reversal)."}}, "original": true}, {"id": "LR-FL-002", "section": "LR", "type": "Flaw", "subtype": "causal", "difficulty": 3, "target_seconds": 85, "tags": ["causal", "self-selection", "urban", "public-health"], "stimulus": "Public health official: Residents of neighborhoods that have farmers' markets eat more fresh vegetables than residents of neighborhoods that lack them. So if we open farmers' markets in the neighborhoods that lack them, vegetable consumption in those neighborhoods will rise.", "stem": "The official's reasoning is most vulnerable to criticism on the grounds that it", "choices": {"A": "relies on a sample too small to support its conclusion", "B": "assumes that farmers' markets are the only source of fresh vegetables", "C": "fails to consider that residents who already prefer fresh vegetables may be more likely to live in neighborhoods that have, or that attract, farmers' markets", "D": "presumes that what is true of each neighborhood is true of the city as a whole", "E": "draws a conclusion about vegetable consumption from evidence about vegetable prices"}, "answer": "C", "explanation": {"argument_skeleton": "Premise: market neighborhoods eat more vegetables. Conclusion: adding markets will raise consumption elsewhere. Gap: markets cause the higher consumption, rather than demand causing the markets.", "why_correct": "Markets open where demand already exists, and vegetable lovers may choose those neighborhoods. Either way the correlation runs from preference to markets, so new markets may not change habits. C names that overlooked possibility.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "No sample size is given or relied on."}, "B": {"trap": "TOO_STRONG", "text": "The argument needs markets to raise consumption, not to be the only source."}, "D": {"trap": "OUT_OF_SCOPE", "text": "The conclusion stays at the neighborhood level."}, "E": {"trap": "SHELL_GAME", "text": "The evidence concerns consumption, not prices."}}, "method_reminder": "Correlation to intervention is a leap. Ask whether the 'cause' was placed where the 'effect' already lived.", "flashcard": {"front": "Places with X have more Y, so adding X will raise Y. Main flaw?", "back": "X may follow Y (self-selection or reverse causation). Correlation does not license the intervention."}}, "original": true}, {"id": "LR-FL-003", "section": "LR", "type": "Flaw", "subtype": "absence-of-evidence", "difficulty": 2, "target_seconds": 70, "tags": ["burden-of-proof", "consumer"], "stimulus": "Consumer advocates have demanded that the maker of Lumina detergent remove a fragrance additive from its products. But no published study has found that the additive irritates human skin. So the additive is safe for skin, and the advocates' demand should be rejected.", "stem": "The reasoning in the argument is flawed in that the argument", "choices": {"A": "attacks the motives of the consumer advocates rather than their position", "B": "assumes that a claim accepted by many people must be true", "C": "relies on studies conducted by the detergent's manufacturer", "D": "fails to consider that the additive may have uses other than adding fragrance", "E": "treats the lack of evidence that the additive is harmful as proof that it is not harmful"}, "answer": "E", "explanation": {"argument_skeleton": "Premise: no study has found irritation. Conclusion: the additive is safe. Gap: absence of evidence equals evidence of absence.", "why_correct": "Perhaps no one has studied the question, or the studies were too small. Concluding safety from the absence of a finding is the classic burden-of-proof error E describes.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "The argument never mentions the advocates' motives."}, "B": {"trap": "OUT_OF_SCOPE", "text": "No appeal to popular belief appears."}, "C": {"trap": "OUT_OF_SCOPE", "text": "The source of any studies is never mentioned."}, "D": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Other uses would not affect whether it irritates skin."}}, "method_reminder": "'No study has shown harm' supports 'safe' only if someone looked properly.", "flashcard": {"front": "'Never been shown harmful, so it is safe.' Flaw?", "back": "Absence of evidence treated as evidence of absence."}}, "original": true}, {"id": "LR-FL-004", "section": "LR", "type": "Flaw", "subtype": "composition", "difficulty": 3, "target_seconds": 80, "tags": ["part-whole", "music"], "stimulus": "Each of the four musicians in the newly formed Arden Quartet has won a major international solo competition. Clearly, then, the Arden Quartet will be one of the finest chamber ensembles performing today.", "stem": "The reasoning above is flawed because it", "choices": {"A": "relies on a sample that is too small to be representative", "B": "assumes that a group whose members each excel individually will excel as a group", "C": "confuses the cause of the quartet's success with its effect", "D": "fails to consider that some solo competitions are more prestigious than others", "E": "takes for granted that chamber music is more demanding than solo performance"}, "answer": "B", "explanation": {"argument_skeleton": "Premise: each member is an elite soloist. Conclusion: the ensemble will be elite. Gap: the whole inherits the parts' quality.", "why_correct": "Ensemble playing needs blend and coordination that solo prizes do not measure. Inferring the group's excellence from each member's excellence is the part-to-whole flaw.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "There is no sample; all four members are described."}, "C": {"trap": "CAUSAL_REVERSAL", "text": "No causal claim is reversed."}, "D": {"trap": "TRUE_BUT_IRRELEVANT", "text": "All four won major international competitions, so prestige variation does not matter."}, "E": {"trap": "OUT_OF_SCOPE", "text": "The argument compares nothing about difficulty."}}, "method_reminder": "When the conclusion is about a group and the evidence is about members, suspect composition.", "flashcard": {"front": "Every part is excellent, so the whole is. Flaw?", "back": "Part to whole (composition): properties of members need not belong to the group."}}, "original": true}, {"id": "LR-FL-005", "section": "LR", "type": "Flaw", "subtype": "scope-shift", "difficulty": 3, "target_seconds": 85, "tags": ["scope", "urban", "housing"], "stimulus": "City planner: Over the past decade, the number of housing units in Brookfield grew faster than the number of households. Therefore, housing in Brookfield became more affordable over the decade for the households that live there.", "stem": "The planner's reasoning is most vulnerable to which one of the following criticisms?", "choices": {"A": "It confuses the number of households with the number of residents.", "B": "It assumes that what is true of Brookfield is true of other cities.", "C": "It relies on data from a period too short to show a trend.", "D": "It draws a conclusion about affordability from evidence that concerns only the quantity of housing.", "E": "It presumes that every household in Brookfield rents rather than owns its home."}, "answer": "D", "explanation": {"argument_skeleton": "Premise: units grew faster than households. Conclusion: housing became more affordable. Gap: more units per household means lower costs relative to incomes.", "why_correct": "Affordability compares costs with incomes. The premise is only about counts. Prices could rise anyway (location, quality, demand from outside buyers) and incomes could fall. D names the shift from quantity to affordability.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "Both premise and conclusion are about households; no confusion with residents."}, "B": {"trap": "OUT_OF_SCOPE", "text": "No other city is mentioned."}, "C": {"trap": "TRUE_BUT_IRRELEVANT", "text": "A decade is a reasonable span; length is not the problem."}, "E": {"trap": "OUT_OF_SCOPE", "text": "The argument says nothing about renting versus owning."}}, "method_reminder": "Compare the key noun in the evidence with the key noun in the conclusion.", "flashcard": {"front": "Units grew faster than households, so housing got more affordable. Flaw?", "back": "Scope shift: quantity of housing is not affordability, which depends on prices and incomes."}}, "original": true}, {"id": "LR-NA-001", "section": "LR", "type": "Necessary Assumption", "subtype": "plan", "difficulty": 3, "target_seconds": 85, "tags": ["plan", "arts"], "stimulus": "The Fenwick Theater's managers plan to attract younger audiences by staging contemporary plays instead of classics. Since younger theatergoers are more likely than older ones to attend contemporary plays, this change in programming will increase the theater's attendance among younger people.", "stem": "The argument depends on assuming which one of the following?", "choices": {"A": "Most older theatergoers prefer classics to contemporary plays.", "B": "The Fenwick Theater will attract more younger theatergoers than any other theater in the city.", "C": "Contemporary plays are less expensive to stage than classics.", "D": "Younger theatergoers never attend performances of classic plays.", "E": "At least some younger theatergoers would be willing to attend contemporary plays at the Fenwick Theater."}, "answer": "E", "explanation": {"argument_skeleton": "Premise: younger people favor contemporary plays. Conclusion: staging them at the Fenwick will raise its young attendance. Gap: young people will come to this theater for them.", "why_correct": "Negate E: no younger theatergoer would attend contemporary plays at the Fenwick. Then the plan cannot raise young attendance. The negation destroys the argument, so E is required.", "why_wrong": {"A": {"trap": "NOT_NECESSARY", "text": "Older audiences' tastes do not affect whether younger attendance rises."}, "B": {"trap": "TOO_STRONG", "text": "The plan only needs an increase, not to beat every rival."}, "C": {"trap": "OUT_OF_SCOPE", "text": "Cost does not bear on attendance."}, "D": {"trap": "EXTREME", "text": "'Never' is far stronger than needed; negate it and the argument survives."}}, "method_reminder": "Negate the contender. If the conclusion falls, it is necessary.", "flashcard": {"front": "Necessary Assumption answers often look how?", "back": "Modest: 'at least some', 'not all', 'could'. Negate them and the argument collapses."}}, "original": true}, {"id": "LR-NA-002", "section": "LR", "type": "Necessary Assumption", "subtype": "defensive", "difficulty": 4, "target_seconds": 95, "tags": ["causal", "science", "reverse-causation"], "stimulus": "Paleontologist: Fossilized pollen in lake sediments shows that oak trees became abundant around the lake about 9,000 years ago, at the same time that charcoal deposits from fires became rare. Oaks are poorly adapted to frequent fire. Thus, the decline in fire frequency is what allowed oaks to become abundant.", "stem": "Which one of the following is an assumption on which the paleontologist's argument depends?", "choices": {"A": "Oaks were entirely absent from the region before 9,000 years ago.", "B": "The spread of oaks was not itself the main cause of the decline in fire frequency.", "C": "Most fires around the lake were started by lightning.", "D": "No other tree species became abundant around the lake 9,000 years ago.", "E": "Charcoal deposits reliably indicate fire frequency in every kind of environment."}, "answer": "B", "explanation": {"argument_skeleton": "Premise: oaks rose as fires fell; oaks dislike fire. Conclusion: fewer fires let oaks spread. Gap: the arrow does not run from oaks to fewer fires.", "why_correct": "Negate B: the spread of oaks was the main cause of fewer fires (oak forests can burn less readily). Then the paleontologist has the causation backward and the conclusion fails. B is a defensive assumption ruling out reverse causation.", "why_wrong": {"A": {"trap": "TOO_STRONG", "text": "Oaks only needed to be less abundant before; total absence is not required."}, "C": {"trap": "NOT_NECESSARY", "text": "The source of the fires does not matter to the argument."}, "D": {"trap": "TOO_STRONG", "text": "Other species spreading would not undercut the claim about oaks."}, "E": {"trap": "EXTREME", "text": "Reliability here is needed, not in every environment. Negating 'every' leaves the argument intact."}}, "method_reminder": "Causal arguments assume no reverse causation. Look for the answer that rules it out.", "flashcard": {"front": "Causal Necessary Assumption: common defensive answer?", "back": "'The effect did not cause the supposed cause.' Negate it and the argument dies."}}, "original": true}, {"id": "LR-NA-003", "section": "LR", "type": "Necessary Assumption", "subtype": "plan", "difficulty": 3, "target_seconds": 85, "tags": ["plan", "technology", "business"], "stimulus": "Software executive: Our programmers spend about a fifth of their working hours in recurring meetings. If we cancel all recurring meetings, our programmers will spend that time writing code, and so the company will release its new product months ahead of schedule.", "stem": "The executive's argument requires assuming which one of the following?", "choices": {"A": "Recurring meetings serve no useful purpose for the company.", "B": "Programmers prefer writing code to attending meetings.", "C": "The pace of the new product's development is limited at least in part by the amount of time programmers spend writing code.", "D": "Other software firms hold fewer meetings than this firm does.", "E": "Canceling recurring meetings will not cause any programmer to leave the company."}, "answer": "C", "explanation": {"argument_skeleton": "Premise: canceling meetings frees time for coding. Conclusion: the release will come months early. Gap: more coding time actually speeds the release.", "why_correct": "Negate C: development pace is not at all limited by coding time (testing, approvals or design are the bottleneck). Then extra coding hours do not speed the release, and the conclusion fails.", "why_wrong": {"A": {"trap": "TOO_STRONG", "text": "Meetings could have some use and the plan could still speed the release."}, "B": {"trap": "NOT_NECESSARY", "text": "Preferences do not matter if the time is spent coding."}, "D": {"trap": "IRRELEVANT_COMPARISON", "text": "Other firms' meetings are beside the point."}, "E": {"trap": "EXTREME", "text": "If one programmer left, the release could still come early. Not required."}}, "method_reminder": "Plans assume the freed resource is the actual bottleneck.", "flashcard": {"front": "'Free up X, so output rises.' Hidden requirement?", "back": "X is a real constraint on output. If something else is the bottleneck, freeing X does nothing."}}, "original": true}, {"id": "LR-SA-001", "section": "LR", "type": "Sufficient Assumption", "subtype": "conditional-bridge", "difficulty": 2, "target_seconds": 70, "tags": ["conditional", "politics"], "stimulus": "Every candidate who participated in all three public debates received the Ledger's endorsement. Okafor received the Ledger's endorsement. Therefore, Okafor will win the election.", "stem": "The conclusion follows logically if which one of the following is assumed?", "choices": {"A": "Every candidate who receives the Ledger's endorsement will win the election.", "B": "Every candidate who wins the election participated in all three debates.", "C": "Okafor participated in all three public debates.", "D": "Most candidates endorsed by the Ledger have won their elections.", "E": "No candidate who skipped a debate received the Ledger's endorsement."}, "answer": "A", "explanation": {"argument_skeleton": "Known: Okafor was endorsed. New term in conclusion: wins. Bridge needed: endorsed → wins.", "why_correct": "Endorsed → wins, plus Okafor endorsed, guarantees Okafor wins. The debate premise is a distraction.", "why_wrong": {"B": {"trap": "MISTAKEN_REVERSAL", "text": "Runs from winning to debating; it never reaches Okafor winning."}, "C": {"trap": "TOO_WEAK", "text": "Debating connects only to endorsement, which Okafor already has."}, "D": {"trap": "TOO_WEAK", "text": "'Most' cannot guarantee the conclusion."}, "E": {"trap": "TOO_WEAK", "text": "About skipping debates and endorsements; never reaches winning."}}, "method_reminder": "Find the term that appears only in the conclusion and bridge to it.", "flashcard": {"front": "Sufficient Assumption: where do you start?", "back": "Circle the conclusion's new term. The answer links a premise term to it, arrow pointing at the new term."}}, "original": true}, {"id": "LR-SA-002", "section": "LR", "type": "Sufficient Assumption", "subtype": "quantifier-bridge", "difficulty": 4, "target_seconds": 90, "tags": ["quantifier", "conditional", "museum"], "stimulus": "Some of the paintings in the gallery's new acquisition were painted on oak panels. Any painting on an oak panel requires a humidity-controlled display case. So some of the paintings in the new acquisition will be displayed in the east hall.", "stem": "The conclusion follows logically if which one of the following is assumed?", "choices": {"A": "All of the east hall's display cases are humidity-controlled.", "B": "Some paintings displayed in the east hall were painted on oak panels.", "C": "Only paintings on oak panels require humidity-controlled display cases.", "D": "Every painting that requires a humidity-controlled display case will be displayed in the east hall.", "E": "Most paintings in the new acquisition require humidity-controlled display cases."}, "answer": "D", "explanation": {"argument_skeleton": "Some acquisition paintings → oak → humidity case. Needed: humidity case → east hall.", "why_correct": "With D, the oak paintings in the acquisition need humidity cases, and anything needing one goes to the east hall. So some acquisition paintings will be in the east hall.", "why_wrong": {"A": {"trap": "MISTAKEN_REVERSAL", "text": "East hall → humidity case points the wrong way; it does not send humidity-case paintings there."}, "B": {"trap": "TOO_WEAK", "text": "Some oak paintings in the east hall need not be from the acquisition."}, "C": {"trap": "TOO_WEAK", "text": "Restricts which paintings need cases, but never reaches the east hall."}, "E": {"trap": "TOO_WEAK", "text": "Adds more paintings needing cases without connecting cases to the east hall."}}, "method_reminder": "Chain from the 'some' term through the premises to the new term. The bridge must point toward the conclusion.", "flashcard": {"front": "Some A are B; B → C. You need: some A are D. Bridge?", "back": "C → D. Then some A → B → C → D."}}, "original": true}, {"id": "LR-SA-003", "section": "LR", "type": "Sufficient Assumption", "subtype": "principle-bridge", "difficulty": 3, "target_seconds": 80, "tags": ["conditional", "literature"], "stimulus": "Kenji has read every novel on the prize shortlist. Anyone who has read every novel on the shortlist is qualified to judge the prize. Hence Kenji should be appointed to the prize committee.", "stem": "Which one of the following, if assumed, enables the conclusion to be properly drawn?", "choices": {"A": "Only people who have read every novel on the shortlist should be appointed to the committee.", "B": "Kenji is more widely read than any current member of the committee.", "C": "Anyone who is qualified to judge the prize should be appointed to the prize committee.", "D": "Some people qualified to judge the prize already serve on the committee.", "E": "Being qualified to judge the prize requires having read every novel on the shortlist."}, "answer": "C", "explanation": {"argument_skeleton": "Kenji → read all → qualified. Conclusion: should be appointed. Bridge needed: qualified → should be appointed.", "why_correct": "C supplies qualified → should be appointed. Kenji is qualified, so he should be appointed.", "why_wrong": {"A": {"trap": "MISTAKEN_REVERSAL", "text": "Says appointment requires reading, not that reading earns appointment."}, "B": {"trap": "IRRELEVANT_COMPARISON", "text": "Comparing Kenji to current members does not establish what should happen."}, "D": {"trap": "TOO_WEAK", "text": "Some qualified people serving does not mean Kenji should."}, "E": {"trap": "TOO_WEAK", "text": "Reverses the premise's direction and never reaches appointment."}}, "method_reminder": "For 'should' conclusions, the bridge is often a principle: anyone who meets X should get Y.", "flashcard": {"front": "Premises establish a fact; conclusion says 'should'. What fills the gap?", "back": "A principle linking that fact to the 'should': if X, then should Y."}}, "original": true}, {"id": "LR-MC-001", "section": "LR", "type": "Main Conclusion", "subtype": "counter-argument", "difficulty": 3, "target_seconds": 75, "tags": ["economics", "policy"], "stimulus": "Some economists argue that raising the minimum wage in rural counties will reduce employment there, because rural employers operate on thin margins. But rural counties already face labor shortages, and employers competing for scarce workers often absorb higher wages rather than cutting jobs. The economists' prediction, therefore, overstates the risk to rural employment.", "stem": "Which one of the following most accurately expresses the main conclusion of the argument?", "choices": {"A": "Rural employers operate on thin margins.", "B": "Rural counties already face labor shortages.", "C": "Raising the minimum wage will have no effect on rural employment.", "D": "The prediction that a higher minimum wage will reduce rural employment overstates the risk to rural jobs.", "E": "Employers competing for scarce workers often absorb higher wages rather than cutting jobs."}, "answer": "D", "explanation": {"argument_skeleton": "Opposing view: higher wage, fewer rural jobs. Premises: labor shortages; employers absorb costs. Conclusion: that prediction overstates the risk.", "why_correct": "'Therefore' marks it, and the why test confirms: why believe the prediction overstates the risk? Because of the shortages and absorption. D paraphrases it with the pronoun filled in.", "why_wrong": {"A": {"trap": "OPPOSING_VIEW", "text": "The economists' reason, which the author argues against."}, "B": {"trap": "PREMISE_AS_CONCLUSION", "text": "Evidence offered for the conclusion."}, "C": {"trap": "EXTREME", "text": "'Overstates the risk' is not 'no effect'."}, "E": {"trap": "PREMISE_AS_CONCLUSION", "text": "The second premise."}}, "method_reminder": "Find the claim that answers the opposing view; check it with 'because'.", "flashcard": {"front": "Argument opens with 'Some economists argue...'. Is that the conclusion?", "back": "Almost never. It is usually the view the author is about to answer."}}, "original": true}, {"id": "LR-MC-002", "section": "LR", "type": "Main Conclusion", "subtype": "first-sentence", "difficulty": 4, "target_seconds": 85, "tags": ["urban", "intermediate-conclusion"], "stimulus": "The proposal to replace the downtown parking garage with a park deserves support, despite merchants' worries about losing customers. Parking surveys show the garage is rarely more than half full, since most downtown shoppers now arrive by transit or on foot. So removing the garage would cost the merchants few customers, and the park would draw new visitors to the area.", "stem": "Which one of the following most accurately expresses the main conclusion of the argument?", "choices": {"A": "Removing the garage would cost downtown merchants few customers.", "B": "The proposal to replace the downtown parking garage with a park deserves support.", "C": "Most downtown shoppers now arrive by transit or on foot.", "D": "Merchants are worried that removing the garage will cost them customers.", "E": "The park would draw more visitors than the garage does."}, "answer": "B", "explanation": {"argument_skeleton": "Survey data → few customers lost (intermediate) + park draws visitors → the proposal deserves support (main).", "why_correct": "Everything else supports the first sentence. 'Removing the garage would cost few customers' is itself supported by the survey and in turn supports the main claim, which makes it intermediate.", "why_wrong": {"A": {"trap": "WRONG_ROLE", "text": "Intermediate conclusion: supported by the survey, supporting the main claim."}, "C": {"trap": "PREMISE_AS_CONCLUSION", "text": "A premise explaining the survey result."}, "D": {"trap": "OPPOSING_VIEW", "text": "The objection the author answers."}, "E": {"trap": "SHELL_GAME", "text": "The argument never compares visitor numbers."}}, "method_reminder": "When 'so' appears mid-argument, test whether its claim supports something else. If it does, it is intermediate.", "flashcard": {"front": "A claim is supported AND supports another. What is it?", "back": "An intermediate conclusion. The main conclusion is the one nothing else in the argument relies on."}}, "original": true}, {"id": "LR-RO-001", "section": "LR", "type": "Role", "subtype": "alternative-explanation", "difficulty": 3, "target_seconds": 80, "tags": ["education", "role"], "stimulus": "Critics claim that the new reading curriculum has failed because test scores fell in its first year. But first-year declines are common whenever a curriculum changes, as teachers and students adjust to new materials. Indeed, scores at schools that adopted the curriculum two years ago are now higher than ever. So the claim that the curriculum has failed is premature.", "stem": "The claim that first-year declines are common whenever a curriculum changes plays which one of the following roles in the argument?", "choices": {"A": "It is the main conclusion of the argument.", "B": "It is a claim the argument attributes to the critics.", "C": "It is evidence that the curriculum has improved test scores.", "D": "It is a concession that the critics' conclusion is correct.", "E": "It is offered as an alternative explanation of the evidence on which the critics base their claim."}, "answer": "E", "explanation": {"argument_skeleton": "Critics: scores fell, so it failed. Author: first-year declines are normal (explains the fall another way) + older adopters now score higher. Conclusion: the failure claim is premature.", "why_correct": "The critics rely on the first-year drop. The author explains that drop as a normal adjustment rather than failure. That is an alternative explanation of their evidence, supporting the main conclusion.", "why_wrong": {"A": {"trap": "PREMISE_AS_CONCLUSION", "text": "It supports the conclusion that the failure claim is premature."}, "B": {"trap": "OPPOSING_VIEW", "text": "The critics claim failure; this claim is the author's reply."}, "C": {"trap": "SHELL_GAME", "text": "It explains a decline; the later-score claim is the evidence of improvement."}, "D": {"trap": "WRONG_ROLE", "text": "It concedes the scores fell, not that the critics' conclusion is right."}}, "method_reminder": "Label the claim by what it does to the opposing view: concede, deny, or explain the evidence another way.", "flashcard": {"front": "Author accepts the critics' data but explains it differently. Role?", "back": "An alternative explanation of the evidence the opposing view relies on."}}, "original": true}, {"id": "LR-RO-002", "section": "LR", "type": "Role", "subtype": "intermediate", "difficulty": 4, "target_seconds": 90, "tags": ["ecology", "role", "intermediate-conclusion"], "stimulus": "Bird-watchers have long held that the gray warbler avoids open farmland. This belief is mistaken. Tracking data show that gray warblers regularly forage in farm fields during their autumn migration. Thus the warbler's decline cannot be blamed solely on the loss of forest habitat, since the species also depends on farmland, much of which is now being converted to housing.", "stem": "The claim that the bird-watchers' belief is mistaken figures in the argument in which one of the following ways?", "choices": {"A": "It is a conclusion that is supported by evidence and that in turn supports the argument's main conclusion.", "B": "It is the main conclusion of the argument.", "C": "It is a premise that is not supported by any other claim in the argument.", "D": "It is a hypothesis the argument ultimately rejects.", "E": "It is evidence offered for the claim that gray warblers avoid open farmland."}, "answer": "A", "explanation": {"argument_skeleton": "Tracking data → the belief is mistaken (warblers use farmland) → warblers depend on farmland → decline is not solely due to forest loss (main).", "why_correct": "The tracking data support it, and it feeds the claim that the species depends on farmland, which supports the main conclusion about the decline. Supported and supporting: intermediate conclusion.", "why_wrong": {"B": {"trap": "WRONG_ROLE", "text": "The main conclusion is about the cause of the decline."}, "C": {"trap": "WRONG_ROLE", "text": "The tracking data support it."}, "D": {"trap": "VALENCE_FLIP", "text": "The author asserts it; the bird-watchers' belief is what gets rejected."}, "E": {"trap": "REVERSAL", "text": "It contradicts the claim that warblers avoid farmland."}}, "method_reminder": "Draw arrows. A claim with arrows coming in and going out is intermediate.", "flashcard": {"front": "How do you tell a premise from an intermediate conclusion?", "back": "A premise has no support inside the argument. An intermediate conclusion is supported and supports something else."}}, "original": true}, {"id": "LR-ME-001", "section": "LR", "type": "Method", "subtype": "counter-premise", "difficulty": 3, "target_seconds": 85, "tags": ["urban", "transport", "policy"], "stimulus": "Councilmember Reyes argues that the city should not adopt congestion pricing because it would burden low-income commuters. But under the proposed plan, the revenue would fund expanded bus service in the very neighborhoods where most low-income commuters live, and those commuters drive downtown far less often than other residents do. So the concern Reyes raises is not a reason to reject the plan.", "stem": "The argument proceeds by", "choices": {"A": "questioning the motives behind Reyes's opposition to the plan", "B": "arguing that the plan's benefits to the city as a whole outweigh its costs to every group", "C": "showing that the group Reyes says would be harmed would in fact be largely spared, and partly helped, by the plan", "D": "offering a counterexample to a general principle on which Reyes relies", "E": "appealing to the success of congestion pricing in other cities"}, "answer": "C", "explanation": {"argument_skeleton": "Reyes: pricing burdens low-income commuters. Reply: they rarely drive downtown (spared) and gain bus service (helped). Conclusion: Reyes's concern is not a reason to reject.", "why_correct": "The argument answers Reyes on his own terms, examining the group he named and showing it would face little cost and some benefit. C describes both moves.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "Reyes's motives are never discussed."}, "B": {"trap": "TOO_BROAD", "text": "The argument focuses on low-income commuters, not a citywide cost-benefit tally."}, "D": {"trap": "WRONG_ROLE", "text": "No general principle or counterexample appears."}, "E": {"trap": "OUT_OF_SCOPE", "text": "Other cities are never mentioned."}}, "method_reminder": "Name the move before reading choices: here, 'answers the objection by examining the group it names'.", "flashcard": {"front": "Method: author shows the people the opponent worried about are not actually harmed. Name it.", "back": "Rebutting an objection by showing its predicted harm does not fall on the group named."}}, "original": true}, {"id": "LR-EV-001", "section": "LR", "type": "Evaluate", "subtype": "confounder", "difficulty": 3, "target_seconds": 80, "tags": ["causal", "medicine"], "stimulus": "A hospital found that patients assigned to rooms with windows facing a garden were discharged, on average, a day earlier than patients assigned to rooms facing a parking lot. The hospital's administrators concluded that a view of nature speeds recovery.", "stem": "Which one of the following would it be most useful to know in order to evaluate the administrators' conclusion?", "choices": {"A": "how many rooms in the hospital face the garden", "B": "whether patients were assigned to garden-facing rooms on the basis of how serious their conditions were", "C": "whether patients preferred the garden view", "D": "how much it would cost to plant gardens outside other wings of the hospital", "E": "whether other hospitals in the region have gardens"}, "answer": "B", "explanation": {"argument_skeleton": "Premise: garden-view patients left a day earlier. Conclusion: the view speeds recovery. Gap: the two groups did not differ in some other way that affects recovery.", "why_correct": "Variable Test: if less serious cases went to garden rooms, the conclusion weakens; if assignment was unrelated to severity, a major confounder is ruled out and it strengthens. Either answer swings the argument.", "why_wrong": {"A": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Either answer leaves the comparison untouched."}, "C": {"trap": "OUT_OF_SCOPE", "text": "Preference is not recovery speed."}, "D": {"trap": "OUT_OF_SCOPE", "text": "Cost does not bear on whether the view helps."}, "E": {"trap": "IRRELEVANT_COMPARISON", "text": "Other hospitals' gardens say nothing about these patients."}}, "method_reminder": "Run the Variable Test: a good question has a yes that helps and a no that hurts.", "flashcard": {"front": "Evaluate question. Fast way to test each choice?", "back": "The Variable Test: imagine both answers. If one strengthens and the other weakens, it matters."}}, "original": true}, {"id": "LR-PA-001", "section": "LR", "type": "Parallel Reasoning", "subtype": "valid-chain", "difficulty": 3, "target_seconds": 95, "tags": ["conditional", "parallel"], "stimulus": "Every member of the rowing team trains at dawn. Anyone who trains at dawn goes to sleep before ten. So every member of the rowing team goes to sleep before ten.", "stem": "Which one of the following arguments is most similar in its pattern of reasoning to the argument above?", "choices": {"A": "Every violinist in the orchestra owns a metronome. Some people who own metronomes practice daily. So some violinists in the orchestra practice daily.", "B": "Every member of the chess club goes to sleep before ten. Anyone who trains at dawn goes to sleep before ten. So every member of the chess club trains at dawn.", "C": "Most of the editors read every submission. Everyone who reads every submission is exhausted by spring. So most of the editors are exhausted by spring.", "D": "Every apprentice in the shop works on Saturdays. No one who works on Saturdays attends the evening class. So no apprentice in the shop attends the evening class.", "E": "Anyone who has read the brief knows the facts of the case, and every judge on the panel has read the brief. So every judge on the panel knows the facts of the case."}, "answer": "E", "explanation": {"argument_skeleton": "All A are B; all B are C; so all A are C. Valid, universal, positive.", "why_correct": "E: all judges have read the brief (A → B); all who read it know the facts (B → C); so all judges know the facts (A → C). Same valid chain; the premise order does not matter.", "why_wrong": {"A": {"trap": "MISMATCHED_STRUCTURE", "text": "Uses 'some' and is invalid: the metronome owners who practice may not be violinists."}, "B": {"trap": "MISTAKEN_REVERSAL", "text": "Both premises point to sleeping before ten, then the conclusion reverses one of them. Invalid."}, "C": {"trap": "QUANTIFIER_SHIFT", "text": "Valid, but 'most' in the premise and conclusion does not match the original's 'every'."}, "D": {"trap": "MISMATCHED_STRUCTURE", "text": "Valid, but with a negative premise and conclusion; the original has none."}}, "method_reminder": "Compare conclusions first: quantifier and polarity eliminate most choices before diagramming.", "flashcard": {"front": "Parallel Reasoning: fastest first filter?", "back": "Match the conclusion's quantifier, strength and polarity. Then diagram survivors."}}, "original": true}, {"id": "LR-PA-002", "section": "LR", "type": "Parallel Flaw", "subtype": "affirming-the-consequent", "difficulty": 3, "target_seconds": 95, "tags": ["conditional", "parallel", "mistaken-reversal"], "stimulus": "If the Osprey restaurant had received a good review in Sunday's paper, it would be fully booked tonight. It is fully booked tonight. So it must have received a good review in Sunday's paper.", "stem": "Which one of the following arguments contains flawed reasoning most similar to that in the argument above?", "choices": {"A": "If the lake had frozen, the ferry would have been canceled. The lake froze. So the ferry must have been canceled.", "B": "If the shipment had arrived, the shelves would be full. The shelves are empty. So the shipment has not arrived.", "C": "If the council had approved the budget, the library would open on Sundays. The library opens on Sundays. So the council must have approved the budget.", "D": "If the printer had been repaired, the reports would be ready. The printer was not repaired. So the reports must not be ready.", "E": "If the coach had changed the lineup, the team would have scored early. The team did not score early. So the coach must have changed the lineup."}, "answer": "C", "explanation": {"argument_skeleton": "If A then B; B; so A. The Mistaken Reversal (affirming the consequent).", "why_correct": "C: if approved then Sunday hours; Sunday hours; so approved. Same reversal, same 'must' conclusion.", "why_wrong": {"A": {"trap": "MISMATCHED_STRUCTURE", "text": "If A then B; A; so B. Valid."}, "B": {"trap": "MISMATCHED_STRUCTURE", "text": "If A then B; not B; so not A. Valid contrapositive."}, "D": {"trap": "MISTAKEN_NEGATION", "text": "If A then B; not A; so not B. A different flaw."}, "E": {"trap": "MISMATCHED_STRUCTURE", "text": "If A then B; not B; so A. A different, self-contradicting error."}}, "method_reminder": "Name the flaw in letters first, then hunt for its twin.", "flashcard": {"front": "If A then B. B. So A. Name and twin?", "back": "Mistaken Reversal. Its twin is any argument that affirms the necessary condition and concludes the sufficient one."}}, "original": true}, {"id": "LR-PR-001", "section": "LR", "type": "Principle", "subtype": "identify", "difficulty": 3, "target_seconds": 85, "tags": ["ethics", "law", "principle"], "stimulus": "Liam borrowed a ladder from his neighbor. While Liam was using it carefully, it cracked because of a hidden defect in the wood. Liam's neighbor asked him to pay for a replacement, but Liam is not obligated to do so.", "stem": "Which one of the following principles, if valid, most helps to justify the conclusion above?", "choices": {"A": "A borrower who damages a borrowed item is always obligated to replace it.", "B": "Lenders should inspect items for defects before lending them.", "C": "A person who uses a borrowed item carelessly is obligated to replace it if it breaks.", "D": "A borrower is not obligated to replace a borrowed item damaged during careful use if the damage resulted from a defect the borrower could not have detected.", "E": "No one is obligated to pay for an item that was defective when it was sold."}, "answer": "D", "explanation": {"argument_skeleton": "Facts: borrowed, careful use, hidden defect. Judgment: no obligation to replace. Needed: careful use + undetectable defect → no obligation.", "why_correct": "D's condition matches the facts exactly (careful use, hidden defect) and its outcome matches the judgment (no obligation).", "why_wrong": {"A": {"trap": "REVERSAL", "text": "Reaches the opposite judgment."}, "B": {"trap": "TOO_WEAK", "text": "Says what lenders should do; never reaches the borrower's obligation."}, "C": {"trap": "MISTAKEN_NEGATION", "text": "Careless → obligated does not give careful → not obligated."}, "E": {"trap": "SHELL_GAME", "text": "About selling, not borrowing."}}, "method_reminder": "Check the outcome first, then confirm the facts meet the principle's condition.", "flashcard": {"front": "Principle Identify: which part do you check first?", "back": "The outcome. Most wrong principles reach a different judgment; then confirm the facts meet the condition."}}, "original": true}, {"id": "LR-PR-002", "section": "LR", "type": "Principle", "subtype": "apply", "difficulty": 4, "target_seconds": 95, "tags": ["journalism", "principle", "necessary-condition"], "stimulus": "Principle: A journalist may publish information obtained from an anonymous source only if the journalist has independently confirmed the information and publishing it serves the public interest.", "stem": "Which one of the following judgments most closely conforms to the principle above?", "choices": {"A": "Because Dana could not independently confirm her anonymous source's account of the mayor's finances, she should not have published it, even though the story concerned public spending.", "B": "Because Ravi independently confirmed his anonymous source's report and the report concerned public safety, Ravi was justified in publishing it.", "C": "Because Mei's source was named rather than anonymous, Mei was not required to confirm the information before publishing it.", "D": "Because Ola's story did not serve the public interest, Ola should have relied on a named source instead.", "E": "Because Sam's anonymous source had been reliable in the past, Sam could publish the information without confirming it."}, "answer": "A", "explanation": {"argument_skeleton": "Publish anonymous info → confirmed AND public interest. Contrapositive: not confirmed (or not public interest) → may not publish.", "why_correct": "Dana failed the confirmation condition, so by the contrapositive she may not publish. The public-interest fact does not rescue her because both conditions are required.", "why_wrong": {"B": {"trap": "MISTAKEN_REVERSAL", "text": "Treats the necessary conditions as sufficient. The principle never says meeting them justifies publishing."}, "C": {"trap": "MISTAKEN_NEGATION", "text": "The principle is silent on named sources; it does not say they need no confirmation."}, "D": {"trap": "OUT_OF_SCOPE", "text": "The principle says nothing about switching to named sources."}, "E": {"trap": "CONTRADICTS", "text": "Publishing unconfirmed anonymous information violates the principle."}}, "method_reminder": "'Only if' gives necessary conditions. Conforming judgments use the contrapositive to forbid, not the conditions to permit.", "flashcard": {"front": "Principle: may X only if A and B. Which judgment conforms safely?", "back": "Failing A or B, so may not X. Meeting A and B does not establish permission."}}, "original": true}, {"id": "LR-PX-001", "section": "LR", "type": "Paradox", "subtype": "induced-demand", "difficulty": 3, "target_seconds": 80, "tags": ["urban", "transport", "paradox"], "stimulus": "After the city widened its busiest highway by adding a lane in each direction, average rush-hour commute times on the highway increased rather than decreased.", "stem": "Which one of the following, if true, most helps to explain the result described above?", "choices": {"A": "The widening project was completed ahead of schedule.", "B": "The added capacity led many drivers who had previously used other routes or traveled at other times to use the highway during rush hour.", "C": "Before the widening, the highway was already the fastest route into the city.", "D": "Many drivers reported that the wider highway felt safer to drive on.", "E": "The widening project cost more than the city had originally budgeted."}, "answer": "B", "explanation": {"argument_skeleton": "Paradox: more capacity, and yet longer commutes.", "why_correct": "If the new lanes drew in many additional rush-hour drivers, traffic could exceed the added capacity. Both facts become true at once.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "Construction timing does not explain slower commutes afterward."}, "C": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Being fastest before does not explain getting slower after."}, "D": {"trap": "DEEPENS_PARADOX", "text": "Feeling safer might speed drivers up, which deepens the puzzle."}, "E": {"trap": "OUT_OF_SCOPE", "text": "Cost has nothing to do with commute times."}}, "method_reminder": "State the paradox as 'X, and yet Y', then look for what changed in who or how many.", "flashcard": {"front": "More capacity, yet worse congestion. Typical resolution?", "back": "Induced demand: the improvement attracts new users who fill it."}}, "original": true}, {"id": "LR-PX-002", "section": "LR", "type": "Paradox", "subtype": "timing", "difficulty": 4, "target_seconds": 90, "tags": ["paradox", "reverse-causation", "safety"], "stimulus": "In a large national survey, people who owned smoke detectors were more likely than people who did not to report having had a fire in their home in the past five years. Yet fire-safety experts are confident that owning a smoke detector does not make house fires more likely.", "stem": "Which one of the following, if true, most helps to reconcile the survey result with the experts' view?", "choices": {"A": "Smoke detectors greatly reduce the number of deaths caused by house fires.", "B": "Some smoke detectors are installed incorrectly by homeowners.", "C": "People who own smoke detectors are also more likely to own fire extinguishers.", "D": "House fires are more common in winter than in summer.", "E": "Many people install smoke detectors only after experiencing a fire in their home."}, "answer": "E", "explanation": {"argument_skeleton": "Detector owners report more fires, and yet detectors do not cause fires.", "why_correct": "If a fire often prompts the purchase, past fires produce detector ownership. The correlation is real, the arrow runs from fire to detector, and the experts can be right.", "why_wrong": {"A": {"trap": "SHELL_GAME", "text": "Deaths are not fires; this explains nothing about fire frequency."}, "B": {"trap": "OUT_OF_SCOPE", "text": "Poor installation does not cause fires."}, "C": {"trap": "DEEPENS_PARADOX", "text": "Owners have even more safety equipment, which makes their extra fires stranger."}, "D": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Seasonality applies to owners and non-owners alike."}}, "method_reminder": "When a correlation seems to defy known causes, check whether the effect came first.", "flashcard": {"front": "Safety gear owners report more accidents. Classic resolution?", "back": "Reverse causation in time: people buy the gear after an accident."}}, "original": true}, {"id": "LR-PI-001", "section": "LR", "type": "Point at Issue", "subtype": "disagree", "difficulty": 3, "target_seconds": 80, "tags": ["urban", "dialogue"], "stimulus": "Ines: The city should convert the old rail yard into a public park. Green space is scarce in the eastern districts, and a park there would serve thousands of residents.\nMarco: Green space is certainly scarce in the eastern districts. But the rail yard's soil is contaminated, and cleaning it to a standard safe for a park would cost far more than building housing on it. The yard should be used for housing.", "stem": "Ines and Marco disagree over whether", "choices": {"A": "green space is scarce in the eastern districts", "B": "the rail yard's soil is contaminated", "C": "housing is more needed than parks throughout the city", "D": "the old rail yard should be converted into a public park", "E": "cleaning contaminated soil is ever worth its cost"}, "answer": "D", "explanation": {"argument_skeleton": "Ines: park. Marco: concedes scarcity, objects on cost, recommends housing.", "why_correct": "Ines says the yard should become a park; Marco says it should be housing instead
