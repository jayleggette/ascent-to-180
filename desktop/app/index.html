es doubled, 10% to 20%. Conclusion: older residents became more entrepreneurial. Gap: a bigger share means a higher rate of founding per older resident.", "why_correct": "C changes the base. With new businesses flat, older founders doubled in number, but older residents tripled. Founders per older resident fell by about a third, so the typical older resident became less entrepreneurial, not more.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "Survival rates say nothing about how often older residents start businesses."}, "B": {"trap": "IRRELEVANT_COMPARISON", "text": "Other counties' trends neither explain nor undercut Ostrava's numbers."}, "D": {"trap": "OUT_OF_SCOPE", "text": "The kind of business is irrelevant to how entrepreneurial older residents are."}, "E": {"trap": "EXTREME", "text": "The sweeping 'every' grabs attention, but prior retirement has no bearing on the rate of founding."}}, "method_reminder": "A share is not a rate. Check what happened to the size of the group before reading a rising share as rising behavior.", "flashcard": {"front": "Older founders' share doubled. Proof that older people became more entrepreneurial?", "back": "No. If the older population tripled, founders per older person fell. A share hides changes in group size."}}, "original": true}, {"id": "LR-FL-006", "section": "LR", "type": "Flaw", "subtype": "equivocation", "difficulty": 4, "target_seconds": 95, "tags": ["equivocation", "philosophy-of-science"], "stimulus": "Essayist: Scientists insist that any good theory must be falsifiable, that is, capable of being shown false. But a theory that could be shown false is a theory that might well be false, and no one should rely on a theory that might well be false. So by scientists' own standard, no good theory deserves our reliance.", "stem": "The reasoning in the essayist's argument is most vulnerable to criticism on the grounds that the argument", "choices": {"A": "draws a general conclusion about theories from a small number of examples", "B": "takes for granted that what is true of some good theories is true of all of them", "C": "concludes that a theory is false merely because no one has proved it true", "D": "treats a theory's being open to disproof as though that made the theory likely to be false", "E": "overlooks the possibility that some theories that cannot be falsified are nonetheless useful"}, "answer": "D", "explanation": {"argument_skeleton": "Premise: a good theory must be falsifiable (could be shown false). Premise: a theory that could be shown false might well be false. Premise: do not rely on what might well be false. Conclusion: no good theory deserves reliance. Gap: 'could be shown false' quietly becomes 'is likely false'.", "why_correct": "Falsifiable means testable: if the theory were false, evidence could show it. That says nothing about the odds that it is false. The essayist swaps in 'might well be false', an equivocation that makes the startling conclusion possible.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "The argument cites no examples at all; it works from definitions."}, "B": {"trap": "QUANTIFIER_SHIFT", "text": "The premise says every good theory must be falsifiable, so no shift from some to all occurs."}, "C": {"trap": "SHELL_GAME", "text": "The essayist never concludes that any theory is false, only that none deserves reliance."}, "E": {"trap": "TRUE_BUT_IRRELEVANT", "text": "The conclusion concerns good theories, which are falsifiable by the premise's own standard. Useful unfalsifiable theories do not touch it."}}, "method_reminder": "When innocent premises yield a startling conclusion, look for a key word or phrase that changes meaning between steps.", "flashcard": {"front": "Falsifiable, so might well be false, so unreliable. The flaw?", "back": "Equivocation: 'could be shown false if false' becomes 'probably false'. Testable is not doubtful."}}, "original": true}, {"id": "LR-FL-007", "section": "LR", "type": "Flaw", "subtype": "source-attack", "difficulty": 2, "target_seconds": 70, "tags": ["ad-hominem", "source-attack", "policy"], "stimulus": "Columnist: The economist Ruth Adeyemi argues that the proposed tax on sugary drinks would reduce obesity rates in our state. But Adeyemi's research institute received a large grant last year from a foundation that campaigns against sugary drinks. We can therefore dismiss her argument.", "stem": "The columnist's reasoning is flawed because it", "choices": {"A": "rejects an argument because of a fact about the person making it rather than because of any weakness in the argument itself", "B": "assumes that a tax on sugary drinks would be popular with voters", "C": "treats the absence of evidence that the tax would work as proof that it would fail", "D": "presumes that grants from foundations always determine the findings of the research they fund", "E": "fails to consider that obesity has many causes besides sugary drinks"}, "answer": "A", "explanation": {"argument_skeleton": "Premise: Adeyemi's institute took money from an anti-sugary-drink foundation. Conclusion: her argument can be dismissed. Gap: who funds the arguer settles whether the argument is good.", "why_correct": "The funding might be a reason to check her work closely, but it is not evidence that her reasoning or data are wrong. The columnist never engages the argument; it attacks the arguer instead.", "why_wrong": {"B": {"trap": "OUT_OF_SCOPE", "text": "Popularity with voters plays no role in the columnist's reasoning."}, "C": {"trap": "SHELL_GAME", "text": "The columnist never discusses evidence about the tax at all."}, "D": {"trap": "EXTREME", "text": "'Always determine' is far stronger than anything the columnist commits to. The error is dismissing the argument without examining it, not a claim about all grants."}, "E": {"trap": "TRUE_BUT_IRRELEVANT", "text": "That might be a criticism of Adeyemi's argument, but it is not the error in the columnist's."}}, "method_reminder": "Source attacks: a motive to argue for X is not a reason to think the argument for X is bad. Look for the jump from who is arguing to whether the argument works.", "flashcard": {"front": "She is funded by an anti-soda group, so ignore her case for a soda tax. The flaw?", "back": "Ad hominem: it attacks the source's motives instead of showing her reasoning or evidence is wrong."}}, "original": true}, {"id": "LR-FL-008", "section": "LR", "type": "Flaw", "subtype": "mistaken-negation", "difficulty": 2, "target_seconds": 70, "tags": ["conditional", "mistaken-negation", "art-market"], "stimulus": "Gallery director: If a painting has been authenticated by the Varga Institute, collectors will pay a premium for it. The landscape we acquired last month has never been submitted to the Varga Institute, so collectors will not pay a premium for it.", "stem": "Which one of the following most accurately describes a flaw in the gallery director's reasoning?", "choices": {"A": "It infers that a painting has been authenticated from the fact that collectors will pay a premium for it.", "B": "It confuses the price collectors will pay for a painting with the painting's artistic merit.", "C": "It treats authentication by the Varga Institute as necessary for a painting to be genuine.", "D": "It applies a general claim about paintings to one particular painting.", "E": "It treats a condition that is enough to secure a premium as though it were required for one."}, "answer": "E", "explanation": {"argument_skeleton": "Rule: authenticated → premium. Fact: not authenticated (never submitted). Conclusion: no premium. Invalid: from A → B and not A, nothing follows about B.", "why_correct": "Authentication guarantees a premium; nothing says it is the only route to one. A famous name, a fine provenance, or excellent condition could earn a premium too. Concluding 'no premium' from 'no authentication' is a mistaken negation.", "why_wrong": {"A": {"trap": "MISTAKEN_REVERSAL", "text": "That is the reversal error, premium → authenticated. The director commits the negation error instead."}, "B": {"trap": "OUT_OF_SCOPE", "text": "Artistic merit never enters the argument."}, "C": {"trap": "SHELL_GAME", "text": "Close, but the director treats authentication as required for a premium, not for being genuine."}, "D": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Applying a general rule to a case is fine. The problem is how this rule is applied."}}, "method_reminder": "Diagram the rule. A → B lets you infer not A from not B. Negating the left side alone proves nothing.", "flashcard": {"front": "Authenticated → premium. Not authenticated, so no premium?", "back": "Mistaken negation. Authentication is enough for a premium, not required. Other things can earn one."}}, "original": true}, {"id": "LR-FL-009", "section": "LR", "type": "Flaw", "subtype": "circular", "difficulty": 3, "target_seconds": 80, "tags": ["circular", "urban", "transit"], "stimulus": "Editorial: The city's new transit authority is trustworthy. Its annual report states that it has met every one of its public commitments, and an organization that meets all of its public commitments is trustworthy. Nor is there any reason to doubt the report's accuracy, since it was issued by a trustworthy authority.", "stem": "The reasoning in the editorial is flawed because the editorial", "choices": {"A": "infers that an organization will keep its commitments in the future from the fact that it has kept them in the past", "B": "assumes that no organization's annual report could ever contain an error", "C": "relies on the truth of its conclusion to support one of its premises", "D": "treats meeting public commitments as the only way an organization can be trustworthy", "E": "ignores evidence that the transit authority has failed to meet some of its commitments"}, "answer": "C", "explanation": {"argument_skeleton": "Premise: the report says every commitment was met. Premise: meeting all commitments → trustworthy. Support for the report's accuracy: the authority is trustworthy. Conclusion: the authority is trustworthy. The conclusion props up a premise.", "why_correct": "The report proves trustworthiness only if it is accurate, and its accuracy is defended by appealing to the authority's trustworthiness, the very point in question. The argument runs in a circle.", "why_wrong": {"A": {"trap": "SHELL_GAME", "text": "The conclusion concerns present trustworthiness, not predictions about future commitments."}, "B": {"trap": "EXTREME", "text": "The editorial assumes only that this report is accurate. Its error is how it supports that assumption."}, "D": {"trap": "MISTAKEN_REVERSAL", "text": "The editorial says meeting commitments is enough for trustworthiness, not that it is the only way."}, "E": {"trap": "OUT_OF_SCOPE", "text": "No such evidence is mentioned, so ignoring it cannot be the flaw."}}, "method_reminder": "Circular arguments hide the conclusion inside the support. Trace each premise's backing; if it leads back to the conclusion, name circularity.", "flashcard": {"front": "The report is accurate because the authority is trustworthy, and the report proves it is trustworthy. Flaw?", "back": "Circular reasoning: the conclusion is assumed in order to support a premise that is then used to prove it."}}, "original": true}, {"id": "LR-FL-010", "section": "LR", "type": "Flaw", "subtype": "false-dilemma", "difficulty": 2, "target_seconds": 70, "tags": ["false-dilemma", "education", "budget"], "stimulus": "School board member: Either we cut the music program or we raise property taxes. Since residents overwhelmingly oppose higher property taxes, we have no choice but to cut the music program.", "stem": "The school board member's argument is most vulnerable to the criticism that it", "choices": {"A": "assumes that residents who oppose higher taxes place no value on the music program", "B": "presumes without justification that cutting the music program and raising property taxes are the only options available", "C": "relies on residents' preferences in deciding a question that should be settled by experts", "D": "concludes that the music program is not worth funding because residents will not pay for it", "E": "fails to explain why the music program was created in the first place"}, "answer": "B", "explanation": {"argument_skeleton": "Premise: either cut music or raise taxes. Premise: residents oppose higher taxes. Conclusion: cut music. Gap: those really are the only two options.", "why_correct": "Given its premises, the argument is valid; the trouble is the first premise. Budgets have other levers, such as trimming other spending, seeking grants, or drawing on reserves. Treating two options as the only ones, without support, is a false dilemma.", "why_wrong": {"A": {"trap": "EXTREME", "text": "'No value' is far stronger than anything the argument assumes. It relies only on residents' opposition to higher taxes."}, "C": {"trap": "OUT_OF_SCOPE", "text": "Expertise is never at issue, and tax preferences are not a matter for experts."}, "D": {"trap": "SHELL_GAME", "text": "The member never judges the program's worth, only claims there is no alternative to cutting it."}, "E": {"trap": "OUT_OF_SCOPE", "text": "The program's origins are irrelevant to whether it must be cut."}}, "method_reminder": "When an argument says 'either X or Y', ask who closed the other doors. An unsupported either-or premise is the flaw.", "flashcard": {"front": "Either cut music or raise taxes; taxes are unpopular; so cut music. Flaw?", "back": "False dilemma: it assumes those are the only two options when other cuts or funding sources may exist."}}, "original": true}, {"id": "LR-NA-004", "section": "LR", "type": "Necessary Assumption", "subtype": "economics", "difficulty": 4, "target_seconds": 95, "tags": ["negation-test", "economics", "tourism"], "stimulus": "Economist: A new tax on hotel rooms in Port Avery would not reduce hotel employment in the city. Port Avery's hotels compete only with one another for guests visiting the city. Since the tax would raise every hotel's prices by the same amount, no hotel would lose guests to a competitor by passing the tax on to its guests.", "stem": "Which one of the following is an assumption on which the economist's argument depends?", "choices": {"A": "Most hotel employees in Port Avery live within the city limits.", "B": "Port Avery's hotels have raised their prices in past years without losing guests.", "C": "No hotel in Port Avery would raise its prices by more than the amount of the tax.", "D": "The higher room prices would not lead many travelers to visit Port Avery less often or to stay fewer nights.", "E": "The revenue from the tax would be spent on attracting more visitors to Port Avery."}, "answer": "D", "explanation": {"argument_skeleton": "Premise: Port Avery's hotels compete only with one another. Premise: an equal price rise means no hotel loses guests to a rival. Conclusion: hotel employment will not fall. Gap: losing guests to rivals is the only way higher prices could cut bookings.", "why_correct": "Negate D: higher prices lead many travelers to visit less often or stay fewer nights. Then every hotel books fewer rooms at once and needs fewer workers, even though no hotel lost a guest to a rival. The argument requires D.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "Where employees live has nothing to do with how many jobs the hotels offer."}, "B": {"trap": "NOT_NECESSARY", "text": "Negate it: past price increases did cost guests. That history would worry us, but the argument rests on this tax hitting every hotel equally, not on past experience."}, "C": {"trap": "TOO_STRONG", "text": "Negate it: one hotel raises prices by more than the tax. It may lose guests to rivals, but the city's total bookings and jobs need not fall."}, "E": {"trap": "NOT_NECESSARY", "text": "Spending the revenue on tourism would help offset any drop, but the economist never relies on it."}}, "method_reminder": "Negation test: negate the answer. If the conclusion no longer follows, the answer is necessary. Helpful answers that the argument survives without are traps.", "flashcard": {"front": "Equal tax on every hotel, so none loses guests to rivals, so no job losses. Missing assumption?", "back": "Higher prices will not make travelers visit less or stay shorter. Rivals are not the only way to lose guests."}}, "original": true}, {"id": "LR-NA-005", "section": "LR", "type": "Necessary Assumption", "subtype": "evidence-origin", "difficulty": 4, "target_seconds": 95, "tags": ["negation-test", "art-history", "attribution"], "stimulus": "Art historian: The portrait traditionally attributed to the court painter Elena Marsh was probably painted by someone else. Infrared imaging reveals a detailed underdrawing beneath its paint, yet none of the forty portraits securely attributed to Marsh, which together span her entire career, shows any underdrawing.", "stem": "The art historian's argument requires assuming which one of the following?", "choices": {"A": "None of Marsh's students ever painted directly onto a canvas without an underdrawing.", "B": "The underdrawing was made in preparing this portrait, rather than being left over from an earlier, abandoned work on the same canvas.", "C": "Infrared imaging can detect underdrawing beneath every kind of paint used in Marsh's era.", "D": "Marsh trained more students than any other court painter of her time.", "E": "The portrait was painted during the years when Marsh was most active at court."}, "answer": "B", "explanation": {"argument_skeleton": "Premise: the disputed portrait has a detailed underdrawing. Premise: none of 40 secure Marsh portraits, spanning her career, has one. Conclusion: someone else probably painted it. Gap: the underdrawing reflects how this portrait's painter worked.", "why_correct": "Negate B: the underdrawing belongs to an earlier, abandoned work on a reused canvas. Then it says nothing about how the portrait itself was painted, and Marsh could have painted directly over it, as she always did. The evidence for another hand disappears.", "why_wrong": {"A": {"trap": "TOO_STRONG", "text": "The conclusion is only that someone other than Marsh painted it. Negate A and the underdrawing still points away from Marsh."}, "C": {"trap": "TOO_STRONG", "text": "'Every kind of paint' is more than needed. Negate it and the argument survives, so long as imaging works on the paints Marsh used."}, "D": {"trap": "OUT_OF_SCOPE", "text": "How many students Marsh trained has no bearing on who painted this portrait."}, "E": {"trap": "NOT_NECESSARY", "text": "The secure portraits span her whole career, so the date within it does not matter."}}, "method_reminder": "Ask what the evidence must be evidence of. If a clue could have another origin, the argument assumes it does not.", "flashcard": {"front": "Underdrawing found; the painter never used one; so someone else painted it. Hidden assumption?", "back": "The underdrawing was made for this portrait, not left over from an earlier work on a reused canvas."}}, "original": true}, {"id": "LR-NA-006", "section": "LR", "type": "Necessary Assumption", "subtype": "capacity", "difficulty": 3, "target_seconds": 85, "tags": ["negation-test", "business", "airline"], "stimulus": "Airline executive: Dropping our afternoon flight between Pell and Ostrava will not cost us a significant number of passengers on that route. The afternoon flight carries only 30 percent of the route's passengers, and our morning and evening flights on the route are rarely more than half full.", "stem": "Which one of the following is an assumption required by the executive's argument?", "choices": {"A": "The plane now used for the afternoon flight could be filled on another route.", "B": "No passenger on the afternoon flight has ever chosen it because of its departure time.", "C": "The morning and evening flights on the route charge the same fares as the afternoon flight.", "D": "No other airline flies between Pell and Ostrava.", "E": "Passengers who now take the afternoon flight would not, in significant numbers, switch to another airline or stop flying the route rather than take one of the airline's other flights."}, "answer": "E", "explanation": {"argument_skeleton": "Premise: the afternoon flight carries 30% of the route's passengers. Premise: the morning and evening flights are rarely over half full. Conclusion: dropping the afternoon flight will not cost a significant number of passengers. Gap: afternoon passengers will move to the other flights rather than leave.", "why_correct": "Empty seats help only if displaced passengers take them. Negate E: many afternoon passengers would switch airlines or stop flying the route. Then the airline loses them, and the conclusion fails.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "Using the plane elsewhere bears on profit, not on whether this route loses passengers."}, "B": {"trap": "EXTREME", "text": "'No passenger ever' is far stronger than needed. Some may prefer the afternoon and still switch."}, "C": {"trap": "NOT_NECESSARY", "text": "Negate it: the other flights cost a bit more. Passengers may still take them, so the argument survives."}, "D": {"trap": "TOO_STRONG", "text": "Negate it: rivals fly the route. Passengers may still stay with this airline, so the argument survives."}}, "method_reminder": "Capacity arguments assume behavior: that people will actually use the alternative. Negate that and see whether the argument breaks.", "flashcard": {"front": "The dropped flight carries 30% of passengers and the other flights have room, so no loss. Assumption?", "back": "Displaced passengers will take the other flights rather than leave. Spare seats help only if they get used."}}, "original": true}, {"id": "LR-NA-007", "section": "LR", "type": "Necessary Assumption", "subtype": "dating-evidence", "difficulty": 3, "target_seconds": 80, "tags": ["negation-test", "linguistics", "dating-evidence"], "stimulus": "Lexicographer: The word 'quellish' first appears in dictionaries in 1910. But it occurs in a letter dated 1872 in the Ainsley family papers. So the word was already in use at least a generation before dictionaries recorded it.", "stem": "Which one of the following is an assumption on which the lexicographer's argument depends?", "choices": {"A": "The word 'quellish' was not introduced into the letter by someone who copied or altered it at a later date.", "B": "The Ainsley family papers contain no other letters written before 1900.", "C": "'Quellish' was used more commonly in 1872 than it is today.", "D": "Dictionaries published before 1910 recorded every word in common use at the time.", "E": "The 1872 letter was written by a member of the Ainsley family."}, "answer": "A", "explanation": {"argument_skeleton": "Premise: dictionaries first list 'quellish' in 1910. Premise: it appears in a letter dated 1872. Conclusion: the word was in use well before 1910. Gap: the word was in the letter in 1872, as the date implies.", "why_correct": "Negate A: the word entered the letter when someone later copied or altered it. Then the 1872 date tells us nothing about when the word was used, and the evidence for early use disappears.", "why_wrong": {"B": {"trap": "OUT_OF_SCOPE", "text": "Other letters in the collection are irrelevant to this one."}, "C": {"trap": "TOO_STRONG", "text": "The argument needs the word to have been in use, not more common than it is today."}, "D": {"trap": "EXTREME", "text": "Negate it: dictionaries missed some common words. That fits the argument perfectly well."}, "E": {"trap": "NOT_NECESSARY", "text": "Who wrote the letter does not matter, only when the word was written."}}, "method_reminder": "Dated evidence assumes the date applies to the part you are using. Negate that and see whether the argument survives.", "flashcard": {"front": "A word appears in a letter dated 1872, so it predates its 1910 dictionary entry. Assumption?", "back": "The word was in the letter in 1872, not added later by a copyist or editor."}}, "original": true}, {"id": "LR-SA-004", "section": "LR", "type": "Sufficient Assumption", "subtype": "conditional-chain", "difficulty": 3, "target_seconds": 85, "tags": ["conditional", "chain", "contrapositive"], "stimulus": "Every finalist for the Hale Fellowship has published a book. Anyone who has published a book has a literary agent. Therefore, Mei, who does not belong to the writers' guild, is not a finalist for the Hale Fellowship.", "stem": "The conclusion follows logically if which one of the following is assumed?", "choices": {"A": "Everyone who belongs to the writers' guild has a literary agent.", "B": "Mei has applied for no fellowship other than the Hale Fellowship.", "C": "Everyone who has a literary agent belongs to the writers' guild.", "D": "No one who has published a book belongs to the writers' guild.", "E": "Most people who have a literary agent belong to the writers' guild."}, "answer": "C", "explanation": {"argument_skeleton": "Finalist → published → agent. Mei: not in the guild. Conclusion: Mei is not a finalist. Missing link: agent → guild.", "why_correct": "With C the chain runs finalist → published → agent → guild. Its contrapositive runs not guild → not agent → not published → not finalist. Mei is not in the guild, so she is not a finalist. The conclusion is guaranteed.", "why_wrong": {"A": {"trap": "MISTAKEN_REVERSAL", "text": "Guild → agent points the wrong way. It tells us nothing about someone outside the guild."}, "B": {"trap": "OUT_OF_SCOPE", "text": "Her other applications are irrelevant."}, "D": {"trap": "REVERSAL", "text": "This puts every published author outside the guild, so lacking membership would fit a finalist. It works against the conclusion."}, "E": {"trap": "TOO_WEAK", "text": "'Most' leaves room for Mei's case to be the exception, so the conclusion is not guaranteed."}}, "method_reminder": "Sufficient Assumption: chain the premises toward the conclusion's terms, then supply the missing arrow in the right direction.", "flashcard": {"front": "Finalist → published → agent. Not in the guild, so not a finalist. Missing arrow?", "back": "Agent → guild. Then not guild → not agent → not published → not finalist."}}, "original": true}, {"id": "LR-SA-005", "section": "LR", "type": "Sufficient Assumption", "subtype": "bridge", "difficulty": 3, "target_seconds": 85, "tags": ["bridge", "literature"], "stimulus": "Critic: Halvorsen's new novel should receive the Clare Prize. The prize's rules state that it is to be awarded to the year's most inventive novel, and no other novel published this year experiments with narrative form as boldly as Halvorsen's does.", "stem": "Which one of the following, if assumed, enables the critic's conclusion to be properly drawn?", "choices": {"A": "Bold experiments with narrative form are praised by critics more often than other kinds of innovation.", "B": "Halvorsen's earlier novels were also highly inventive.", "C": "The year's most inventive novel always experiments boldly with narrative form.", "D": "Whichever novel of the year experiments most boldly with narrative form is the year's most inventive novel.", "E": "Bold experimentation with narrative form is one important aspect of a novel's inventiveness."}, "answer": "D", "explanation": {"argument_skeleton": "Rule: the prize goes to the most inventive novel. Premise: Halvorsen's is the boldest experiment with form this year. Conclusion: it should get the prize. Missing link: boldest experiment → most inventive.", "why_correct": "D connects the premise's term (boldest experiment with form) to the rule's term (most inventive). With it, Halvorsen's novel is the most inventive, and the rules award the prize to that novel. The conclusion follows.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "What critics praise is not what the rules require."}, "B": {"trap": "OUT_OF_SCOPE", "text": "Earlier novels are irrelevant; only this year's novel is in contention."}, "C": {"trap": "MISTAKEN_REVERSAL", "text": "Most inventive → bold points the wrong way. Halvorsen's boldness would still not make it the most inventive."}, "E": {"trap": "TOO_WEAK", "text": "One important aspect leaves room for another novel to be more inventive overall."}}, "method_reminder": "Sufficient Assumption: find the term the premises establish and the term the rule requires. The right answer bridges them, in that direction.", "flashcard": {"front": "The prize goes to the most inventive novel; this one is the boldest with form. Missing link?", "back": "Boldest with form → most inventive. 'One aspect of' is too weak, and the reversed arrow fails."}}, "original": true}, {"id": "LR-SA-006", "section": "LR", "type": "Sufficient Assumption", "subtype": "unless", "difficulty": 3, "target_seconds": 90, "tags": ["conditional", "unless", "truth-table"], "stimulus": "The museum will receive the Ostrom grant unless its attendance falls this year. If the museum's new exhibit opens on schedule, attendance will not fall this year. The new exhibit will open on schedule. So the museum will extend its evening hours.", "stem": "The conclusion follows logically if which one of the following is assumed?", "choices": {"A": "The museum will extend its evening hours only if it receives the Ostrom grant.", "B": "If the museum's attendance falls this year, it will not receive the Ostrom grant.", "C": "The new exhibit will draw more visitors than any exhibit the museum has held before.", "D": "If the new exhibit opens on schedule, the museum will receive the Ostrom grant.", "E": "If the museum receives the Ostrom grant, it will extend its evening hours."}, "answer": "E", "explanation": {"argument_skeleton": "On schedule → attendance does not fall → grant. The exhibit opens on schedule, so the museum gets the grant. Conclusion: it extends its hours. Missing: grant → extend.", "why_correct": "The premises already deliver the grant: the exhibit opens on schedule, so attendance holds, so the grant comes. 'Unless' means 'if not', and its truth table rules out only steady attendance with no grant. E turns the grant into extended hours, completing the chain.", "why_wrong": {"A": {"trap": "MISTAKEN_REVERSAL", "text": "Extend → grant makes the grant necessary, not enough. Getting the grant would still not guarantee longer hours."}, "B": {"trap": "MISTAKEN_NEGATION", "text": "This adds what happens if attendance falls, which never occurs here, and it never reaches evening hours."}, "C": {"trap": "OUT_OF_SCOPE", "text": "Record crowds are not needed. The chain only requires that attendance not fall."}, "D": {"trap": "RESTATES_PREMISE", "text": "This already follows from the premises and still stops short of evening hours."}}, "method_reminder": "Translate 'X unless Y' as 'if not Y, then X'. Then find where the chain stops short of the conclusion and supply that link.", "flashcard": {"front": "Translate: 'The museum gets the grant unless attendance falls.'", "back": "If attendance does not fall → grant. It does not say that falling attendance blocks the grant."}}, "original": true}, {"id": "LR-IN-008", "section": "LR", "type": "Must Be True", "subtype": "quantifiers", "difficulty": 3, "target_seconds": 80, "tags": ["quantifiers", "most", "venn"], "stimulus": "Most of the volunteers at the Westside food bank are retired. Every retired volunteer at the Westside food bank also volunteers at the public library. None of the volunteers at the public library is under thirty.", "stem": "If the statements above are true, which one of the following must also be true?", "choices": {"A": "Most volunteers at the public library are retired.", "B": "Most volunteers at the Westside food bank are thirty or older.", "C": "No volunteer at the Westside food bank is under thirty.", "D": "Some retired people who volunteer at the public library do not volunteer at the Westside food bank.", "E": "Every volunteer at the public library is retired."}, "answer": "B", "explanation": {"argument_skeleton": "Most W are R. All R in W are L. No L is under 30. Venn: W's retired majority sits inside L, and L lies wholly outside the under-30 circle.", "why_correct": "The retired volunteers are a majority of Westside's volunteers. All of them volunteer at the library, and no library volunteer is under thirty. So a majority of Westside volunteers are thirty or older.", "why_wrong": {"A": {"trap": "QUANTIFIER_SHIFT", "text": "We know about Westside's majority, not the library's. The library could have many volunteers who are not retired."}, "C": {"trap": "EXTREME", "text": "Westside's non-retired minority could include people under thirty."}, "D": {"trap": "OUT_OF_SCOPE", "text": "Possible, but nothing requires it. Every retired library volunteer could also be at Westside."}, "E": {"trap": "MISTAKEN_REVERSAL", "text": "Retired Westside volunteers → library does not mean library → retired."}}, "method_reminder": "Most plus all: most A are B and all B are C gives most A are C. Draw it; the majority stays a majority.", "flashcard": {"front": "Most W are retired; retired W volunteers all work at L; no L volunteer is under 30. Must be true?", "back": "Most W are thirty or older. W's non-retired minority could be any age, so 'none under 30' fails."}}, "original": true}, {"id": "LR-IN-009", "section": "LR", "type": "Must Be True", "subtype": "quantifiers", "difficulty": 4, "target_seconds": 90, "tags": ["quantifiers", "some", "conditional"], "stimulus": "Last year, every employee of Linden Design who worked remotely more than three days a week received a laptop stipend. Some employees who received the stipend also received a performance bonus. No employee who received a performance bonus worked fewer than forty hours in any week of the year.", "stem": "If the statements above are true, which one of the following must also be true?", "choices": {"A": "Some employees who worked remotely more than three days a week received a performance bonus.", "B": "Every employee who received a performance bonus also received a laptop stipend.", "C": "No employee who worked fewer than forty hours in some week received a laptop stipend.", "D": "At least one employee who received a laptop stipend never worked fewer than forty hours in a week last year.", "E": "Most employees who worked remotely more than three days a week worked at least forty hours every week."}, "answer": "D", "explanation": {"argument_skeleton": "Remote 3+ days → stipend. Some stipend recipients got a bonus. Bonus → never under 40 hours in a week. So some stipend recipients never had a week under 40.", "why_correct": "Take the employees who got both the stipend and a bonus; at least one exists. Every bonus earner avoided weeks under forty hours. So at least one stipend recipient never worked fewer than forty hours in a week.", "why_wrong": {"A": {"trap": "MISTAKEN_REVERSAL", "text": "Remote → stipend does not run backward, so stipend recipients need not be remote workers. The bonus overlap could involve only recipients who worked in the office."}, "B": {"trap": "QUANTIFIER_SHIFT", "text": "Some stipend recipients got bonuses; that does not make every bonus earner a stipend recipient."}, "C": {"trap": "EXTREME", "text": "A short week rules out a bonus, not a stipend."}, "E": {"trap": "OUT_OF_SCOPE", "text": "Nothing ties remote workers as a group to their weekly hours."}}, "method_reminder": "With 'some', find the overlap the stimulus guarantees and carry it through each 'all' rule. 'Some' passes forward; it never grows into 'all' or 'most'.", "flashcard": {"front": "Some stipend recipients got bonuses; bonus earners never had a week under 40 hours. Must be true?", "back": "Some stipend recipients never had a week under 40 hours. 'Some' passes through an 'all' rule unchanged."}}, "original": true}, {"id": "LR-IN-010", "section": "LR", "type": "Must Be True", "subtype": "numbers", "difficulty": 2, "target_seconds": 70, "tags": ["numbers", "percent-vs-number", "education"], "stimulus": "In 2020, the Lakeshore school district enrolled 4,000 students, 25 percent of whom qualified for free school meals. In 2025, the district enrolled 5,000 students, 22 percent of whom qualified for free school meals.", "stem": "If the statements above are true, which one of the following must also be true?", "choices": {"A": "More students in the district qualified for free school meals in 2025 than in 2020.", "B": "The number of students in the district who qualified for free school meals declined between 2020 and 2025.", "C": "The district spent more on free school meals in 2025 than in 2020.", "D": "The rules for qualifying for free school meals became stricter between 2020 and 2025.", "E": "Most students who enrolled in the district after 2020 did not qualify for free school meals."}, "answer": "A", "explanation": {"argument_skeleton": "2020: 25% of 4,000 = 1,000 qualify. 2025: 22% of 5,000 = 1,100 qualify. The share fell; the number rose.", "why_correct": "Run the numbers: 1,000 students qualified in 2020 and 1,100 in 2025. The percentage dropped only because enrollment grew faster than the qualifying group did.", "why_wrong": {"B": {"trap": "SHELL_GAME", "text": "It swaps the share, which fell, for the number, which rose from 1,000 to 1,100."}, "C": {"trap": "OUTSIDE_KNOWLEDGE", "text": "Spending depends on meal costs and participation, which the stimulus never gives."}, "D": {"trap": "OUT_OF_SCOPE", "text": "No cause for the falling share is given; growth in enrollment alone explains it."}, "E": {"trap": "TOO_STRONG", "text": "Net totals hide who left and who arrived over five years, so nothing follows about new students as a group."}}, "method_reminder": "When percentages and totals both change, compute the actual numbers before choosing. A falling share can hide a rising count.", "flashcard": {"front": "25% of 4,000 vs 22% of 5,000. Did the number qualifying fall?", "back": "No: 1,000 became 1,100. The share fell because enrollment grew faster than the qualifying group."}}, "original": true}, {"id": "LR-IN-011", "section": "LR", "type": "Most Strongly Supported", "subtype": "comparison-group", "difficulty": 3, "target_seconds": 80, "tags": ["ecology", "comparison-group", "hedged-language"], "stimulus": "Ecologist: In the Marren wetlands, the population of reed warblers has fallen sharply over the past decade, while the population of sedge warblers, which nest in the same reed beds, has remained stable. Reed warblers feed almost entirely on a single species of midge, whereas sedge warblers eat a wide variety of insects. Over the same decade, the midge population in the wetlands has declined steeply.", "stem": "The statements above, if true, most strongly support which one of the following?", "choices": {"A": "The midge population declined because reed warblers ate too many midges.", "B": "The sedge warbler population in the wetlands will soon begin to decline.", "C": "The decline of the reed warblers is unlikely to be explained solely by a loss of suitable nesting habitat in the reed beds.", "D": "Birds that eat a wide variety of insects never decline when one insect species becomes scarce.", "E": "The midges declined because of changes in the wetlands' water quality."}, "answer": "C", "explanation": {"argument_skeleton": "Facts: reed warblers down sharply; sedge warblers, nesting in the same reed beds, stable. Reed warblers depend on one midge; sedge warblers eat many insects. Midges down steeply.", "why_correct": "If the reed beds had become poor places to nest, the sedge warblers nesting there should have suffered too, yet they held steady. The facts point away from nesting habitat as the whole story and toward food. C claims only that much, with protective hedges.", "why_wrong": {"A": {"trap": "CAUSAL_REVERSAL", "text": "This runs the arrow backward, and it clashes with the facts: the warblers were declining, not multiplying."}, "B": {"trap": "OUT_OF_SCOPE", "text": "Nothing predicts trouble for sedge warblers; their varied diet suggests the opposite."}, "D": {"trap": "EXTREME", "text": "'Never' goes far beyond one stable population in one wetland."}, "E": {"trap": "OUT_OF_SCOPE", "text": "No cause of the midge decline is mentioned."}}, "method_reminder": "Most Strongly Supported: prefer modest claims the facts make likely. A comparison group in the stimulus often supports ruling out a shared cause.", "flashcard": {"front": "Two warblers share reed beds; one crashes, one holds steady. What is best supported?", "back": "Nesting habitat alone probably does not explain the crash, since the same beds still support the stable species."}}, "original": true}, {"id": "LR-IN-012", "section": "LR", "type": "Most Strongly Supported", "subtype": "numbers", "difficulty": 3, "target_seconds": 80, "tags": ["history", "numbers", "hedged-language"], "stimulus": "Historian: Guild records from seventeenth-century Tarsin list several hundred master weavers but only six master dyers. Yet tax ledgers from the same century show that most of the cloth Tarsin's merchants sold was dyed, much of it in elaborate patterns that took many hours to produce.", "stem": "The historian's statements, if true, most strongly support which one of the following?", "choices": {"A": "Master dyers in Tarsin earned more than master weavers did.", "B": "Tarsin's guild records are unreliable for every craft they cover.", "C": "Undyed cloth was more highly prized than dyed cloth in seventeenth-century Tarsin.", "D": "Tarsin's master weavers often dyed cloth themselves, in violation of guild rules.", "E": "Much of the dyeing of Tarsin's cloth was probably done by people who were not listed in the guild records as master dyers."}, "answer": "E", "explanation": {"argument_skeleton": "Facts: several hundred master weavers, six master dyers. Most cloth sold was dyed, often with hours of patterning.", "why_correct": "Six people could hardly have done the hours of dyeing that most of several hundred weavers' output required. Someone else must have done much of it: journeymen, apprentices, weavers, or workers outside the guild. E claims only that, with a hedge.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "Earnings are never mentioned."}, "B": {"trap": "EXTREME", "text": "At most the records undercount who did dyeing. 'Every craft' is unsupported."}, "C": {"trap": "OUT_OF_SCOPE", "text": "Nothing compares how the two kinds of cloth were valued."}, "D": {"trap": "HALF_RIGHT", "text": "Weavers doing some dyeing is one possibility, but the text says nothing about guild rules, and other workers could account for the dyeing."}}, "method_reminder": "Most Strongly Supported: pick the answer the numbers make nearly certain, and avoid answers that commit to one specific explanation the text never gives.", "flashcard": {"front": "Hundreds of weavers, six master dyers, mostly dyed cloth. What is best supported?", "back": "Much dyeing was done by people not listed as master dyers. Do not pick a single specific explanation the text never names."}}, "original": true}, {"id": "LR-IN-013", "section": "LR", "type": "Most Strongly Supported", "subtype": "conditional", "difficulty": 3, "target_seconds": 80, "tags": ["conditional", "only", "numbers"], "stimulus": "Pharmacologist: The drug Tavorin lowers cholesterol only in patients who carry the gene variant K. About 30 percent of the population carries variant K. In a recent trial, Tavorin lowered cholesterol in 45 percent of the participants.", "stem": "If the pharmacologist's statements are true, which one of the following is most strongly supported?", "choices": {"A": "Variant K was more common among the trial's participants than it is in the population as a whole.", "B": "Tavorin lowers cholesterol in every patient who carries variant K.", "C": "Most of the trial's participants carried variant K.", "D": "The trial's organizers deliberately recruited carriers of variant K.", "E": "Tavorin lowers cholesterol more effectively than other cholesterol drugs do."}, "answer": "A", "explanation": {"argument_skeleton": "Tavorin works → patient carries K. Population: about 30% carry K. Trial: Tavorin worked in 45%. So at least 45% of participants carried K.", "why_correct": "Every participant whose cholesterol fell must carry K, so at least 45 percent of participants carried it, compared with about 30 percent of the population. Carriers were overrepresented in the trial.", "why_wrong": {"B": {"trap": "MISTAKEN_REVERSAL", "text": "'Only in carriers' makes K necessary, not sufficient. Some carriers may not respond."}, "C": {"trap": "QUANTIFIER_SHIFT", "text": "We know at least 45 percent carried K, and that need not be a majority."}, "D": {"trap": "OUT_OF_SCOPE", "text": "Overrepresentation could reflect chance or who volunteered. Intent is unsupported."}, "E": {"trap": "IRRELEVANT_COMPARISON", "text": "No other drug is discussed."}}, "method_reminder": "'Only in' sets a necessary condition: every success must meet it. Counting the successes gives a floor on how many meet the condition.", "flashcard": {"front": "Works only in K carriers; about 30% of people carry K; it worked in 45% of a trial. Inference?", "back": "At least 45% of participants carried K, so carriers were overrepresented. Not 'most', and not 'all carriers respond'."}}, "original": true}, {"id": "LR-IN-014", "section": "LR", "type": "Must Be False", "subtype": "conditional", "difficulty": 3, "target_seconds": 80, "tags": ["conditional", "must-be-false", "contrapositive"], "stimulus": "No ferry on the Plover line departs before 7 a.m. Every ferry on the Plover line that stops at Pine Island also stops at Gull Point. The 6:45 a.m. ferry from Halden Harbor stops at Gull Point.", "stem": "If the statements above are true, which one of the following must be false?", "choices": {"A": "The 6:45 a.m. ferry from Halden Harbor is not on the Plover line.", "B": "Some Plover line ferries stop at Gull Point without stopping at Pine Island.", "C": "Some ferries that stop at Gull Point depart before 7 a.m.", "D": "The 6:45 a.m. ferry from Halden Harbor is a Plover line ferry that also stops at Pine Island.", "E": "A ferry that is not on the Plover line stops at Pine Island but not at Gull Point."}, "answer": "D", "explanation": {"argument_skeleton": "Plover → departs at 7 a.m. or later. Plover and Pine → Gull. The 6:45 stops at Gull. Contrapositive: departs before 7 → not Plover. So the 6:45 is not a Plover ferry.", "why_correct": "The 6:45 departs before 7 a.m., and no Plover ferry does, so it cannot be a Plover ferry at all. D calls it a Plover ferry, so D must be false whatever its stops.", "why_wrong": {"A": {"trap": "REVERSAL", "text": "This must be true, the opposite of what the question asks for."}, "B": {"trap": "MISTAKEN_REVERSAL", "text": "Pine → Gull does not mean Gull → Pine, so a Plover ferry that stops only at Gull Point is possible."}, "C": {"trap": "REVERSAL", "text": "This must be true: the 6:45 stops at Gull Point and departs before 7."}, "E": {"trap": "QUANTIFIER_SHIFT", "text": "The Pine-Gull rule covers only Plover ferries. Other ferries can stop anywhere."}}, "method_reminder": "Must Be False: find the answer that collides with a valid deduction. Answers that could be true, or must be true, are wrong.", "flashcard": {"front": "No Plover ferry leaves before 7. The 6:45 stops at Gull Point. What must be false?", "back": "Anything calling the 6:45 a Plover ferry. Leaving before 7 rules it out of the line entirely."}}, "original": true}, {"id": "LR-MC-003", "section": "LR", "type": "Main Conclusion", "subtype": "intermediate-conclusion", "difficulty": 2, "target_seconds": 70, "tags": ["main-conclusion", "intermediate-conclusion", "urban"], "stimulus": "Some critics argue that the city's shared electric scooter program has made getting around more dangerous, citing a rise in reported scooter injuries. But the number of scooter trips has more than doubled since the program's first year, while reported injuries have risen by only 20 percent. The program, in other words, has made each scooter trip safer even as total injuries climbed. That is why the city should keep the program rather than end it, as the critics demand.", "stem": "Which one of the following most accurately expresses the main conclusion of the argument?", "choices": {"A": "The number of scooter trips has more than doubled since the program's first year.", "B": "The city should keep the scooter program rather than end it.", "C": "Each scooter trip has become safer since the program's first year.", "D": "The scooter program has made getting around the city more dangerous.", "E": "Reported scooter injuries have risen since the program's first year."}, "answer": "B", "explanation": {"argument_skeleton": "Opposing view: the program made getting around more dangerous. Premise: trips more than doubled while injuries rose 20%. Intermediate conclusion: each trip is safer. Main conclusion: keep the program ('That is why').", "why_correct": "'That is why' marks the final step: the finding that each trip is safer is offered as the reason to keep the program. Every other claim either supports that recommendation or is the view it answers.", "why_wrong": {"A": {"trap": "RESTATES_PREMISE", "text": "A premise: evidence for the safety claim, not the point."}, "C": {"trap": "SHELL_GAME", "text": "An intermediate conclusion. It is supported, but it in turn supports the recommendation to keep the program."}, "D": {"trap": "VALENCE_FLIP", "text": "This is the critics' view, the one the argument rejects."}, "E": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Accurate, and conceded, but it is background to the argument, not its conclusion."}}, "method_reminder": "Ask which claim everything else supports. A claim that is itself used as a reason is intermediate, not main.", "flashcard": {"front": "Trips doubled, injuries rose 20%, so each trip is safer; that is why we should keep the program. Main conclusion?", "back": "Keep the program. 'Each trip is safer' is an intermediate conclusion that supports it."}}, "original": true}, {"id": "LR-MC-004", "section": "LR", "type": "Main Conclusion", "subtype": "rebuttal", "difficulty": 3, "target_seconds": 75, "tags": ["main-conclusion", "analogy", "literature"], "stimulus": "It is often said that translations of poetry inevitably betray their originals. This complaint, however, rests on a confusion. It treats a translation as an attempted copy, which must fall short, rather than as a new poem made in response to the old one, which can succeed on its own terms. No one faults a painting of a cathedral for failing to be a cathedral.", "stem": "The main conclusion of the argument is that", "choices": {"A": "translations of poetry inevitably betray their originals", "B": "a painting of a cathedral should not be faulted for failing to be a cathedral", "C": "a translation of a poem is a new poem that can succeed on its own terms", "D": "poetry is harder to translate than prose is", "E": "the complaint that translations of poetry inevitably betray their originals rests on a confusion"}, "answer": "E", "explanation": {"argument_skeleton": "Opposing view: translations inevitably betray. Main conclusion: that complaint rests on a confusion. Support: it treats a translation as a copy rather than a new poem. Analogy: no one faults a painting for not being a cathedral.", "why_correct": "The second sentence gives the author's verdict on the complaint, and the rest explains it: the confusion is identified, then illustrated by the painting analogy. E restates that verdict.", "why_wrong": {"A": {"trap": "VALENCE_FLIP", "text": "This is the complaint the author argues against."}, "B": {"trap": "DEVICE_PROMOTION", "text": "The painting is an analogy offered in support. It is not the point."}, "C": {"trap": "RESTATES_PREMISE", "text": "This is the view of translation the author uses to explain the confusion, so it supports the conclusion."}, "D": {"trap": "OUT_OF_SCOPE", "text": "Prose is never mentioned."}}, "method_reminder": "When an argument opens with what 'is often said', the main conclusion is usually the author's response to it. Check that the remaining sentences support that response.", "flashcard": {"front": "'It is often said X. This rests on a confusion. [reason]. [analogy].' Main conclusion?", "back": "That X rests on a confusion. The reason and the analogy support it; the opening view is the target."}}, "original": true}, {"id": "LR-RO-003", "section": "LR", "type": "Role", "subtype": "concession", "difficulty": 2, "target_seconds": 70, "tags": ["role", "concession", "economics"], "stimulus": "Economist: Many people believe that rent control protects tenants. And it is true that tenants who already live in rent-controlled apartments benefit, at least in the short run. But by holding rents below market levels, rent control discourages construction of new rental housing, which makes apartments scarcer for everyone looking to rent. So rent control ultimately harms tenants as a group.", "stem": "The claim that tenants who already live in rent-controlled apartments benefit, at least in the short run, plays which one of the following roles in the economist's argument?", "choices": {"A": "It is offered as evidence that rent control encourages the construction of new rental housing.", "B": "It is a premise offered in direct support of the argument's main conclusion.", "C": "It acknowledges a consideration that might seem to tell against the argument's main conclusion.", "D": "It is the position that the economist's argument is designed to refute.", "E": "It is an intermediate conclusion supported by the claim about the construction of new housing."}, "answer": "C", "explanation": {"argument_skeleton": "Opposing belief: rent control protects tenants. Concession: current tenants benefit, in the short run. Premise: below-market rents discourage construction and make apartments scarce. Conclusion: rent control harms tenants as a group.", "why_correct": "'It is true that... But' is the classic concession pattern. The economist grants that current tenants gain, a point that seems to favor rent control, and then argues that the wider effect outweighs it.", "why_wrong": {"A": {"trap": "DIRECTION_FLIP", "text": "The argument says rent control discourages construction, and the claim about current tenants says nothing about building."}, "B": {"trap": "REVERSAL", "text": "The claim cuts against the conclusion that rent control harms tenants. It does not support it."}, "D": {"trap": "VALENCE_FLIP", "text": "The economist accepts this claim. The target is the broader belief that rent control protects tenants."}, "E": {"trap": "SHELL_GAME", "text": "The construction claim supports the main conclusion, not this concession."}}, "method_reminder": "Concession markers: 'admittedly', 'it is true that', 'granted'. The claim is accepted, yet it cuts against the conclusion.", "flashcard": {"front": "'It is true that current tenants benefit. But...' What role does the granted claim play?", "back": "A concession: accepted, though it seems to cut against the conclusion, which the argument then overrides."}}, "original": true}, {"id": "LR-RO-004", "section": "LR", "type": "Role", "subtype": "intermediate-conclusion", "difficulty": 3, "target_seconds": 80, "tags": ["role", "intermediate-conclusion", "evolution"], "stimulus": "Biologist: The Harlan cave fish has lost its eyes over many generations of life in total darkness. Some have suggested that the eyes simply stopped mattering and decayed through random mutation. But eyes are costly organs: developing and maintaining eye tissue consumes a substantial share of a fish's energy. In total darkness, then, fish with smaller eyes would have had more energy for growth and reproduction. Natural selection, not mere decay, is therefore the likeliest explanation for the loss of the fish's eyes.", "stem": "The claim that fish with smaller eyes would have had more energy for growth and reproduction plays which one of the following roles in the biologist's argument?", "choices": {"A": "It is a conclusion drawn from another claim in the argument and used in turn to support the argument's main conclusion.", "B": "It is the argument's main conclusion.", "C": "It is a hypothesis that the biologist argues against.", "D": "It is a premise for which the argument offers no support.", "E": "It is evidence offered to show that the fish's eyes decayed through random mutation."}, "answer": "A", "explanation": {"argument_skeleton": "Rejected view: the eyes decayed through random mutation. Premise: eyes are costly. Intermediate conclusion: smaller-eyed fish had more energy for growth and reproduction ('then'). Main conclusion: natural selection explains the loss ('therefore').", "why_correct": "'Then' shows the claim is inferred from the cost of eyes, and 'therefore' shows it feeds the final claim about natural selection. A claim that is both supported and supporting is an intermediate conclusion.", "why_wrong": {"B": {"trap": "SHELL_GAME", "text": "The main conclusion is the claim about natural selection, which this claim supports."}, "C": {"trap": "VALENCE_FLIP", "text": "The rejected hypothesis is random decay. The biologist endorses this claim."}, "D": {"trap": "HALF_RIGHT", "text": "It does support the conclusion, but it is itself supported by the claim that eyes are costly."}, "E": {"trap": "REVERSAL", "text": "It supports selection over decay, the opposite of the decay hypothesis."}}, "method_reminder": "Check both directions: is the claim supported by something, and does it support something? Yes to both means intermediate conclusion.", "flashcard": {"front": "Eyes are costly; so smaller-eyed fish had more energy; therefore selection explains eye loss. Role of the middle claim?", "back": "Intermediate conclusion: supported by the cost claim and used to support the main conclusion."}}, "original": true}, {"id": "LR-RO-005", "section": "LR", "type": "Role", "subtype": "counterexample", "difficulty": 2, "target_seconds": 70, "tags": ["role", "counterexample", "urban"], "stimulus": "Columnist: Opponents of the proposal to close the old city to cars claim that such closures always ruin local shops. Yet when Varna closed its historic center to cars a decade ago, retail sales there rose for five straight years. Closures may hurt shops in some places, but the claim that they always do is false, and it gives us no reason to reject the proposal.", "stem": "The columnist's reference to Varna serves which one of the following functions in the argument?", "choices": {"A": "It is the main conclusion of the columnist's argument.", "B": "It is evidence that closing the old city to cars will increase retail sales there.", "C": "It is a claim that the columnist concedes before arguing against it.", "D": "It is offered as a counterexample to a generalization on which opponents of the proposal rely.", "E": "It illustrates the kind of damage that closing streets to cars can do to local shops."}, "answer": "D", "explanation": {"argument_skeleton": "Opponents' generalization: car-free closures always ruin shops. Counterexample: Varna closed its center and sales rose five years running. Conclusion: the 'always' claim is false and gives no reason to reject the proposal.", "why_correct": "One clear case in which a closure did not ruin shops is enough to defeat a claim about what such closures always do. That is exactly how the Varna example is used.", "why_wrong": {"A": {"trap": "SHELL_GAME", "text": "The conclusion is that the 'always' claim is false. Varna is the evidence for it."}, "B": {"trap": "TOO_STRONG", "text": "The columnist uses Varna only to refute 'always', not to predict higher sales in the old city."}, "C": {"trap": "REVERSAL", "text": "Varna supports the columnist. A concession would cut against the columnist."}, "E": {"trap": "VALENCE_FLIP", "text": "Sales in Varna rose, so the example shows the opposite of damage."}}, "method_reminder": "Universal claims ('always', 'never') fall to a single counterexample. Look for a specific case aimed at a general claim.", "flashcard": {"front": "Opponents say car-free closures always ruin shops; Varna's closure did not. Role of Varna?", "back": "A counterexample that defeats the 'always' generalization. It does not prove the new closure will help."}}, "original": true}, {"id": "LR-ME-002", "section": "LR", "type": "Method", "subtype": "reductio", "difficulty": 2, "target_seconds": 70, "tags": ["method", "reductio", "art"], "stimulus": "Ana: Any work of art that offends a significant number of people should be removed from public display.\nBen: By that standard, nearly every great work in the national gallery would have to come down, since most of them offended many people when they were first shown, and some still do.", "stem": "Ben responds to Ana by", "choices": {"A": "questioning whether the works Ana has in mind are really works of art", "B": "arguing that Ana's principle, applied consistently, would have a consequence she would probably find unacceptable", "C": "offering evidence that works that offend people are more valuable than works that do not", "D": "attacking Ana's motives for proposing the principle", "E": "accepting Ana's principle but disputing that it applies to the works in the national gallery"}, "answer": "B", "explanation": {"argument_skeleton": "Ana: offends many → remove. Ben: applying that rule would remove most great works, since they offended many.", "why_correct": "Ben does not deny that the works offended people; he uses that fact to show where Ana's rule leads: an empty national gallery. The implied point is that a rule with that result must be a bad rule.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "Ben takes for granted that they are great works of art."}, "C": {"trap": "IRRELEVANT_COMPARISON", "text": "Ben makes no claim that offensive works are more valuable. He says great works happened to offend."}, "D": {"trap": "MISMATCHED_STRUCTURE", "text": "That is a different argumentative move, an attack on the person. Ben addresses only the principle's consequences."}, "E": {"trap": "VALENCE_FLIP", "text": "Ben applies the principle to the gallery precisely to show it is unacceptable. He does not accept it."}}, "method_reminder": "Method questions: describe the move abstractly. Applying an opponent's principle to show it yields an unacceptable result is a recurring pattern.", "flashcard": {"front": "Ana: remove art that offends many. Ben: then most great works go. Ben's method?", "back": "Shows that Ana's principle, applied consistently, yields a result she would reject. He does not dispute the facts."}}, "original": true}, {"id": "LR-ME-003", "section": "LR", "type": "Method", "subtype": "elimination", "difficulty": 2, "target_seconds": 65, "tags": ["method", "elimination"], "stimulus": "Detective: The pendant was taken from the safe between 9 p.m. and midnight. Only three people knew the safe's combination: the owner, her assistant, and the caterer. The owner was at a dinner across town all evening, and security footage shows the assistant at the front desk the entire time. So the caterer took the pendant.", "stem": "The detective's argument proceeds by", "choices": {"A": "drawing a general conclusion from a series of particular cases", "B": "relying on the testimony of an eyewitness to the theft", "C": "showing that the caterer had a motive to take the pendant", "D": "inferring that because the caterer could have taken the pendant, the caterer must have taken it", "E": "ruling out all but one of a limited set of possibilities and concluding that the remaining one is true"}, "answer": "E", "explanation": {"argument_skeleton": "Possibilities: owner, assistant, caterer. Owner ruled out (across town). Assistant ruled out (footage). Conclusion: the caterer.", "why_correct": "The detective limits the suspects to three, eliminates two with evidence, and concludes the third. That is reasoning by elimination.", "why_wrong": {"A": {"trap": "MISMATCHED_STRUCTURE", "text": "The conclusion is about one case, not a generalization from many."}, "B": {"trap": "OUT_OF_SCOPE", "text": "No one is said to have witnessed the theft; the footage shows only where the assistant was."}, "C": {"trap": "SHELL_GAME", "text": "Motive is never discussed. The argument is about opportunity."}, "D": {"trap": "MISMATCHED_STRUCTURE", "text": "The detective does more than note that the caterer could have done it: the other two are eliminated first."}}, "method_reminder": "Name the structure, not the topic: list the options, cross off all but one, conclude the survivor.", "flashcard": {"front": "Three people could open the safe; two are ruled out; so the third did it. Method?", "back": "Process of elimination: restrict the possibilities, rule out all but one, and conclude it."}}, "original": true}, {"id": "LR-ME-004", "section": "LR", "type": "Method", "subtype": "overlooked-benefit", "difficulty": 3, "target_seconds": 80, "tags": ["method", "dialogue", "health-care"], "stimulus": "Hiroshi: Since the clinic extended its hours, the average wait for an appointment there has barely changed. So the extension was a waste of money.\nLena: Not necessarily. Before the extension, the clinic saw about 200 patients a week; now it sees about 350, many of whom used to go untreated or to the emergency room. The clinic is treating far more people with the same wait.", "stem": "Lena responds to Hiroshi's argument by", "choices": {"A": "disputing the accuracy of the waiting-time figures on which Hiroshi relies", "B": "arguing that the extension will shorten waits in the future", "C": "pointing out that the evidence Hiroshi cites leaves out a significant benefit that the extension has produced", "D": "drawing an analogy between the clinic and the emergency room", "E": "conceding that the extension was a waste of money but arguing that it was nonetheless worth doing"}, "answer": "C", "explanation": {"argument_skeleton": "Hiroshi: waits unchanged → waste. Lena: accepts the wait figures, adds that weekly patients rose from 200 to 350 at the same wait.", "why_correct": "Lena does not deny that waits held steady. She shows that waiting time is not the only measure: the clinic now treats 75 percent more patients, many of whom previously went untreated or to the emergency room. Hiroshi's evidence misses that benefit.", "why_wrong": {"A": {"trap": "PREMISE_ATTACK", "text": "Lena accepts Hiroshi's figures. She disputes what they show."}, "B": {"trap": "OUT_OF_SCOPE", "text": "Lena makes no prediction about future waits."}, "D": {"trap": "MISMATCHED_STRUCTURE", "text": "The emergency room comes up only as where some patients used to go, not as an analogy."}, "E": {"trap": "VALENCE_FLIP", "text": "Lena rejects the claim that the extension was a waste. She concedes nothing of the kind."}}, "method_reminder": "In dialogue Method questions, check whether the second speaker accepts the first speaker's evidence. Accepting it and adding a missed consideration is different from denying it.", "flashcard": {"front": "Waits unchanged, so the longer clinic hours were a waste? Reply: far more patients are seen. The method?", "back": "Accepts the evidence but shows it omits a major benefit: more patients treated at the same wait."}}, "original": true}, {"id": "LR-PA-003", "section": "LR", "type": "Parallel Reasoning", "subtype": "quantifiers", "difficulty": 3, "target_seconds": 100, "tags": ["parallel", "quantifiers", "valid"], "stimulus": "Some of the wines in the Corliss cellar are from Portugal. Every Portuguese wine in the Corliss cellar was bottled before 2015. So some of the wines in the Corliss cellar were bottled before 2015.", "stem": "Which one of the following arguments is most similar in its pattern of reasoning to the argument above?", "choices": {"A": "Some of the members of the hiking club are teachers. Some teachers are also musicians. So some of the members of the hiking club are musicians.", "B": "Every member of the orchestra practices daily. Some people who practice daily are professionals. So some members of the orchestra are professionals.", "C": "All of the cars on Lot 4 are electric. Every electric car on the lot was serviced last month. So all of the cars on Lot 4 were serviced last month.", "D": "Some of the students in Ms. Ortiz's class are on the debate team. Every member of the debate team attended the summer workshop. So some of the students in Ms. Ortiz's class attended the summer workshop.", "E": "Some of the apartments in the Garnet building have balconies. Every apartment with a balcony rents for more. So every apartment in the Garnet building that rents for more has a balcony."}, "answer": "D", "explanation": {"argument_skeleton": "Some C are P. All P are B. So some C are B. Valid: the guaranteed overlap of C and P lies inside B.", "why_correct": "D matches term for term: some class members are debaters, all debaters attended, so some class members attended. Same quantifiers, same order, same valid inference.", "why_wrong": {"A": {"trap": "MISMATCHED_STRUCTURE", "text": "Some plus some guarantees nothing; the teachers in the club may not be the musicians."}, "B": {"trap": "QUANTIFIER_SHIFT", "text": "The 'some' sits in the wrong premise: all orchestra members practice daily, but the professionals among daily practicers may all be outside the orchestra."}, "C": {"trap": "MISMATCHED_STRUCTURE", "text": "Valid, but all plus all yields an 'all' conclusion. The original moves from 'some' to 'some'."}, "E": {"trap": "MISTAKEN_REVERSAL", "text": "Balcony → rents for more does not mean rents for more → balcony."}}, "method_reminder": "Parallel: label the original (some A are B; all B are C; so some A are C), then check each answer's quantifiers and conclusion form, not its topic.", "flashcard": {"front": "Some A are B; all B are C; so some A are C. Valid?", "back": "Yes. The A-B overlap lies inside C. Some plus some, or all plus some, would not work."}}, "original": true}, {"id": "LR-PA-004", "section": "LR", "type": "Parallel Reasoning", "subtype": "conditional-chain", "difficulty": 3, "target_seconds": 105, "tags": ["parallel", "conditional", "contrapositive"], "stimulus": "If the council approves the new zoning code, developers will build taller apartment buildings downtown. If developers build taller apartment buildings downtown, the city will upgrade its downtown water mains. But the city will not upgrade its downtown water mains. So the council will not approve the new zoning code.", "stem": "Which one of the following arguments is most similar in its pattern of reasoning to the argument above?", "choices": {"A": "If Marta joins the expedition, the team will carry a satellite phone. If the team carries a satellite phone, it will carry an extra battery pack. But the team will not carry an extra battery pack. So Marta will not join the expedition.", "B": "If the bakery hires a second baker, it will open on Sundays. If it opens on Sundays, its revenue will rise. But the bakery will not hire a second baker. So its revenue will not rise.", "C": "If the river floods, the bridge will close. If the bridge closes, the ferry will run extra trips. The ferry is running extra trips. So the river has flooded.", "D": "If the library extends its hours, more students will study there. If more students study there, the library will add seating. The library will extend its hours. So it will add seating.", "E": "Either the council approves the budget or the museum closes. The museum will not close. So the council will approve the budget."}, "answer": "A", "explanation": {"argument_skeleton": "A → B; B → C; not C; so not A. Valid: denying the end of a chain denies its start.", "why_correct": "A has the same shape: joins → phone → battery pack; no battery pack; so Marta will not join. Same chain, same denied final link, same valid conclusion.", "why_wrong": {"B": {"trap": "MISTAKEN_NEGATION", "text": "It denies the first condition and concludes the last is false: not A, so not C. Invalid, and not the original's move."}, "C": {"trap": "MISTAKEN_REVERSAL", "text": "It affirms the last result and concludes the first condition: C, so A. Invalid."}, "D": {"trap": "MISMATCHED_STRUCTURE", "text": "Valid, but it affirms the start of the chain to reach the end, rather than denying the end to rule out the start."}, "E": {"trap": "MISMATCHED_STRUCTURE", "text": "Valid, but an either-or argument, not a conditional chain."}}, "method_reminder": "Diagram the original in letters, including where the final fact attaches. Here a denied final consequent leads to a denied first condition.", "flashcard": {"front": "A → B, B → C, not C. Conclusion?", "back": "Not A. Denying the end of a chain denies its start. Denying A, or affirming C, proves nothing."}}, "original": true}, {"id": "LR-PA-005", "section": "LR", "type": "Parallel Reasoning", "subtype": "qualifiers", "difficulty": 4, "target_seconds": 110, "tags": ["parallel", "qualifiers"], "stimulus": "Nearly all of the restaurants that opened on Calder Street last year are run by first-time owners. Restaurants run by first-time owners usually close within three years. So many of the restaurants that opened on Calder Street last year will probably close within three years.", "stem": "Which one of the following arguments is most similar in its reasoning to the argument above?", "choices": {"A": "Nearly all of the paintings in tomorrow's auction are landscapes. Landscapes usually sell above their estimates. So every painting in tomorrow's auction will sell above its estimate.", "B": "Most students who take the advanced course passed the introductory course. Most students who passed the introductory course are math majors. So most students who take the advanced course are math majors.", "C": "Nearly all of the trees planted along the boulevard this spring were saplings from the city nursery. Saplings from the city nursery usually survive their first winter. So many of the trees planted along the boulevard this spring will probably survive their first winter.", "D": "Restaurants run by first-time owners usually close within three years. Several restaurants on Calder Street closed within three years of opening. So nearly all of those restaurants were run by first-time owners.", "E": "Nearly all of this year's new hires came from the Bellmont training program. Graduates of the Bellmont program occasionally leave their first job within a year. So some of this year's new hires will certainly leave within a year."}, "answer": "C", "explanation": {"argument_skeleton": "Nearly all X are Y. Y usually Z. So many X probably Z. Hedged premises support a hedged conclusion.", "why_correct": "C mirrors every qualifier: nearly all the trees are nursery saplings, nursery saplings usually survive, so many will probably survive. Same structure, same strength.", "why_wrong": {"A": {"trap": "EXTREME", "text": "'Usually' cannot support 'every painting will'. The conclusion is far stronger than the original's."}, "B": {"trap": "MISMATCHED_STRUCTURE", "text": "It chains two 'most' claims into a 'most' conclusion, a different and invalid pattern."}, "D": {"trap": "MISTAKEN_REVERSAL", "text": "Same topic as the original, reversed logic: it reasons from closing back to first-time ownership."}, "E": {"trap": "QUANTIFIER_SHIFT", "text": "'Occasionally' becomes 'certainly'. The original keeps its conclusion as tentative as its premises."}}, "method_reminder": "In non-formal parallel questions, match the strength words: 'nearly all', 'usually', 'probably'. A conclusion stronger than the original's is a mismatch even when the topic fits.", "flashcard": {"front": "Nearly all X are Y; Y usually Z; so many X probably Z. What breaks a parallel answer?", "back": "Changing strength ('every X will', 'some will certainly') or reversing the generalization's direction."}}, "original": true}, {"id": "LR-PA-006", "section": "LR", "type": "Parallel Reasoning", "subtype": "only-unless", "difficulty": 3, "target_seconds": 95, "tags": ["parallel", "only", "unless", "conditional"], "stimulus": "Only members of the guild may exhibit at the autumn fair. Rosa is not a member of the guild. So Rosa may not exhibit at the autumn fair.", "stem": "Which one of the following arguments is most similar in its pattern of reasoning to the argument above?", "choices": {"A": "Only residents may apply for a parking permit. Nadia is a resident. So Nadia may apply for a parking permit.", "B": "Anyone certified by the league may referee a playoff match. Ilse is not certified by the league. So Ilse may not referee a playoff match.", "C": "Only seniors may enroll in the honors seminar. Jorge has enrolled in the honors seminar. So Jorge is a senior.", "D": "Most members of the choir may sing solos. Ana is not a member of the choir. So Ana may not sing solos.", "E": "No one may referee a playoff match unless certified by the league. Ilse is not certified by the league. So Ilse may not referee a playoff match."}, "answer": "E", "explanation": {"argument_skeleton": "Exhibit → member ('only members'). Rosa: not a member. So Rosa may not exhibit. Valid contrapositive.", "why_correct": "'No one may referee unless certified' means referee → certified, the same rule shape as 'only members may exhibit'. Ilse is not certified, so she may not referee: the same valid contrapositive.", "why_wrong": {"A": {"trap": "MISTAKEN_REVERSAL", "text": "'Only residents' makes residency necessary, not enough. Being a resident does not guarantee permission."}, "B": {"trap": "MISTAKEN_NEGATION", "text": "Certification is enough to referee here, not required, so lacking it proves nothing."}, "C": {"trap": "MISMATCHED_STRUCTURE", "text": "Valid, but it affirms the action to infer the requirement, rather than denying the requirement to rule out the action."}, "D": {"trap": "QUANTIFIER_SHIFT", "text": "'Most members' sets no rule for nonmembers at all."}}, "method_reminder": "Translate 'only A may B' and 'no one may B unless A' the same way: B → A. The valid move then runs from not A to not B.", "flashcard": {"front": "'Only guild members may exhibit' and 'No one may referee unless certified.' Same logic?", "back": "Yes. Both mean doing it → meeting the requirement. Lacking the requirement means you may not do it."}}, "original": true}, {"id": "LR-PA-007", "section": "LR", "type": "Parallel Flaw", "subtype": "quantifiers", "difficulty": 4, "target_seconds": 110, "tags": ["parallel-flaw", "quantifiers", "most"], "stimulus": "Most of the employees at Kessler Labs are chemists. Most of the employees at Kessler Labs work the night shift. So most of the chemists at Kessler Labs work the night shift.", "stem": "Which one of the following arguments exhibits a flawed pattern of reasoning most similar to that in the argument above?", "choices": {"A": "Most of the employees at Kessler Labs are chemists. Every chemist at Kessler Labs has a doctorate. So most of the employees at Kessler Labs have a doctorate.", "B": "Most of the volunteers at the shelter are students. Most of the volunteers at the shelter work on weekends. So most of the students who volunteer at the shelter work on weekends.", "C": "Most of the guests at the wedding were relatives of the bride. Most of the bride's relatives live abroad. So most of the guests at the wedding live abroad.", "D": "Some of the tenants in the building own cars. Some of the tenants in the building own bicycles. So some of the tenants in the building own both a car and a bicycle.", "E": "Most of the members of the chess club are seniors. Most of the members of the chess club take calculus. So some members of the chess club are seniors who take calculus."}, "answer": "B", "explanation": {"argument_skeleton": "Most E are C. Most E are N. So most C are N. Flaw: two majorities of one group must overlap, but the overlap can be a minority of
