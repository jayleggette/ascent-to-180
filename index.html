. Both take a position, and the positions conflict.", "why_wrong": {"A": {"trap": "BOTH_AGREE", "text": "Marco says green space is 'certainly' scarce."}, "B": {"trap": "ONE_SPEAKER", "text": "Only Marco mentions contamination."}, "C": {"trap": "TOO_BROAD", "text": "Neither speaker addresses the whole city."}, "E": {"trap": "TOO_BROAD", "text": "Marco speaks only of this cleanup's cost compared with housing."}}, "method_reminder": "Apply the 'both must have an opinion' test, then check the opinions conflict.", "flashcard": {"front": "Second speaker opens with 'certainly X, but...'. What does that tell you?", "back": "They agree on X. The disagreement lies after the 'but'."}}, "original": true}, {"id": "LR-AG-001", "section": "LR", "type": "Agreement", "subtype": "agree", "difficulty": 3, "target_seconds": 80, "tags": ["dialogue", "policy", "energy"], "stimulus": "Priya: Requiring new office buildings to meet strict energy standards will raise construction costs, but the savings on heating and cooling will repay those costs within a decade. So the requirement is worth adopting.\nTomas: The standards will indeed raise construction costs. But developers will pass those costs on to tenants, and many small businesses will be priced out of new buildings. The requirement should not be adopted in its current form.", "stem": "Priya and Tomas are committed to agreeing that", "choices": {"A": "requiring the energy standards will raise construction costs for new office buildings", "B": "the savings on heating and cooling will repay the added costs within a decade", "C": "many small businesses will be priced out of new buildings", "D": "the requirement should be adopted", "E": "developers should bear the costs of the energy standards themselves"}, "answer": "A", "explanation": {"argument_skeleton": "Priya: costs rise, savings repay them, adopt. Tomas: costs 'indeed' rise, tenants pay, do not adopt as is.", "why_correct": "Both say construction costs will rise; Tomas's 'indeed' signals the shared premise.", "why_wrong": {"B": {"trap": "ONE_SPEAKER", "text": "Only Priya claims payback."}, "C": {"trap": "ONE_SPEAKER", "text": "Only Tomas raises small businesses."}, "D": {"trap": "REVERSAL", "text": "This is where they disagree."}, "E": {"trap": "OUT_OF_SCOPE", "text": "Neither says who should bear the costs."}}, "method_reminder": "For agreement, look for concession words in the second speaker: indeed, certainly, admittedly.", "flashcard": {"front": "Agreement question: where do you look first?", "back": "At what the second speaker concedes before disagreeing."}}, "original": true}], "passages": [{"id": "RC-HUM-001", "passage_type": "humanities", "comparative": false, "difficulty": 4, "title": "The Ruin and the Present", "text": ["For much of the twentieth century, art historians read the eighteenth-century vogue for painted ruins as an art of mourning. The crumbling arches and overgrown columns that crowded the canvases of the period, the argument ran, gave visual form to a culture newly anxious about the impermanence of its own achievements. The evidence for this reading was not thin: diaries of the period describe visitors moved to tears before such canvases, and moralizing verses were sometimes printed beneath engravings made from them. On this view the ruin painter was a moralist, and the ruin itself an emblem of vanity: whatever is built will fall.", "This reading is not wrong, but it is incomplete, and its incompleteness has distorted our sense of what these paintings were for. Many of the most admired ruin pictures were commissioned by the same patrons who were funding new roads, canals, and public buildings, and they hung in rooms designed to display that new construction. Inventories of several such collections record ruin paintings hung opposite architectural drawings of the patrons' own projects. The rooms were not chapels; they were showcases. A painting of a fallen temple in such a room could hardly have been a simple lament. It invited comparison, and the comparison was flattering: the patron's age, it suggested, had inherited the ambitions of antiquity and possessed the engineering to surpass them.", "The paintings themselves support this double reading. Consider the habit, common among the period's ruin painters, of placing small contemporary figures among the fallen stones: a surveyor with his instruments, a shepherd resting in the shade of a broken wall, a party of travelers sketching. Earlier critics treated these figures as foils that dramatized the scale of the vanished past. But the figures are rarely dwarfed or diminished; they are at ease, often busy, sometimes measuring the very structures that loom over them. In one much-copied canvas a draftsman sits on a fallen capital, calmly recording the profile of the column it once crowned. The past in these images is not only a warning. It is also a resource, something to be studied, quarried, and improved upon.", "None of this requires us to discard the melancholy that earlier historians found. The ruin painting held two attitudes at once, and its power came from refusing to choose between them. To see in it only mourning is to miss the confidence of the age that bought it; to see in it only confidence is to miss why that age wanted its confidence painted against a backdrop of collapse. The most accomplished of these painters seem to have understood that ambition is most persuasive when it is shown beside what it fears."], "model_margin_notes": ["Old view: ruin paintings = art of mourning", "Author: old view incomplete; patrons' rooms invited flattering comparison", "Evidence in paintings: busy modern figures, past as resource", "Thesis: paintings hold mourning AND confidence at once"], "main_point": "Eighteenth-century ruin paintings expressed both melancholy about decay and confidence about the present, and reading them as only mourning (or only confidence) misses their meaning.", "author_attitude": "Qualified acceptance of the traditional reading (not wrong, but incomplete), confident in the double reading.", "structure": "Traditional interpretation; argument from context that it is incomplete; argument from the paintings' figures; synthesis that keeps both attitudes.", "questions": [{"id": "RC-HUM-001-1", "section": "RC", "type": "Main Point", "difficulty": 4, "target_seconds": 75, "tags": ["main-point", "tension"], "stem": "Which one of the following most accurately expresses the main point of the passage?", "choices": {"A": "Eighteenth-century ruin paintings expressed a culture's anxiety about the impermanence of its achievements.", "B": "Eighteenth-century patrons commissioned ruin paintings chiefly to celebrate their own building projects.", "C": "Eighteenth-century ruin paintings joined mourning for the past with confidence about the present, and reading them as purely elegiac misses half of their meaning.", "D": "The small contemporary figures in ruin paintings show that painters meant to diminish the achievements of antiquity.", "E": "Twentieth-century art historians were mistaken to find any melancholy in eighteenth-century ruin paintings."}, "answer": "C", "explanation": {"argument_skeleton": "Passage: old reading (mourning) is incomplete; context and figures show confidence too; final paragraph insists on both.", "why_correct": "Paragraph 4 states the thesis: the paintings 'held two attitudes at once'. C keeps both halves and names the error the passage corrects.", "why_wrong": {"A": {"trap": "TENSION_COLLAPSE", "text": "The traditional half only. Paragraph 2 calls it incomplete."}, "B": {"trap": "TENSION_COLLAPSE", "text": "The confidence half only, and 'chiefly' overstates it; paragraph 4 warns against seeing only confidence."}, "D": {"trap": "DEVICE_PROMOTION", "text": "The figures are evidence in paragraph 3, and they are said to study and improve on the past, not diminish it."}, "E": {"trap": "VALENCE_FLIP", "text": "The author says the reading 'is not wrong' and keeps the melancholy."}}, "method_reminder": "If your main-point sentence contains 'both' or 'at once', the answer must keep both sides.", "flashcard": {"front": "Passage ends: the work 'held two attitudes at once'. Main point answer must?", "back": "Keep both attitudes. One-sided answers are Tension Collapse, however accurate each half is."}}, "original": true}, {"id": "RC-HUM-001-2", "section": "RC", "type": "Author's Attitude", "difficulty": 3, "target_seconds": 60, "tags": ["attitude", "valence"], "stem": "The author's attitude toward the interpretation described in the first paragraph is best described as", "choices": {"A": "qualified acceptance: correct as far as it goes, but partial", "B": "outright rejection of its central claim", "C": "reluctant agreement based on the paintings' subject matter alone", "D": "skepticism about whether any evidence could support it", "E": "admiration for its account of the contemporary figures"}, "answer": "A", "explanation": {"argument_skeleton": "Paragraph 2 opens: 'This reading is not wrong, but it is incomplete.' Paragraph 4: 'None of this requires us to discard the melancholy.'", "why_correct": "Not wrong plus incomplete equals qualified acceptance. The author keeps the reading and adds to it.", "why_wrong": {"B": {"trap": "VALENCE_FLIP", "text": "The author explicitly says it is not wrong."}, "C": {"trap": "HALF_RIGHT", "text": "Agreement is right, but nothing says it rests on subject matter alone, or that it is reluctant."}, "D": {"trap": "EXTREME", "text": "The author grants the reading is partly correct."}, "E": {"trap": "VALENCE_FLIP", "text": "Paragraph 3 disputes the earlier critics' treatment of the figures."}}, "method_reminder": "Quote the author's own verdict sentence; attitude answers paraphrase it.", "flashcard": {"front": "'This reading is not wrong, but it is incomplete.' Attitude?", "back": "Qualified acceptance. Not rejection, not endorsement."}}, "original": true}, {"id": "RC-HUM-001-3", "section": "RC", "type": "Function", "difficulty": 4, "target_seconds": 70, "tags": ["function", "device"], "stem": "The author mentions the surveyor, the shepherd, and the travelers in the third paragraph primarily in order to", "choices": {"A": "show that ruin painters often included portraits of their patrons", "B": "illustrate how earlier critics correctly identified the role of such figures", "C": "argue that the paintings were intended mainly as records of surveying work", "D": "demonstrate that eighteenth-century viewers disliked melancholy subjects", "E": "provide evidence from the paintings themselves that they presented the past as something to be used and surpassed"}, "answer": "E", "explanation": {"argument_skeleton": "Paragraph 3 opens 'The paintings themselves support this double reading' and closes 'It is also a resource, something to be studied, quarried, and improved upon.'", "why_correct": "The figures are evidence internal to the paintings for the confident half of the double reading: busy, at ease, measuring the ruins.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "Nothing identifies the figures as patrons."}, "B": {"trap": "VALENCE_FLIP", "text": "The author says earlier critics misread the figures as foils."}, "C": {"trap": "DEVICE_PROMOTION", "text": "One figure is a surveyor; that does not make the paintings surveying records."}, "D": {"trap": "OUT_OF_SCOPE", "text": "Viewers' tastes are never discussed, and the author keeps the melancholy."}}, "method_reminder": "Function questions: find the claim the detail supports. Usually it is the sentence right before or after.", "flashcard": {"front": "Why does an author mention specific figures in a painting?", "back": "As evidence for a claim nearby. Answer with that claim, never with the figures themselves."}}, "original": true}, {"id": "RC-HUM-001-4", "section": "RC", "type": "Inference", "difficulty": 3, "target_seconds": 65, "tags": ["inference"], "stem": "It can be inferred that the author would most likely agree with which one of the following statements about the rooms in which many ruin paintings hung?", "choices": {"A": "They were designed primarily to display ancient artifacts.", "B": "They encouraged viewers to compare ancient achievements with contemporary ones.", "C": "They were decorated to evoke a mood of mourning.", "D": "They contained no works other than ruin paintings.", "E": "They were designed by the painters of the ruins."}, "answer": "B", "explanation": {"argument_skeleton": "Paragraph 2: rooms displayed new construction; paintings hung opposite drawings of patrons' projects; the painting 'invited comparison'.", "why_correct": "Ruins hung opposite drawings of new projects in rooms built to display construction: the arrangement invited comparison. B is one short step from paragraph 2.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "The rooms were 'designed to display that new construction', not ancient artifacts."}, "C": {"trap": "VALENCE_FLIP", "text": "The rooms framed the paintings flatteringly, not mournfully."}, "D": {"trap": "EXTREME", "text": "The rooms also held architectural drawings."}, "E": {"trap": "OUT_OF_SCOPE", "text": "Who designed the rooms is never said."}}, "method_reminder": "Inference: the answer sits one step from a specific line. Find the line first.", "flashcard": {"front": "RC Inference standard?", "back": "Supported by a specific line, one short step. Plausible but unlocated means wrong."}}, "original": true}, {"id": "RC-HUM-001-5", "section": "RC", "type": "Organization", "difficulty": 4, "target_seconds": 70, "tags": ["organization", "structure"], "stem": "Which one of the following best describes the organization of the passage?", "choices": {"A": "A theory is presented, evidence against it is offered, and the theory is rejected in favor of its opposite.", "B": "Two competing theories are described, and the author declines to choose between them.", "C": "A historical trend is described, its causes are listed, and its decline is explained.", "D": "A traditional interpretation is presented, its incompleteness is argued from historical context and from the works themselves, and a reading that keeps both attitudes is proposed.", "E": "A single painting is described in detail, and its symbolism is interpreted paragraph by paragraph."}, "answer": "D", "explanation": {"argument_skeleton": "Margin notes in order: old view; incomplete (context); evidence (figures); synthesis.", "why_correct": "D matches every step in order, including the two kinds of evidence and the both/and ending.", "why_wrong": {"A": {"trap": "TENSION_COLLAPSE", "text": "The old theory is kept, not rejected for its opposite."}, "B": {"trap": "HALF_RIGHT", "text": "The author does not decline to choose; she proposes a reading that combines them."}, "C": {"trap": "OUT_OF_SCOPE", "text": "No causes of a trend or its decline are listed."}, "E": {"trap": "DEVICE_PROMOTION", "text": "The passage discusses a genre, not one painting."}}, "method_reminder": "Read your margin notes in order and check the answer's last step first.", "flashcard": {"front": "Organization question: fastest check?", "back": "Match your margin notes in order. Eliminate any answer whose last step does not match the last paragraph."}}, "original": true}, {"id": "RC-HUM-001-6", "section": "RC", "type": "Analogy", "difficulty": 5, "target_seconds": 80, "tags": ["analogy", "tension"], "stem": "Which one of the following is most analogous to the ruin paintings as the author understands them?", "choices": {"A": "A memorial to a village flooded by a reservoir, placed beside the dam whose water now supplies the region", "B": "A history textbook chapter that lists the causes of an empire's fall", "C": "An advertisement that praises a new bridge without any reference to the past", "D": "A museum display that reconstructs an ancient temple exactly as it originally stood", "E": "A novel set entirely in antiquity, with no modern characters"}, "answer": "A", "explanation": {"argument_skeleton": "Relationship to match: an image of loss that also celebrates present power and achievement, held together.", "why_correct": "The memorial mourns the lost village while standing beside the engineering that replaced it. Loss and confidence in one object, like the ruin paintings.", "why_wrong": {"B": {"trap": "TENSION_COLLAPSE", "text": "Analysis of decline only; no present-day confidence."}, "C": {"trap": "TENSION_COLLAPSE", "text": "Confidence only; no sense of loss."}, "D": {"trap": "OUT_OF_SCOPE", "text": "A restoration shows no ruin and no present."}, "E": {"trap": "OUT_OF_SCOPE", "text": "No present-day element at all."}}, "method_reminder": "Abstract the relationship first, then look for it in a new topic.", "flashcard": {"front": "RC Analogy: what do you match?", "back": "The abstract relationship (loss plus pride held together), never the topic."}}, "original": true}]}, {"id": "RC-HUM-002", "passage_type": "humanities", "comparative": false, "difficulty": 5, "title": "Can a Metaphor Be Paraphrased?", "text": ["A long tradition in criticism holds that metaphors cannot be paraphrased. To say that “time is a thief” is not, on this view, to say anything that could be restated literally, as in “time passes and we lose things”; the literal version is not a weaker statement of the same content but a different statement altogether. Defenders of this position, whom we may call irreducibilists, point out that any paraphrase must select some features of the comparison and ignore others, while the metaphor leaves the selection open. The complaint is not that paraphrases are inaccurate but that they are always partial. A reader confronted with “time is a thief” may think of stealth, of loss, of the night, of the impossibility of recovering what is taken, and no list of these associations ever seems complete.", "The irreducibilists have drawn a powerful lesson from this incompleteness. If no paraphrase can exhaust a metaphor, they argue, then the metaphor's meaning must lie outside literal language entirely, in a kind of perception that words can prompt but not contain. Poetry, on this account, does not state truths so much as train us to see; and the critic who paraphrases a poem has not explained it but replaced it. Some irreducibilists go further, suggesting that the habit of paraphrase dulls the very capacity for seeing that poetry exists to cultivate.", "Yet the argument proves too much. Literal statements, too, resist complete paraphrase: a careful legal definition can be restated, but every restatement shifts emphasis, invites different inferences, and leaves some reader's question unanswered. The same is true of a scientific definition or a set of directions to a train station: each can be restated in many ways, and none of the restatements settles every question the original raises. If incompleteness of paraphrase showed that meaning lies beyond language, it would show this of ordinary prose as readily as of poetry. What the irreducibilists have identified is not a special property of metaphor but a general feature of interpretation: no restatement is ever final.", "This does not leave the irreducibilists with nothing. Metaphors do invite an unusually open-ended search for relevant features, and a reader who reduces “time is a thief” to a single literal claim has misread it. But the remedy is better paraphrase, not the abandonment of paraphrase. The critic's task is to set out the range of features a metaphor makes salient and to argue for their relative weight, a task that is difficult and never finished, and that is nonetheless a task of explanation in words. Its results can be compared, contested, and improved, which is more than can be said of a perception that words are supposed to prompt but never capture."], "model_margin_notes": ["Irreducibilists: metaphors cannot be paraphrased; associations open", "Their lesson: meaning lies beyond language; paraphrase replaces", "Author objects: proves too much; literal text also resists paraphrase", "Concession + remedy: metaphors are open-ended, so paraphrase better"], "main_point": "Metaphors' resistance to complete paraphrase does not show their meaning lies beyond language, because all statements resist complete paraphrase; critics should improve paraphrase rather than abandon it.", "author_attitude": "Accepts the irreducibilists' observation, rejects the conclusion they draw from it; constructive rather than dismissive.", "structure": "Opposing view and its observation; the conclusion drawn from it; objection (the argument proves too much); concession and alternative program.", "questions": [{"id": "RC-HUM-002-1", "section": "RC", "type": "Main Point", "difficulty": 4, "target_seconds": 75, "tags": ["main-point", "emphasis"], "stem": "Which one of the following most accurately expresses the main point of the passage?", "choices": {"A": "Metaphors convey a kind of perception that literal language cannot contain.", "B": "Although metaphors invite open-ended interpretation, their resistance to complete paraphrase does not place their meaning beyond language, and critics should improve paraphrase rather than abandon it.", "C": "Critics who paraphrase poems replace them rather than explain them.", "D": "Legal definitions are as difficult to paraphrase as poetic metaphors.", "E": "No interpretation of a metaphor can be shown to be better than another."}, "answer": "B", "explanation": {"argument_skeleton": "Paragraphs 1 and 2 report the irreducibilist view at length; paragraph 3 rejects its inference; paragraph 4 concedes a point and proposes better paraphrase.", "why_correct": "B captures the objection in paragraph 3, the concession and the remedy in paragraph 4.", "why_wrong": {"A": {"trap": "EMPHASIS_ENDORSEMENT", "text": "The view given the most space is the one the author rejects."}, "C": {"trap": "VALENCE_FLIP", "text": "The irreducibilists' claim; the author calls paraphrase 'a task of explanation'."}, "D": {"trap": "DEVICE_PROMOTION", "text": "The legal definition is an example supporting the objection."}, "E": {"trap": "EXTREME", "text": "The author says critics should 'argue for' the relative weight of features, so better readings exist."}}, "method_reminder": "Space on the page is not agreement. Find the author's own voice: 'Yet the argument proves too much.'", "flashcard": {"front": "Two paragraphs describe a view; paragraph 3 starts 'Yet...'. Whose view is the main point?", "back": "The author's, after the 'Yet'. The opening paragraphs set up the view being answered."}}, "original": true}, {"id": "RC-HUM-002-2", "section": "RC", "type": "Author's Attitude", "difficulty": 4, "target_seconds": 65, "tags": ["attitude", "criticism-scope"], "stem": "Which one of the following best describes the author's attitude toward the irreducibilists?", "choices": {"A": "complete agreement with their conclusions", "B": "dismissal of their observations as false", "C": "uncertainty about whether paraphrase is possible at all", "D": "acceptance of their observation that paraphrase is incomplete, combined with rejection of the conclusion they draw from it", "E": "admiration for their treatment of literal language"}, "answer": "D", "explanation": {"argument_skeleton": "Paragraph 3 grants incompleteness ('Literal statements, too...') and denies the inference ('proves too much'). Paragraph 4: 'This does not leave the irreducibilists with nothing.'", "why_correct": "The author accepts the observation and rejects the inference. That precise split is D.", "why_wrong": {"A": {"trap": "EMPHASIS_ENDORSEMENT", "text": "The author rejects their conclusion."}, "B": {"trap": "CRITICISM_SCOPE", "text": "The author accepts their observation; it is their inference that fails."}, "C": {"trap": "TOO_WEAK", "text": "The author is confident paraphrase is possible and should be improved."}, "E": {"trap": "OUT_OF_SCOPE", "text": "The irreducibilists say nothing about literal language; the author raises it against them."}}, "method_reminder": "Separate what the author grants from what the author denies.", "flashcard": {"front": "Author: 'They are right that X, but X does not show Y.' Attitude?", "back": "Accepts the observation, rejects the inference. Watch for answers that flip which part is rejected."}}, "original": true}, {"id": "RC-HUM-002-3", "section": "RC", "type": "Function", "difficulty": 4, "target_seconds": 65, "tags": ["function"], "stem": "The author refers to “a careful legal definition” primarily in order to", "choices": {"A": "suggest that legal language is a kind of poetry", "B": "show that legal definitions are less precise than metaphors", "C": "illustrate the irreducibilists' claim that meaning lies beyond language", "D": "argue that paraphrase should be abandoned in legal interpretation", "E": "show that the incompleteness of paraphrase is not peculiar to metaphor"}, "answer": "E", "explanation": {"argument_skeleton": "Paragraph 3: literal statements also resist paraphrase, so incompleteness is 'a general feature of interpretation'.", "why_correct": "The legal definition is a literal statement that resists complete paraphrase, which shows the property is general rather than special to metaphor.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "The author makes no claim that legal language is poetic."}, "B": {"trap": "IRRELEVANT_COMPARISON", "text": "No ranking of precision is made."}, "C": {"trap": "EMPHASIS_ENDORSEMENT", "text": "The example is used against the irreducibilists."}, "D": {"trap": "CONTRADICTS", "text": "The author defends paraphrase."}}, "method_reminder": "Ask what claim the example supports. Here: 'the argument proves too much'.", "flashcard": {"front": "Author uses a non-poetic example inside an argument about poetry. Usual purpose?", "back": "To show the property claimed to be special is actually general, so it proves too much."}}, "original": true}, {"id": "RC-HUM-002-4", "section": "RC", "type": "Inference", "difficulty": 4, "target_seconds": 70, "tags": ["inference", "application"], "stem": "The author would most likely say that a critic who restates “time is a thief” as “time passes and we lose things” has", "choices": {"A": "offered a paraphrase that is incomplete but could be improved by setting out more of the features the metaphor makes salient", "B": "correctly captured the full meaning of the metaphor", "C": "replaced the metaphor rather than explained it", "D": "shown that the metaphor has no literal content", "E": "demonstrated that literal statements are more precise than metaphors"}, "answer": "A", "explanation": {"argument_skeleton": "Paragraph 4: reducing the metaphor to 'a single literal claim' misreads it; 'the remedy is better paraphrase'.", "why_correct": "The single-claim restatement is a misreading, and the author's remedy is fuller paraphrase that sets out the range of features. A matches both.", "why_wrong": {"B": {"trap": "VALENCE_FLIP", "text": "The author says such a reduction misreads the metaphor."}, "C": {"trap": "EMPHASIS_ENDORSEMENT", "text": "The irreducibilists would say this, not the author."}, "D": {"trap": "EXTREME", "text": "Nothing suggests the metaphor lacks literal content."}, "E": {"trap": "OUT_OF_SCOPE", "text": "The author never ranks literal language above metaphor."}}, "method_reminder": "Hypothetical author response: predict from the author's stated remedy, not from your own view.", "flashcard": {"front": "How do you predict what an author would say about a new case?", "back": "Apply the author's stated view and remedy to it, one step only."}}, "original": true}, {"id": "RC-HUM-002-5", "section": "RC", "type": "Detail", "difficulty": 3, "target_seconds": 55, "tags": ["detail", "attribution"], "stem": "According to the passage, the irreducibilists argue that", "choices": {"A": "metaphors are less important than literal statements", "B": "critics should set out the range of features a metaphor makes salient", "C": "the open-endedness of a metaphor's associations shows that its meaning lies outside literal language", "D": "paraphrase of ordinary prose is as incomplete as paraphrase of poetry", "E": "poetry states truths more precisely than prose does"}, "answer": "C", "explanation": {"argument_skeleton": "Paragraph 2: 'If no paraphrase can exhaust a metaphor... then the metaphor's meaning must lie outside literal language entirely.'", "why_correct": "C restates the irreducibilists' inference from paragraph 2.", "why_wrong": {"A": {"trap": "VALENCE_FLIP", "text": "They elevate metaphor, if anything."}, "B": {"trap": "SHELL_GAME", "text": "This is the author's remedy in paragraph 4, attributed to the wrong people."}, "D": {"trap": "RECYCLED_LANGUAGE", "text": "Wording from the author's objection in paragraph 3."}, "E": {"trap": "CONTRADICTS", "text": "Paragraph 2: poetry 'does not state truths so much as train us to see'."}}, "method_reminder": "Attribution questions: check whose voice each claim belongs to.", "flashcard": {"front": "Detail question asks what a group argues. Common trap?", "back": "The author's own view, or the author's objection, attributed to the group."}}, "original": true}, {"id": "RC-HUM-002-6", "section": "RC", "type": "RC Strengthen/Weaken", "difficulty": 5, "target_seconds": 80, "tags": ["strengthen"], "stem": "Which one of the following, if true, would most strengthen the author's argument in the third paragraph?", "choices": {"A": "Many poets dislike seeing their metaphors paraphrased.", "B": "Some metaphors are easier to paraphrase than others.", "C": "Readers associate far more features with metaphors than with literal statements.", "D": "When readers paraphrase ordinary literal sentences, their restatements differ from one another about as often as their paraphrases of metaphors do.", "E": "Courts frequently revise their legal definitions."}, "answer": "D", "explanation": {"argument_skeleton": "Claim to support: incompleteness of paraphrase is general to interpretation, not special to metaphor.", "why_correct": "If literal sentences produce as much divergence in paraphrase as metaphors, the resistance is general, exactly the author's point.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "Poets' preferences do not bear on the logic of paraphrase."}, "B": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Variation among metaphors does not show literal statements resist paraphrase too."}, "C": {"trap": "REVERSAL", "text": "This suggests metaphor is special after all, which weakens the author."}, "E": {"trap": "OUT_OF_SCOPE", "text": "Revision of definitions is not incompleteness of paraphrase."}}, "method_reminder": "In RC Strengthen, isolate the exact claim and support its gap, as in LR.", "flashcard": {"front": "Author claims a property is general, not special. Best strengthener?", "back": "Evidence the property shows up equally in the ordinary cases."}}, "original": true}]}, {"id": "RC-LAW-001", "passage_type": "law", "comparative": false, "difficulty": 3, "title": "Adverse Possession Reconsidered", "text": ["Under the doctrine of adverse possession, a person who openly occupies land belonging to someone else, without permission and continuously for a period fixed by statute, can acquire legal title to it. The required period varies by jurisdiction, commonly from ten to twenty years, and the occupation must usually be exclusive as well as open. To students meeting the rule for the first time, it often looks like a license for trespass. The standard justifications are more modest. Courts have long said that the doctrine rewards those who put land to productive use, penalizes owners who neglect their property, and, above all, quiets title: after enough time, the law prefers to confirm settled expectations rather than reopen old disputes whose evidence has faded.", "Critics have recently argued that the first two justifications no longer fit the doctrine's actual effects. In many cities the land acquired through adverse possession is not neglected farmland but narrow strips along property lines: a driveway that crosses a boundary by a meter, a fence built a few feet onto a neighbor's lot. In some jurisdictions such strip claims now outnumber all other adverse possession claims combined. The “possessor” in such cases rarely intended to take anything and has done nothing especially productive; the “neglectful” owner may simply never have commissioned a survey. Rewarding one and penalizing the other, the critics conclude, is arbitrary.", "The critics are right about the facts but draw the wrong conclusion. Boundary cases are precisely where the third justification is strongest. A fence that has stood for thirty years has shaped how both neighbors use their land: what they planted, where they built, what a buyer was shown when either lot was sold. Unwinding that arrangement on the strength of an old survey would disturb many expectations to vindicate one technical claim. Courts deciding such cases often say less about the possessor's conduct than about the neighbors' long acquiescence, and rightly so. The doctrine's value in these cases lies not in rewarding the possessor but in protecting the reliance that time has created on both sides of the line.", "If the critics' objection has force, it is against the first two justifications rather than against the doctrine. A legislature persuaded by them might reasonably restrict claims based on deliberate seizure of land, where the language of reward and penalty does real work, while preserving the doctrine for the boundary disputes that now make up most of its business. Such a legislature would not be retreating from adverse possession so much as aligning it with its strongest rationale."], "model_margin_notes": ["Rule + three justifications; quieting title the key one", "Critics: modern cases are boundary strips; reward/penalty arbitrary", "Author: facts right, conclusion wrong; reliance justifies boundary cases", "Proposal: restrict deliberate seizures, keep boundary cases"], "main_point": "Although critics correctly describe modern adverse possession cases as mostly boundary disputes, those are the cases where the doctrine's interest in protecting settled expectations justifies it most.", "author_attitude": "Agrees with the critics' facts, disagrees with their conclusion; constructive, offers a reform.", "structure": "Rule and justifications; critics' objection; author's rebuttal from the third justification; proposed reform.", "questions": [{"id": "RC-LAW-001-1", "section": "RC", "type": "Main Point", "difficulty": 3, "target_seconds": 65, "tags": ["main-point"], "stem": "Which one of the following most accurately expresses the main point of the passage?", "choices": {"A": "Adverse possession should be abolished because it rewards trespass.", "B": "The productive-use justification remains the strongest defense of adverse possession.", "C": "Most adverse possession cases now involve disputes over narrow strips along property lines.", "D": "Critics of adverse possession have misdescribed the cases it now governs.", "E": "Although critics correctly describe most modern adverse possession cases, those cases are where the doctrine's interest in settled expectations justifies it most strongly."}, "answer": "E", "explanation": {"argument_skeleton": "Paragraph 3: 'The critics are right about the facts but draw the wrong conclusion. Boundary cases are precisely where the third justification is strongest.'", "why_correct": "E keeps both parts of the author's verdict: the critics' facts stand, and those facts are exactly where quieting title matters most.", "why_wrong": {"A": {"trap": "VALENCE_FLIP", "text": "The author defends the doctrine."}, "B": {"trap": "SHELL_GAME", "text": "The author relies on the third justification, not productive use."}, "C": {"trap": "TOO_NARROW", "text": "A fact the passage uses, not its point."}, "D": {"trap": "CRITICISM_SCOPE", "text": "The author says the critics are right about the facts."}}, "method_reminder": "In law passages, the author often grants the facts and fights about the rule's rationale.", "flashcard": {"front": "'Right about the facts, wrong about the conclusion.' Which answer type traps you?", "back": "Reversed scope of criticism: an answer saying the author disputes the facts."}}, "original": true}, {"id": "RC-LAW-001-2", "section": "RC", "type": "Author's Attitude", "difficulty": 3, "target_seconds": 55, "tags": ["attitude", "criticism-scope"], "stem": "The author's attitude toward the critics discussed in the second paragraph is best described as", "choices": {"A": "wholesale endorsement of their argument", "B": "contempt for their factual claims", "C": "agreement with their account of the facts but disagreement with the conclusion they draw", "D": "agreement with their conclusion but disagreement about the facts", "E": "indifference, since they address a rare kind of case"}, "answer": "C", "explanation": {"argument_skeleton": "Paragraph 3, first sentence.", "why_correct": "The author accepts their description of modern cases and rejects the inference that the doctrine is arbitrary.", "why_wrong": {"A": {"trap": "VALENCE_FLIP", "text": "The author rejects their conclusion."}, "B": {"trap": "CRITICISM_SCOPE", "text": "The facts are the part the author accepts."}, "D": {"trap": "CRITICISM_SCOPE", "text": "Exactly reversed."}, "E": {"trap": "CONTRADICTS", "text": "Boundary disputes 'now make up most of its business'."}}, "method_reminder": "Name what the author accepts and what the author rejects before reading the choices.", "flashcard": {"front": "Two-part attitude (accepts facts, rejects conclusion). The classic trap?", "back": "The same two parts swapped: accepts the conclusion, rejects the facts."}}, "original": true}, {"id": "RC-LAW-001-3", "section": "RC", "type": "Function", "difficulty": 3, "target_seconds": 55, "tags": ["function", "example"], "stem": "The example of the fence that has stood for thirty years serves primarily to", "choices": {"A": "illustrate how possessors deliberately seize neighboring land", "B": "show how a long-standing arrangement creates reliance on both sides of a boundary", "C": "prove that property surveys are unreliable", "D": "demonstrate that boundary disputes are rare", "E": "argue that fences should not be built near property lines"}, "answer": "B", "explanation": {"argument_skeleton": "Paragraph 3: the fence 'shaped how both neighbors use their land'; value lies in 'protecting the reliance that time has created on both sides'.", "why_correct": "The fence illustrates reliance built up over time on both sides, the basis of the author's defense.", "why_wrong": {"A": {"trap": "CONTRADICTS", "text": "Paragraph 2: possessors in such cases 'rarely intended to take anything'."}, "C": {"trap": "EXTREME", "text": "An old survey being overridden does not make surveys unreliable."}, "D": {"trap": "CONTRADICTS", "text": "They are most of the doctrine's business."}, "E": {"trap": "OUT_OF_SCOPE", "text": "No advice about building fences appears."}}, "method_reminder": "Examples serve the claim in the same paragraph. Name that claim.", "flashcard": {"front": "Law passage example: a long-standing fence. Typical function?", "back": "To show reliance built over time, the core of the 'quiet title' rationale."}}, "original": true}, {"id": "RC-LAW-001-4", "section": "RC", "type": "Application", "difficulty": 4, "target_seconds": 70, "tags": ["application", "policy"], "stem": "Which one of the following legislative changes would the author be most likely to support?", "choices": {"A": "abolishing adverse possession entirely", "B": "requiring a new survey with every property sale while abolishing adverse possession for boundary disputes", "C": "lengthening the statutory period for all claims", "D": "restricting claims based on deliberate seizure of land while keeping the doctrine for boundary disputes", "E": "allowing claims only when the possessor has made productive use of the land"}, "answer": "D", "explanation": {"argument_skeleton": "Paragraph 4: a legislature 'might reasonably restrict claims based on deliberate seizure... while preserving the doctrine for the boundary disputes'.", "why_correct": "D restates the reform the author endorses as reasonable.", "why_wrong": {"A": {"trap": "VALENCE_FLIP", "text": "The author defends the doctrine."}, "B": {"trap": "CONTRADICTS", "text": "It removes the doctrine exactly where the author says it is strongest."}, "C": {"trap": "OUT_OF_SCOPE", "text": "The passage never discusses the length of the period."}, "E": {"trap": "SHELL_GAME", "text": "Built on the productive-use rationale the author says does not fit boundary cases."}}, "method_reminder": "Application: the author usually states the principle near the end. Apply it literally.", "flashcard": {"front": "Which policy would the author support? Where do you look first?", "back": "The last paragraph, where authors usually state their proposal."}}, "original": true}, {"id": "RC-LAW-001-5", "section": "RC", "type": "Detail", "difficulty": 2, "target_seconds": 45, "tags": ["detail"], "stem": "According to the passage, the third justification for adverse possession is that the doctrine", "choices": {"A": "confirms settled expectations rather than reopening disputes whose evidence has faded", "B": "rewards those who put land to productive use", "C": "penalizes owners who neglect their property", "D": "encourages owners to commission surveys", "E": "prevents trespass"}, "answer": "A", "explanation": {"argument_skeleton": "Paragraph 1 lists three justifications; the third is quieting title.", "why_correct": "A paraphrases paragraph 1's 'above all, quiets title' clause.", "why_wrong": {"B": {"trap": "RECYCLED_LANGUAGE", "text": "The first justification, in the passage's own words."}, "C": {"trap": "SHELL_GAME", "text": "The second justification."}, "D": {"trap": "OUT_OF_SCOPE", "text": "Surveys are mentioned, but not as a purpose of the doctrine."}, "E": {"trap": "CONTRADICTS", "text": "The doctrine is said to look like a license for trespass."}}, "method_reminder": "Lists in law passages are numbered by position. Count to the right item.", "flashcard": {"front": "Detail question about 'the third' item in a list. Main risk?", "back": "Picking an earlier item copied word for word."}}, "original": true}, {"id": "RC-LAW-001-6", "section": "RC", "type": "Inference", "difficulty": 4, "target_seconds": 65, "tags": ["inference"], "stem": "It can be inferred that the author regards the language of reward and penalty as", "choices": {"A": "irrelevant to every adverse possession case", "B": "apt for cases of deliberate seizure but ill-suited to most boundary disputes", "C": "the strongest justification for the doctrine", "D": "a recent invention of the doctrine's critics", "E": "equally apt for every kind of adverse possession case"}, "answer": "B", "explanation": {"argument_skeleton": "Paragraph 4: in deliberate seizures 'the language of reward and penalty does real work'; paragraph 3: in boundary cases the value 'lies not in rewarding the possessor'.", "why_correct": "Real work in deliberate seizures, not the point in boundary cases: B.", "why_wrong": {"A": {"trap": "EXTREME", "text": "It 'does real work' in deliberate seizures."}, "C": {"trap": "CONTRADICTS", "text": "The author calls quieting title the strongest, 'above all'."}, "D": {"trap": "CONTRADICTS", "text": "Courts 'have long said' it."}, "E": {"trap": "EXTREME", "text": "The author distinguishes the two kinds of cases."}}, "method_reminder": "Inference across paragraphs: combine two located lines, nothing more.", "flashcard": {"front": "Author says a rationale 'does real work' in one kind of case. What does that imply about others?", "back": "It is weaker elsewhere, but not useless everywhere. Avoid extreme versions."}}, "original": true}]}, {"id": "RC-CMP-001", "passage_type": "social_science", "comparative": true, "difficulty": 4, "title": "Filtering and Displacement", "text": ["Economists studying housing markets have long described a process called filtering. When new housing is built, it is typically priced for higher-income households, and those households move out of older units to occupy it. The units they vacate become available to households with somewhat lower incomes, who in turn vacate still older units, and so on down a chain of moves. Economists sometimes compare the process to the market for used cars, in which vehicles first sold to wealthier buyers eventually become the affordable cars of others. The process depends on vacancy: each move opens a unit only because someone left it.", "Over time, then, housing built for the affluent becomes housing for the middle class and eventually for lower-income households. The practical implication is straightforward. Cities that permit abundant new construction, even of expensive units, expand the supply of affordable housing indirectly, while cities that restrict construction force higher-income households to compete for older units, bidding up their rents. Where construction is blocked, the chain never starts, and older units that might have filtered down are instead upgraded to serve the affluent. Studies tracking individual moves have found chains of this kind in many metropolitan areas, and regions with more construction have generally seen slower rent growth. Critics who object that new luxury buildings do nothing for low-income renters are thus looking in the wrong place: the benefit appears not in the new building but several moves away.", "The filtering account describes a real mechanism, but the timescale on which it operates matters as much as its direction. The direction of the process is not seriously in dispute; its speed is. Chains of moves that begin with a new high-end building may take a decade or more to free up units that low-income households can afford, and along the way older units are often renovated, merged, or demolished, removing them from the chain. Researchers who have followed particular buildings find that units lost to renovation can break a chain entirely.", "Meanwhile, the neighborhoods where new high-end buildings appear can change quickly: new amenities attract further investment, landlords raise rents in anticipation, and long-time residents may be displaced well before any benefit filters down to them. Residents displaced in the first years of such a change rarely return, even if rents later stabilize, and a regional statistic can conceal their loss entirely. None of this means new construction is harmful at the scale of a region. It means that a regional gain can coexist with a neighborhood loss, and that the households bearing the loss are not necessarily the ones who will eventually gain. Policy that relies on filtering alone asks the most vulnerable renters to wait the longest. Pairing new construction with protections against displacement where it occurs would capture the regional benefit while addressing the local cost."], "text_labels": ["Passage A", "", "Passage B", ""], "model_margin_notes": ["A: filtering mechanism, chain of moves", "A: so permit construction; critics look in wrong place", "B: accepts mechanism; slow, chains break", "B: regional gain + local loss; pair building with anti-displacement"], "main_point": "A: new construction, even expensive, expands affordable housing through filtering. B: filtering is real but slow and leaky, so pair construction with anti-displacement protections.", "author_attitude": "A: confident, dismissive of critics. B: accepts A's mechanism, qualifies it, constructive.", "structure": "A explains a mechanism and its policy implication. B accepts the mechanism, adds timing and local effects, and proposes a complementary policy.", "questions": [{"id": "RC-CMP-001-1", "section": "RC", "type": "Comparative", "difficulty": 4, "target_seconds": 70, "tags": ["comparative", "relationship"], "stem": "Which one of the following most accurately describes the relationship between the two passages?", "choices": {"A": "Passage B rejects the mechanism that Passage A describes.", "B": "Passage B offers further evidence for Passage A's conclusion without qualifying it.", "C": "Passage A responds to objections raised in Passage B.", "D": "Passage B accepts the mechanism Passage A describes but argues that its timing and local effects call for additional policy.", "E": "The two passages describe entirely different phenomena."}, "answer": "D", "explanation": {"argument_skeleton": "A says filtering works, so build. B says filtering is real, slow and leaky, so build and protect.", "why_correct": "B opens by calling filtering 'a real mechanism', then adds timing, chain breaks and displacement, and ends with a complementary policy. D captures all three moves.", "why_wrong": {"A": {"trap": "VALENCE_FLIP", "text": "B calls it 'a real mechanism'."}, "B": {"trap": "HALF_RIGHT", "text": "B builds on A, but qualifies it heavily."}, "C": {"trap": "DIRECTION_FLIP", "text": "A answers unnamed critics, not B; B responds to A's account."}, "E": {"trap": "EXTREME", "text": "Both discuss the same filtering process."}}, "method_reminder": "Write 'A says, B says, B ___ A' before reading the choices.", "flashcard": {"front": "Comparative relationship: B grants A's mechanism and adds conditions. Label?", "back": "B qualifies or extends A. Not 'rejects', not 'merely supports'."}}, "original": true}, {"id": "RC-CMP-001-2", "section": "RC", "type": "Comparative", "difficulty": 4, "target_seconds": 70, "tags": ["comparative", "agreement"], "stem": "The authors of both passages would most likely agree that", "choices": {"A": "permitting new construction can benefit a region's housing market as a whole", "B": "new luxury buildings cause displacement in the neighborhoods where they are built", "C": "filtering frees up affordable units within a few years", "D": "housing policy should rely on filtering alone", "E": "renovation removes most older units from the housing supply"}, "answer": "A", "explanation": {"argument_skeleton": "A: construction expands affordable supply. B: 'None of this means new construction is harmful at the scale of a region' and policy 'would capture the regional benefit'.", "why_correct": "Both affirm a regional benefit from new construction: A directly, B by referring to the 'regional benefit' its policy would capture.", "why_wrong": {"B": {"trap": "ONE_SPEAKER", "text": "Only B raises displacement, and says residents 'may' be displaced."}, "C": {"trap": "CONTRADICTS", "text": "B says a decade or more; A gives no timescale."}, "D": {"trap": "CONTRADICTS", "text": "B explicitly rejects relying on filtering alone."}, "E": {"trap": "EXTREME", "text": "B says units are 'often' renovated, not that most are lost."}}, "method_reminder": "For agreement, find a line in each passage that commits its author to the claim.", "flashcard": {"front": "Comparative agreement: what must be true of the right answer?", "back": "Each author commits to it somewhere. One-author claims are traps."}}, "original": true}, {"id": "RC-CMP-001-3", "section": "RC", "type": "Function", "difficulty": 3, "target_seconds": 55, "tags": ["function"], "stem": "In Passage A, the statement that critics are “looking in the wrong place” serves to", "choices": {"A": "concede that critics have identified a real harm", "B": "suggest that new buildings are often poorly located", "C": "argue that the benefits of new construction appear elsewhere in the chain of moves rather than in the new building itself", "D": "introduce evidence about neighborhood displacement", "E": "dismiss the needs of low-income renters as unimportant"}, "answer": "C", "explanation": {"argument_skeleton": "Same sentence: 'the benefit appears not in the new building but several moves away'.", "why_correct": "The phrase redirects the critics to where A says the benefit actually shows up: further down the chain.", "why_wrong": {"A": {"trap": "VALENCE_FLIP", "text": "A dismisses the critics' objection rather than conceding it."}, "B": {"trap": "RECYCLED_LANGUAGE", "text": "Takes 'place' literally; the phrase is about where benefits appear."}, "D": {"trap": "SHELL_GAME", "text": "Displacement is Passage B's topic."}, "E": {"trap": "EXTREME", "text": "A argues low-income renters do benefit, eventually."}}, "method_reminder": "Figurative phrases: translate into a literal claim from the same sentence.", "flashcard": {"front": "A phrase like 'looking in the wrong place'. How do you answer its function?", "back": "Translate it literally using its own sentence. Watch for answers that take the metaphor literally."}}, "original": true}, {"id": "RC-CMP-001-4", "section": "RC", "type": "Author Response", "difficulty": 4, "target_seconds": 70, "tags": ["comparative", "response"], "stem": "The author of Passage B would most likely respond to the final sentence of Passage A by pointing out that", "choices": {"A": "new luxury buildings provide no benefit to anyone", "B": "the critics are right that filtering does not occur", "C": "studies tracking individual moves are unreliable", "D": "luxury buildings should be prohibited in low-income neighborhoods", "E": "a benefit several moves away may arrive too late for the residents who bear costs near the new building"}, "answer": "E", "explanation": {"argument_skeleton": "A ends: the benefit appears 'several moves away'. B: chains take a decade or more; residents 'may be displaced well before any benefit filters down to them'.", "why_correct": "B accepts that the benefit is real but distant in time and place, and that the people near the new building may bear costs before it arrives. E is B's reply.", "why_wrong": {"A": {"trap": "EXTREME", "text": "B grants a regional benefit."}, "B": {"trap": "CONTRADICTS", "text": "B calls filtering a real mechanism."}, "C": {"trap": "OUT_OF_SCOPE", "text": "B never questions the studies."}, "D": {"trap": "EXTREME", "text": "B proposes protections against displacement, concept", "C": "qualify an account of how new housing benefits lower-income households and propose a complementary policy", "D": "argue that displacement is the main cause of rising rents", "E": "summarize research on neighborhood amenities"}, "answer": "C", "explanation": {"argument_skeleton": "Passage B: accepts the mechanism, adds timing and local costs, recommends pairing construction with protections.", "why_correct": "C has the right verbs, qualify and propose, and the right objects.", "why_wrong": {"A": {"trap": "VALENCE_FLIP", "text": "B never disputes the regional effect."}, "B": {"trap": "OUT_OF_SCOPE", "text": "No history of the concept is given."}, "D": {"trap": "EXTREME", "text": "Displacement is a local cost, not called the main cause of rising rents."}, "E": {"trap": "TOO_NARROW", "text": "Amenities are one detail in one sentence."}}, "method_reminder": "Purpose answers: match the verb first (qualify, propose, refute, describe).", "flashcard": {"front": "Primary Purpose: what do you check first in each choice?", "back": "The verb. Then whether the object covers the whole passage."}}, "original": true}]}]};

  const blocked=picks.filter(id=>tierIdx(LIB.Q[id].type)<2).sort((a,b)=>LIB.Q[a].type<LIB.Q[b].type?-1:1);const inter=shuffle(picks.filter(id=>tierIdx(LIB.Q[id].type)>=2));
  const out=[];let bi=0,ii=0;while(bi<blocked.length||ii<inter.length){for(let k=0;k<2&&bi<blocked.length;k++)out.push(blocked[bi++]);if(ii<inter.length)out.push(inter[ii++])}return out}

const RAW2SCALED=[120,120,120,120,120,120,120,120,120,120,122,123,124,125,126,127,128,130,131,132,133,134,136,137,138,139,140,141,142,143,144,145,146,147,148,148,149,150,151,152,152,153,154,155,156,156,157,158,159,160,160,161,162,163,163,164,165,166,166,167,168,169,169,170,171,172,172,173,174,175,176,176,177,178,179,180,180,180];
function scaledFromRaw(raw){raw=clamp(Math.round(raw),0,77);return RAW2SCALED[raw]}
const MIX=[0,.12,.24,.30,.22,.12];
function expAcc(th){let e=0;for(let s=1;s<=5;s++)e+=MIX[s]*pWin(th,STAR_D[s]);return e}
function solveTheta(atts){let c=1,ds=[1060,1060];let lo=300,hi=1900;for(const a of atts){ds.push(STAR_D[a.d]||1060);c+=a.ok}for(let i=0;i<40;i++){const mid=(lo+hi)/2;let e=0;for(const D of ds)e+=pWin(mid,D);if(e<c)lo=mid;else hi=mid}const th=(lo+hi)/2;let info=0;for(const D of ds){const p=pWin(th,D);info+=p*(1-p)}const se=(400/Math.LN10)/Math.sqrt(Math.max(info,.5));return{th,se}}
function timedSets(){const sets={LR:new Set(),RC:new Set()};for(const a of A){if(!TIMED.has(a.m)||!a.set)continue;const q=LIB.Q[a.q];if(!q)continue;sets[q.section==='RC'?'RC':'LR'].add(a.set)}return{LR:sets.LR.size,RC:sets.RC.size}}
function projection(){const cut=now()-75*DAY;const lr=[],rc=[];for(const a of A){if(!TIMED.has(a.m)||a.t<cut||S.quarantine[a.q])continue;const q=LIB.Q[a.q];if(!q)continue;(q.section==='RC'?rc:lr).push(a)}
  const ts=timedSets();let model=null;
  if(ts.LR>=5&&ts.RC>=5){const L=solveTheta(lr.slice(-300)),R=solveTheta(rc.slice(-200));const eL=expAcc(L.th),eR=expAcc(R.th);const raw=eL*50+eR*27;const dL=(expAcc(L.th+L.se)-expAcc(L.th-L.se))/2*50,dR=(expAcc(R.th+R.se)-expAcc(R.th-R.se))/2*27;const sd=Math.sqrt(dL*dL+dR*dR)+1.2;model={mid:scaledFromRaw(raw),lo:scaledFromRaw(raw-1.3*sd),hi:scaledFromRaw(raw+1.3*sd),raw,eL,eR}}
  const real=S.realTests.slice().sort((a,b)=>a.date<b.date?-1:1).slice(-2).map(r=>+r.scaled).filter(Boolean);
  if(real.length){const rm=avg(real);if(model){const mid=Math.round(.7*rm+.3*model.mid);const half=Math.max(2,Math.round((model.hi-model.lo)/3));return{mid,lo:clamp(mid-half,120,180),hi:clamp(mid+half,120,180),src:'blend',ts,model,real}}return{mid:Math.round(rm),lo:clamp(Math.round(rm)-3,120,180),hi:clamp(Math.round(rm)+3,120,180),src:'real',ts,real}}
  if(model)return Object.assign({src:'model',ts},model);return{mid:null,ts,src:'none'}}
function snapshotProjection(){const p=projection();if(p.mid==null)return;const k=dayKey();const h=S.projHist;if(h.length&&h[h.length-1].d===k)h[h.length-1]={d:k,lo:p.lo,mid:p.mid,hi:p.hi};else h.push({d:k,lo:p.lo,mid:p.mid,hi:p.hi});if(h.length>200)h.shift()}

  if(Store.db&&Store.ready)cloudSave(core);else if(Store.db){}else{Store.lastSave=now();Store.status=Store.localOk?'local':'fail';renderSave()}}
async function writeChunked(name,str,rev){const CH=60000;const n=Math.max(1,Math.ceil(str.length/CH));for(let i=0;i<n;i++)await Store.db.doc(base()+name+'-'+i).set({s:str.slice(i*CH,(i+1)*CH)});const meta={n,savedAt:S.savedAt,v:APP.schema};if(rev!=null)meta.rev=rev;await Store.db.doc(base()+name).set(meta)}
async function readChunked(name){const m=await Store.db.doc(base()+name).get();if(!m.exists)return null;const d=m.data();let s='';for(let i=0;i<d.n;i++){const c=await Store.db.doc(base()+name+'-'+i).get();if(!c.exists)return null;s+=c.data().s}return{str:s,savedAt:d.savedAt,rev:d.rev||0}}
function cloudSave(core){if(Store.writing){Store.again=true;return}Store.writing=true;Store.status='saving';renderSave();const rev=S.rev;
  (async()=>{try{const m=await Store.db.doc(base()+'core').get();if(m.exists&&((m.data().rev||0)>(S.cloudRev||0))){Store.writing=false;Store.again=false;await reconcile();return}
    await writeChunked('core',core,rev);for(const i of Array.from(Store.dirtyAtt)){Store.dirtyAtt.delete(i);await Store.db.doc(base()+'att-'+i).set({s:JSON.stringify(A.slice(i*ATT_CHUNK,(i+1)*ATT_CHUNK)),i})}S.cloudRev=Math.max(S.cloudRev||0,rev);Store.remoteRev=S.cloudRev;lsSet(LS.core,JSON.stringify(S));Store.status='cloud';Store.err='';Store.lastSave=now()}catch(e){Store.status=Store.localOk?'cloudfail':'fail';Store.err=(e&&(e.code||e.message))||'error'}
    Store.writing=false;renderSave();if(Store.again){Store.again=false;saveNow()}})()}
async function writePack(pk){if(!Store.db)return;try{await writeChunked('pack-'+packKey(pk.pack),JSON.stringify(pk))}catch(e){Store.err=(e&&e.code)||'pack write failed';Store.status='cloudfail';renderSave()}}
function packKey(id){return String(id).replace(/[^A-Za-z0-9_\-]/g,'_').slice(0,80)}

  const packs=[];for(const pm of rs.packsMeta||[]){const r=await readChunked('pack-'+packKey(pm.id));if(r){try{packs.push(JSON.parse(r.str))}catch(e){}}}return{rs,att,packs}}

async function decide(remote){const R=await loadRemote(remote);const rrev=remote.rev||0,lp=progOf(S,A),rp=progOf(R.rs,R.att),synced=S.cloudRev!=null;let mode,conflict=false;
  if(synced){const moved=rrev>S.cloudRev,changed=(S.rev||0)>S.cloudRev;if(!moved)mode='push';else if(!changed)mode='take';else{conflict=true;mode=rp>=lp?'take':'push'}}
  else mode=rp>lp?'take':'push';
  Store.remoteRev=rrev;
  if(mode==='take'){if(lp>0&&(conflict||!synced)&&JSON.stringify(S)!==remote.str)stashBackup('device copy replaced by cloud',JSON.stringify(S),A);
    S=R.rs;A=R.att;IMPORTED=R.packs;S.cloudRev=rrev;S.rev=rrev;SEEN=null;indexContent();applySettings();lsSet(LS.core,JSON.stringify(S));lsSet(LS.att,JSON.stringify(A));lsSet(LS.packs,JSON.stringify(IMPORTED));Store.ready=true;Store.status='cloud';Store.lastSave=now();
    toast(conflict?'Another device had more progress, so I loaded that one. Your other copy is backed up in Preferences.':'Loaded your climb from your cloud save.','volt');render()}
  else{if(rp>0&&(conflict||!synced))stashBackup('cloud copy replaced by this device',remote.str,R.att);
    S.cloudRev=rrev;for(let i=0;i<Math.ceil(A.length/ATT_CHUNK);i++)Store.dirtyAtt.add(i);for(const pk of IMPORTED)await writePack(pk);Store.ready=true;if(conflict||(!synced&&rp>0))toast('This device had more progress than the cloud copy, so I kept this one. The cloud copy is backed up in Preferences.','volt');saveNow()}}
async function reconcile(){try{const remote=await readChunked('core');if(remote)await decide(remote);else{Store.ready=true;saveNow()}}catch(e){Store.db=null;Store.status=Store.localOk?'cloudfail':'fail';Store.err=(e&&(e.code||e.message))||'error';renderSave()}}
async function checkRemote(){if(!Store.db||!Store.ready||Store.writing)return;try{const m=await Store.db.doc(base()+'core').get();if(m.exists&&((m.data().rev||0)>(S.cloudRev||0)))await reconcile()}catch(e){}}

  const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.05;lg.gain.value=180;lfo.connect(lg).connect(f.frequency);lfo.start();os.push(lfo);f.connect(g).connect(ac.destination);g.gain.linearRampToValueAtTime(.035,ac.currentTime+3);AMB={g,os}}

/* ----- the Daily Climb ----- */
function buildClimb(len){const ex=new Set();const steps=[{type:'warmup'}];
  const nMain=len===20?6:len===45?10:16;const main=adaptiveMix(nMain,ex);main.forEach(x=>ex.add(x));
  steps.push({type:'set',set:makeSet({label:'Main Quest',mode:'blind',items:main})});
  const exP=[];if(len===90){const p=pickPassage({humanities:true});if(p){exP.push(p);steps.push({type:'set',set:makeSet({label:'Main Quest: passage with margin notes',mode:'blind',items:passQs(p),margin:true})})}}
  if(len>=45){const rcDay=len===90||dayNum()%2===1;if(rcDay){const p=pickPassage({humanities:true,exclude:exP});if(p)steps.push({type:'set',set:makeSet({label:'Timed Trial: one passage in 8:45',mode:'timed',items:passQs(p),timeLimit:525})})}
    if(!rcDay||len===90){const t=pickQs(LIB.lr,8,{exclude:ex});steps.push({type:'set',set:makeSet({label:'Timed Trial: 8 in 11',mode:'timed',items:t,timeLimit:660})})}}
  steps.push({type:'autopsy'},{type:'reflect'},{type:'rewards'});
  return steps}
function startClimb(len){if(S.active){confirmBox('Replace your session?','You have a session in progress. Starting a new Daily Climb ends it without recording unfinished sets.','Start new climb',()=>{S.active=null;startClimb(len)});return}

function ansOf(set,id){return set.ans[id]||(set.ans[id]={ch:'',conf:'',fl:0,sec:0,chg:0,first:null,struck:[],pred:'',hint:0,checked:false})}
function curQid(set){if(set.phase==='br')return set.brList[set.brIdx];return set.items[set.idx]}
function choose(L){const set=curSet();if(!set)return;const id=curQid(set);const q=LIB.Q[id];if(!q)return;
  if(set.phase==='br'){const b=set.br[id]||(set.br[id]={ch:''});b.ch=L;saveSoon();renderPlayer();return}
  const a=ansOf(set,id);if(a.checked)return;if(set.twist==='predict'&&!a.revealed)return;if(set.twist==='nochange'&&a.ch){toast('No second looks in this fight. First answer stands.');return}

  if(a.first==null)a.first=L;else if(a.ch&&a.ch!==L)a.chg++;a.ch=L;sfx('tick');

function setConf(c){const set=curSet();if(!set)return;const a=ansOf(set,curQid(set));if(set.phase!=='answer'||a.checked)return;a.conf=c;saveSoon();renderPlayer()}
function toggleFlag(){const set=curSet();if(!set||set.phase!=='answer')return;const a=ansOf(set,curQid(set));a.fl=a.fl?0:1;saveSoon();renderPlayer()}

  if(a.checked)return;a.checked=true;if(!a.conf)a.conf='think';const rec=recordAnswer(q,a,set.mode,set.id,set.idx+1);a.ok=rec.ok;sfx(rec.ok?'ok':'slip');if(typeof onCheck==='function')onCheck(set,q,a,rec.ok);

function goIdx(i){const set=curSet();if(!set)return;if(set.phase==='br'){set.brIdx=clamp(i,0,set.brList.length-1)}else set.idx=clamp(i,0,set.items.length-1);set.qStart=now();renderPlayer();scrollTop()}
function nextQ(){const set=curSet();if(!set)return;
  if(set.phase==='answer'){const id=curQid(set);const a=ansOf(set,id);
    if((set.mode==='guided'||set.mode==='speed')&&!a.checked){if(a.ch)checkCurrent();else if(set.mode==='speed'){checkCurrent()}else toast('Check your answer first.');return}
    if(set.trap&&a.huntPending){toast('Name the trap first, or skip it.');return}
    if(!a.conf&&a.ch)a.conf='think';
    if(set.idx<set.items.length-1){goIdx(set.idx+1);return}
    if(set.mode==='sim'){openReview();return}
    finishAnswerPhase(false);return}
  if(set.phase==='br'){if(set.brIdx<set.brList.length-1){goIdx(set.brIdx+1);return}finishBR()}}
function prevQ(){const set=curSet();if(!set)return;if(set.phase==='br')goIdx(set.brIdx-1);else goIdx(set.idx-1)}
function finishAnswerPhase(timeUp){const set=curSet();if(!set||set.phase!=='answer')return;closeModal();
  if(timeUp){toast('Time. Pencils down.','gold');sfx('bad')}
  for(const id of set.items){const a=ansOf(set,id);if(!a.conf)a.conf=a.ch?'think':'guess'}
  if(set.mode==='guided'||set.mode==='speed'||set.trap){for(const id of set.items){const a=ansOf(set,id);if(!a.checked){a.checked=true;const r=recordAnswer(LIB.Q[id],a,set.mode,set.id,set.items.indexOf(id)+1);a.ok=r.ok}}set.phase='done';set.recorded=true;set.res=setResults(set);afterSet(set);nextStep();return}
  const list=set.items.filter(id=>{const a=ansOf(set,id);const q=LIB.Q[id];return a.fl||a.conf!=='sure'||a.ch!==q.answer});
  if(!list.length||set.noBR){recordSet(set);set.phase='done';afterSet(set);nextStep();return}
  set.phase='br';set.brList=list;set.brIdx=0;saveSoon();render();scrollTop()}

  set.res=setResults(set);S.counters.sets=(S.counters.sets||0)+1;if(TIMED.has(set.mode))S.counters.timedSets=(S.counters.timedSets||0)+1;checkAch();saveNow()}
function setResults(set){let c=0,cb=0,n=set.items.length;for(const id of set.items){const q=LIB.Q[id];const a=ansOf(set,id);const ok=a.ch===q.answer;c+=ok?1:0;const b=set.br[id];cb+=(b&&b.ch)?(b.ch===q.answer?1:0):(ok?1:0)}return{c,n,cb,gap:cb-c,sec:Math.round(set.elapsed)}}
