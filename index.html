<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ascent to 180</title>
<meta name="description" content="LSAT prep as a climb: adaptive practice, blind review and trap-coded explanations.">
<meta name="theme-color" content="#05080F">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ascent 180">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="fonts/fonts.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>document.documentElement.classList.add('standalone')</script>
</head>
<body>
<style>
/* Ascent to 180, expedition build. Chrome: dark glass over a live mountain. Reading surfaces: night slate or paper.
   Type: Barlow Condensed (display, numerals), Barlow (interface), Literata (reading). */
:root{
  color-scheme:dark;
  --night:#060A14;
  --paper:#080D1A; --paper2:rgba(8,13,26,.82);
  --card:rgba(11,17,33,.76); --card2:rgba(22,31,56,.72);
  --ink:#EAF0FA; --ink2:#B6C2D8; --ink3:#8894AD; --line:rgba(190,210,255,.12); --line2:rgba(190,210,255,.22);
  --gold:#FFC56B; --goldf:#F2A93B; --goldsoft:rgba(242,169,59,.16);
  --volt:#74E8D2; --voltf:#2DC7AD; --voltsoft:rgba(45,199,173,.15);
  --bad:#FF8C95; --badf:#EF5562; --badsoft:rgba(239,85,98,.16);
  --c1:#B8862B; --c2:#1AA3B2;
  --seq0:#18213A; --seq1:#3B3A3A; --seq2:#6E5A2E; --seq3:#B08433; --seq4:#F2C063;
  --hl:rgba(255,197,107,.30);
  --shadow:0 22px 48px -24px rgba(0,0,0,.75);
  --blur:blur(16px) saturate(1.25);
  --f-display:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-read:"Literata","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-mono:"Barlow Condensed","Roboto Condensed",ui-monospace,monospace;
  --fs:1;
  --rbg:#0E1424; --rcard:#141C30; --rcard2:#192239; --rink:#E8EDF6; --rink2:#B3BED2; --rink3:#8692A9; --rline:rgba(220,230,255,.10); --rline2:rgba(220,230,255,.19); --rsel:#F2A93B; --rhl:rgba(255,197,107,.30);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--rbg:#F6F3EC;--rcard:#FFFDF8;--rcard2:#EEE9DD;--rink:#18202F;--rink2:#3F4A60;--rink3:#677087;--rline:rgba(24,32,47,.12);--rline2:rgba(24,32,47,.24);--rsel:#9A6510;--rhl:rgba(240,190,80,.42)}}
:root[data-theme="light"]{--rbg:#F6F3EC;--rcard:#FFFDF8;--rcard2:#EEE9DD;--rink:#18202F;--rink2:#3F4A60;--rink3:#677087;--rline:rgba(24,32,47,.12);--rline2:rgba(24,32,47,.24);--rsel:#9A6510;--rhl:rgba(240,190,80,.42)}
:root[data-font="lexend"]{--f-read:"Lexend",system-ui,sans-serif;--f-ui:"Lexend",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-ui);font-size:calc(15px*var(--fs));line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:inline-block;vertical-align:-3px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.disp{font-family:var(--f-display);font-weight:600;letter-spacing:.005em;text-wrap:balance}
.read{font-family:var(--f-read)}
.muted{color:var(--ink3)} .sub{color:var(--ink2)}
.eyebrow{font-size:calc(13px*var(--fs));color:var(--ink3);font-weight:500}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1.disp{font-size:calc(42px*var(--fs));line-height:1.02}
h2.disp{font-size:calc(30px*var(--fs));line-height:1.08}
h3{font-size:calc(17px*var(--fs));font-weight:600}
p{margin:0}

/* ---------- the scene ---------- */
#scene{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0;background:#05080F}
#veil{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .7s ease,background .7s ease;background:linear-gradient(180deg,rgba(4,7,15,.62),rgba(4,7,15,.74))}
.veiled #veil{opacity:1}
.deepveil #veil{background:linear-gradient(180deg,rgba(4,7,15,.86),rgba(4,7,15,.9))}
.noscene #scene,.sceneoff #scene{display:none}
.noscene body,.sceneoff body{background:radial-gradient(120% 80% at 70% 0%,#1C2A55 0%,#0B1230 45%,#05080F 100%) fixed}
#app{position:relative;z-index:2}
#fx,#fxl{position:relative;z-index:70}
#fxl{position:fixed;inset:0;pointer-events:none}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(7,11,22,.82),rgba(7,11,22,.64));backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);padding:16px 10px 24px max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:1px;scrollbar-width:thin}
.brand{display:flex;align-items:baseline;gap:2px;padding:2px 12px 14px}
.brand b{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.brand span{font-family:var(--f-display);font-size:22px;color:var(--gold);font-weight:600}
.navgroup{margin:14px 12px 4px;font-size:12px;color:var(--ink3);font-weight:500}
.nav{display:flex;align-items:center;gap:11px;padding:7px 12px;border-radius:9px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink2);font-size:calc(14.5px*var(--fs));width:100%;font-weight:500;position:relative}
.nav .ic{color:var(--ink3)}
.nav:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.nav.on{background:linear-gradient(90deg,rgba(242,169,59,.16),rgba(242,169,59,.03));color:var(--ink)}
.nav.on .ic{color:var(--gold)}
.nav.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--goldf);box-shadow:0 0 10px var(--goldf)}
.nav .lock{margin-left:auto;font-size:11px;color:var(--ink3)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:12px max(20px,env(safe-area-inset-right,0px)) 10px 22px;flex-wrap:wrap}
.veiled .top{background:linear-gradient(180deg,rgba(6,10,20,.8),rgba(6,10,20,0));}
.top .grow{flex:1}
.chip{display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:12px;background:rgba(9,14,28,.62);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);min-height:42px}
.chip .ic{color:var(--ink3)}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat small{font-size:11.5px;color:var(--ink3)}
.stat b{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.01em}
.lvring{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--goldf) calc(var(--p)*1%),rgba(255,255,255,.1) 0);flex:none}
.lvring b{width:27px;height:27px;border-radius:50%;background:#0D1428;display:grid;place-items:center;font-family:var(--f-display);font-size:15px;font-weight:700}
.xpbar{width:118px;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#F2A93B,#FFD58A);border-radius:3px;box-shadow:0 0 8px rgba(242,169,59,.7)}
.savechip{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink3);border:1px solid var(--line);padding:5px 10px;border-radius:999px;background:rgba(9,14,28,.6);cursor:pointer;backdrop-filter:var(--blur)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.dot.ok{background:var(--voltf);box-shadow:0 0 6px var(--voltf)} .dot.warn{background:var(--goldf)} .dot.bad{background:var(--badf)}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:rgba(9,14,28,.6);color:var(--ink2);cursor:pointer;backdrop-filter:var(--blur)}
.iconbtn:hover{color:var(--ink);border-color:var(--line2)}
.content{padding:18px max(24px,env(safe-area-inset-right,0px)) 64px 24px;max-width:1260px;width:100%}
.content.full{max-width:none;padding:0}
.isfs .content{max-width:1640px}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--card);backdrop-filter:var(--blur);margin-bottom:14px;font-size:14px}
.banner.warn{border-color:rgba(242,169,59,.55);background:linear-gradient(90deg,rgba(242,169,59,.16),rgba(11,17,33,.78))}
.banner.bad{border-color:rgba(239,85,98,.6);background:linear-gradient(90deg,rgba(239,85,98,.18),rgba(11,17,33,.78))}
.banner .x{margin-left:auto}

/* ---------- music mini player ---------- */
.mplayer{display:flex;align-items:center;gap:4px;padding:4px;border-radius:12px;border:1px solid var(--line);background:rgba(9,14,28,.62);backdrop-filter:var(--blur);min-height:42px}
.mbtn{width:32px;height:32px;border-radius:9px;border:0;display:grid;place-items:center;background:rgba(255,255,255,.07);cursor:pointer;color:var(--ink)}
.mplayer.on .mbtn{background:var(--goldf);color:#1B1205}
.mst{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink2);cursor:pointer;font-size:13px;font-weight:600;padding:4px 6px;border-radius:8px}
.mst:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.eq{display:flex;align-items:flex-end;gap:2px;height:14px;width:14px;margin-right:6px}
.eq i{flex:1;background:var(--ink3);height:3px;border-radius:1px}
.mplayer.on .eq i{background:var(--gold);animation:eq 1s ease-in-out infinite}
.mplayer.on .eq i:nth-child(2){animation-delay:-.4s}.mplayer.on .eq i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:3px}50%{height:13px}}

/* ---------- building blocks ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-width:0;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.card.flat{box-shadow:none;background:var(--card2)}
.card h3{margin-bottom:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.stack{display:flex;flex-direction:column;gap:16px}
.between{justify-content:space-between}
.sep{height:1px;background:var(--line);margin:12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 15px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.06);cursor:pointer;font-weight:600;font-size:calc(14px*var(--fs));color:var(--ink);text-decoration:none;letter-spacing:.01em;transition:background .15s,border-color .15s,transform .08s}
.btn:hover{border-color:rgba(255,255,255,.34);background:rgba(255,255,255,.1)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#FFD68C,#F2A93B);color:#1B1205;border-color:transparent;box-shadow:0 0 0 1px rgba(255,205,120,.25),0 10px 26px -10px rgba(242,169,59,.75)}
.btn.primary:hover{background:linear-gradient(180deg,#FFE0A3,#F5B24D)}
.btn.gold{background:rgba(242,169,59,.14);border-color:rgba(242,169,59,.6);color:var(--gold)}
.btn.gold:hover{background:rgba(242,169,59,.24)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:rgba(255,255,255,.07)}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn.xl{padding:15px 30px;font-size:19px;border-radius:14px;font-family:var(--f-display);font-weight:700;letter-spacing:.03em}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.kbd{font-family:var(--f-ui);font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink2);background:rgba(255,255,255,.05);font-weight:600}
.btn.primary .kbd{border-color:rgba(27,18,5,.3);color:#3A2808;background:rgba(255,255,255,.25)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);background:rgba(255,255,255,.04);white-space:nowrap}
.pill.gold{border-color:rgba(242,169,59,.6);color:var(--gold);background:var(--goldsoft)}
.pill.volt{border-color:rgba(45,199,173,.55);color:var(--volt);background:var(--voltsoft)}
.pill.bad{border-color:rgba(239,85,98,.6);color:var(--bad);background:var(--badsoft)}
.stars{letter-spacing:1px;color:var(--gold);font-size:12px}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#C9862A,#FFC56B)}
.meter.v i{background:linear-gradient(90deg,#1E9C88,#74E8D2)}
.tag{font-size:12px;color:var(--ink3)}
input[type=text],input[type=number],input[type=date],select,textarea{background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;min-width:0;color:var(--ink)}
select option{background:#101729;color:var(--ink)}
input[type=range]{accent-color:var(--goldf)}
textarea{width:100%;resize:vertical;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink2);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:rgba(255,255,255,.04);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:rgba(242,169,59,.2);color:var(--gold)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--ink3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line2)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:rgba(255,255,255,.04)}
.scroll{overflow-x:auto}
.prose{font-family:var(--f-read);font-size:calc(17px*var(--fs));line-height:1.66;max-width:68ch}
.prose p+p,.prose ul,.prose ol{margin-top:.7em}
.prose h4{font-family:var(--f-display);font-size:16px;letter-spacing:.02em;color:var(--gold);margin:1.3em 0 .3em;font-weight:600}
.prose li{margin:.25em 0}
.prose b{font-weight:600}
.callout{border-left:3px solid var(--goldf);padding:9px 14px;background:var(--goldsoft);border-radius:0;font-size:15px}
.callout.v{border-left-color:var(--voltf);background:var(--voltsoft)}

/* ---------- Base Camp over the scene ---------- */
#marks{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.mk{position:absolute;left:0;top:0;opacity:0;transition:opacity .5s ease;will-change:transform}
.mk i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:#FFE3A8;box-shadow:0 0 0 2px rgba(255,197,107,.35),0 0 14px 4px rgba(255,190,90,.55)}
.mk span{position:absolute;left:14px;top:0;transform:translateY(-50%);display:none;flex-direction:column;line-height:1.15;padding:5px 10px;border-radius:9px;background:rgba(7,11,22,.68);border:1px solid rgba(255,220,160,.2);backdrop-filter:blur(8px);white-space:nowrap}
.mk.named span{display:flex}
.mk span b{font-size:13px;font-weight:600}
.mk span small{font-size:11.5px;color:var(--ink2)}
.mk.floor i{background:transparent;box-shadow:0 0 0 2px var(--gold);}
.mk.floor span{left:auto;right:14px;border-color:rgba(242,169,59,.45)}
.mk.floor span b{color:var(--gold)}
.mk.you i{width:14px;height:14px;left:-7px;top:-7px;background:#fff;box-shadow:0 0 0 3px rgba(255,197,107,.6),0 0 24px 8px rgba(255,190,90,.65)}
.mk.you i::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1.5px solid rgba(255,205,120,.75);animation:ping 2.4s ease-out infinite}
.mk.you span{left:18px;background:rgba(242,169,59,.9);border-color:transparent;color:#1B1205}
.mk.you span small{color:#4A3410}
@keyframes ping{0%{transform:scale(.5);opacity:1}100%{transform:scale(2.1);opacity:0}}
.camp{position:relative;min-height:calc(100vh - 70px);display:grid;grid-template-columns:minmax(0,1fr) 352px;grid-template-rows:auto 1fr auto;gap:18px;padding:6px max(24px,env(safe-area-inset-right,0px)) 26px 24px}
.alti{grid-column:1;align-self:start;text-shadow:0 2px 28px rgba(0,0,0,.55);position:relative;z-index:2}
.alti small{font-size:14px;color:var(--ink2);font-weight:500}
.alti .num{font-family:var(--f-display);font-weight:600;font-size:calc(78px*var(--fs));line-height:.95;letter-spacing:-.005em;color:#F6F8FD;display:block}
.alti .num em{font-style:normal;font-size:.45em;color:var(--ink2);margin-left:6px;font-weight:500}
.alti p{color:#DCE3F0;max-width:46ch;margin-top:6px;font-size:14.5px;text-shadow:0 1px 2px rgba(0,0,0,.75),0 0 18px rgba(0,0,0,.55)}
.alti small{text-shadow:0 1px 2px rgba(0,0,0,.7)}
.camp::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(48% 42% at 12% 8%,rgba(4,8,18,.42),transparent 72%),radial-gradient(40% 36% at 92% 100%,rgba(4,8,18,.4),transparent 70%)}
.campR{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;gap:14px;align-self:start;position:relative;z-index:2}
.campR .banner{margin:0;font-size:13.5px;align-items:flex-start}
.campB{position:relative;z-index:2;grid-column:1/-1;grid-row:3;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:760px}
.tile{padding:11px 14px;border-radius:13px;background:rgba(9,14,28,.66);border:1px solid var(--line);backdrop-filter:var(--blur);min-width:0}
.tile small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink3)}
.tile b{display:block;font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.1;margin-top:2px}
.tile span{font-size:12.5px;color:var(--ink2)}
.go{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.go .alts{display:flex;gap:6px}
.go .note{font-size:13px;color:#DCE3F0;text-shadow:0 1px 2px rgba(0,0,0,.8),0 0 14px rgba(0,0,0,.6)}
.crux{position:relative;overflow:hidden}
.crux .k{font-size:12.5px;color:var(--ink3)}
.crux h3{font-family:var(--f-display);font-size:26px;font-weight:600;letter-spacing:.01em;margin:2px 0 0}
.crux .route{font-size:13.5px;color:var(--ink2)}
.floors{display:flex;gap:4px;margin:12px 0 6px}
.floors i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.1)}
.floors i.on{background:linear-gradient(90deg,#C9862A,#FFC56B);box-shadow:0 0 8px rgba(242,169,59,.5)}
.weak{font-size:13.5px;color:var(--ink2);margin:8px 0 12px}
.weak b{color:var(--volt);font-weight:600}
.below{position:relative;z-index:2;padding:6px max(24px,env(safe-area-inset-right,0px)) 60px 24px;max-width:1260px}
.hz{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.hz:last-child{border-bottom:0}

/* ---------- map ---------- */
.mapzone{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;text-align:left;width:100%;backdrop-filter:var(--blur);transition:border-color .15s,background .15s}
.mapzone:hover{border-color:rgba(242,169,59,.5);background:rgba(18,26,48,.82)}
.mapzone.locked{opacity:.6}
.ring{transform:rotate(-90deg)}
.ring .bg{stroke:rgba(255,255,255,.12)} .ring .fg{stroke:var(--goldf);transition:stroke-dashoffset .8s}

/* ---------- player (reading surface) ---------- */
.player{--ink:var(--rink);--ink2:var(--rink2);--ink3:var(--rink3);--line:var(--rline);--line2:var(--rline2);--card:var(--rcard);--card2:var(--rcard2);--paper:var(--rbg);--hl:var(--rhl);
  display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:0;border:1px solid var(--rline2);border-radius:16px;background:var(--rbg);color:var(--rink);overflow:hidden;min-height:calc(100vh - 190px);box-shadow:0 30px 80px -34px rgba(0,0,0,.85)}
.player .card,.player .btn,.player .mapzone{backdrop-filter:none}
.player .btn{background:var(--rcard);border-color:var(--rline2);color:var(--rink)}
.player .btn:hover{border-color:var(--rink3)}
.player .btn.primary{background:linear-gradient(180deg,#FFD68C,#F2A93B);color:#1B1205;border-color:transparent}
.player .btn.ghost{background:transparent;border-color:transparent}
.player .pill.gold{color:var(--rsel)}
.player a{color:var(--rsel)}
.pbar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--rline);background:var(--rcard);flex-wrap:wrap;grid-column:1/-1}
.pleft{padding:24px 28px;border-right:1px solid var(--rline);overflow-y:auto;max-height:calc(100vh - 250px)}
.pright{padding:20px 22px;overflow-y:auto;max-height:calc(100vh - 250px);display:flex;flex-direction:column;gap:12px}
.stim{font-family:var(--f-read);font-size:calc(17.5px*var(--fs));line-height:1.7;max-width:64ch}
.stim p+p{margin-top:.85em}
.stim .w{border-radius:2px}
.stim .w.hl{background:var(--hl);box-shadow:0 0 0 1px var(--hl)}
.stim.hlmode{cursor:text}
.para{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px}
.para .pn{font-family:var(--f-display);font-size:13px;color:var(--rink3);padding-top:4px}
.mnote{grid-column:2;margin:6px 0 2px;font-family:var(--f-ui);font-size:13px;width:100%}
.stem{font-weight:600;font-size:calc(16px*var(--fs));line-height:1.5}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{display:grid;grid-template-columns:30px minmax(0,1fr) 30px;gap:10px;align-items:start;padding:11px 10px;border:1px solid var(--rline2);border-radius:11px;background:var(--rcard);cursor:pointer;text-align:left;font-family:var(--f-read);font-size:calc(16px*var(--fs));line-height:1.52;width:100%;user-select:text;transition:border-color .12s,box-shadow .12s,background .12s}
.ch:hover{border-color:var(--rink3)}
.ch .L{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--rline2);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--rink2)}
.ch.sel{border-color:var(--rsel);box-shadow:inset 0 0 0 1px var(--rsel),0 0 0 3px color-mix(in srgb,var(--rsel) 18%,transparent)}
.ch.sel .L{background:var(--rsel);color:#1B1205;border-color:var(--rsel)}
.ch.struck .tx{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--rink3)}
.ch.struck .L{opacity:.45}
.ch.right{border-color:var(--voltf);background:color-mix(in srgb,var(--voltf) 12%,var(--rcard))}
.ch.right .L{background:var(--voltf);border-color:var(--voltf);color:#03252A}
.ch.wrong{border-color:var(--badf);background:color-mix(in srgb,var(--badf) 12%,var(--rcard))}
.ch .sk{border:0;background:none;cursor:pointer;color:var(--rink3);font-size:12px;padding:4px;border-radius:6px}
.ch .sk:hover{color:var(--rink);background:var(--rcard2)}
.ch .mark{font-family:var(--f-ui);font-size:12px;font-weight:700}
.conf{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.conf button{border:1px solid var(--rline2);background:var(--rcard);padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--rink2)}
.conf button.on{background:var(--rsel);color:#1B1205;border-color:var(--rsel)}
.timer{font-family:var(--f-display);font-size:19px;font-weight:600;padding:2px 11px;border-radius:9px;border:1px solid var(--rline2);background:var(--rbg);letter-spacing:.02em}
.timer.danger{border-color:var(--badf);color:var(--bad);background:var(--badsoft)}
.timer.hide{color:transparent;text-shadow:0 0 8px var(--rink3)}
.flagbtn.on{border-color:var(--goldf)!important;background:var(--goldsoft)!important;color:var(--rsel)!important}
.qnav{display:flex;gap:6px;flex-wrap:wrap}
.qnav button{width:34px;height:30px;border-radius:8px;border:1px solid var(--rline2);background:var(--rcard);font-family:var(--f-display);font-size:14px;cursor:pointer;color:var(--rink2)}
.qnav button.ans{background:var(--rcard2);border-color:var(--rink3);color:var(--rink)}
.qnav button.cur{background:var(--rsel);color:#1B1205;border-color:var(--rsel)}
.qnav button.fl{box-shadow:inset 0 -3px 0 var(--goldf)}
.explain{border:1px solid var(--rline2);border-radius:12px;padding:14px 16px;background:var(--rcard2);display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.explain .k{font-size:12.5px;color:var(--rink3);font-weight:600}
.explain .ww{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start}
.fc{border:1px dashed var(--rline2);border-radius:10px;padding:10px 12px;background:var(--rcard)}
.hintbox{border-left:3px solid var(--voltf);background:var(--voltsoft);padding:8px 12px;font-size:14px}
.typetag{font-size:12.5px;font-weight:700;color:var(--rsel);letter-spacing:.02em}

/* pitch strip: game chrome inside the player, always dark */
.pitch{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:9px 16px;background:linear-gradient(90deg,#0B1222,#121B33);color:#EAF0FA;border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.pname{display:flex;align-items:center;gap:8px;min-width:0}
.pname b{font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.pname small{color:#9AA7C0;font-size:12.5px}
.pname .ic{color:#FFC56B}
.pbar2{position:relative;flex:1;min-width:140px;height:8px;border-radius:4px;background:rgba(255,255,255,.1)}
.pbar2 i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#C9862A,#FFD68C);box-shadow:0 0 10px rgba(242,169,59,.6);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.pbar2 em{position:absolute;top:-4px;bottom:-4px;width:2px;background:#74E8D2;box-shadow:0 0 8px #2DC7AD}
.o2{display:flex;align-items:center;gap:3px;font-size:12px;color:#9AA7C0}
.o2 span{margin-right:4px;font-weight:600}
.o2 b{width:9px;height:14px;border-radius:2px;background:rgba(255,255,255,.12)}
.o2 b.on{background:#74E8D2;box-shadow:0 0 6px rgba(45,199,173,.6)}
.mom{display:flex;align-items:center;gap:5px;font-family:var(--f-display);font-size:16px;font-weight:600;color:#FFC56B;animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:none;opacity:1}}
.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.slipflash{position:fixed;inset:0;box-shadow:inset 0 0 140px 20px rgba(239,85,98,.55);animation:fade .7s ease-out forwards}
@keyframes fade{from{opacity:1}to{opacity:0}}
.floater{position:fixed;font-family:var(--f-display);font-weight:700;font-size:26px;color:#FFD68C;text-shadow:0 0 18px rgba(242,169,59,.8),0 2px 6px rgba(0,0,0,.5);animation:floatup 1.4s cubic-bezier(.2,.8,.2,1) forwards;pointer-events:none}
@keyframes floatup{0%{transform:translateY(10px) scale(.8);opacity:0}15%{opacity:1;transform:translateY(0) scale(1.05)}100%{transform:translateY(-70px) scale(1);opacity:0}}

/* ---------- overlays: debrief, level, cache ---------- */
.fxwrap{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(80% 70% at 50% 40%,rgba(10,16,32,.55),rgba(3,5,10,.86));animation:fade-in .25s ease-out}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.fxcard{width:min(640px,100%);max-height:90vh;overflow:auto;background:linear-gradient(180deg,#141D36,#0B1122);border:1px solid rgba(255,220,160,.18);border-radius:20px;padding:24px 26px;box-shadow:0 40px 120px -30px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.03) inset;animation:rise .4s cubic-bezier(.2,.8,.2,1)}
.dbtop small,.cache small,.lvup small{font-size:13px;color:var(--ink3)}
.db h2,.cache h2{font-family:var(--f-display);font-size:30px;font-weight:600;letter-spacing:.01em}
.profile{width:100%;height:auto;margin:14px 0 6px;overflow:visible}
.profile .sendline{stroke:#74E8D2;stroke-dasharray:4 5;stroke-width:1.2;opacity:.8}
.profile .sendlbl{fill:#74E8D2;font-size:12px;font-family:var(--f-ui)}
.profile .area{fill:rgba(242,169,59,.10)}
.profile .ridge{fill:none;stroke:#FFC56B;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--dur,1.6s) ease-out forwards;filter:drop-shadow(0 0 6px rgba(242,169,59,.6))}
@keyframes draw{to{stroke-dashoffset:0}}
.profile .hold{opacity:0;animation:fade-in .2s ease-out forwards;animation-delay:calc(.22s + var(--i)*.15s)}
.profile .hold.ok circle{fill:#FFE3A8}
.profile .hold.bad circle{fill:#2A1218;stroke:#EF5562;stroke-width:1.5}
.profile .hold.bad path{stroke:#FF8C95;stroke-width:1.6}
.dbres{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-top:8px;flex-wrap:wrap}
.dbres.ok{border-color:rgba(45,199,173,.4);background:linear-gradient(90deg,rgba(45,199,173,.12),rgba(255,255,255,.02))}
.dbres .verdict{display:block;font-family:var(--f-display);font-size:24px;font-weight:600}
.dbres.ok .verdict{color:var(--volt)}
.dbres span{color:var(--ink2);font-size:14px}
.grit{display:flex;flex-direction:column;align-items:flex-end;font-family:var(--f-display);font-size:22px;font-weight:600;color:#9BE7F2}
.grit .ic{display:none}
.grit small{font-family:var(--f-ui);font-size:12px;color:var(--ink3);font-weight:500}
.slips{margin:14px 0 16px}
.slips small{color:var(--ink3);font-size:13px}
.slips ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.slips li{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:7px 10px;border-radius:9px;background:rgba(239,85,98,.08);border:1px solid rgba(239,85,98,.22)}
.slips li span{color:var(--ink3)}
.lvup{text-align:center;position:relative;padding:10px 0 4px}
.lvup .rays{position:absolute;left:50%;top:38%;width:520px;height:520px;margin:-260px 0 0 -260px;background:repeating-conic-gradient(from 0deg,rgba(255,200,110,.10) 0 6deg,transparent 6deg 18deg);border-radius:50%;mask:radial-gradient(circle,#000 0,transparent 62%);-webkit-mask:radial-gradient(circle,#000 0,transparent 62%);animation:spin 26s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.lvnum{font-family:var(--f-display);font-size:120px;font-weight:700;line-height:1;color:#FFE0A3;text-shadow:0 0 40px rgba(242,169,59,.7);position:relative}
.lvup h2{font-family:var(--f-display);font-size:30px;font-weight:600;position:relative}
.lvup p{color:var(--ink2);margin:8px 0 18px;position:relative}
.cache{text-align:center}
.cache .crate{color:#FFC56B;filter:drop-shadow(0 0 22px rgba(242,169,59,.6));animation:crate .9s cubic-bezier(.2,.8,.2,1)}
@keyframes crate{0%{transform:scale(.4) rotate(-12deg);opacity:0}60%{transform:scale(1.15) rotate(4deg);opacity:1}100%{transform:none}}
.cache h2{display:flex;align-items:center;justify-content:center;gap:8px;color:#9BE7F2;margin:6px 0}
.cache .drop{margin:8px 0 16px;color:var(--gold)}
.cache p{margin-bottom:16px}
.cachecard{border-color:rgba(242,169,59,.45);background:linear-gradient(90deg,rgba(242,169,59,.14),rgba(11,17,33,.8))}
.cachecard .ic{color:var(--gold)}
.cachecard.opened{border-color:var(--line);background:var(--card)}

/* ---------- outfitter ---------- */
.gritbig{display:flex;align-items:baseline;gap:8px;padding:10px 16px;border-radius:14px;background:rgba(9,14,28,.66);border:1px solid var(--line)}
.gritbig b{font-family:var(--f-display);font-size:34px;font-weight:600;color:#9BE7F2}
.gritbig .ic{color:#9BE7F2;align-self:center}
.gear{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center}
.gear.on{border-color:rgba(45,199,173,.5)}
.swatch{width:52px;height:52px;border-radius:14px;background:radial-gradient(circle at 50% 45%,#fff 0,var(--sw) 22%,color-mix(in srgb,var(--sw) 30%,#060A14) 70%);box-shadow:0 0 24px -4px var(--sw)}
.swatch.sky{display:grid;place-items:center;background:linear-gradient(180deg,#0B1534,#1D2A5A);color:#C9D6FF;box-shadow:none}
.swatch.sky.aurora{background:linear-gradient(180deg,#071A2A,#0E3A3A);color:#7CF5C1}
.swatch.sky.meteors{color:#FFE3A8}
.gtxt h3{margin:0}
.gtxt p{font-size:13.5px}

/* ---------- flashcards, charts, misc ---------- */
.flip{perspective:1400px;height:300px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .face{--ink:var(--rink);--ink2:var(--rink2);--ink3:var(--rink3);position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--rline2);border-radius:16px;background:var(--rbg);color:var(--rink);padding:26px 28px;display:flex;flex-direction:column;gap:10px;overflow:auto;box-shadow:var(--shadow)}
.flip .back{transform:rotateY(180deg);background:var(--rcard2)}
.chart{width:100%;overflow:visible}
.chart text{fill:var(--ink2);font-family:var(--f-ui);font-size:11.5px}
.chart .grid line{stroke:var(--line)}
.chart .axis{stroke:var(--line2)}
.tip{position:fixed;z-index:60;pointer-events:none;background:#F2F5FB;color:#111827;font-size:12.5px;padding:6px 9px;border-radius:8px;max-width:260px;line-height:1.35;font-family:var(--f-ui);box-shadow:var(--shadow)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px}
.cal i{width:12px;height:12px;border-radius:3px;background:var(--seq0)}
.modalwrap{position:fixed;inset:0;z-index:50;background:rgba(3,5,10,.66);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.modal{background:linear-gradient(180deg,rgba(18,26,48,.96),rgba(10,15,30,.97));border:1px solid var(--line2);border-radius:16px;max-width:580px;width:100%;padding:22px 24px;box-shadow:var(--shadow);max-height:86vh;overflow:auto}
.toasts{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:75;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:rgba(14,21,40,.94);color:var(--ink);border:1px solid var(--line2);padding:10px 14px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);max-width:360px;animation:rise .35s ease-out;backdrop-filter:var(--blur)}
.toast.gold{background:linear-gradient(90deg,rgba(242,169,59,.95),rgba(255,214,140,.95));color:#1B1205;border-color:transparent}
.toast.volt{background:rgba(45,199,173,.95);color:#03252A;border-color:transparent}
.toast.bad{background:rgba(70,18,28,.95);border-color:rgba(239,85,98,.6);color:#FFD9DC}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.burst{animation:burst .6s ease-out}
@keyframes burst{0%{transform:scale(.96)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
.ach{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);backdrop-filter:var(--blur)}
.ach .medal{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;border:1.5px solid var(--line2);color:var(--ink3)}
.ach.got .medal{border-color:var(--goldf);background:var(--goldsoft);color:var(--gold);box-shadow:0 0 16px -2px rgba(242,169,59,.6)}
.ach.lock{opacity:.55}
.breath{width:170px;height:170px;border-radius:50%;border:2px solid var(--voltf);display:grid;place-items:center;margin:16px auto;transition:transform 4s ease-in-out;background:var(--voltsoft);font-family:var(--f-display);font-size:20px}
.bigq{font-family:var(--f-display);font-size:calc(28px*var(--fs));line-height:1.2;font-weight:600}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:rgba(255,255,255,.04);cursor:pointer;font-size:calc(15px*var(--fs))}
.opt:hover{border-color:rgba(255,255,255,.34)}
.opt.right{border-color:var(--voltf);background:var(--voltsoft)}
.opt.wrong{border-color:var(--badf);background:var(--badsoft)}
.hero{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--card);backdrop-filter:var(--blur)}
.alt{font-size:13px;color:var(--ink2)}
.alt b{font-family:var(--f-display);font-size:54px;line-height:1;color:var(--ink);font-weight:600}
[hidden]{display:none!important}

@media (max-width:1100px){.camp{grid-template-columns:minmax(0,1fr) 310px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));gap:4px}
  .rail .navgroup{display:none}
  .rail .nav{width:auto;padding:7px 10px;white-space:nowrap;flex:none}
  .brand{padding:2px 8px 2px 0;flex:none}
  .player{grid-template-columns:1fr}
  .pleft{border-right:0;border-bottom:1px solid var(--rline);max-height:none}
  .pright{max-height:none}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .camp{grid-template-columns:1fr;grid-template-rows:auto;min-height:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .alti{min-height:46vh}
  .campR{grid-column:1;grid-row:auto}
  .campB{grid-column:1;grid-row:auto;grid-template-columns:1fr}
  .go{align-items:stretch}
  .below{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  #marks{display:none}
}

<script>
const CURR={};
CURR.towers=[
{id:'weaken',name:'Weaken',types:['Weaken'],prio:1,core:1,twist:'wager',cards:'weaken',steps:['Find the conclusion, then the evidence offered for it.','Name the gap in one sentence: the author assumes ___.','Predict the attack: effect without the cause, reversed arrow, or another cause.','Rank the survivors with the Weakener Hierarchy. Highest level wins.']},
{id:'strengthen',name:'Strengthen',types:['Strengthen'],prio:1,core:1,twist:'clock',cards:'strengthen',steps:['Find the conclusion and the evidence.','Name the gap the author leaves open.','Predict what would close it: rule out an alternative, confirm the mechanism, show the comparison group did not change.','Pick the answer that makes the conclusion more likely, even a little.']},
{id:'inference',name:'Inference',types:['Must Be True','Most Strongly Supported','Must Be False'],prio:2,core:1,twist:'nochange',cards:'inference',steps:['There is usually no conclusion. Treat every sentence as a fact.','Mark the strongest statements: conditionals, quantifiers, comparisons.','Chain statements that share a term.','Test each choice against the text, never against plausibility.']},
{id:'flaw',name:'Flaw',types:['Flaw'],prio:3,core:1,twist:'predict',cards:'flaw',steps:['Find the conclusion and premises.','Name the gap.','Match the gap to a flaw you know by name.','Translate each choice back into the stimulus to check it describes what the author did.']},
{id:'na',name:'Necessary Assumption',types:['Necessary Assumption'],prio:4,core:1,twist:'clock',steps:['Find the conclusion and premises.','Name the bridge the argument needs.','For each contender, negate it.','If the negation wrecks the argument, it is the answer.']},
{id:'sa',name:'Sufficient Assumption',types:['Sufficient Assumption'],prio:4,core:1,twist:'predict',steps:['Find the term in the conclusion that never appears in the premises.','Build a bridge from the premise term to that new term.','Check the direction of the arrow.','The right answer plus the premises must guarantee the conclusion.']},
{id:'conclusion',name:'Main Conclusion',types:['Main Conclusion'],core:1,twist:'blackout',steps:['Underline every claim.','Ask of each: why should I believe that? The claim the others answer is the conclusion.','Watch for a conclusion after but, however, or yet.','Reject premises, concessions and intermediate conclusions.']},
{id:'role',name:'Role of a Statement',types:['Role'],twist:'nochange',steps:['Find the main conclusion first.','Locate the quoted claim.','Label it: premise, intermediate conclusion, main conclusion, opposing view, concession, or background.','Match the label, not the content.']},
{id:'method',name:'Method of Reasoning',types:['Method'],twist:'predict',steps:['Find the conclusion and how it is supported.','Write the argument as an abstract skeleton.','Check every phrase of a choice against the skeleton.','Eliminate any choice that describes a move the author never made.']},
{id:'evaluate',name:'Evaluate the Argument',types:['Evaluate'],twist:'clock',steps:['Find the gap.','For each question, imagine two opposite answers.','If one answer strengthens and the other weakens, that question matters.','Pick the question that swings the argument hardest.']},
{id:'parallel',name:'Parallel Reasoning',types:['Parallel Reasoning','Parallel Flaw'],twist:'blackout',steps:['Reduce the original to letters: if A then B, A, so B.','Note conclusion strength and whether it is valid.','Eliminate choices with a different conclusion type or quantifier.','Diagram only the survivors.']},
{id:'principle',name:'Principle',types:['Principle'],core:1,twist:'wager',steps:['Separate the principle into its condition and its outcome.','Check whether the facts satisfy the condition.','Check whether the outcome matches the judgment.','Reject principles that cover the facts but reach a different judgment.']},
{id:'paradox',name:'Resolve the Paradox',types:['Paradox'],core:1,twist:'clock',steps:['State the paradox as: X, and yet Y.','Accept both facts as true.','Look for a difference between the two groups, times, or situations.','The right answer lets both facts be true at once.']},
{id:'dispute',name:'Point at Issue',types:['Point at Issue','Agreement'],twist:'nochange',steps:['Summarize each speaker in one line.','For each choice, check that both speakers have an opinion on it.','For disagree questions, the opinions must conflict.','For agree questions, they must match.']},
{id:'except',name:'The EXCEPT Gate',tag:'except',types:[],twist:'blackout',steps:['Rewrite the stem without EXCEPT: four choices do the job.','Mark each choice: does the job, opposite, or neither.','The answer is the odd one out.','The odd one out can be irrelevant, not only the opposite.']}
];
CURR.lessons={
weaken:{task:'Choose the fact that, if true, makes the conclusion less likely to follow from the evidence. You attack the **link** between premise and conclusion. The premises themselves are fixed facts; no answer can make them false.',
 method:['Read the stem. "If true" means every choice is accepted as fact.','Split the argument: conclusion, then the evidence for it.','Name the gap in one sentence: "The author assumes ___."','Predict the attack before reading the choices.','If two choices survive, rank them with the Weakener Hierarchy below. The higher level wins.'],
 predict:'Most Weaken stimuli are causal. Predict one of three attacks: the effect happened **without** the cause (a comparison group), the arrow runs **backward**, or **another cause** explains the effect. For plans, predict a reason the plan cannot reach its goal. For samples, predict that the sample is unrepresentative.',
 correct:'New information that makes the gap harder to cross. It rarely destroys the argument outright. It only has to hurt it more than the other four.',
 traps:['**Premise attack**: disputes a fact the stimulus already gives you.','**Adjacent doubt**: raises a worry near the argument without explaining the evidence another way.','**Exceptions**: one case that does not fit. Probabilistic conclusions survive exceptions.','**Irrelevant comparison** and **out of scope**: same topic, different question.','**Wrong direction**: a strengthener dressed in skeptical words.'],
 speed:'Write the gap in six words before reading the choices. On a two-choice standoff, compare hierarchy levels rather than gut feel.',
 errors:['Choosing a Level 4 mechanism or exception answer when a Level 1 to 3 answer is on the page.','Treating a comparison group as irrelevant because the conclusion names only one place. A group that got the effect without the cause is the strongest attack there is.','Picking a broad trend that moves the benchmark and the subject together, which explains nothing about the gap between them.'],
 example:{stim:'After the town of Larchmont banned leaf blowers downtown, noise complaints there fell by half within a year. The council concluded that the ban caused the decline.',q:'Which one of the following, if true, most seriously weakens the council’s conclusion?',walk:'Gap: nothing else changed that would cut complaints. Level 1: complaints fell just as much in neighborhoods with no ban. Level 3: the downtown nightclub closed that same year. Level 4: a few shops still run blowers illegally. Level 5: blowers are expensive. Take Level 1 if it is offered.'}},
strengthen:{task:'Choose the fact that, if true, makes the conclusion more likely to follow from the evidence. It does not have to prove anything.',
 method:['Find the conclusion and evidence.','Name the gap.','Predict the kind of support that closes it.','Eliminate answers that only repeat a premise or point the wrong way.','Pick the answer that helps most.'],
 predict:'For causal claims: rule out the most obvious alternative cause, show the effect did **not** appear where the cause was absent, show a **dose-response** pattern, or confirm the mechanism. For samples: show the sample represents the group. For plans: show the plan’s key precondition holds.',
 correct:'Information the author needed but did not give. Often it shores up the necessary assumption.',
 traps:['**Restates a premise**: adds nothing new.','**Sounds supportive, misses the gap**: a lab property, a popular opinion, a general trend.','**Wrong direction**: a weakener.','**Supports a different conclusion**: helps a nearby claim, not this one.'],
 speed:'Strengthen answers can be strong; extreme language is not a reason to eliminate here, unlike in Inference.',
 errors:['Choosing a fact about the cause in general (antioxidants in coffee) over a fact that rules out a confounder in the study itself.','Ignoring the comparison-group strengthener because it is about other places.','Picking an answer that would matter only if the conclusion were broader.'],
 example:{stim:'People who drink coffee each morning have lower rates of Type 2 diabetes than those who do not. So morning coffee reduces diabetes risk.',q:'Which most strengthens the argument?',walk:'Gap: the drinkers do not differ in some other way that explains the result. Best: the study controlled for diet, exercise and genetic risk. That closes the confounder gap. A lab finding about antioxidants is weaker; it is support for a mechanism, not for this correlation being causal.'}},
inference:{task:'The stimulus is a set of facts. Choose what **must be true** given them (Must Be True), what they **most strongly support** (Most Strongly Supported), or what **cannot** be true (Must Be False).',
 method:['Treat every sentence as true. There may be no conclusion at all.','Mark conditionals, quantifiers (all, most, some, none), and comparisons.','Combine statements that share a term into chains.','Test each choice against the text. Ask: which sentence proves this?','For Must Be False, the answer contradicts the text; the other four could be true.'],
 predict:'You often cannot predict the exact answer, but you can predict its shape: a chain of two statements, a "some" or "at least one" claim, or the contrapositive of a rule.',
 correct:'Modest language that the text fully covers: "some", "at least one", "can", "not all". The **Most Strongly Supported** standard is the same idea with a little slack: the text justifies it, not merely makes it plausible.',
 traps:['**Extreme**: "all", "always", "only" when the text says "most" or "some".','**One step too far**: a reasonable next thought the text never states.','**Mistaken reversal** of a conditional.','**Outside knowledge**: true in the world, absent from the text.','**Adjacent claim**: about a closely related group or time.'],
 speed:'Diagram conditionals as you read; most correct answers are a single link away from what you wrote.',
 errors:['Accepting a choice because it is likely, not because it is supported.','Reversing a conditional ("only if" read as "if").','Combining two "most" statements about different groups as if they had to overlap.'],
 example:{stim:'Every licensed guide on the ridge carries a radio. Some people on the ridge today carry no radio.',q:'Which must be true?',walk:'Guide → radio, so no radio → not a guide. Some people have no radio, so some people on the ridge today are not licensed guides. "Most climbers are unlicensed" goes too far.'}},
flaw:{task:'Describe the error in the reasoning. The conclusion does not follow; your job is to name why, in the test’s abstract language.',
 method:['Find the conclusion and premises.','Name the gap.','Match it to a catalog flaw (open the Flaw Catalog).','Translate each choice back into the stimulus: does it describe something the author actually did?','Confirm the described move is actually an error here.'],
 predict:'Ask: what did the author take for granted, fail to consider, or confuse? Most flaws are one of about twenty patterns.',
 correct:'Abstract wording that maps cleanly onto the stimulus: "takes for granted that", "fails to consider the possibility that", "presumes without justification", "confuses a condition sufficient for an outcome with one that is necessary".',
 traps:['**Describes something the author did not do.**','**Accurate but not a flaw**: a true description of the argument’s structure.','**Right flaw, wrong parts**: names the error but attaches it to the wrong claim.','**Flaw from another argument**: a classic error that is not present here.'],
 speed:'Learn the test’s phrasing table in the Flaw Catalog. Recognition beats derivation under time.',
 errors:['Picking an answer that accurately describes the argument but is not an error.','Accepting "fails to consider X" when X would not hurt the argument even if true.','Mixing up which claim was taken for granted.'],
 example:{stim:'Every member who voted for the budget attended the hearing. Rowan attended the hearing, so Rowan voted for the budget.',q:'The reasoning is flawed because it',walk:'Voted → attended. The argument runs attended → voted. Answer: it treats attending as sufficient for voting when the premise makes it only necessary.'}},
na:{task:'Find the unstated premise the argument cannot survive without.',method:['Find the conclusion and premises.','Name the bridge the argument needs.','Shortlist the choices that touch the bridge.','Negate each one.','The negation that wrecks the argument is the answer.'],
 predict:'Often a modest bridge ("at least some", "not all", "is possible") or a defensive claim that rules out an objection.',correct:'Something the argument needs, not necessarily enough to prove it. Negate it and the conclusion falls.',
 traps:['**Sufficient but not necessary**: stronger than the argument needs.','**Helpful but not required**: would strengthen, but the argument survives its negation.','**Extreme**: "all", "always", "never".','**Reverses the bridge.**'],
 speed:'Negate precisely: "all" becomes "not all", "some" becomes "none", "is" becomes "is not".',errors:['Choosing strong answers that would prove the conclusion but are not required.','Negating sloppily, turning "some" into "some are not".','Ignoring defensive assumptions that rule out an alternative.'],
 example:{stim:'The museum should extend its hours, since the extra evening hours would let working visitors attend.',q:'Which assumption is required?',walk:'Required: at least some working visitors would actually come in the evening. Negate it: no working visitor would come. The argument collapses. "Most visitors prefer evenings" is not required.'}},
sa:{task:'Find the answer that, added to the premises, guarantees the conclusion.',method:['Find the new term: in the conclusion, not in the premises.','Find the old term it must connect to.','Build the bridge: old term → new term.','Check direction and quantifier.','Confirm: premises plus answer make the conclusion certain.'],
 predict:'A conditional that links the premise term to the conclusion term, usually with strong words: "any", "all", "only".',correct:'Strong and complete. Unlike Necessary Assumption, strength is a virtue here.',
 traps:['**Reversed bridge**: new term → old term.','**Necessary but not sufficient**: required but not enough.','**Connects the wrong terms.**'],speed:'Circle the new term in the conclusion; the answer must contain it.',
 errors:['Reversing the arrow.','Choosing a merely necessary condition.','Missing that the conclusion’s quantifier ("some" versus "all") changes what bridge is needed.'],
 example:{stim:'Teresa reviewed every contract in the file. So Teresa noticed the error.',q:'Which, if assumed, allows the conclusion to be properly drawn?',walk:'Old term: reviewed every contract. New term: noticed the error. Bridge: anyone who reviewed every contract in the file noticed the error. Plus the premise, the conclusion is guaranteed.'}},
conclusion:{task:'Identify the claim the rest of the argument supports.',method:['Mark every claim.','Ask of each: why should I believe that?','The claim that the others answer is the main conclusion.','Watch for conclusions after but, however, yet, and in the first sentence.','Paraphrase it, then match.'],
 predict:'Often the claim that pushes back on an opposing view, or a recommendation (should, ought).',correct:'A faithful paraphrase of the main claim, sometimes with the pronoun filled in.',
 traps:['**Premise**: a reason, not the point.','**Intermediate conclusion**: supported, but itself supports something else.','**Opposing view** or **concession**.','**Too broad / too narrow.**'],speed:'Test your pick with "because": [pick] because [other claims]. If it reads naturally, you have it.',
 errors:['Taking the intermediate conclusion.','Taking a restated opposing view.','Taking the most interesting sentence rather than the supported one.'],
 example:{stim:'Some say the new park is a waste of land. But the park lowered summer temperatures on nearby blocks, and cooler blocks reduce heat-related hospital visits. The park is a sound use of the land.',q:'Main conclusion?',walk:'The last sentence answers the opposing view and is supported by the other two. The temperature claim is a premise.'}},
role:{task:'Say what job a quoted claim does in the argument.',method:['Find the main conclusion first.','Find the quoted claim.','Ask what it supports and what supports it.','Label it.','Match the label.'],predict:'Labels: premise, intermediate conclusion, main conclusion, opposing view, evidence for an opposing view, concession, background, example.',correct:'The label that matches the claim’s relationship to the main conclusion.',
 traps:['**Premise versus intermediate conclusion**: if something supports the claim, it is a conclusion of some kind.','**"The conclusion" when it supports another claim.**','**"A view the author rejects" when the author actually concedes it.**'],speed:'Draw arrows: claim → what it supports.',errors:['Calling an intermediate conclusion a premise.','Missing a concession.','Mixing up the opposing view with the evidence offered for it.'],
 example:{stim:'"Cooler blocks reduce heat-related hospital visits" in the park argument above.',q:'Role?',walk:'It supports the main conclusion together with the temperature claim and is not itself supported. It is a premise.'}},
method:{task:'Describe how the argument works, in abstract terms.',method:['Find the conclusion and its support.','Write a skeleton: "rejects a proposal by showing it defeats its own purpose", "argues by analogy", "offers a counterexample to a general claim".','Check each phrase of a choice against the skeleton.','Eliminate any choice that describes a move the author never made.'],
 predict:'Name the move before reading: analogy, counterexample, eliminating alternatives, appeal to a principle, showing consequences.',correct:'Every part of it happened in the argument.',traps:['**Half right**: first half matches, second half invents.','**Describes the opponent’s method.**','**Too strong**: "proves", "demonstrates conclusively".'],speed:'Read choices backward: check the last phrase first, where invented moves hide.',
 errors:['Accepting a choice because one word matches.','Missing that the author attacks a premise, not a conclusion.','Confusing a counterexample with an analogy.'],
 example:{stim:'Critics say tutoring cannot help adults learn languages. Yet the program’s adult students passed at the same rate as its teenagers.',q:'Method?',walk:'The author answers a general claim with a counterexample.'}},
evaluate:{task:'Choose the question whose answer would most help you decide whether the argument is good.',method:['Find the gap.','For each choice, imagine a yes and a no.','If one answer helps and the other hurts, the question is relevant.','Pick the one that swings it most.'],predict:'Usually a question about the gap: is there another cause, does the comparison group differ, is the sample representative?',correct:'A question whose two answers point in opposite directions (the Variable Test).',
 traps:['**Answer changes nothing** either way.','**Asks about a premise’s truth** rather than the link.','**Out of scope.**'],speed:'Run the Variable Test only on the two or three choices that mention the gap.',errors:['Choosing interesting background questions.','Ignoring comparison questions.','Not running both answers.'],
 example:{stim:'Since the clinic began texting reminders, missed appointments fell 30%. So the texts work.',q:'Most useful to know?',walk:'Did missed appointments fall at similar clinics that sent no texts? Yes weakens; no strengthens.'}},
parallel:{task:'Find the argument whose logical structure matches the original. For Parallel Flaw, match the same flaw.',method:['Reduce the original to letters.','Note: conclusion strength (must, probably, should), quantifiers, valid or invalid.','Eliminate by conclusion type first; it is the fastest filter.','Diagram survivors only.','For Parallel Flaw, name the flaw first, then find it.'],
 predict:'Write the skeleton: "All A are B; C is A; so C is B."',correct:'Same structure, any topic. The order of premises may differ.',traps:['**Same topic, different structure.**','**Valid when the original is invalid**, or the reverse.','**Different quantifier** ("most" versus "all").','**Different conclusion strength.**'],
 speed:'Compare conclusions first. Half the choices usually die there.',errors:['Matching vocabulary instead of logic.','Missing a negation in the conclusion.','Not noticing the original commits a reversal.'],
 example:{stim:'All ripe pears are soft. This pear is soft. So it is ripe.',q:'Which shows the same flawed pattern?',walk:'All A are B; X is B; so X is A. Look for a choice that also affirms the necessary condition and concludes the sufficient one.'}},
principle:{task:'Find the principle that justifies a judgment (Identify), or the judgment a principle supports (Apply).',method:['Split the principle into condition and outcome.','Check the facts meet the condition.','Check the outcome matches the judgment.','Watch the direction: a principle that says when something is required is not one that says when it is allowed.'],
 predict:'Write the judgment as a rule: "If [facts], then [judgment]."',correct:'Broad enough to cover the facts, aimed at exactly the judgment drawn.',traps:['**Covers the facts, wrong outcome.**','**Right outcome, condition the facts do not meet.**','**Reversed condition.**','**Too narrow** to apply.'],speed:'Check the outcome first; most wrong choices reach a different judgment.',
 errors:['Choosing a principle that matches the topic, not the logic.','Missing a condition in the principle that the facts fail.','Confusing permitted with required.'],
 example:{stim:'Ana kept the found wallet’s cash because no one claimed it after she posted notices for a month. Her conduct was acceptable.',q:'Which principle justifies the judgment?',walk:'Need: if a finder makes reasonable efforts to locate the owner and none claims the item, keeping it is acceptable.'}},
paradox:{task:'Find the fact that lets two apparently conflicting facts both be true.',method:['State it as: X, and yet Y.','Accept both as true.','Look for a difference between the groups, times or conditions.','Pick the answer that explains both at once.'],predict:'Something about how the two situations differ, or a third factor that produces Y despite X.',correct:'After reading it, the "and yet" disappears.',
 traps:['**Explains only one side.**','**Deepens the paradox.**','**Restates the paradox.**','**Out of scope**: about a different group.'],speed:'For EXCEPT versions, four answers resolve it; find the one that does not.',errors:['Choosing an answer that is true and related but leaves the tension standing.','Forgetting both facts must survive.','Missing a composition change (who is in the group).'],
 example:{stim:'The new trail cut average hiking time to the lake, yet more hikers now report arriving exhausted.',q:'Which best resolves it?',walk:'The shorter trail is much steeper. Both facts now fit.'}},
dispute:{task:'Find what two speakers disagree about (or agree on).',method:['Summarize each speaker in one line.','For each choice: does each speaker express a view on it?','For disagreement, the views must conflict; for agreement, match.','Eliminate anything only one of them addresses.'],predict:'Usually the second speaker’s "but" names it.',correct:'A claim both speakers take a position on, with opposite positions.',
 traps:['**Only one speaker addresses it.**','**Both agree.**','**Too broad.**'],speed:'The "both must have an opinion" test kills most choices in seconds.',errors:['Picking what one speaker emphasizes.','Inferring opinions a speaker never expressed.','Missing that the speakers agree on a premise and differ on the conclusion.'],
 example:{stim:'Rae: The library should cut hours to fund e-books. Sol: Cutting hours hurts patrons without internet, so the library should not.',q:'Point at issue?',walk:'Whether the library should cut its hours to fund e-books.'}},
except:{task:'Four choices do what the stem asks; one does not. Find the one that does not.',method:['Rewrite the stem without EXCEPT.','Mark each choice: does the job (yes), does the opposite (opp), or neither (0).','The answer is the only choice not marked yes.','Do not look for the "best" answer; look for the outlier.'],predict:'The outlier is usually irrelevant, not the opposite.',correct:'The odd one out: a choice that does not weaken (or explain, or strengthen).',
 traps:['**Habit pick**: choosing the strongest weakener out of reflex.','**Ignoring irrelevance**: forgetting the outlier can do nothing at all.'],speed:'Say the rewritten stem out loud in your head before each choice.',errors:['Answering the stem as if EXCEPT were not there.','Expecting the outlier to be the opposite.','Overthinking a choice that clearly does the job.'],
 example:{stim:'Weaken EXCEPT question about a causal claim.',q:'Which does NOT weaken?',walk:'Four choices name another cause or show the effect without the cause. One merely says the effect was large. It is the answer.'}}
};
CURR.hierarchy=[
{level:1,name:'The effect without the cause',desc:'The outcome happened where the supposed cause was absent. The cause is no longer needed to explain the effect, so causation is eliminated, not just doubted.',ex:'Neighboring states without the waiting-period law saw identical declines in handgun homicides.'},
{level:2,name:'Reverse causation',desc:'The "cause" is really the effect. The correlation is real; the arrow points the wrong way. It turns the argument’s own evidence against it.',ex:'Early-stage depression had already caused social withdrawal before social ties were measured.'},
{level:3,name:'Confounding variable or alternative cause',desc:'A third factor independently produces the effect, or something else changed at the same time.',ex:'Villagers walk steep hills daily, which explains their heart health without olive oil.'},
{level:4,name:'Mechanism or exception doubt',desc:'Casts doubt but does not explain why the effect happened. Probabilistic claims survive exceptions. Right only when nothing at Levels 1 to 3 is offered.',ex:'Some homicides use guns bought years before the crime.'},
{level:5,name:'Tangential concern',desc:'Same vocabulary, no effect on the gap. Test: does it change whether the cause explains the effect? If not, it is irrelevant.',ex:'LED streetlights use less electricity than the old lights.'}];
CURR.concepts=[
{id:'c1',tag:'weaken',front:'Weakener Level 1?',back:'The effect occurred without the cause (a comparison group). It eliminates causation instead of doubting it. Strongest weakener.'},
{id:'c2',tag:'weaken',front:'Weakener Level 2?',back:'Reverse causation: the supposed effect actually produced the supposed cause. The correlation is real, the arrow is backward.'},
{id:'c3',tag:'weaken',front:'Weakener Level 3?',back:'A confounding variable or simultaneous change independently explains the effect.'},
{id:'c4',tag:'weaken',front:'Weakener Level 4, and when is it right?',back:'Mechanism or exception doubt. It raises a worry without explaining the effect. Right only when no Level 1 to 3 answer appears.'},
{id:'c5',tag:'weaken',front:'Weakener Level 5?',back:'Tangential: same words, no effect on the gap. Ask whether it changes if the cause explains the effect.'},
{id:'c6',tag:'weaken',front:'Adjacent doubt versus direct alternative?',back:'Adjacent doubt questions the argument from the side. A direct alternative explains the evidence another way. The test rewards the direct alternative.'},
{id:'c7',tag:'strengthen',front:'Strongest causal strengthener?',back:'Dose-response or a clean comparison group: more cause, more effect; or no cause, no effect. Either rules out most alternatives at once.'},
{id:'c8',tag:'strengthen',front:'Why exceptions do not weaken probabilistic claims',back:'"X reduces risk" never claimed X works every time. One counterexample leaves the average effect standing.'},
{id:'c9',tag:'inference',front:'Most A are B, and most A are C. What follows?',back:'At least one A is both B and C. Two "most" claims about the same group must overlap. About different groups, nothing follows.'},
{id:'c10',tag:'inference',front:'"Only if" points which way?',back:'"A only if B" means A → B. The term after "only if" is necessary. Reading it as B → A is the Mistaken Reversal.'},
{id:'c11',tag:'inference',front:'"Unless" translation',back:'"A unless B" means: if not B, then A. Contrapositive: if not A, then B.'},
{id:'c12',tag:'flaw',front:'Necessary versus sufficient flaw wording',back:'"Takes a condition that is necessary for X to be sufficient for X," or the reverse. It is the Mistaken Reversal in the test’s words.'},
{id:'c13',tag:'flaw',front:'Accurate but not a flaw',back:'An answer can correctly describe the argument and still be wrong on a Flaw question. It must describe an error.'},
{id:'c14',tag:'rc',front:'Emphasis versus endorsement',back:'Space on the page is not agreement. Look for the author’s own voice: "in fact", "clearly", "unfortunately", versus reported views: "critics argue".'},
{id:'c15',tag:'rc',front:'Tension collapse',back:'When a passage holds two ideas in balance (both A and B), an answer that keeps only one side is wrong, however true that side is.'},
{id:'c16',tag:'rc',front:'Device promotion',back:'An example, analogy or anecdote supports the point; it is never the main point. Ask what the example is an example of.'},
{id:'c17',tag:'rc',front:'Valence flip',back:'Right topic, wrong attitude: the answer approves where the author doubts, or the reverse. Check the author’s adjectives.'},
{id:'c18',tag:'rc',front:'Direction flip',back:'Reverses a relationship: A shapes B becomes B shapes A. Reread the sentence that states the relation.'}];
CURR.forge=[
{id:'anatomy',name:'Argument anatomy',blurb:'Premises, conclusions, intermediate conclusions, concessions, and the difference between an argument and a description.',lesson:{task:'Every argument is a claim plus reasons. Your first job on every LR question is to find which sentence is the claim.',method:['Conclusion words: therefore, thus, so, hence, consequently, it follows that, which shows that.','Premise words: because, since, for, given that, as, after all.','The "why should I believe that?" test: the conclusion is the claim the other sentences answer.','An **intermediate conclusion** is supported by one claim and supports another.','A **concession** ("admittedly", "granted") gives ground to the other side. An **opposing view** ("some argue") is what the author argues against.','A **description** reports facts with no claim supported by reasons. An explanation says why something happened; it is not an argument for it.'],speed:'Conclusions hide in first sentences and after "but". Test with "because".'}},
{id:'conditional',name:'Conditional logic',blurb:'If, only if, unless, until, without, no, all, any, the only. Contrapositives and chains.',lesson:{task:'A conditional says one thing guarantees another. Sufficient → necessary.',method:['"If A, B": A → B. "All A are B": A → B. "Any A is B": A → B. "Whenever A, B": A → B.','"A only if B": A → B. "Only B are A" and "the only A are B": A → B.','"A unless B", "A until B", "without B, A": not B → A.','"No A are B": A → not B.','Contrapositive: from A → B, infer not B → not A. Always valid.','**Mistaken Reversal**: from A → B, inferring B → A. **Mistaken Negation**: inferring not A → not B. Both invalid.','Chains: A → B and B → C give A → C.'],speed:'Translate on the page as you read. Never hold a chain in your head.'}},
{id:'quantifiers',name:'Quantifiers',blurb:'All, most, some, none, not all. How they combine and how they negate.',lesson:{task:'Quantifiers control what follows. Strong ones (all, none) chain like conditionals; weak ones (some, most) combine only in specific ways.',method:['"Some" means at least one, possibly all.','"Most" means more than half, possibly all.','Some A are B and all B are C: some A are C.','Most A are B and most A are C: at least one A is both B and C.','Most A are B and most B are C: nothing follows about A and C.','Negations: all → not all; some → none; most → half or fewer.'],speed:'Draw the "most" overlap as two bars over the same group; if they come from different groups, no overlap is guaranteed.'}},
{id:'necsuff',name:'Necessary versus sufficient',blurb:'The single most tested idea on the LSAT.',lesson:{task:'A sufficient condition guarantees the outcome. A necessary condition is required for it. In A → B, A is sufficient for B and B is necessary for A.',method:['Required, needed, must, only if, unless: these introduce necessary conditions.','If, any, all, whenever, every: these introduce sufficient conditions.','Many flaws are this confusion: treating a requirement as a guarantee, or a guarantee as a requirement.','Necessary Assumption questions ask for necessary conditions of the argument; Sufficient Assumption questions ask for sufficient ones.'],speed:'Label every condition N or S as you read it.'}},
{id:'causal',name:'Causal reasoning',blurb:'Correlation, reverse causation, third factors, coincidence, and the comparison group.',lesson:{task:'A causal conclusion says one thing produces another. Evidence is usually a correlation or a before-and-after change.',method:['Ask what else could produce the same pattern: a third factor, a simultaneous change, chance.','Ask whether the arrow could run the other way.','Ask whether the effect appeared where the cause was absent.','Strengtheners: rule out alternatives, comparison groups, dose-response, mechanism.','Weakeners: the same list, inverted. See the Weakener Hierarchy.'],speed:'Every causal stimulus gets the same three questions: other cause, reverse arrow, effect without cause.'}},
{id:'numbers',name:'Sampling, statistics and numbers',blurb:'Base rates, percentages versus totals, averages, and samples.',lesson:{task:'Numerical arguments fail in a few predictable ways.',method:['Totals versus rates: more accidents may just mean more cars.','Percent change says nothing about absolute size without a starting level.','Market share can rise while sales fall, if the market shrinks.','Averages can move because the group changed, not because members changed.','A sample must represent the population: who was asked, and who answered?'],speed:'When you see a number, ask "out of how many?"'}},
{id:'scope',name:'Scope and language',blurb:'Scope shifts, equivocation, strength of language, comparatives.',lesson:{task:'Conclusions often claim more, or something different, than the evidence covers.',method:['Scope shift: evidence about fatalities, conclusion about accidents; evidence about cities, conclusion about the nation.','Equivocation: one word, two meanings.','Strength: could < probably < will < must. A conclusion stronger than its evidence is a gap.','Comparatives: "more than B" says nothing about whether A is high in absolute terms.','Belief versus truth: what experts or most people believe is evidence, not proof.'],speed:'Compare the key nouns and the modal verb of the conclusion against the premises.'}}];
CURR.forgeItems=[
{id:'F-AN-1',module:'anatomy',seconds:45,difficulty:2,prompt:'"Many critics dismiss the novel as sentimental. Yet its final chapter refuses every consolation the earlier chapters offer. Therefore, the charge of sentimentality misreads the book’s design." What is the main conclusion?',options:['Many critics dismiss the novel as sentimental.','The final chapter refuses every consolation.','The charge of sentimentality misreads the book’s design.','The earlier chapters offer consolation.'],answer:2,explain:'"Therefore" marks it, and the why test confirms it: why believe the charge misreads the design? Because the last chapter refuses consolation. The first sentence is the opposing view.'},
{id:'F-AN-2',module:'anatomy',seconds:45,difficulty:2,prompt:'"The bridge should be closed, since inspectors found cracks in two support beams, and any bridge with cracked support beams is unsafe." What role does "any bridge with cracked support beams is unsafe" play?',options:['Main conclusion','Premise','Concession','Opposing view'],answer:1,explain:'It is a reason offered for closing the bridge and nothing supports it. That makes it a premise.'},
{id:'F-AN-3',module:'anatomy',seconds:45,difficulty:3,prompt:'"Soil samples from the valley contain unusually high nitrate levels. So the valley’s wells are probably contaminated. Thus residents should use bottled water until testing is complete." What is "the valley’s wells are probably contaminated"?',options:['The main conclusion','An intermediate conclusion','A premise with no support','Background information'],answer:1,explain:'It is supported by the nitrate finding and in turn supports the recommendation. Supported and supporting: intermediate conclusion.'},
{id:'F-AN-4',module:'anatomy',seconds:40,difficulty:2,prompt:'"The museum’s new admission policy will reduce attendance. Free days used to draw a third of annual visitors, and the policy eliminates them." Where is the conclusion?',options:['The first sentence','The clause about free days drawing visitors','The clause about the policy eliminating free days','There is no conclusion'],answer:0,explain:'The second sentence explains why attendance will fall. Conclusions often come first.'},
{id:'F-AN-5',module:'anatomy',seconds:40,difficulty:2,prompt:'"Admittedly, the new software has a learning curve. But it cuts processing time in half, so the firm should adopt it." The first sentence is:',options:['The main conclusion','A premise supporting adoption','A concession to a possible objection','An intermediate conclusion'],answer:2,explain:'"Admittedly" grants a point against the author’s view. It does not support adoption.'},
{id:'F-AN-6',module:'anatomy',seconds:45,difficulty:3,prompt:'Which one of these is an argument rather than a description?',options:['The orchestra rehearsed for six hours, then performed the new piece.','Since the hall’s acoustics favor strings, the next commission should be a string piece.','The conductor, who was born in Lisbon, has led the orchestra since 2009.','Ticket sales rose last season, and so did donations.'],answer:1,explain:'Only B offers a claim (what the next commission should be) supported by a reason. The others report facts.'},
{id:'F-CO-1',module:'conditional',seconds:30,difficulty:2,prompt:'Translate: "The bill passes only if the governor signs it."',options:['Passes → Signs','Signs → Passes','Not passes → Not signs','Signs → Not passes'],answer:0,explain:'"Only if" introduces the necessary condition. Signing is required for passing; it does not guarantee it.'},
{id:'F-CO-2',module:'conditional',seconds:30,difficulty:2,prompt:'Translate: "Unless the permit is renewed, the market will close."',options:['Not renewed → Close','Renewed → Not close','Close → Not renewed','Not close → Not renewed'],answer:0,explain:'"A unless B" means if not B, then A. B is the Mistaken Negation; C is the Mistaken Reversal; D gets the contrapositive wrong (it should be Not close → Renewed).'},
{id:'F-CO-3',module:'conditional',seconds:30,difficulty:2,prompt:'"If a member votes, she attended the meeting." Which must be true?',options:['If she attended, she voted.','If she did not vote, she did not attend.','If she did not attend, she did not vote.','She voted and attended.'],answer:2,explain:'Contrapositive of Votes → Attended is Not attended → Not voted. A reverses; B negates.'},
{id:'F-CO-4',module:'conditional',seconds:45,difficulty:3,prompt:'"All certified divers completed the night course. Anyone who completed the night course owns a dive light. Dana does not own a dive light." What follows?',options:['Dana completed the night course but lost her light.','Dana is not a certified diver.','Dana is a certified diver without a light.','Dana will take the night course.'],answer:1,explain:'Certified → Course → Light. No light → no course → not certified.'},
