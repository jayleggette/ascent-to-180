{id:'F-CO-5',module:'conditional',seconds:40,difficulty:3,prompt:'"Every winning bid was submitted before noon." Lin’s bid was submitted before noon. What can be concluded?',options:['Lin’s bid won.','Lin’s bid did not win.','Nothing about whether Lin’s bid won.','Most bids submitted before noon won.'],answer:2,explain:'Before noon is necessary for winning, not sufficient. Concluding that Lin won is the Mistaken Reversal.'},
{id:'F-CO-6',module:'conditional',seconds:30,difficulty:2,prompt:'Translate: "No one may enter the archive without a badge."',options:['Enters → Badge','Badge → Enters','Not enters → Not badge','Badge → Not enters'],answer:0,explain:'Without a badge, no entry: Not badge → Not enter. Its contrapositive is Enter → Badge.'},
{id:'F-CO-7',module:'conditional',seconds:35,difficulty:3,prompt:'"The festival is held outdoors if and only if the forecast is clear." This year the festival is indoors. What follows?',options:['The forecast was clear.','The forecast was not clear.','Nothing about the forecast.','The festival was canceled.'],answer:1,explain:'"If and only if" runs both ways: Outdoors ↔ Clear. Indoors means not outdoors, so not clear.'},
{id:'F-CO-8',module:'conditional',seconds:40,difficulty:3,prompt:'"The road stays closed until the inspection is complete." Which translation fits?',options:['Inspection not complete → Road closed','Road closed → Inspection not complete','Inspection complete → Road open','Road open → Inspection not complete'],answer:0,explain:'"Until" works like "unless": not complete → closed. C is the Mistaken Negation; the road could stay closed for another reason.'},
{id:'F-QU-1',module:'quantifiers',seconds:45,difficulty:3,prompt:'"Most senators voted for the bill. Most senators are lawyers." What must be true?',options:['Most lawyers voted for the bill.','At least one senator who is a lawyer voted for the bill.','Some senators who voted for the bill are not lawyers.','No lawyer voted against the bill.'],answer:1,explain:'Two "most" statements about the same group must overlap: more than half plus more than half exceeds the whole.'},
{id:'F-QU-2',module:'quantifiers',seconds:40,difficulty:3,prompt:'"Most A are B. Most B are C." Must any A be C?',options:['Yes, most A are C.','Yes, at least one A is C.','No, nothing follows about A and C.','Yes, all A are C.'],answer:2,explain:'The "most" claims are about different groups (A, then B), so no overlap is guaranteed.'},
{id:'F-QU-3',module:'quantifiers',seconds:35,difficulty:2,prompt:'"Some critics are poets. All poets are readers." What must be true?',options:['Some critics are readers.','All readers are poets.','Some readers are not critics.','All critics are readers.'],answer:0,explain:'The critics who are poets are readers, so some critics are readers.'},
{id:'F-QU-4',module:'quantifiers',seconds:35,difficulty:2,prompt:'"No reptiles are warm-blooded. Some pets are reptiles." What must be true?',options:['Some pets are not warm-blooded.','No pets are warm-blooded.','Some warm-blooded animals are pets.','Most pets are reptiles.'],answer:0,explain:'The pets that are reptiles are not warm-blooded.'},
{id:'F-QU-5',module:'quantifiers',seconds:30,difficulty:2,prompt:'What is the negation of "All of the samples were contaminated"?',options:['None of the samples were contaminated.','At least one sample was not contaminated.','Most samples were not contaminated.','Some samples were contaminated.'],answer:1,explain:'The negation of "all" is "not all": at least one exception.'},
{id:'F-QU-6',module:'quantifiers',seconds:30,difficulty:2,prompt:'"Not all of the applicants were interviewed." Which must be true?',options:['Some applicants were interviewed.','At least one applicant was not interviewed.','No applicants were interviewed.','Most applicants were not interviewed.'],answer:1,explain:'"Not all" guarantees only one exception. It does not guarantee anyone was interviewed.'},
{id:'F-NS-1',module:'necsuff',seconds:25,difficulty:1,prompt:'"Passing the bar exam is required to practice law." Passing the bar exam is:',options:['Sufficient for practicing law','Necessary for practicing law','Both necessary and sufficient','Neither'],answer:1,explain:'"Required" signals a necessary condition. Passing does not guarantee practicing.'},
{id:'F-NS-2',module:'necsuff',seconds:25,difficulty:1,prompt:'"Any student who scores 175 receives the fellowship." Scoring 175 is ___ for the fellowship.',options:['necessary','sufficient','both','neither'],answer:1,explain:'"Any" introduces a sufficient condition. Others might get the fellowship another way.'},
{id:'F-NS-3',module:'necsuff',seconds:25,difficulty:2,prompt:'"The engine starts only when the key is turned." Turning the key is:',options:['sufficient for starting','necessary for starting','both','irrelevant'],answer:1,explain:'"Only when" works like "only if": the key is required, not a guarantee.'},
{id:'F-NS-4',module:'necsuff',seconds:30,difficulty:2,prompt:'"Whenever the alarm sounds, the doors lock." Which is the necessary condition?',options:['The alarm sounding','The doors locking','Both','Neither'],answer:1,explain:'Alarm → Lock. The necessary condition is on the right: if the doors did not lock, the alarm did not sound.'},
{id:'F-NS-5',module:'necsuff',seconds:30,difficulty:3,prompt:'"Since Mara has a license, she is allowed to drive." This reasoning treats the license as:',options:['necessary for being allowed to drive','sufficient for being allowed to drive','neither','both necessary and sufficient'],answer:1,explain:'It concludes permission from the license alone, so it treats the license as sufficient.'},
{id:'F-NS-6',module:'necsuff',seconds:25,difficulty:2,prompt:'"Only members may vote." Kai voted. Then:',options:['Kai is a member.','Kai may not be a member.','All members voted.','Kai is not a member.'],answer:0,explain:'Votes → Member. Kai voted, so Kai is a member.'},
{id:'F-CA-1',module:'causal',seconds:45,difficulty:2,prompt:'"Over ten years, cities that hired more police officers had higher crime rates. So adding officers increases crime." The main risk in this reasoning is:',options:['Reverse causation: rising crime may lead cities to hire officers','Sampling error from a small survey','Equivocation on the word crime','Appeal to authority'],answer:0,explain:'Cities often hire officers because crime is rising. The arrow may run backward.'},
{id:'F-CA-2',module:'causal',seconds:45,difficulty:2,prompt:'"Children who eat breakfast score higher on tests. So breakfast improves scores." Which most weakens this?',options:['Families who serve breakfast also tend to have more time to help with homework.','Some children who skip breakfast score well.','Breakfast foods vary by region.','The tests were given in the morning.'],answer:0,explain:'A third factor (family time) could produce both breakfast and scores. B is only an exception.'},
{id:'F-CA-3',module:'causal',seconds:45,difficulty:2,prompt:'Which most strengthens "The new fertilizer caused the higher yield on Farm A"?',options:['Neighboring farms with the same weather and no fertilizer saw no yield increase.','Farm A’s owner is an experienced farmer.','The fertilizer is expensive.','Yields vary from year to year.'],answer:0,explain:'A comparison group without the cause and without the effect rules out weather and the general trend.'},
{id:'F-CA-4',module:'causal',seconds:45,difficulty:3,prompt:'"Since the factory closed, asthma cases in town fell 30%, so the factory caused asthma." Which question best evaluates this?',options:['Did asthma cases also fall in similar towns with no factory closure?','How many workers did the factory employ?','Was the factory profitable?','How old was the factory?'],answer:0,explain:'If similar towns fell too, the closure is not needed to explain the drop. If not, the causal claim gains support.'},
{id:'F-CA-5',module:'causal',seconds:35,difficulty:2,prompt:'Which pattern most strongly suggests causation rather than coincidence?',options:['The more of the drug patients took, the larger their improvement.','Patients who took the drug liked it.','The drug was approved quickly.','Some patients improved without the drug.'],answer:0,explain:'A dose-response relationship is hard to explain by coincidence or by most third factors.'},
{id:'F-CA-6',module:'causal',seconds:35,difficulty:2,prompt:'"The new mascot debuted in March, and the team then won ten straight games, so the mascot caused the streak." The error is:',options:['Treating a sequence in time as cause and effect','Confusing necessary and sufficient conditions','Attacking the person instead of the argument','Reasoning from part to whole'],answer:0,explain:'Coming before is not causing. Nothing links the mascot to the wins.'},
{id:'F-NU-1',module:'numbers',seconds:40,difficulty:2,prompt:'"More accidents involve red cars than silver cars, so red cars are more dangerous." What information is missing?',options:['How many red and silver cars are on the road','The price of red cars','Whether drivers prefer red','How many accidents happen at night'],answer:0,explain:'A total means nothing without the base rate. There may simply be more red cars.'},
{id:'F-NU-2',module:'numbers',seconds:35,difficulty:2,prompt:'City A’s crime fell 10% while City B’s fell 20%. Must City B now have less crime than City A?',options:['Yes','No: the starting levels are unknown','Yes, because 20% is larger','Only if City B is larger'],answer:1,explain:'Percent changes say nothing about absolute levels without the starting numbers.'},
{id:'F-NU-3',module:'numbers',seconds:35,difficulty:2,prompt:'A survey of gym members found 80% favor longer gym hours. The council concludes most residents favor longer hours. The flaw is:',options:['An unrepresentative sample','Circular reasoning','Equivocation','A false choice'],answer:0,explain:'Gym members are not a fair sample of residents on this question.'},
{id:'F-NU-4',module:'numbers',seconds:45,difficulty:4,prompt:'A club’s average member income rose, yet no continuing member’s income rose. How is this possible?',options:['It is impossible.','Lower-income members left the club.','Everyone received a raise.','The median fell.'],answer:1,explain:'The average can rise when the group changes, even if no individual changes upward.'},
{id:'F-NU-5',module:'numbers',seconds:35,difficulty:3,prompt:'Brand X’s market share rose from 10% to 15%. Did its sales necessarily increase?',options:['Yes','No: the total market may have shrunk','Yes, by exactly 50%','No: share cannot rise unless sales fall'],answer:1,explain:'Share is a fraction. If the market shrank enough, sales could fall while share rose.'},
{id:'F-NU-6',module:'numbers',seconds:40,difficulty:3,prompt:'Of 50 people who tried a remedy, 40 felt better within a week. What matters most before concluding the remedy works?',options:['How many similar people who did not take it felt better within a week','What the remedy costs','Who manufactures it','Whether it tastes good'],answer:0,explain:'Without a comparison group, recovery may be what happens anyway.'},
{id:'F-SC-1',module:'scope',seconds:30,difficulty:1,prompt:'"A ruler measures length. The queen is a ruler. So the queen measures length." The error is:',options:['Equivocation on "ruler"','Circular reasoning','Attacking the person','A sampling error'],answer:0,explain:'"Ruler" shifts meaning between premises.'},
{id:'F-SC-2',module:'scope',seconds:40,difficulty:2,prompt:'"Most economists favor the tariff. So the tariff is good policy." The problem is that the argument:',options:['moves from what experts believe to what is true','uses a word in two senses','reverses cause and effect','reasons from a part to the whole'],answer:0,explain:'Expert belief is evidence, not proof. The conclusion claims truth.'},
{id:'F-SC-3',module:'scope',seconds:40,difficulty:3,prompt:'Premise: the law reduced traffic fatalities in cities. Conclusion: the law reduced traffic accidents nationwide. Which shifts occur?',options:['Fatalities to accidents, and cities to the nation','Law to policy, and cities to states','Nothing shifts','Only cities to the nation'],answer:0,explain:'Two shifts: the outcome (fatalities versus accidents) and the place (cities versus nation).'},
{id:'F-SC-4',module:'scope',seconds:30,difficulty:2,prompt:'Which claim is hardest to support?',options:['Some birds of this species migrate.','Most of the surveyed birds migrated.','All birds of this species always migrate.','At least one bird migrated.'],answer:2,explain:'"All" and "always" demand the most evidence.'},
{id:'F-SC-5',module:'scope',seconds:35,difficulty:3,prompt:'"Paper A is more widely read than Paper B." Which must be true?',options:['Paper A is widely read.','Paper B is not widely read.','Paper A has more readers than Paper B.','Paper A is the most widely read paper.'],answer:2,explain:'A comparison tells you nothing about absolute levels. Both papers might be obscure.'},
{id:'F-SC-6',module:'scope',seconds:30,difficulty:1,prompt:'The passage says a proposal "could reduce costs". An answer says it "will reduce costs". That answer is:',options:['Too strong','Exactly supported','Too weak','Irrelevant'],answer:0,explain:'"Could" is possibility; "will" is prediction. The answer outruns the text.'}];

CURR.rc={
roadmap:{task:'Read for the map, not the details. Details are on the page when a question needs them; the map is what you cannot rebuild under time.',
 method:['**Before reading**: set the goal. You are looking for the point, the author’s attitude, and the structure.','**Each paragraph**: write a margin note of 5 to 8 words naming the paragraph’s job ("introduces critics’ view", "author objects: ignores audience").','**Mark the voice**: is this the author evaluating, or the author reporting what others think? "Critics contend" is a report. "This view is mistaken" is the author.','**Mark shifts**: however, yet, although, despite, but, on the other hand. Almost every shift is tested.','**Mark strength**: clearly, merely, surprisingly, arguably, largely. These carry the attitude.','**After reading**: one sentence each for main point, attitude, structure.','**Per question**: locate the evidence, predict, then match. Never answer from memory.'],
 speed:'Three to four minutes reading with notes, then about 40 to 60 seconds per question. The notes pay for themselves on the third question.',
 errors:['Reading emphasis as endorsement: a view that gets three paragraphs may be the one the author rejects.','Collapsing a both/and thesis into one side.','Promoting an example or analogy to the main point.']},
islands:{
humanities:{task:'Literature, art, music, philosophy, film, history of ideas. The difficulty is not vocabulary; it is attitude. Authors in these passages rarely shout. They qualify, concede and then turn.',method:['Name the competing viewpoints and who holds each.','Find the author’s own view and how strong it is: "largely right but", "misses", "too narrowly".','Track tone words. A single "merely" can carry the whole attitude.','Expect both/and theses: "X is a formal innovation and also a political statement". Answers that keep one half are traps.','Abstract nouns are claims. Translate each into plain English in your margin note.'],traps:['Valence flip on attitude questions.','Tension collapse on main point questions.','Device promotion: the painting or poem discussed is an example, not the point.']},
social_science:{task:'Sociology, economics, anthropology, political theory, psychology. Usually a hypothesis, the evidence for it, a challenge, and a verdict.',method:['Name the phenomenon being explained.','List the explanations on offer and who holds each.','Mark the evidence and which explanation it supports.','Note what the author concludes and how strongly.'],traps:['Adjacent doubt chosen over the competing explanation the passage offers.','Direction flips in causal statements.','Emphasis read as endorsement.']},
natural_science:{task:'Biology, physics, earth science, medicine. Jargon is decoration: the structure is always question, finding, puzzle.',method:['Find the question being investigated.','Find the finding and the method behind it.','Find the open puzzle or the competing hypothesis.','Replace each technical term with a letter if needed. The logic survives.'],traps:['Recycled language: a choice built from the passage’s terms that says something new.','Extreme language on what the study proved.','Direction flips in mechanisms.']},
law:{task:'Court cases, doctrine, regulation, policy. The standard shape: a rule, a challenge or exception, the rationale, and the effect on someone.',method:['State the rule in plain words.','Find the exception or the challenge to it.','Find the rationale each side offers.','Track who benefits or loses under each reading.'],traps:['Reversed scope of criticism: the author attacks the rule’s application, the answer says the rule itself.','Half right answers on the rationale.','Out of scope remedies.']},
comparative:{task:'Two shorter passages, A and B. Most questions test how they relate.',method:['Read A and map it. Read B and map it.','Write one line: "A says ___. B says ___. B ___ A" (agrees, extends, rebuts, applies, supplies evidence for, ignores).','For agreement questions, both authors must commit to the claim.','For questions about one passage, ignore the other.'],traps:['An answer true of one passage offered as true of both.','Disagreement invented where one author is silent.','Attitude transferred from A to B.']}},
qtypes:[
{name:'Main Point',how:'Find the sentence the whole passage serves. It must cover every paragraph and keep any both/and tension. Too narrow describes one paragraph; too broad drifts beyond the passage.'},
{name:'Primary Purpose',how:'Main point stated as a verb: to argue, to explain, to evaluate, to compare, to challenge. Match the verb first; "to describe" is wrong when the author argues.'},
{name:"Author's Attitude",how:'Use the strength words you marked. Most correct answers are moderate and mixed: "qualified approval", "reserved skepticism". Extreme attitudes are rare and must be earned by the text.'},
{name:'Organization',how:'Read your margin notes in order. The answer must match every step in the right order. Check the last step first.'},
{name:'Function',how:'Why is this detail here? Find the claim it supports. Answers are verbs: to illustrate, to concede, to contrast, to support, to undermine.'},
{name:'Detail',how:'Go back to the line. The answer is a paraphrase of what is stated. Recycled wording attached to the wrong idea is the standard trap.'},
{name:'Inference',how:'Must be supported by the passage, usually one short step from a specific line. Answers that sound like the author but go further are traps.'},
{name:'Vocabulary in Context',how:'Ignore the dictionary meaning; reread the sentence and the one before. The answer replaces the word without changing the sentence’s logic.'},
{name:'Analogy',how:'Abstract the relationship in the passage ("a method praised for the wrong reasons"), then find the choice with the same relationship in a different topic.'},
{name:'Application',how:'State the passage’s principle as a rule, then test which scenario meets its condition and produces its outcome.'},
{name:'RC Strengthen/Weaken',how:'Same as LR: find the specific claim and its support in the passage, then attack or close the gap between them.'},
{name:'Author Response',how:'Predict from the author’s stated view and reasoning, not from what a reasonable person would say. If the author never addressed it, extend only one step.'},
{name:'Comparative',how:'Use your "A says, B says, relation" line. For agree or disagree, both authors must have a position on the claim.'}],
readingList:['Aeon essays on philosophy and the history of ideas','New York Review of Books essays on art and literature','Quanta Magazine features on open science questions','A Supreme Court majority opinion and its dissent (supremecourt.gov)','London Review of Books long reviews','Boston Review essays on political theory']};

CURR.traps=[
{code:'VALENCE_FLIP',group:'RC',name:'Valence Flip',short:'Right topic, opposite attitude.',long:'The answer describes the author’s view of the right thing with the wrong charge: approval for doubt, skepticism for praise, rejection for qualified acceptance. It is the most expensive trap on attitude and main point questions because the content words all match.',spot:'Before choosing, say the author’s attitude in two words ("qualified approval") and check the adjective in the answer against them.',sounds:['"The author dismisses..." when the author partly accepts.','"enthusiastically endorses" when the passage says "largely persuasive, but".']},
{code:'DIRECTION_FLIP',group:'RC',name:'Direction Flip',short:'Reverses a relationship.',long:'The passage says A shapes B; the answer says B shapes A. Or A limits B becomes B limits A. These answers reuse both terms exactly, which makes them feel verified.',spot:'Find the sentence that states the relationship and trace the verb from subject to object.',sounds:['"Changes in patronage drove the new style" when the passage says the style attracted new patrons.']},
{code:'TENSION_COLLAPSE',group:'RC',name:'Tension Collapse',short:'Keeps one half of a both/and thesis.',long:'The passage holds two ideas in balance: a work is both formally radical and politically conservative; a doctrine is both necessary and dangerous. The answer states one half as the whole point.',spot:'If your main point sentence has "both", "while", "even as" or "and yet", the right answer needs both sides.',sounds:['"The author argues the novel is politically conservative" when the thesis is that it is formally radical and politically conservative.']},
{code:'DEVICE_PROMOTION',group:'RC',name:'Device Promotion',short:'Turns an example into the main point.',long:'An example, analogy, case or anecdote supports a claim. The answer presents the example itself as what the passage is about.',spot:'Ask what the example is an example of. The answer to that question is the point.',sounds:['"The passage is primarily concerned with the history of the Lisbon tram" when the tram illustrates a theory of urban form.']},
{code:'EMPHASIS_ENDORSEMENT',group:'RC',name:'Emphasis Is Not Endorsement',short:'Assumes the author agrees with the view given the most space.',long:'Authors often spend most of a passage laying out a view they go on to reject or qualify. Space is not agreement. This was one of your recorded misses: two paragraphs on critics read as the author siding with them.',spot:'Separate reported voice ("critics contend", "proponents claim") from authorial voice ("in fact", "this overlooks", "rightly").',sounds:['"The author agrees with the sociologists that..." when the author only reports them.']},
{code:'ADJACENT_DOUBT',group:'RC',name:'Adjacent Doubt',short:'A skeptical-sounding answer chosen over the direct alternative.',long:'When the passage offers a competing explanation, the right answer names it. The trap answer just casts general doubt nearby: the method was imperfect, some cases differ. It sounds critical and explains nothing.',spot:'Ask whether the answer explains the evidence another way. If it only doubts, look for one that explains.',sounds:['"Some studies were small" when the passage offers a rival cause.']},
{code:'EXTREME',group:'RC',name:'Extreme Language',short:'All, never, only, completely, when the text says often or some.',long:'The answer is directionally right but stronger than the text allows. On inference and attitude questions, strength must be earned line by line.',spot:'Circle the quantifier and the modal verb in the answer and find their match in the passage.',sounds:['"always", "entirely", "proves", "the only"']},
{code:'OUT_OF_SCOPE',group:'RC',name:'Out of Scope',short:'Plausible, but never discussed.',long:'The answer is reasonable and on topic, and the passage simply does not address it. On must-be-supported questions that is fatal.',spot:'Find the line. If you cannot point to it, it is out.',sounds:['A comparison to a group the passage never mentions.','A prediction about the future when the passage is about the past.']},
{code:'HALF_RIGHT',group:'RC',name:'Half Right',short:'First half right, second half wrong.',long:'The most common trap at higher difficulty. The opening clause matches the passage exactly, buying your trust; the closing clause adds a claim the passage does not make.',spot:'Read every answer to the end, and check the last clause first.',sounds:['"...which shows that the earlier critics were entirely mistaken."']},
{code:'RECYCLED_LANGUAGE',group:'RC',name:'Recycled Phrase',short:'Passage wording attached to a claim the passage does not make.',long:'Familiar words feel like evidence. The answer lifts a memorable phrase and uses it to say something new.',spot:'Distrust verbatim phrases. Paraphrases are usually the right answer; copies are usually traps.',sounds:['A striking term from paragraph 2 used to describe paragraph 4’s argument.']},
{code:'TOO_NARROW',group:'RC',name:'Too Narrow',short:'Covers one paragraph, not the passage.',long:'On main point and purpose questions, an answer that is accurate about one section is still wrong.',spot:'Check that the answer covers your first and last margin notes.',sounds:['A main point that describes only the opening view.']},
{code:'TOO_BROAD',group:'RC',name:'Too Broad',short:'Claims more than the passage covers.',long:'The answer generalizes from the passage’s case to a whole field or all cases.',spot:'Match the scope nouns: one author or all authors, one doctrine or law in general.',sounds:['"Modern art in general..." when the passage discusses one painter.']},
{code:'CRITICISM_SCOPE',group:'RC',name:'Reversed Scope of Criticism',short:'The author criticizes the method; the answer says the conclusion.',long:'Authors often accept a conclusion while rejecting how others reached it, or the reverse. The answer misplaces the target of the criticism.',spot:'Ask: what exactly does the author object to, the claim or the reasoning for it?',sounds:['"The author rejects the historians’ conclusion" when the author rejects only their evidence.']},
{code:'MISTAKEN_REVERSAL',group:'LR',name:'Mistaken Reversal',short:'Treats a necessary condition as sufficient.',long:'From A → B, infers B → A. Common in Inference answers and the most common Flaw.',spot:'Diagram the rule; check the arrow direction in the answer.',sounds:['"Since she attended, she voted" from "all voters attended".']},
{code:'MISTAKEN_NEGATION',group:'LR',name:'Mistaken Negation',short:'Negates both sides without flipping.',long:'From A → B, infers not A → not B.',spot:'A valid contrapositive flips and negates. Negating without flipping is the trap.',sounds:['"Since he did not vote, he did not attend."']},
{code:'QUANTIFIER_SHIFT',group:'LR',name:'Quantifier Shift',short:'Some becomes most, most becomes all.',long:'The answer upgrades or changes a quantifier the stimulus set.',spot:'Circle quantifiers in both the stimulus and the answer.',sounds:['"Most" in the answer when the stimulus said "some".']},
{code:'CAUSAL_REVERSAL',group:'LR',name:'Causal Reversal',short:'Swaps cause and effect.',long:'Correct as a weakener when it shows the arrow runs backward; wrong when an Inference or Method answer misstates the stimulus’s own direction.',spot:'Trace the verb: which thing acts on which?',sounds:['"Depression causes social withdrawal" when the stimulus claimed the reverse.']},
{code:'IRRELEVANT_COMPARISON',group:'LR',name:'Irrelevant Comparison',short:'Compares things the argument does not depend on.',long:'The answer sets up a comparison (more, less, faster) between groups or options the conclusion is not about.',spot:'Ask whether the conclusion depends on that comparison.',sounds:['"Brand B is cheaper than Brand A" in an argument about whether A works.']},
{code:'SHELL_GAME',group:'LR',name:'Shell Game',short:'Swaps in a slightly different claim.',long:'The answer addresses something close to the conclusion but not the conclusion: a related group, a stronger version, a different time.',spot:'Read the conclusion again and compare key nouns word by word.',sounds:['Answers about "accidents" when the conclusion is about "fatalities".']},
{code:'TOO_WEAK',group:'LR',name:'Too Weak',short:'Not enough to do the job.',long:'On Sufficient Assumption and Justify questions, an answer that helps but does not guarantee is wrong.',spot:'Add it to the premises. Is the conclusion now certain?',sounds:['"Some" bridges where "all" is needed.']},
{code:'TOO_STRONG',group:'LR',name:'Too Strong',short:'More than the argument needs or the text supports.',long:'On Necessary Assumption, Inference and RC questions, extra strength makes an answer unsupported or unnecessary.',spot:'Negate it: if the argument survives the negation, it was not necessary.',sounds:['"All", "always", "the only reason".']},
{code:'TRUE_BUT_IRRELEVANT',group:'LR',name:'True but Irrelevant',short:'Accurate, and beside the point.',long:'Especially on Flaw and Method questions: the answer accurately describes the argument but does not name an error or the method asked for.',spot:'Ask whether it answers the stem, not whether it is true.',sounds:['"The argument relies on a survey." So what?']},
{code:'REVERSAL',group:'LR',name:'Wrong Direction',short:'Does the opposite of the task.',long:'A strengthener on a Weaken question, or a weakener on a Strengthen question. Usually wrapped in the right vocabulary.',spot:'Restate the task before choosing: am I hurting or helping?',sounds:['An answer that rules out an alternative cause on a Weaken question.']},
{code:'RESTATES_PREMISE',group:'LR',name:'Restates a Premise',short:'Says what the stimulus already said.',long:'Adds no new information, so it cannot strengthen, weaken, or resolve anything.',spot:'If you already knew it from the stimulus, it does nothing.',sounds:['A reworded version of the evidence.']},
{code:'PREMISE_ATTACK',group:'LR',name:'Premise Attack',short:'Disputes a fact you must accept.',long:'Premises are fixed. An answer that suggests they are false contradicts the stimulus rather than weakening the reasoning.',spot:'Weakeners add a new fact; they do not deny old ones.',sounds:['"The survey numbers were inaccurate."']},
{code:'EXPLAINS_HALF',group:'LR',name:'Explains Only Half',short:'Resolves one side of a paradox.',long:'The answer makes one fact understandable but leaves the conflict with the other standing.',spot:'Restate the paradox as "X and yet Y" and check that both survive.',sounds:['Why sales rose, without why profits fell.']},
{code:'DEEPENS_PARADOX',group:'LR',name:'Deepens the Paradox',short:'Makes the conflict worse.',long:'The answer adds a fact that makes the two observations even harder to reconcile.',spot:'After reading it, is the "and yet" stronger? Then it is wrong.',sounds:['More evidence that X should have prevented Y.']},
{code:'NOT_NECESSARY',group:'LR',name:'Helpful, Not Required',short:'Would help, but the argument survives without it.',long:'On Necessary Assumption questions, many wrong answers strengthen. The negation test exposes them.',spot:'Negate it and check whether the argument is still standing.',sounds:['A strong supportive claim the argument never needed.']},
{code:'MISMATCHED_STRUCTURE',group:'LR',name:'Mismatched Structure',short:'Same topic or words, different logic.',long:'On Parallel questions, the trap shares surface features with the original but differs in conclusion type, quantifier or validity.',spot:'Compare conclusions first: strength, quantifier, negation.',sounds:['A valid argument offered to match an invalid one.']},
{code:'OUTSIDE_KNOWLEDGE',group:'LR',name:'Outside Knowledge',short:'True in the world, absent from the text.',long:'On Inference and RC questions, only the text counts.',spot:'Point to the sentence. No sentence, no answer.',sounds:['A well-known fact that the stimulus never states.']},
{code:'CONTRADICTS',group:'LR',name:'Contradicts the Text',short:'Must be false given what you were told.',long:'The answer conflicts with a stated fact or with a valid chain from the stated facts. Easy to catch once you diagram; easy to miss when you skim.',spot:'Run the chain; if the answer breaks it, it is out (or it is the answer on a Must Be False question).',sounds:['An answer that lets something happen the rules forbid.']},
{code:'PREMISE_AS_CONCLUSION',group:'LR',name:'Premise Posing as Conclusion',short:'Picks a reason instead of the point.',long:'On Main Conclusion and Role questions, a premise is offered as the conclusion. It is a true part of the argument, doing the wrong job.',spot:'Run the because test: the conclusion is what the others support.',sounds:['A statistic or fact from the middle of the argument.']},
{code:'OPPOSING_VIEW',group:'LR',name:'Opposing View',short:'Picks the view the author argues against.',long:'Arguments often open with someone else’s position. Choosing it as the conclusion, or as the author’s belief, is the LR twin of Emphasis Is Not Endorsement.',spot:'Words like "some argue", "critics claim", "it is often said" mark views the author is about to answer.',sounds:['"Some economists argue..." offered as the main point.']},
{code:'WRONG_ROLE',group:'LR',name:'Wrong Role Label',short:'Mislabels what a claim does.',long:'Role and Method answers name jobs: premise, intermediate conclusion, concession, counterexample. The trap names a real job the claim does not do.',spot:'Draw the support arrows before reading labels.',sounds:['"It is the main conclusion" for a claim that supports another claim.']},
{code:'ONE_SPEAKER',group:'LR',name:'Only One Speaker',short:'Only one speaker addresses it.',long:'Point at Issue and Agreement answers must be things both speakers take a position on.',spot:'Apply the "both must have an opinion" test first.',sounds:['A claim only the second speaker makes.']},
{code:'BOTH_AGREE',group:'LR',name:'Both Agree',short:'Offered as a disagreement, but both accept it.',long:'Speakers often agree on a premise and differ on the conclusion. A choice naming the shared premise is wrong on a disagreement question.',spot:'Look for concessions like "certainly" or "indeed" in the second speaker.',sounds:['"Whether green space is scarce" when both say it is.']}];
CURR.trapIndex={};for(const t of CURR.traps)CURR.trapIndex[t.code]=t;
['SCOPE_SHIFT','INSUFFICIENT','DESCRIBES_PART','DETAIL_AS_PURPOSE','WRONG_DIRECTION'].forEach(c=>{CURR.trapIndex[c]=CURR.trapIndex[c]||{code:c,name:{SCOPE_SHIFT:'Scope Shift',INSUFFICIENT:'Not Enough',DESCRIBES_PART:'Describes Only Part',DETAIL_AS_PURPOSE:'Detail as Purpose',WRONG_DIRECTION:'Wrong Direction'}[c],short:'',long:'',spot:''}});

CURR.flaws=[
{name:'Necessary taken as sufficient',plain:'Treats something required for an outcome as if it guaranteed it.',phrasing:['takes a condition that is required for X to be enough to bring about X','infers that because a requirement was met, the outcome followed'],example:'Every winner trained daily. Lee trained daily, so Lee will win.'},
{name:'Sufficient taken as necessary',plain:'Treats one guaranteed route to an outcome as the only route.',phrasing:['confuses a condition that ensures X with one that X requires','presumes that X can come about in only one way'],example:'Anyone who scores 175 gets the grant. Ana did not score 175, so she will not get it.'},
{name:'Correlation taken as causation',plain:'Concludes one thing causes another because they occur together.',phrasing:['takes a correlation to establish a causal link','fails to consider that the two may share a common cause'],example:'Towns with more cafes have less crime, so cafes reduce crime.'},
{name:'Reverse causation overlooked',plain:'Ignores that the supposed effect might be causing the supposed cause.',phrasing:['fails to consider that the effect may be the cause','overlooks the possibility that Y led to X rather than X to Y'],example:'Cities with more police have more crime, so police cause crime.'},
{name:'Alternative explanation ignored',plain:'Accepts one explanation for the evidence without ruling out others.',phrasing:['fails to rule out other explanations for the data','ignores that another factor could account for the change'],example:'Complaints fell after the ban, so the ban worked. (A nightclub also closed.)'},
{name:'Part to whole (composition)',plain:'Assumes what is true of the parts is true of the whole.',phrasing:['assumes that a property of each part belongs to the whole','infers a characteristic of a group from characteristics of its members'],example:'Each player is excellent, so the team will be excellent.'},
{name:'Whole to part (division)',plain:'Assumes what is true of the whole is true of each part.',phrasing:['assumes that what holds for the group holds for each member','attributes a property of the whole to every part'],example:'The firm is profitable, so every division is profitable.'},
{name:'Equivocation',plain:'Uses a key word in two different senses.',phrasing:['relies on a term used in two different senses','treats two meanings of a word as one'],example:'The theory is only a theory, so it is just a guess.'},
{name:'Attack on the person',plain:'Rejects a claim because of who made it rather than the reasons given.',phrasing:['criticizes the source rather than the argument','rejects a position because of the motives of those who hold it'],example:'The senator owns farmland, so her farm bill argument fails.'},
{name:'Inappropriate authority',plain:'Relies on an authority outside their expertise, or treats authority as proof.',phrasing:['relies on the opinion of someone not shown to be an expert on the matter','treats an expert’s endorsement as conclusive'],example:'A famous chef says the vaccine is unsafe, so it is.'},
{name:'Appeal to popularity',plain:'Concludes something is true or right because many believe it.',phrasing:['treats widespread belief as evidence of truth','infers that a view is correct from its popularity'],example:'Most voters think the tax is fair, so it is fair.'},
{name:'Circular reasoning',plain:'Assumes the conclusion in a premise.',phrasing:['presupposes what it sets out to prove','offers as support a restatement of the conclusion'],example:'The report is reliable because it is accurate, and it is accurate because it is reliable.'},
{name:'False dichotomy',plain:'Presents two options as the only ones.',phrasing:['assumes without warrant that only two options exist','overlooks alternatives other than the two considered'],example:'Either we cut the program or we raise tuition.'},
{name:'Unrepresentative sample',plain:'Draws a conclusion about a population from a sample that does not reflect it.',phrasing:['relies on a sample unlikely to represent the group','generalizes from a group that differs in relevant ways'],example:'Gym members favor longer hours, so residents do.'},
{name:'Numbers versus percentages',plain:'Confuses totals with rates or shares.',phrasing:['treats a change in proportion as a change in amount','infers a rate from raw totals'],example:'Red cars have more accidents, so red cars are riskier.'},
{name:'Hasty generalization',plain:'Draws a sweeping conclusion from too few cases.',phrasing:['draws a general conclusion from a few instances','generalizes from insufficient evidence'],example:'Two of my students struggled, so the curriculum fails.'},
{name:'Scope shift',plain:'The conclusion is about something different from the evidence.',phrasing:['draws a conclusion about X from evidence about Y','shifts from a claim about one group to a claim about another'],example:'The law cut fatalities in cities, so it cut accidents nationwide.'},
{name:'Possibility taken as certainty',plain:'Treats what could happen as what will happen.',phrasing:['treats a possible outcome as inevitable','infers that something will occur because it might'],example:'The bridge could fail, so it will fail.'},
{name:'Some or most taken as all',plain:'Inflates a quantifier.',phrasing:['moves from a claim about some to a claim about all','treats what is typical as universal'],example:'Most critics praised it, so every critic did.'},
{name:'Straw man',plain:'Refutes a distorted version of the opposing view.',phrasing:['misrepresents the position it attacks','responds to a claim the opponent did not make'],example:'She wants to trim the budget, so she wants to shut the department.'},
{name:'Absence of evidence',plain:'Concludes a claim is false because it has not been proven, or true because it has not been disproven.',phrasing:['treats a lack of evidence for a claim as evidence against it','infers truth from the absence of disproof'],example:'No study has shown harm, so it is safe.'},
{name:'Sequence taken as cause',plain:'Concludes A caused B because A came first.',phrasing:['infers causation from a sequence in time','assumes that what came before produced what came after'],example:'The mascot debuted, then the team won, so the mascot helped.'},
{name:'False analogy',plain:'Argues from a comparison between things that differ in a relevant way.',phrasing:['relies on an analogy between cases that are not relevantly similar','overlooks differences that undermine the comparison'],example:'Running a country is like running a household, so the budget must always balance.'},
{name:'Belief taken as fact',plain:'Moves from what someone believes or perceives to what is true.',phrasing:['confuses what people believe with what is the case','treats a perception as evidence of the fact itself'],example:'Residents feel safer, so crime has fallen.'},
{name:'Plan assumed to succeed',plain:'Assumes a plan will reach its goal because one step works, ignoring other requirements.',phrasing:['overlooks other conditions needed for the plan to succeed','assumes that meeting one requirement ensures the goal'],example:'Lower fares will fill the trains, so the line will profit. (Costs rise too.)'},
{name:'Comparison taken as absolute',plain:'Moves from "more than" to "a lot".',phrasing:['treats a comparative claim as an absolute one','infers that X is high from the fact that it is higher than Y'],example:'Paper A has more readers than Paper B, so A is widely read.'}];

CURR.clock={
skip:{task:'A hard question is worth exactly as much as an easy one. Time spent rescuing one question is taken from three others.',method:['Set a hard ceiling: 2:30 for LR, about 1:30 per RC question after the passage.','When the timer turns red, choose your best remaining answer, flag it, and move.','Never leave a blank. There is no penalty for wrong answers.','On the section review screen, return to flagged items only after every question has an answer.','If you return and are still split, keep the first answer unless you can say a specific reason to change it.'],speed:'The first ten LR questions are usually the fastest. Bank time there at 50 to 60 seconds each.'},
scoring:{task:'Your raw score is the number of scored questions you answer correctly. LSAC converts raw to the 120 to 180 scale with a curve that differs slightly from test to test.',method:['About 76 or 77 scored questions: two LR sections of roughly 25 and one RC section of about 27.','Near the top, each miss costs one point or more. A 180 usually allows zero to two misses; the high 170s allow a handful.','Every official PrepTest ships with its own conversion table. Use the real one when you log a test.'],speed:'Careless misses on easy questions cost exactly as much as hard misses. That is why calibration matters.'}};

CURR.mind=[
{id:'routine',name:'Test-day routine',lesson:{method:['Sleep: same bedtime for the last five nights, not just the last one.','Food: a familiar breakfast, protein, no experiments.','Water, but not a liter in the last hour.','Warm-up: five untimed logic flashes from the Forge, nothing new.','Arrive early or log in early; tech problems eat calm.','Between sections: stand, breathe, do not review.']}},
{id:'reset',name:'Resetting after a bad section',lesson:{body:['You will not know how a section went. Sections that feel brutal are often the experimental one, or hard for everyone.','Run one box-breathing round, say "next section, fresh score", and treat the next section as the only one that exists.','The worst thing a bad section can do is cost you the next one.']}},
{id:'unscored',name:'The unscored section',lesson:{body:['In the current format one of the four sections is unscored, and you cannot tell which. From August 2027 unscored questions are embedded inside the three sections.','Treat every section and every question as scored. Guessing which is experimental is a losing game.']}},
{id:'triage',name:'Section triage',lesson:{method:['RC: you may do passages in any order. Start with the passage that looks most comfortable, but never skip a whole passage unless time is gone.','LR: work in order, flag aggressively, and use the first ten questions to bank time.','Leave nothing blank in either.']}},
{id:'elimination',name:'Elimination discipline',lesson:{method:['Cross out each eliminated choice and name the reason in one phrase: out of scope, too strong, wrong direction, half right.','If you cannot name a reason, the choice is still alive.','Two survivors: compare them against the gap, not against each other.']}},
{id:'guessing',name:'Guessing',lesson:{body:['No penalty for wrong answers, so a blank is always a mistake.','Eliminate first, then guess among survivors.','For a true last-second blind guess, use the same letter every time so you are not deciding under panic.']}},
{id:'confidence',name:'Confidence discipline',lesson:{body:['Change an answer only when you can say the specific reason out loud: "B is out of scope because the conclusion is about fatalities."','The Observatory tracks your answer changes. If changes hurt more than they help, adopt a no-change rule for anything you rated Sure.']}},
{id:'interface',name:'Digital interface',lesson:{body:['This game mirrors the official tools: highlighter, strikethrough, flag, section review screen and an on-screen timer.','Practice official PrepTests in LawHub so its exact interface is familiar before test day.']}},
{id:'stamina',name:'Stamina',lesson:{method:['Weeks 1 to 8: single sections.','Weeks 9 to 16: two-section blocks.','Week 17 on: full tests under real conditions, breaks included, ideally at the time of day you will test.','Do the writing sample on a separate day, as the real one is taken separately.']}},
{id:'perfectionism',name:'Perfectionism and bad days',lesson:{body:['A 180 attempt means treating every miss as data rather than as a verdict.','Bad days happen. Log them, tag the causes in the Autopsy, and look at the weekly trend, never the single day.','If practice starts to feel like dread, take the minimum viable day and protect sleep. Consistency beats intensity.']}}];
CURR.mindIndex={};for(const m of CURR.mind)CURR.mindIndex[m.id]=m;

CURR.writing={
what:'LSAT Argumentative Writing is unscored, but you must complete it before your score is released, and it goes to every school you apply to. It is taken online and proctored, separately from the multiple-choice test: 15 minutes of prewriting analysis (you may move on after five), then 35 minutes to write. LSAC asks for a response that is well-written, cogent and well-argued. The practice prompts here present a debatable issue with several perspectives. Confirm the current format on lsac.org.',
template:{method:['Lead with your position in the first two sentences. Do not make the reader hunt for it.','Use the perspectives in the prompt. Agree with parts of them by name; disagree with others by name.','Engage the strongest opposing argument directly, then explain why your position still wins.','Give concrete reasons and one specific example or mechanism per paragraph.','Close in two or three sentences that restate the position with the reason that matters most.'],speed:'Spend about 8 minutes outlining in prewriting, 24 writing, 3 proofreading. Four paragraphs of real reasoning beat seven of filler.'},
rubric:[{id:'pos',name:'Clear position',desc:'The position is stated early and held throughout.'},{id:'use',name:'Use of the prompt',desc:'Engages the specific perspectives and facts given, not a generic version of the issue.'},{id:'counter',name:'Counterargument',desc:'Names the strongest opposing argument fairly and answers it.'},{id:'reason',name:'Reasoning',desc:'Each claim is supported with a reason or concrete example; no leaps.'},{id:'prose',name:'Clarity and control',desc:'Organized paragraphs, precise words, clean sentences, a real conclusion.'}],
checklist:['Position in the first two sentences.','At least two perspectives from the prompt engaged by name.','The best counterargument stated fairly, then answered.','One concrete example or mechanism per body paragraph.','No new arguments in the conclusion.','Proofread for one full minute.'],
prewrite:['What exactly is the question you must answer?','Which perspective is closest to your view, and where do you part ways with it?','What is the strongest argument against your view?','What concrete example or mechanism will you use?','Outline: position, reason 1, reason 2, counterargument and reply, close.'],
prompts:[
{id:'W01',title:'Public sculpture and public money',scenario:'A mid-sized city sets aside one percent of the cost of new public buildings for public art. A councilmember proposes redirecting that money to maintenance of existing parks, arguing residents value working fountains over new sculptures.',task:'Write an argumentative essay taking a position on whether cities should dedicate a fixed share of construction budgets to public art.',criteria:['Perspective 1: Public art is infrastructure for civic identity; a fixed share protects it from being cut every lean year.','Perspective 2: Fixed set-asides are rigid; spending should follow what residents actually use and ask for.','Perspective 3: The share is fine, but the money should fund maintenance of existing works and community-chosen art rather than prestige commissions.'],
 model:'Cities should keep a fixed share for public art, but with a rule that a portion of it maintains what the city already owns. The set-aside exists because art is the first thing cut and the last thing restored; without a floor, a lean year becomes a lean decade.\n\nThe second perspective is right that spending should follow use, and wrong about what use means. Residents do not "use" a sculpture the way they use a fountain, yet public art shapes where people gather and how a neighborhood is described. Those effects do not show up in a maintenance request, which is exactly why a budget built only on requests will never fund them.\n\nThe strongest objection is opportunity cost: every dollar on a new commission is a dollar not spent on a broken fountain. That objection is why the third perspective matters. A share that pays to keep existing works and park features in repair answers the complaint without abandoning the principle. The councilmember’s fountains could be repaired from the art budget if they are part of the city’s public art, and many are.\n\nThe fixed share should stay, and it should be split: maintenance first, new work second, with residents choosing the new work. That keeps the floor that protects art while making it accountable to the people who live with it.'},
{id:'W02',title:'Banning phones in high schools',scenario:'A school district is considering a rule requiring students to lock phones in pouches from the first bell to the last. Teachers report fewer distractions in pilot schools; some parents object that they cannot reach their children in emergencies.',task:'Take a position on whether high schools should require phones to be locked away during the school day.',criteria:['Perspective 1: Attention is the scarce resource in schools; removing the device is simpler and fairer than policing its use.','Perspective 2: Students must learn to manage technology; bans postpone a skill they will need.','Perspective 3: A ban is acceptable only with a reliable way for families to reach students.']},
{id:'W03',title:'Open-plan offices',scenario:'A growing firm must choose a layout for its new floor. Leadership favors an open plan to encourage collaboration; several employees argue that quiet, enclosed space produces better work.',task:'Take a position on whether knowledge workplaces should default to open-plan layouts.',criteria:['Perspective 1: Open plans speed informal communication and flatten hierarchy.','Perspective 2: Deep work requires quiet; open plans trade output for the appearance of collaboration.','Perspective 3: The answer depends on the work; layouts should mix zones rather than pick one model.']},
{id:'W04',title:'Lotteries for selective admissions',scenario:'A competitive public high school receives four applicants per seat. A board member proposes admitting by lottery among all applicants who meet a minimum standard, instead of ranking by exam scores.',task:'Take a position on whether selective public schools should admit by lottery above a qualifying threshold.',criteria:['Perspective 1: Above a threshold, small score differences are noise; a lottery is more honest about that.','Perspective 2: Ranking rewards effort and preparation; a lottery tells students effort past the line does not matter.','Perspective 3: Lotteries are fairer but should be weighted to protect access for students from under-resourced schools.']},
{id:'W05',title:'Paying organ donors',scenario:'Waiting lists for kidney transplants are long and many patients die waiting. Some economists propose a regulated system that compensates living donors; critics warn of exploitation.',task:'Take a position on whether governments should compensate living kidney donors.',criteria:['Perspective 1: Compensation would save lives and recognizes a real sacrifice.','Perspective 2: Payment pressures the poor into risky surgery and commodifies the body.','Perspective 3: Non-cash compensation, such as insurance and tax credits, captures the benefits with fewer risks.']},
{id:'W06',title:'Four-day school weeks',scenario:'A rural district with a budget shortfall is weighing a four-day school week with longer days. Supporters cite savings and teacher recruitment; opponents cite childcare burdens and learning loss.',task:'Take a position on whether struggling districts should adopt four-day school weeks.',criteria:['Perspective 1: It saves money and helps recruit teachers in places that cannot compete on salary.','Perspective 2: It shifts costs to families and reduces instruction for the students who need it most.','Perspective 3: It can work only with a funded fifth-day program for families who need it.']},
{id:'W07',title:'Algorithmic sentencing tools',scenario:'A state is considering requiring judges to consult a risk-assessment algorithm before sentencing. Supporters say it reduces inconsistency between judges; critics say it embeds historical bias and is hard to challenge.',task:'Take a position on whether judges should be required to consult algorithmic risk assessments at sentencing.',criteria:['Perspective 1: Human judgment is inconsistent; a common tool makes outcomes more predictable and fair.','Perspective 2: Tools trained on past decisions reproduce past bias with a veneer of objectivity.','Perspective 3: Tools are acceptable only if their methods are open to challenge by the defense.']},
{id:'W08',title:'Historic preservation and housing',scenario:'A neighborhood with many older buildings seeks a historic district designation that would limit demolition and new construction. Housing advocates argue the city needs more homes near transit.',task:'Take a position on whether cities should grant historic designations in neighborhoods near transit when housing is scarce.',criteria:['Perspective 1: Old buildings carry character and history that cannot be rebuilt once lost.','Perspective 2: Designation freezes neighborhoods for current owners and pushes newcomers farther out.','Perspective 3: Protect the most significant buildings, and allow added density elsewhere in the district.']}]};

CURR.immersion=[
{id:'IM01',title:'Fidelity in translation',text:'Theorists of translation once asked whether a version should be faithful to the letter or to the spirit of its source, as though the two could be separated cleanly. The question now looks less like a choice than a confession: every translation reveals what its maker believed the original was for. A translator who preserves an archaic syntax at the cost of fluency has decided that strangeness is part of the work’s meaning; one who smooths it has decided that the work’s first readers did not experience it as strange. Neither decision is neutral, and neither is a failure. What deserves criticism is the translation that claims to have made no decision at all.',para:'The old letter versus spirit debate is better understood as each translator revealing a view of what the original is for. Preserving strangeness and smoothing it are both legitimate choices; the real fault is pretending no choice was made.',qs:[{stem:'The author would most likely criticize a translator who',options:['preserves archaic syntax at the cost of fluency','smooths a difficult text for modern readers','presents a translation as a neutral transfer of meaning','writes a preface explaining the choices made'],answer:2,explain:'The last sentence: the fault is the translation that claims to have made no decision. Choices A and B are presented as legitimate decisions.'},{stem:'The author’s attitude toward the letter versus spirit debate is best described as',options:['dismissive of both sides as trivial','persuaded that the spirit should prevail','convinced that the debate misdescribes what translators do','uncertain whether translation is possible'],answer:2,explain:'"Less like a choice than a confession": the author reframes the debate rather than taking a side. A is too strong; the author treats both choices as serious.'}]},
{id:'IM02',title:'The museum frame',text:'A ceremonial mask placed behind glass acquires a property it never had in use: it becomes something to be looked at. Critics of the museum have treated this as a loss, a conversion of living objects into specimens. The charge is partly right, but it assumes that the object’s original meaning was fixed and recoverable. Many such objects were made to change meaning across occasions, worn in one ceremony and reinterpreted in the next. The museum does not end that history so much as add one more occasion to it, though it is an occasion the makers did not choose.',para:'Displaying an object makes it something to look at, which critics call a loss. The author partly agrees but argues the objection assumes a fixed original meaning, when such objects often changed meaning; the museum adds another reinterpretation, albeit one the makers did not choose.',qs:[{stem:'Which best states the author’s position on the critics?',options:['They are entirely mistaken about museums.','They are partly right but rely on a questionable assumption.','They are right that museums should return objects.','They overstate how many objects are displayed.'],answer:1,explain:'"The charge is partly right, but it assumes...": a qualified response. A is a valence flip; C is out of scope.'},{stem:'The final clause ("an occasion the makers did not choose") functions to',options:['concede a cost of display that the author’s reframing does not erase','prove that museums should not display ceremonial objects','show that the makers approved of museums','introduce a new topic unrelated to the critics'],answer:0,explain:'It keeps the tension: the museum continues the object’s history, yet without the makers’ consent. Collapsing that tension in either direction (B) is the trap.'}]},
{id:'IM03',title:'Silence in music',text:'It is tempting to describe the rests in a piece of music as gaps, places where the music stops. Performers know otherwise. A rest is timed, shaped by what precedes it, and heard as a held expectation of what follows; a badly judged rest can ruin a phrase as surely as a wrong note. Yet to say that silence is therefore "part of the music" in the same way as sound risks a different error. Sound can be heard in isolation; a rest cannot. Its meaning is entirely borrowed from its neighbors, which is precisely what makes it so difficult to perform.',para:'Rests are not mere gaps; they are timed and shaped and can ruin a phrase. But silence is not musical in the same way as sound, since a rest has no meaning on its own and borrows it from surrounding notes, which is why it is hard to perform.',qs:[{stem:'The passage is primarily concerned with',options:['arguing that silence is the most important element of music','qualifying two opposing ways of describing musical rests','explaining why performers dislike rests','showing that rests can be heard in isolation'],answer:1,explain:'The author rejects "gaps" and also limits "part of the music in the same way": a both/and position. A promotes one side; D contradicts the text.'},{stem:'According to the passage, rests are difficult to perform because',options:['they are rarely notated precisely','their meaning depends entirely on the surrounding sound','audiences cannot hear them','they occur only at the ends of phrases'],answer:1,explain:'The last sentence: meaning "entirely borrowed from its neighbors" is what makes them difficult.'}]},
{id:'IM04',title:'Precedent and memory',text:'Common-law judges are said to follow precedent, but the metaphor of following misleads. A court that cites an earlier decision must first decide what that decision stood for, and earlier opinions rarely announce their holdings in terms precise enough to settle later disputes. The act of following is therefore also an act of reading, and reading is never passive. This does not make precedent arbitrary. The range of plausible readings is limited by the earlier court’s reasoning, and a reading that ignores that reasoning is quickly exposed as a departure rather than an application.',para:'Following precedent requires interpreting what earlier cases held, since holdings are rarely precise, so it is active reading. Still, precedent is not arbitrary: earlier reasoning limits plausible readings, and readings that ignore it are recognizable as departures.',qs:[{stem:'The author would most likely agree that',options:['precedent places no real constraint on judges','applying precedent involves interpretation within limits','earlier courts always state holdings precisely','judges should stop citing earlier decisions'],answer:1,explain:'Both halves: reading is active, and readings are limited by prior reasoning. A collapses the tension one way; C contradicts the passage.'},{stem:'The phrase "the metaphor of following misleads" mainly serves to',options:['introduce the author’s claim that applying precedent is interpretive','reject the idea of precedent entirely','criticize particular judges','define the term holding'],answer:0,explain:'It sets up the claim that following is reading. B is the reversed scope trap: the author criticizes a metaphor, not precedent.'}]}];

CURR.facts={confirm:'Verified against LSAC pages in November 2026. Formats and dates change; confirm on lsac.org and the LSAC calendar before you rely on anything here.',sections:[
{t:'Current format (through the June 2027 test)',items:['Four 35-minute multiple-choice sections: two Logical Reasoning, one Reading Comprehension, and one unscored variable section (LR or RC) that looks identical to the scored ones.','A 10-minute intermission between the second and third sections.','No logic games: Analytical Reasoning was removed in 2024.','Scores run from 120 to 180. There is no penalty for wrong answers.']},
{t:'New format (from the August 2027 test)',items:['Reading Comprehension comes first: 52 minutes, 6 passages, 40 questions, of which 4 passages and 27 questions are scored.','Then two Logical Reasoning sections: 45 minutes and 32 questions each, 25 scored and 7 unscored.','A 10-minute break after the first section and another after the second.','Unscored questions are embedded and you will not be told which they are.','Question types, the number of scored questions, average time per question (about 78 seconds RC, 84 seconds LR) and the meaning of 120 to 180 scores do not change.','LSAC plans new-format practice tests in LawHub in February 2027. Testing in June 2027 or earlier uses the current format.']},
{t:'LSAT Argumentative Writing',items:['Unscored, but required before your score is released, and sent to the schools you apply to.','Taken online and proctored, separately from the multiple-choice test, in Chrome on a desktop or laptop.','15 minutes of prewriting analysis (you may move on after five), then 35 minutes to write. No word limit.']},
{t:'Scoring',items:['Raw score is the number of scored questions you answer correctly; each test has its own conversion to the 120 to 180 scale.','Near the top of the scale each miss tends to cost a point or more. Use each official PrepTest’s own table when you log it.']}]};

CURR.help=[
{t:'The daily loop',p:['Start every day with a **Daily Climb** from Base Camp: a warm-up of spaced-repetition cards and a logic flash, an adaptive Main Quest weighted 70% to your weakest skills, a Timed Trial on standard and deep days, an Autopsy of every miss and shaky answer, a one-minute Reflection, and a rewards screen.','A 20-minute climb always keeps your streak. Missing a day never deletes progress. Streak Freezes (earned every seven days, two stored) cover gaps automatically.']},
{t:'Blind Review and the Conversion Gap',p:['In untimed and timed sets you get no feedback until the end. Then every question you flagged, rated below Sure, or missed comes back for a re-attempt without the clock, still without the answer. Only then do explanations appear.','The difference between your Blind Review score and your timed score is the **Conversion Gap**. A large gap means you understand more than you can do under time.']},
{t:'Saving',p:['Every answer autosaves in this browser, and the status chip at top right says so.','Use **Export Save** in Preferences weekly. It produces one JSON file with everything, including imported packs. **Import Save** restores it anywhere.','The **Progress Ledger** in Reports is a plain-text summary you can paste into any AI chat.']},
{t:'Packs',p:['The engine ships with a starter pack. More arrives as JSON packs: ask an AI assistant for the next one (the Library has a ready-made request), paste it into Import Pack, and it joins the adaptive pool immediately.']},
{t:'Honest limits',p:['Every question here is original and was checked for a single defensible answer, but AI-written questions can still contain subtle flaws a human editor would catch. Every question has a **Report Flaw** button. Reported items are quarantined, excluded from scoring, and listed under Flagged items in the Library.','Official PrepTests on LawHub are the benchmark. This game builds skills and habits; it does not replace official practice, and no projection here is a promise of a score.']}];

const PACK01={"pack": "pack-01-core-starter", "title": "Pack 01A: Core Starter", "schema_version": 1, "questions": [{"id": "LR-WK-001", "section": "LR", "type": "Weaken", "subtype": "causal", "difficulty": 2, "target_seconds": 75, "tags": ["causal", "rate-vs-total"], "stimulus": "In the two years since the city of Marlow installed protected bike lanes on Grand Avenue, the number of cyclist injuries reported on that avenue has dropped by 40 percent. City planners concluded that the protected lanes made cycling on Grand Avenue safer.", "stem": "Which one of the following, if true, most seriously weakens the planners' conclusion?", "choices": {"A": "The protected lanes on Grand Avenue cost more per mile to build than comparable lanes in neighboring cities.", "B": "Some cyclists on Grand Avenue still ride outside the protected lanes.", "C": "During the same two years, the number of people cycling on Grand Avenue fell by more than half after a nearby bridge closed for repairs.", "D": "Cyclist injuries also declined slightly on several avenues that have no protected lanes.", "E": "Several cycling advocacy groups lobbied the city to build the protected lanes."}, "answer": "C", "explanation": {"argument_skeleton": "Premise: injuries on Grand Avenue fell 40% after the lanes went in. Conclusion: the lanes made cycling there safer. Gap: the drop in injuries reflects a lower risk per cyclist, not fewer cyclists.", "why_correct": "Safety is risk per rider. If ridership fell by more than half, a 40% drop in total injuries could mean each cyclist faces the same or higher risk. C explains the evidence without the lanes making anyone safer.", "why_wrong": {"A": {"trap": "IRRELEVANT_COMPARISON", "text": "Cost compared with other cities says nothing about whether the lanes reduced risk."}, "B": {"trap": "ADJACENT_DOUBT", "text": "A few riders outside the lanes is an exception; it does not explain the 40% drop."}, "D": {"trap": "REVERSAL", "text": "A slight decline elsewhere against a 40% drop here suggests the lanes did something extra. If anything it supports the planners."}, "E": {"trap": "OUT_OF_SCOPE", "text": "Who lobbied for the lanes has no bearing on their effect."}}, "method_reminder": "When the evidence is a total, ask whether the number of people exposed changed. Totals are not rates.", "flashcard": {"front": "Injuries fell 40% after a safety change. Strongest attack?", "back": "Show exposure fell: fewer riders, fewer trips. A falling total can hide a rising rate."}}, "original": true}, {"id": "LR-WK-002", "section": "LR", "type": "Weaken", "subtype": "plan", "difficulty": 3, "target_seconds": 85, "tags": ["plan", "business"], "stimulus": "Velora Foods plans to cut its total distribution costs by closing its three regional warehouses and replacing them with a single large warehouse near the center of its sales territory. Because a single warehouse requires fewer staff and less duplicated inventory than three, the company's analysts predict that the change will lower Velora's total distribution costs.", "stem": "Which one of the following, if true, most seriously weakens the analysts' prediction?", "choices": {"A": "A single large warehouse can be equipped with automated sorting systems that the smaller regional warehouses could not afford.", "B": "Velora's main competitor operates five regional warehouses.", "C": "Construction of the new central warehouse is expected to take eighteen months.", "D": "Some of the staff at the regional warehouses would be offered jobs at the new warehouse.", "E": "Fuel and driver wages account for most of Velora's distribution costs, and delivering from the central site would roughly double the average length of each delivery route."}, "answer": "E", "explanation": {"argument_skeleton": "Premise: one warehouse needs fewer staff and less duplicate inventory. Conclusion: total distribution costs will fall. Gap: no other distribution cost rises enough to cancel those savings.", "why_correct": "The plan saves on warehousing but may raise transport. If transport is most of the cost and route lengths double, total costs could rise. E attacks the plan's goal directly.", "why_wrong": {"A": {"trap": "REVERSAL", "text": "Automation is another saving, so it supports the prediction."}, "B": {"trap": "IRRELEVANT_COMPARISON", "text": "A competitor's setup says nothing about Velora's costs under the plan."}, "C": {"trap": "OUT_OF_SCOPE", "text": "Construction time affects when savings arrive, not whether total costs fall."}, "D": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Rehiring some staff still leaves fewer staff overall; the staffing saving stands."}}, "method_reminder": "For plans, look for a cost the plan increases that the argument never counted.", "flashcard": {"front": "Plan saves cost X. How do you weaken 'total costs will fall'?", "back": "Find a cost the plan raises (Y) that is as large as the savings on X."}}, "original": true}, {"id": "LR-WK-003", "section": "LR", "type": "Weaken", "subtype": "reverse-causation", "difficulty": 4, "target_seconds": 95, "tags": ["causal", "reverse-causation", "workplace"], "stimulus": "A survey of employees at forty companies that have on-site gyms found that employees who regularly used the gyms reported much higher job satisfaction than employees who did not. A consultant concluded that using an on-site gym increases employees' job satisfaction and recommended that firms seeking more satisfied workforces install on-site gyms.", "stem": "Which one of the following, if true, most seriously weakens the consultant's reasoning?", "choices": {"A": "Employees who are dissatisfied with their jobs typically report working longer hours and having less free time during the workday.", "B": "Some employees who never used the on-site gym also reported high job satisfaction.", "C": "On-site gyms are more expensive for firms to maintain than subsidized memberships at outside gyms.", "D": "Many employees who use on-site gyms also exercise on weekends.", "E": "Regular exercise has been shown in many studies to improve mood."}, "answer": "A", "explanation": {"argument_skeleton": "Premise: gym users report higher satisfaction than non-users. Conclusion: gym use raises satisfaction. Gap: satisfaction (or what drives it) is not what determines who uses the gym.", "why_correct": "A runs the arrow the other way: dissatisfied employees are the overworked ones with no time for the gym. Low satisfaction and long hours produce non-use, so the correlation does not show the gym causes anything. Hierarchy Level 2.", "why_wrong": {"B": {"trap": "TOO_WEAK", "text": "An exception. The claim is about a tendency, which survives individual counterexamples."}, "C": {"trap": "IRRELEVANT_COMPARISON", "text": "Relative cost of gym options says nothing about whether gym use raises satisfaction."}, "D": {"trap": "OUT_OF_SCOPE", "text": "Weekend habits of gym users do not bear on the causal link."}, "E": {"trap": "REVERSAL", "text": "A mechanism linking exercise to mood supports the consultant."}}, "method_reminder": "In every correlation, ask: could the 'effect' be producing the 'cause'?", "flashcard": {"front": "Gym users are more satisfied, so gyms raise satisfaction. Best weakener type?", "back": "Reverse causation: dissatisfied, overworked people lack time for the gym. Level 2 on the Weakener Hierarchy."}}, "original": true}, {"id": "LR-WK-004", "section": "LR", "type": "Weaken", "subtype": "sampling", "difficulty": 3, "target_seconds": 85, "tags": ["sampling", "survey", "urban"], "stimulus": "To learn whether residents of Fairhaven support building a new public library, the town council posted an online poll on the current library's website. Of the 1,200 people who responded, 85 percent favored the new building. The council concluded that a large majority of Fairhaven residents support the project.", "stem": "Which one of the following, if true, most seriously weakens the council's conclusion?", "choices": {"A": "Fairhaven has a population of about 30,000.", "B": "The proposed library would include a larger children's section.", "C": "The poll remained open for two weeks rather than one month.", "D": "Residents who visit the current library's website are far more likely than other residents to use library services frequently.", "E": "A similar poll in a neighboring town found only 50 percent support for a new library there."}, "answer": "D", "explanation": {"argument_skeleton": "Premise: 85% of 1,200 website respondents favor the library. Conclusion: a large majority of residents do. Gap: the respondents represent residents generally.", "why_correct": "D shows the sample was drawn from heavy library users, the group most likely to want a new library. The sample is not representative, so it cannot speak for all residents.", "why_wrong": {"A": {"trap": "TRUE_BUT_IRRELEVANT", "text": "1,200 of 30,000 is a large enough sample if it is representative. Size is not the problem."}, "B": {"trap": "OUT_OF_SCOPE", "text": "Features of the building do not bear on whether the poll reflects residents' views."}, "C": {"trap": "TRUE_BUT_IRRELEVANT", "text": "A two-week window gives no reason to think respondents differ from residents."}, "E": {"trap": "IRRELEVANT_COMPARISON", "text": "Another town's opinion says nothing about Fairhaven's."}}, "method_reminder": "For surveys, ask who could answer. Self-selected samples lean toward the people who care most.", "flashcard": {"front": "Poll posted on the library's website. Problem?", "back": "Self-selected, unrepresentative sample: library users answer, and they favor the library."}}, "original": true}, {"id": "LR-WK-005", "section": "LR", "type": "Weaken", "subtype": "alternative-explanation", "difficulty": 3, "target_seconds": 85, "tags": ["archaeology", "alternative-explanation"], "stimulus": "Archaeologist: The pottery fragments found at the hillside site are decorated with the same spiral motif found on pottery from the coastal settlement thirty kilometers away. So the hillside site must have been occupied by people who came from the coastal settlement.", "stem": "Which one of the following, if true, most seriously weakens the archaeologist's argument?", "choices": {"A": "The hillside site is at a much higher elevation than the coastal settlement.", "B": "Pottery bearing the spiral motif was traded widely throughout the region during the period in question.", "C": "Potters at the coastal settlement usually worked with clay from nearby riverbanks.", "D": "Some fragments at the hillside site bear no decoration at all.", "E": "Spiral motifs are among the oldest decorative patterns known."}, "answer": "B", "explanation": {"argument_skeleton": "Premise: hillside pottery shares the coastal spiral motif. Conclusion: the hillside people came from the coast. Gap: shared pottery style indicates shared origin rather than some other link.", "why_correct": "If motif pottery was widely traded, the hillside people could have acquired it without coming from the coast. B offers an alternative explanation for the evidence. Level 3.", "why_wrong": {"A": {"trap": "OUT_OF_SCOPE", "text": "Elevation has nothing to do with where the occupants came from."}, "C": {"trap": "TRUE_BUT_IRRELEVANT", "text": "Without information about the hillside clay, this neither helps nor hurts."}, "D": {"trap": "ADJACENT_DOUBT", "text": "Undecorated pieces are an exception; the decorated ones still need explaining."}, "E": {"trap": "OUT_OF_SCOPE", "text": "The age of the motif in general does not bear on these two sites."}}, "method_reminder": "Shared feature does not mean shared origin. Look for another route the feature could travel.", "flashcard": {"front": "Same artifact style at two sites, so same people. Best attack?", "back": "An alternative explanation: trade, copying, or a common outside source spread the style."}}, "original": true}, {"id": "LR-WK-006", "section": "LR", "type": "Weaken", "subtype": "comparison-group", "difficulty": 4, "target_seconds":
