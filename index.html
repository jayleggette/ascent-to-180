/* ================= expedition layer: scene sync, pitches, debriefs, caches, outfitter ================= */
const CRUX={weaken:['The Correlation Wall','an alternative cause for the same effect'],strengthen:['The Hollow Pillar','evidence that closes off the alternatives'],inference:['The Knife Edge','only what the text forces'],flaw:['The Gap','naming the gap before you read the choices'],na:['The Keystone','the negation test'],sa:['The Bridge','a premise that makes the conclusion certain'],conclusion:['The False Summit','the claim every other sentence supports'],role:['The Traverse','labeling each sentence by its job'],method:['The Slab','describing moves, not content'],evaluate:['The Balance Ridge','a question whose answer cuts both ways'],parallel:['The Twin Spires','matching structure, not topic'],principle:['The Ledge of Rules','the rule that covers every element'],paradox:['The Serac','a fact that lets both claims be true'],dispute:['The Col','the one point both speakers address'],except:['The Inverted Step','flipping the task before the choices']};
const RANKS=[[1,'Trailhead'],[3,'Trekker'],[5,'Scrambler'],[8,'Rope Second'],[12,'Rope Leader'],[16,'Alpinist'],[21,'Mountaineer'],[27,'High-Altitude Climber'],[34,'Summiteer'],[42,'Expedition Leader'],[50,'Seven Summits']];
function rankOf(lv){let r=RANKS[0][1];for(const[l,n]of RANKS)if(lv>=l)r=n;return r}
const CAMPS=[[120,'Base Camp'],[150,'Camp I'],[160,'Camp II'],[168,'Camp III'],[174,'Camp IV'],[180,'Summit']];
const metersOf=sc=>Math.round(400+(clamp(sc,120,180)-120)*(8449/60));
const fmtM=m=>Math.round(m).toLocaleString('en-US')+' m';
const LAMPS={ember:['Ember headlamp','Warm gold, the default trail light.',[1.0,0.72,0.32],0],white:['LED white','Clean, cold and bright.',[0.92,0.94,1.0],90],glacier:['Glacier blue','The color of deep ice.',[0.45,0.8,1.0],120],aurora:['Aurora green','Polar green light on the snow.',[0.4,1.0,0.68],160],crimson:['Signal flare','Rescue red, visible from the valley.',[1.0,0.36,0.34],160],violet:['Ultraviolet','A night-climber violet.',[0.76,0.52,1.0],200]};
const SKIES={none:['Clear sky','The sky as it is.',0],snow:['Snowfall','Light snow drifts across the range.',220],meteors:['Meteor shower','Shooting stars on dark nights.',300],aurora:['Aurora','Northern lights over the range at night.',400]};
function G(){return S.game}
function expE(){const pr=projection();if(pr.mid!=null)return clamp((pr.mid-120)/60,0,1);return Math.min(0.2,0.03+A.length/2000)}
function towerFloors(id){const ts=towerState(id);const r=x=>x&&x.n?x.c/x.n>=.6:false;return[ts.lesson,!!ts.f2,r(ts.f3),r(ts.f4),!!(ts.f5&&ts.f5.passed)].filter(Boolean).length}
function nextCrux(){const types=lrTypesAvail();const w=types.sort((a,b)=>mastery(a)-mastery(b))[0];const tw=CURR.towers||[];return tw.find(x=>(x.types||[]).includes(w)&&!towerState(x.id).cleared)||tw.find(x=>!towerState(x.id).cleared)||tw[0]}
function cruxOf(id){return CRUX[id]||['The Crux','reading the task before the choices']}

/* ---------- scene sync ---------- */
function skyHour(){const k=S.settings.sky;return{dawn:6.95,day:11.5,dusk:17.15,night:22.5}[k]==null?null:{dawn:6.95,day:11.5,dusk:17.15,night:22.5}[k]}
let lastSceneKey='';
function sceneSync(){if(typeof SCENE==='undefined'||SCENE.failed)return;const s=S.settings,g=G();
  const home=VIEW.name==='home'&&S.profile.onboarded;const lamp=(LAMPS[g.equip.lamp]||LAMPS.ember)[2];const sky=g.equip.sky;
  const key=[s.sky,g.equip.lamp,sky,s.quality].join('|');if(key!==lastSceneKey){lastSceneKey=key;SCENE.configure({hour:skyHour(),lamp,aurora:sky==='aurora'?1:0,meteor:sky==='meteors'?1:0,snow:sky==='snow'?0.75:0});SCENE.setQuality(s.quality||'auto')}
  const mode=s.scene==='off'?'off':(home&&s.scene==='live'&&!reducedMotion()?'live':'still');if(VIEW.name==='play'&&SCENE.info().mode!=='off'&&s.scene!=='off'){SCENE.freeze()}else SCENE.setMode(mode);
  document.documentElement.classList.toggle('veiled',!home);document.documentElement.classList.toggle('deepveil',VIEW.name==='play');
  const e=expE();const prev=g.lastE;const climb=home&&prev!=null&&e-prev>0.004;SCENE.setProgress(e,climb||(home&&prev!=null&&Math.abs(prev-e)>0.004));
  if(climb)setTimeout(()=>toast('You climbed '+fmtM(metersOf(120+e*60)-metersOf(120+prev*60))+' since your last visit.','gold'),900);
  if(home&&prev!==e){g.lastE=e;saveSoon()}}

/* ---------- trail markers over the live scene ---------- */
let unMarks=null;
function marksHTML(){const pr=projection();const fl=S.profile.floor||172;const e=expE();const cur=pr.mid!=null?pr.mid:120+e*60;
  const nextCamp=CAMPS.find(c=>c[0]>cur);const out=CAMPS.map(([sc,n])=>({s:(sc-120)/60,label:n,sub:fmtM(metersOf(sc))+', LSAT '+sc,cls:'cmp'+((sc===120||sc===180||(nextCamp&&nextCamp[0]===sc))?' named':'')}));
  if(fl>120&&fl<180)out.push({s:(fl-120)/60,label:'Your floor',sub:'LSAT '+fl,cls:'floor named'});
  out.push({s:e,label:pr.mid==null?'You are here':'You',sub:pr.mid==null?'Altitude unmapped':fmtM(metersOf(pr.mid)),cls:'you named'});
  return out.map(m=>`<div class="mk ${m.cls}" data-s="${m.s.toFixed(4)}"><i></i><span><b>${esc(m.label)}</b><small>${esc(m.sub)}</small></span></div>`).join('')}
function occluded(P){const c=SCENE.camera();const ro=c.ro;for(let i=1;i<24;i++){const k=i/24*0.86;const x=ro[0]+(P[0]-ro[0])*k,y=ro[1]+(P[1]-ro[1])*k,z=ro[2]+(P[2]-ro[2])*k;if(SCENE.height(x,z)>y+0.06)return true}return false}
function mountMarks(){if(unMarks){unMarks();unMarks=null}const box=$('#marks');if(!box)return;if(typeof SCENE==='undefined'||SCENE.failed||S.settings.scene==='off'){box.hidden=true;return}
  const els=[...box.querySelectorAll('.mk')];let tick=0,occ=els.map(()=>false);
  const place=()=>{if(!box.isConnected){if(unMarks){unMarks();unMarks=null}return}tick++;
    els.forEach((el,i)=>{const P=SCENE.trailPoint(+el.dataset.s);const p=SCENE.project(P);if(!p||p.x<-40||p.x>innerWidth+40||p.y<-40||p.y>innerHeight+40){el.style.opacity=0;return}
      if(tick%12===1)occ[i]=el.classList.contains('you')?false:occluded(P);el.style.transform=`translate3d(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px,0)`;el.style.opacity=occ[i]?0.25:1})};
  unMarks=SCENE.onFrame(place);setTimeout(place,60)}

/* ---------- pitch strip in the player ---------- */
function liveSet(set){return set.mode==='guided'||set.mode==='speed'||!!set.trap}
function cruxNameForSet(set){const s=SES();const tid=s&&s.meta&&s.meta.tower;if(set.mode==='boss'&&tid)return'Crux: '+cruxOf(tid)[0];return set.label}
function stripHTML(set){if(S.settings.focus||set.mode==='sim'||set.phase!=='answer')return'';const n=set.items.length;if(n<2)return'';const need=Math.ceil(n*0.7);const live=liveSet(set);const g=set.g||{mom:0,o2:5};
  const answered=set.items.filter(id=>(set.ans[id]||{}).ch).length;const correct=set.items.filter(id=>{const a=set.ans[id];return a&&a.checked&&a.ok}).length;const prog=live?correct/n:answered/n;
  return`<div class="pitch" id="pitch"><div class="pname">${icon(set.mode==='boss'?'swords':'mountain',16)}<b>${esc(cruxNameForSet(set))}</b><small>${live?`${correct} of ${need} holds to send`:`Blind pitch, ${answered} of ${n} answered. Results at the top.`}</small></div>
  <div class="pbar2" title="${live?'Send line at '+need+' correct':'Rope paid out'}"><i style="width:${(prog*100).toFixed(1)}%"></i>${live?`<em style="left:${(need/n*100).toFixed(1)}%"></em>`:''}</div>
  <div class="o2" title="Oxygen. Each slip costs one bottle.">${live?`<span>O₂</span>${[0,1,2,3,4].map(i=>`<b class="${i<g.o2?'on':''}"></b>`).join('')}`:'<span class="muted">O₂ readings after the pitch</span>'}</div>${live&&g.mom>=2?`<div class="mom">${icon('zap',14)}Momentum ×${g.mom}</div>`:''}</div>`}
function onCheck(set,q,a,ok){const g=set.g||(set.g={mom:0,o2:5,best:0});if(ok){g.mom++;g.best=Math.max(g.best,g.mom);G().bestMom=Math.max(G().bestMom||0,g.best);G().grit+=2+((q.difficulty||3)>=4?1:0);floatAt('#choices','+'+(30+(q.difficulty||3)*12)+' m','up');if(g.mom>=3&&g.mom%3===0)sfx('send')}
  else{g.mom=0;g.o2=Math.max(0,g.o2-1);const t=trapOf(q,a.ch);slipFx(t?trapName(t):'')}}
function floatAt(sel,text,cls){if(reducedMotion())return;const el=$(sel);const fx=$('#fxl');if(!el||!fx)return;const r=el.getBoundingClientRect();const d=document.createElement('div');d.className='floater '+(cls||'');d.textContent=text;d.style.left=(r.left+r.width*0.62)+'px';d.style.top=(r.top+8)+'px';fx.appendChild(d);setTimeout(()=>d.remove(),1500)}
function slipFx(name){const fx=$('#fxl');if(fx&&!reducedMotion()){const v=document.createElement('div');v.className='slipflash';fx.appendChild(v);setTimeout(()=>v.remove(),700)}
  setTimeout(()=>{const p=$('#player');if(p&&!reducedMotion()){p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake')}},30);if(name)toast('Slipped on '+name+'. Read why below.','bad')}

/* ---------- debriefs, level-ups, caches (overlay in #fx) ---------- */
let DQ=[],LVQ=null;
function queueDebrief(set){if(!set||!set.res||set.items.length<3||set.debriefed)return;set.debriefed=1;
  const items=set.items.map(id=>{const q=LIB.Q[id]||{};const a=set.ans[id]||{};const ok=a.ch===q.answer;return{ok,trap:ok||!a.ch?'':trapOf(q,a.ch),blank:!a.ch,d:q.difficulty||3}});
  const n=items.length,c=items.filter(x=>x.ok).length,need=Math.ceil(n*0.7);const s=SES();const tid=s&&s.meta&&s.meta.tower;const boss=set.mode==='boss'&&!!tid;
  let g=liveSet(set)?0:items.reduce((t,x)=>t+(x.ok?2+(x.d>=4?1:0):0),0);const sent=c>=need;if(sent)g+=boss?40:10;const conv=Math.max(0,(set.res.cb||0)-(set.res.c||0));g+=conv*3;
  const gg=G();gg.grit+=g;if(sent)gg.sent=(gg.sent||0)+1;if(boss&&sent)gg.cruxSent[tid]=now();
  DQ.push({label:boss?'Crux: '+cruxOf(tid)[0]:set.label,items,n,c,need,sent,boss,grit:g,conv,sim:set.mode==='sim',live:liveSet(set)});saveSoon()}
function levelUpQueued(lv){LVQ=lv}
function fxBusy(){const set=curSet();return VIEW.name==='play'&&set&&set.phase==='answer'}
function afterRenderFx(){if(fxOpen||fxBusy())return;if(DQ.length){showDebrief(DQ.shift());return}if(LVQ){const lv=LVQ;LVQ=null;showLevel(lv)}}
let fxOpen=false,fxTimers=[];
function showFx(html,cls){const w=$('#fx');if(!w)return;fxTimers.forEach(clearTimeout);fxTimers=[];w.innerHTML=`<div class="fxwrap ${cls||''}" data-a="fxBg"><div class="fxcard" role="dialog" aria-modal="true">${html}</div></div>`;fxOpen=true;const b=w.querySelector('[data-autofocus]')||w.querySelector('button');if(b)setTimeout(()=>b.focus(),30)}
function closeFx(){const w=$('#fx');if(w)w.innerHTML='';fxOpen=false;fxTimers.forEach(clearTimeout);fxTimers=[];setTimeout(afterRenderFx,120)}
ACT.fxClose=()=>closeFx();ACT.fxBg=(v,el,e)=>{if(e.target===el)closeFx()};
document.addEventListener('keydown',e=>{if(!fxOpen)return;if(e.key==='Escape'||e.key==='Enter'||e.key==='n'||e.key==='N'){e.preventDefault();e.stopImmediatePropagation();closeFx()}},true);
function profileSVG(d){const W=560,H=150,pad=18;const n=d.items.length;let y=0;const pts=[[pad,H-pad]];const max=Math.max(d.need,d.c,1);const sx=(W-2*pad)/n,sy=(H-2*pad-14)/max;
  d.items.forEach((it,i)=>{if(it.ok)y++;pts.push([pad+(i+1)*sx,H-pad-y*sy])});const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const line=H-pad-d.need*sy;
  const holds=d.items.map((it,i)=>{const p=pts[i+1];return`<g class="hold ${it.ok?'ok':'bad'}" style="--i:${i}"><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${it.ok?4.5:5}"/>${it.ok?'':`<path d="M${(p[0]-3).toFixed(1)} ${(p[1]-3).toFixed(1)}l6 6m0-6l-6 6"/>`}</g>`}).join('');
  return`<svg class="profile" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pitch profile: ${d.c} of ${d.n} correct, ${d.need} needed to send"><line x1="${pad}" x2="${W-pad}" y1="${line.toFixed(1)}" y2="${line.toFixed(1)}" class="sendline"/><text x="${W-pad}" y="${(line-6).toFixed(1)}" text-anchor="end" class="sendlbl">Send line, ${d.need} of ${d.n}</text><path d="${path} L${pts[pts.length-1][0].toFixed(1)} ${H-pad} L${pad} ${H-pad}Z" class="area"/><path d="${path}" class="ridge" pathLength="1"/>${holds}</svg>`}
function showDebrief(d){const slips={};d.items.forEach((it,i)=>{if(!it.ok){const k=it.blank?'Left blank':(it.trap?trapName(it.trap):'Wrong answer');(slips[k]=slips[k]||[]).push(i+1)}});
  const slipList=Object.entries(slips).map(([k,v])=>`<li><b>${esc(k)}</b><span>question${v.length>1?'s':''} ${v.join(', ')}</span></li>`).join('');
  const verdict=d.sent?(d.boss?'Crux sent':'Pitch sent'):(d.c/d.n>=0.5?'Turned back below the send line':'Retreat to camp');
  const sub=d.sent?`${d.c} of ${d.n} holds, ${d.need} needed.`:`${d.c} of ${d.n} holds. ${d.need} sends the pitch.`;
  showFx(`<div class="db"><div class="dbtop"><small>Pitch debrief</small><h2>${esc(d.label)}</h2></div>${profileSVG(d)}
   <div class="dbres ${d.sent?'ok':''}"><div><b class="verdict">${esc(verdict)}</b><span>${esc(sub)}</span></div><div class="grit">${icon('gem',16)}+${d.grit} grit${d.conv?`<small>${d.conv} recovered in Blind Review</small>`:''}</div></div>
   ${slipList?`<div class="slips"><small>Hazards on this pitch</small><ul>${slipList}</ul></div>`:'<div class="slips"><small>No slips. Clean ascent.</small></div>'}
   <div class="row" style="justify-content:flex-end"><button class="btn primary" data-a="fxClose" data-autofocus>Continue <span class="kbd">Enter</span></button></div></div>`,'debrief');
  if(!reducedMotion()){d.items.forEach((it,i)=>fxTimers.push(setTimeout(()=>sfx(it.ok?'step':'slip'),220+i*150)));fxTimers.push(setTimeout(()=>sfx(d.sent?'send':'bad'),260+d.items.length*150))}else sfx(d.sent?'send':'bad')}
function showLevel(lv){const pr=projection();showFx(`<div class="lvup"><div class="rays" aria-hidden="true"></div><small>Level reached</small><div class="lvnum">${lv}</div><h2>${esc(rankOf(lv))}</h2><p>${lv%5===0?'A new rank on the mountain. ':''}${pr.mid!=null?'Current altitude '+fmtM(metersOf(pr.mid))+'.':'Log timed sets to map your altitude.'}</p><button class="btn gold" data-a="fxClose" data-autofocus>Keep climbing</button></div>`,'level');sfx('level')}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function cacheRoll(){const g=25+Math.floor(Math.random()*36);let drop=null;const ow=G().owned;const lampsNot=Object.keys(LAMPS).filter(k=>!ow['lamp_'+k]);const skyNot=Object.keys(SKIES).filter(k=>k!=='none'&&!ow['sky_'+k]);const r=Math.random();if(r<0.12&&lampsNot.length)drop='lamp_'+pick(lampsNot);else if(r<0.17&&skyNot.length)drop='sky_'+pick(skyNot);return{g,drop}}
function itemName(id){const[k,v]=id.split('_');return k==='lamp'?(LAMPS[v]||[v])[0]:(SKIES[v]||[v])[0]}
ACT.openCache=()=>{const s=SES();if(!s||s.cache)return;const r=cacheRoll();s.cache=r;const gg=G();gg.grit+=r.g;gg.caches=(gg.caches||0)+1;if(r.drop)gg.owned[r.drop]=1;saveSoon();sfx('cache');

/* ---------- hazards: how often each trap catches you ---------- */
let HZ=null,HZn=-1;
function hazardStats(){if(HZ&&HZn===A.length)return HZ;HZ={};HZn=A.length;for(const a of A){const q=LIB.Q[a.q];if(!q)continue;const tk=trapKeys(q);for(const t of tk){const h=HZ[t]||(HZ[t]={dodged:0,caught:0});if(a.tr&&a.tr===t)h.caught++;else h.dodged++}}return HZ}
function hazardLine(code){const h=hazardStats()[code];if(!h||!(h.dodged+h.caught))return'<span class="tag">Not met yet</span>';const rate=h.caught/(h.dodged+h.caught);const lvl=rate>=0.3?'bad':rate>=0.15?'gold':'volt';return`<span class="pill ${lvl}">${rate>=0.3?'High threat':rate>=0.15?'Moderate':'Under control'}</span><span class="tag">Dodged ${h.dodged}, caught you ${h.caught}</span>`}
function topHazards(n){const H=hazardStats();return Object.entries(H).filter(([,h])=>h.caught>0).sort((a,b)=>b[1].caught/(b[1].dodged+b[1].caught+2)-a[1].caught/(a[1].dodged+a[1].caught+2)).slice(0,n)}

/* ---------- chart helpers (single accent per series, text in ink tokens) ---------- */
function hbars(rows,o){o=o||{};if(!rows.length)return`<p class="muted">Not enough data yet.</p>`;const W=640,lab=o.lab||190,rh=26,H=rows.length*rh+24;const x=v=>lab+(W-lab-60)*clamp(v,0,o.max||100)/(o.max||100);
  let g='';for(const t of (o.ticks||[0,25,50,75,100]))g+=`<line x1="${x(t)}" x2="${x(t)}" y1="4" y2="${H-18}" stroke="var(--line)"/><text x="${x(t)}" y="${H-4}" text-anchor="middle">${t}${o.unit||''}</text>`;
  const b=rows.map((r,i)=>{const y=8+i*rh;const w=Math.max(2,x(r.v)-lab);return`<g data-tip="${esc(r.tip||r.label+': '+Math.round(r.v)+(o.unit||''))}"><rect x="0" y="${y-4}" width="${W}" height="${rh}" fill="transparent"/><text x="${lab-8}" y="${y+11}" text-anchor="end" style="font-family:var(--f-ui);font-size:12px;fill:var(--ink2)">${esc(r.label.length>26?r.label.slice(0,25)+'…':r.label)}</text><rect x="${lab}" y="${y+2}" width="${w}" height="12" rx="4" fill="${r.color||'var(--c1)'}"/><text x="${lab+w+6}" y="${y+12}">${esc(r.text!=null?r.text:Math.round(r.v)+(o.unit||''))}</text></g>`}).join('');
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'Bar chart')}">${g}${b}</svg>`}
function pairBars(rows,o){o=o||{};if(!rows.length)return`<p class="muted">Not enough data yet.</p>`;const W=640,lab=190,rh=38,H=rows.length*rh+24;const x=v=>lab+(W-lab-60)*clamp(v,0,100)/100;let g='';for(const t of[0,25,50,75,100])g+=`<line x1="${x(t)}" x2="${x(t)}" y1="4" y2="${H-18}" stroke="var(--line)"/><text x="${x(t)}" y="${H-4}" text-anchor="middle">${t}%</text>`;
  const b=rows.map((r,i)=>{const y=6+i*rh;return`<g data-tip="${esc(r.label+': timed '+r.a+'%, Blind Review '+r.b+'% (n='+r.n+')')}"><rect x="0" y="${y-2}" width="${W}" height="${rh}" fill="transparent"/><text x="${lab-8}" y="${y+18}" text-anchor="end" style="font-family:var(--f-ui);font-size:12px;fill:var(--ink2)">${esc(r.label)}</text><rect x="${lab}" y="${y+2}" width="${Math.max(2,x(r.a)-lab)}" height="11" rx="4" fill="var(--c1)"/><rect x="${lab}" y="${y+15}" width="${Math.max(2,x(r.b)-lab)}" height="11" rx="4" fill="var(--c2)"/><text x="${Math.max(x(r.a),x(r.b))+6}" y="${y+18}">${r.b-r.a>0?'+':''}${r.b-r.a}</text></g>`}).join('');
  return`<div class="legend" style="margin-bottom:6px"><span><i style="background:var(--c1)"></i>Timed</span><span><i style="background:var(--c2)"></i>Blind Review</span></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Timed versus Blind Review accuracy by skill">${g}${b}</svg>`}
function trendChart(h){if(h.length<2)return`<p class="muted">The trend appears after your projection has been recorded on two different days.</p>`;const W=640,H=200,L=40,R=16,T=12,B=26;const xs=i=>L+(W-L-R)*i/(h.length-1);const lo=Math.max(120,Math.min(...h.map(p=>p.lo))-3),hi=Math.min(180,Math.max(...h.map(p=>p.hi))+3);const y=v=>T+(H-T-B)*(1-(v-lo)/Math.max(1,hi-lo));
  const band=h.map((p,i)=>xs(i)+','+y(p.hi)).join(' ')+' '+h.slice().reverse().map((p,j)=>xs(h.length-1-j)+','+y(p.lo)).join(' ');const line=h.map((p,i)=>xs(i)+','+y(p.mid)).join(' ');let g='';const step=Math.max(1,Math.round((hi-lo)/4));for(let v=Math.ceil(lo);v<=hi;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const last=h[h.length-1];const dots=h.map((p,i)=>`<circle cx="${xs(i)}" cy="${y(p.mid)}" r="9" fill="transparent" data-tip="${esc(fmtDate(p.d)+': '+p.lo+' to '+p.hi)}"/>`).join('');
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Projected score range over time">${g}<polygon points="${band}" fill="var(--voltsoft)"/><polyline points="${line}" fill="none" stroke="var(--c2)" stroke-width="2"/><circle cx="${xs(h.length-1)}" cy="${y(last.mid)}" r="4" fill="var(--c2)" stroke="var(--card)" stroke-width="2"/><text x="${xs(h.length-1)-6}" y="${y(last.mid)-10}" text-anchor="end">${last.mid}</text>${dots}<text x="${L}" y="${H-6}">${fmtDate(h[0].d)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${fmtDate(last.d)}</text></svg>`}
function heatGrid(keys){return`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px">${keys.map(k=>{const m=mastery(k);const s=S.skills[k]||{n:0};const lvl=m<20?0:m<40?1:m<60?2:m<75?3:4;return`<div data-tip="${esc(k.replace(/^P:/,'').replace(/^RC:/,'RC ')+': mastery '+m+', '+s.n+' answered, '+tierName(k))}" style="border-radius:10px;padding:9px 10px;background:var(--seq${lvl});border:1px solid var(--line)"><div style="font-size:12.5px;font-weight:600;color:${lvl>=3?'var(--paper)':'var(--ink)'}">${esc(k.replace(/^P:/,'').replace(/_/g,' ').replace(/^RC:/,'RC · '))}</div><div class="mono" style="font-size:12px;color:${lvl>=3?'var(--paper)':'var(--ink2)'}">${m} · ${TIERS[tierIdx(k)]}</div></div>`}).join('')}</div><div class="legend" style="margin-top:8px">${['0 to 19','20 to 39','40 to 59','60 to 74','75+'].map((l,i)=>`<span><i style="background:var(--seq${i});border:1px solid var(--line)"></i>${l}</span>`).join('')}</div>`}
function calHeat(){const t=dayNum();const start=t-7*16-((new Date().getDay()+6)%7);let cells='';for(let d=start;d<=t;d++){const k=numToKey(d);const r=S.days[k];const m=r?r.sec/60:0;const lvl=m<=0?0:m<20?1:m<45?2:m<90?3:4;cells+=`<i style="background:var(--seq${lvl})" data-tip="${esc(fmtDate(d)+': '+Math.round(m)+' min'+(r&&r.qual?', qualified':''))}"></i>`}return`<div class="scroll"><div class="cal" role="img" aria-label="Study minutes per day, last 16 weeks">${cells}</div></div><div class="legend" style="margin-top:8px"><span><i style="background:var(--seq0);border:1px solid var(--line)"></i>none</span><span><i style="background:var(--seq1)"></i>under 20</span><span><i style="background:var(--seq2)"></i>20 to 45</span><span><i style="background:var(--seq3)"></i>45 to 90</span><span><i style="background:var(--seq4)"></i>90+ min</span></div>`}

VIEWS.stats=()=>{const a=liveA();const pr=projection();
  const by={};for(const x of a){const q=LIB.Q[x.q];const k=q.section==='RC'?'RC · '+q.type:q.type;const r=by[k]||(by[k]={c:0,n:0,s:0});r.c+=x.ok;r.n++;r.s+=x.sec}

  const dd=[1,2,3,4,5].map(s=>{const xs=a.filter(x=>x.d===s);return{label:s+' star',v:pct(sum(xs.map(x=>x.ok)),xs.length),text:xs.length?pct(sum(xs.map(x=>x.ok)),xs.length)+'% · n '+xs.length:'no data',tip:s+'-star: '+xs.length+' answered'}});
  const gapBy={};for(const x of a){if(x.re==null||x.m==='guided'||x.m==='speed')continue;const q=LIB.Q[x.q];const k=q.section==='RC'?'RC · '+q.type:q.type;const r=gapBy[k]||(gapBy[k]={c:0,b:0,n:0});r.c+=x.ok;r.b+=x.re;r.n++}
  const gapRows=Object.entries(gapBy).filter(([,r])=>r.n>=3).map(([k,r])=>({label:k,a:pct(r.c,r.n),b:pct(r.b,r.n),n:r.n})).sort((p,q)=>(q.b-q.a)-(p.b-p.a)).slice(0,10);
  const tr={},tw={};const wk=now()-7*DAY;for(const x of a){if(!x.tr)continue;tr[x.tr]=(tr[x.tr]||0)+1;if(x.t>wk)tw[x.tr]=(tw[x.tr]||0)+1}const trRows=Object.entries(tr).sort((p,q)=>q[1]-p[1]).slice(0,10);const mx=Math.max(1,...trRows.map(r=>r[1]));const tow=Object.entries(tw).sort((p,q)=>q[1]-p[1])[0];
  const cal=calibration();const blocks=[[0,6,'Late night'],[6,9,'Early'],[9,12,'Morning'],[12,15,'Midday'],[15,18,'Afternoon'],[18,21,'Evening'],[21,24,'Night']].map(([h1,h2,n])=>{const xs=a.filter(x=>{const h=new Date(x.t).getHours();return h>=h1&&h<h2});return{label:n+' ('+h1+' to '+h2+')',v:pct(sum(xs.map(x=>x.ok)),xs.length),text:xs.length?pct(sum(xs.map(x=>x.ok)),xs.length)+'% · n '+xs.length:'no data'}}).filter(r=>r.text!=='no data');
  const stam=[[1,5],[6,10],[11,15],[16,20],[21,25],[26,32]].map(([p1,p2])=>{const xs=a.filter(x=>(x.m==='sim'||x.m==='timed')&&x.pos>=p1&&x.pos<=p2);return{label:'Questions '+p1+' to '+p2,v:pct(sum(xs.map(x=>x.ok)),xs.length),text:xs.length?pct(sum(xs.map(x=>x.ok)),xs.length)+'% · n '+xs.length:'no data'}}).filter(r=>r.text!=='no data');
  const ch={helped:0,hurt:0,neutral:0};for(const x of a)if(x.cr)ch[x.cr]++;const why={};for(const k in S.why)why[S.why[k].tag]=(why[S.why[k].tag]||0)+1;const whyRows=Object.entries(why).sort((p,q)=>q[1]-p[1]);const wmx=Math.max(1,...whyRows.map(r=>r[1]));
  const lrKeys=lrTypesAvail().sort();const rcKeys=['P:humanities','P:social_science','P:natural_science','P:law','P:comparative'].concat(uniq(LIB.rc.map(id=>'RC:'+LIB.Q[id].type)));
  return`<div class="stack"><div><div class="eyebrow">Observatory</div><h1 class="disp">Where the score is hiding</h1><p class="sub">${a.length} answers on record. Quarantined questions are excluded everywhere.</p></div>
  <div class="grid g2"><div class="card"><h3>Projected range</h3><p class="sub" style="font-size:13.5px;margin:4px 0 8px">${pr.mid==null?`Unmapped. The model needs 5 timed LR sets (${pr.ts.LR} so far) and 5 timed RC sets (${pr.ts.RC}), or one logged official test.`:`Estimate ${pr.lo} to ${pr.hi}, center ${pr.mid}. An estimate from an approximate curve, never a promise. Official LawHub tests outrank it.`}</p>${trendChart(S.projHist)}</div>

/* ---------- Reports: weekly, ledger, plateau ---------- */
function weeklyDue(){return A.length>=10&&now()-(S.weeklyLast||S.createdAt)>=7*DAY}
function weekStats(from,to){const xs=liveA().filter(x=>x.t>=from&&x.t<to);const c=sum(xs.map(x=>x.ok));const re=xs.filter(x=>x.re!=null&&x.m!=='guided'&&x.m!=='speed');return{n:xs.length,acc:pct(c,xs.length),gap:re.length?pct(sum(re.map(x=>x.re)),re.length)-pct(sum(re.map(x=>x.ok)),re.length):0,xs}}
function buildWeekly(){const t=now();const cur=weekStats(t-7*DAY,t),prev=weekStats(t-14*DAY,t-7*DAY);const types=lrTypesAvail().filter(k=>(S.skills[k]||{}).n>=3);const weakest=types.slice().sort((a,b)=>mastery(a)-mastery(b));const strongest=types.slice().sort((a,b)=>mastery(b)-mastery(a));
  const wins=[];if(cur.n)wins.push(cur.n+' questions answered ('+cur.acc+'% correct).');if(prev.n&&cur.acc>prev.acc)wins.push('Accuracy up '+(cur.acc-prev.acc)+' points on last week.');if(strongest[0])wins.push(strongest[0]+' is your strongest type at '+mastery(strongest[0])+' mastery ('+tierName(strongest[0])+').');wins.push('Streak '+S.streak.cur+' days, '+weekRank().n+' of 7 days qualified.');
  const tw={};for(const x of cur.xs)if(x.tr)tw[x.tr]=(tw[x.tr]||0)+1;const topTrap=Object.entries(tw).sort((a,b)=>b[1]-a[1])[0];const weak=[];if(weakest[0])weak.push(weakest[0]+' at '+mastery(weakest[0])+' mastery.');if(topTrap)weak.push('Most chosen trap: '+trapName(topTrap[0])+' ('+topTrap[1]+'x).');if(cur.gap>8)weak.push('Conversion Gap of '+cur.gap+' points: you know more than you can do on the clock.');else if(mastery('P:humanities')<55)weak.push('Humanities passages at '+mastery('P:humanities')+' mastery.');
  const focus=weakest[0]||'Weaken';const plan=['Daily Climbs at your standard length, five days.','Two passes at the '+focus+' tower floors you have not cleared.','One Timed Trial on Saturday and one humanities passage on Sunday.',topTrap?'Visit the '+trapName(topTrap[0])+' exhibit and run its Trap Hunt.':'One Trap Hunt on your most common trap.'];
  const letter=`Jay, this week you put ${cur.n} questions on the record at ${cur.acc}%. ${prev.n?(cur.acc>=prev.acc?'That is movement in the right direction.':'That is down from last week, which happens; look at the causes, not the number.'):'This is your baseline week.'} The skill costing you the most is ${focus}. ${topTrap?'And the trap you keep stepping on is '+trapName(topTrap[0])+'. ':''}A 180 is built from removing the same two or three errors over and over until they are gone. Pick the one focus above and give it the week.`;
  const text=`ASCENT TO 180 · WEEKLY REPORT · ${dayKey()}\n\nWins\n${wins.map(w=>'- '+w).join('\n')}\n\nWeaknesses\n${weak.map(w=>'- '+w).join('\n')}\n\nFocus for next week: ${focus}\n\nPlan\n${plan.map(w=>'- '+w).join('\n')}\n\nCoach\n${letter}`;
  return{d:dayKey(),wins,weak,focus,plan,letter,text}}
VIEWS.reports=()=>{if(weeklyDue()){const r=buildWeekly();S.weekly.push(r);if(S.weekly.length>30)S.weekly.shift();S.weeklyLast=now();addXP(10);saveSoon()}const r=S.weekly[S.weekly.length-1];const led=ledgerMD();
  return`<div class="stack"><div><div class="eyebrow">Reports</div><h1 class="disp">Weekly report and ledger</h1></div>
  ${r?`<div class="card"><div class="row between"><h3>Week ending ${fmtDate(r.d)}</h3><button class="btn sm" data-a="copyFrom" data-v="wkText">Copy</button></div><div class="grid g3" style="margin-top:10px"><div><div class="eyebrow">Three wins</div><ul class="read">${r.wins.slice(0,3).map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div><div><div class="eyebrow">Weaknesses</div><ul class="read">${r.weak.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div><div><div class="eyebrow">Plan</div><ul class="read">${r.plan.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div></div><div class="callout" style="margin-top:12px"><p class="read" style="font-size:16.5px">${esc(r.letter)}</p></div><textarea id="wkText" rows="4" readonly style="margin-top:10px">${esc(r.text)}</textarea></div>`:`<div class="card flat"><h3>First report after 7 days and 10 answers</h3><p class="sub">It writes itself every week: three wins, three weaknesses, one focus, a plan and a short letter.</p></div>`}
  <div class="card"><h3>Plateau check</h3>${plateauHTML()}</div>
  <div class="card"><div class="row between"><h3>Progress Ledger</h3><div class="row"><button class="btn sm" data-a="copyLedger">Copy</button><button class="btn sm" data-a="dlLedger">Save as .md</button></div></div><p class="sub" style="font-size:13.5px;margin:4px 0 8px">Paste this into any AI chat so it can pick up where the game left off, or ask it for a pack aimed at your weaknesses.</p><textarea id="ledgerText" rows="14" readonly>${esc(led)}</textarea></div>
  ${S.weekly.length>1?`<div class="card"><h3>Past reports</h3>${S.weekly.slice(0,-1).reverse().map(w=>`<details><summary style="cursor:pointer">${fmtDate(w.d)} · focus ${esc(w.focus)}</summary><pre class="read" style="white-space:pre-wrap;font-size:14px">${esc(w.text)}</pre></details>`).join('')}</div>`:''}</div>`};
ACT.copyLedger=()=>{S.counters.ledger++;checkAch();saveSoon();copyText($('#ledgerText').value,$('#ledgerText'))};
ACT.dlLedger=()=>{S.counters.ledger++;checkAch();saveSoon();offerFile('ascent-progress-ledger.md',ledgerMD(),'Progress Ledger')};
function ledgerMD(){const pr=projection();const li=levelInfo(S.xp);const types=lrTypesAvail().concat(['P:humanities','P:social_science','P:natural_science','P:law','P:comparative']).filter(k=>(S.skills[k]||{}).n>=1||k.startsWith('P:'));const weak=types.sort((a,b)=>mastery(a)-mastery(b)).slice(0,5);const tr={};for(const x of liveA())if(x.tr)tr[x.tr]=(tr[x.tr]||0)+1;const traps=Object.entries(tr).sort((a,b)=>b[1]-a[1]).slice(0,5);const w7=weekStats(now()-7*DAY,now());
  return`# Ascent to 180: Progress Ledger\nGenerated ${new Date().toLocaleString()}\n\n## Snapshot\n- Level ${li.lv} (${S.xp} XP). Streak ${S.streak.cur} days, best ${S.streak.best}, ${S.streak.freezes} freezes.\n- Projected range: ${pr.mid==null?'unmapped (not enough timed data or official tests)':pr.lo+' to '+pr.hi+' (center '+pr.mid+', source: '+pr.src+')'}.\n- Goal ${S.profile.goal}, floor ${S.profile.floor}, test date ${S.profile.testDate||'not set'}, format ${S.settings.format}.\n- Answers on record: ${liveA().length}. Last 7 days: ${w7.n} at ${w7.acc}%, Conversion Gap ${w7.gap} points.\n\n## Top five weaknesses (mastery 0 to 100)\n${weak.map(k=>'- '+k.replace('P:','passages: ')+': '+mastery(k)+' ('+tierName(k)+', n='+((S.skills[k]||{}).n||0)+')').join('\n')}\n\n## Top five traps chosen\n${traps.map(([k,n])=>'- '+trapName(k)+' ('+k+'): '+n).join('\n')||'- none yet'}\n\n## Official tests\n${S.realTests.slice(-5).map(r=>'- '+r.date+' '+r.pt+': '+r.scaled).join('\n')||'- none logged'}\n\n## Recent reflections\n${S.reflections.slice(-3).map(r=>'- '+r.d+': mistake '+r.mistake+'; went well '+r.well+'; focus '+r.focus).join('\n')||'- none'}\n\n## Summary\nJay is training for a 180 with a floor of ${S.profile.floor}. Current weakest areas are ${weak.slice(0,3).map(k=>k.replace('P:','')).join(', ')}. ${traps[0]?'The most frequent wrong-answer pull is '+trapName(traps[0][0])+'. ':''}Reason from first principles, never cite prep companies or forums, use no em dashes, and finish every explanation with a flashcard.\n\n## Next pack request\nGenerate an Ascent to 180 pack (schema_version 1) aimed at: ${weak.slice(0,3).map(k=>k.replace('P:','')).join(', ')}${traps[0]?', with wrong answers built on '+traps.slice(0,3).map(t=>t[0]).join(', '):''}.\n`}
function plateauHTML(){const t=now();const a=weekStats(t-14*DAY,t),b=weekStats(t-28*DAY,t-14*DAY);if(a.n<20||b.n<20)return`<p class="sub" style="font-size:13.5px">Runs once there are at least 20 answers in each of the last two fortnights (now ${a.n} and ${b.n}).</p>`;
  if(a.acc>b.acc+2)return`<p class="read">No plateau: accuracy rose from ${b.acc}% to ${a.acc}%. Keep the current mix.</p>`;
  const xs=a.xs;const easyMiss=xs.filter(x=>!x.ok&&x.d<=2&&x.cf==='sure').length;const slowRight=xs.filter(x=>x.ok&&x.sec>130).length;const hurt=xs.filter(x=>x.cr==='hurt').length;const early=xs.filter(x=>x.pos&&x.pos<=10),late=xs.filter(x=>x.pos&&x.pos>=16);const fat=early.length>5&&late.length>5?pct(sum(early.map(x=>x.ok)),early.length)-pct(sum(late.map(x=>x.ok)),late.length):0;
  let d,rx;if(a.gap>=10){d='Speed gap';rx='Blind Review accuracy is '+a.gap+' points above timed. Swap one Main Quest a day for a Timed Trial, and drill the first ten questions at 55 seconds.'}else if(easyMiss>=4){d='Careless errors';rx=easyMiss+' easy questions missed while rated Sure. Slow the first read, and predict before looking at choices (Advanced Citadel: No Prediction Allowed).'}else if(fat>=12){d='Fatigue';rx='Accuracy drops '+fat+' points late in sets. Add one section sim a week and keep breathing resets between sections.'}else if(slowRight>=8||hurt>=4){d='Overthinking';rx=slowRight+' correct answers took over 2:10 and '+hurt+' changes went right to wrong. Set a hard 2:30 ceiling and change answers only with a stated reason.'}else{d='Content gap';rx='Untimed accuracy is flat too, so the limit is understanding. Go back to the Lesson floors of your two weakest towers and the matching Forge module.'}
  return`<p class="read"><b>Plateau detected: ${esc(d)}.</b> Accuracy ${b.acc}% then ${a.acc}% over the last two fortnights.</p><p class="sub" style="margin-top:6px">${esc(rx)}</p>`}

/* ---------- Library: packs, generation, quarantine ---------- */
const TRAP_CODES=['OUT_OF_SCOPE','EXTREME','REVERSAL','HALF_RIGHT','IRRELEVANT_COMPARISON','SHELL_GAME','RECYCLED_LANGUAGE','TOO_WEAK','TOO_STRONG','TRUE_BUT_IRRELEVANT','VALENCE_FLIP','DIRECTION_FLIP','TENSION_COLLAPSE','DEVICE_PROMOTION','EMPHASIS_ENDORSEMENT','ADJACENT_DOUBT','TOO_NARROW','TOO_BROAD','MISTAKEN_REVERSAL','MISTAKEN_NEGATION','QUANTIFIER_SHIFT','CAUSAL_REVERSAL','RESTATES_PREMISE','WRONG_DIRECTION','DEEPENS_PARADOX','EXPLAINS_HALF','NOT_NECESSARY','INSUFFICIENT','DESCRIBES_PART','MISMATCHED_STRUCTURE','DETAIL_AS_PURPOSE','PREMISE_ATTACK','SCOPE_SHIFT','OUTSIDE_KNOWLEDGE'];
function validQ(q,rc){const e=[];if(!q||typeof q!=='object')return['not an object'];if(!q.id)e.push('missing id');if(!q.type)e.push('missing type');if(!rc&&!q.stimulus)e.push('missing stimulus');if(!q.stem)e.push('missing stem');if(!q.choices||LET.some(L=>!q.choices[L]))e.push('needs choices A to E');if(!LET.includes(q.answer))e.push('answer must be A to E');const d=+q.difficulty;if(!(d>=1&&d<=5))e.push('difficulty 1 to 5');if(!q.explanation||!q.explanation.why_correct)e.push('missing explanation.why_correct');else{const w=q.explanation.why_wrong||{};if(LET.filter(L=>L!==q.answer).some(L=>!w[L]||!w[L].text))e.push('why_wrong needs the four wrong letters')}return e}
function validatePack(o){const errs=[];if(!o||typeof o!=='object')return{errs:['Pack must be a JSON object.']};if(!o.pack)errs.push('Missing "pack" id.');if(o.schema_version!==1)errs.push('schema_version must be 1.');const qs=[],ps=[];let skipped=0;
  for(const q of o.questions||[]){const e=validQ(q,false);if(e.length){skipped++;if(errs.length<12)errs.push((q&&q.id||'question')+': '+e.join(', '))}else qs.push(Object.assign({section:'LR',target_seconds:85,original:true},q))}
  for(const p of o.passages||[]){if(!p||!p.id||!Array.isArray(p.text)||!Array.isArray(p.questions)){skipped++;errs.push((p&&p.id||'passage')+': needs id, text[], questions[]');continue}const okQs=[];for(const q of p.questions){const e=validQ(q,true);if(e.length){skipped++;if(errs.length<12)errs.push(q.id+': '+e.join(', '))}else okQs.push(Object.assign({section:'RC',target_seconds:75,original:true},q))}if(okQs.length)ps.push(Object.assign({},p,{questions:okQs}))}
  return{errs,pack:{pack:String(o.pack||'pack-'+rid()),title:o.title||o.pack,schema_version:1,generated:!!o.generated,questions:qs,passages:ps},skipped,nq:qs.length+sum(ps.map(p=>p.questions.length)),np:ps.length}}
function installPack(pk){IMPORTED=IMPORTED.filter(p=>p.pack!==pk.pack);IMPORTED.push(pk);S.packsMeta=S.packsMeta.filter(m=>m.id!==pk.pack);S.packsMeta.push({id:pk.pack,title:pk.title,nq:(pk.questions||[]).length+sum((pk.passages||[]).map(p=>p.questions.length)),np:(pk.passages||[]).length,at:now(),generated:!!pk.generated});
  const okLocal=lsSet(LS.packs,JSON.stringify(IMPORTED));indexContent();writePack(pk);checkAch();saveNow();if(!okLocal&&!Store.db)toast('This browser is out of storage for packs. Export a save backup.','gold')}
VIEWS.library=()=>`<div class="stack"><div><div class="eyebrow">Library</div><h1 class="disp">Packs</h1><p class="sub" style="max-width:72ch;margin-top:6px">The engine is fixed; content arrives in packs. Ask any AI assistant for the next pack, paste the JSON here, and it joins your adaptive pool. Packs save with your progress.</p></div>
  <div class="card"><h3>Installed</h3><div class="scroll"><table class="t" style="margin-top:6px"><tr><th>Pack</th><th>Questions</th><th>Passages</th><th></th></tr>${LIB.packs.map(p=>`<tr><td>${esc(p.title)}${p.generated?' <span class="pill bad">generated, lower trust</span>':''}</td><td class="mono">${p.nq}</td><td class="mono">${p.np}</td><td>${p.id===PACK01.pack?'<span class="tag">built in</span>':`<button class="btn sm ghost" data-a="rmPack" data-v="${esc(p.id)}">Remove</button>`}</td></tr>`).join('')}</table></div></div>
  <div class="grid g2"><div class="card"><h3>Import a pack</h3><p class="sub" style="font-size:13.5px;margin:4px 0 8px">Paste the whole JSON, or choose a .json file.</p><textarea id="pkText" rows="8" placeholder='{"pack":"pack-02-weaken-strengthen","schema_version":1,"questions":[...]}'></textarea><div class="row" style="margin-top:8px"><button class="btn primary" data-a="importPack">Import</button><input type="file" id="pkFile" accept=".json,application/json"></div><div id="pkMsg" class="sub" style="margin-top:8px;font-size:13.5px"></div></div>
  <div class="card"><h3>Request the next pack</h3><p class="sub" style="font-size:13.5px;margin:4px 0 8px">Copies a request you paste into an AI chat. It includes the schema and your current weak spots.</p><select id="rqPack" style="width:100%">${(CURR.packRoadmap||[]).map(p=>`<option>${esc(p)}</option>`).join('')}<option>Custom: my top weaknesses and traps</option></select><div class="row" style="margin-top:8px"><button class="btn" data-a="packReq">Copy request</button></div><textarea id="rqText" rows="5" readonly style="margin-top:8px"></textarea></div></div>
  <div class="card"><h3>Flagged items</h3><p class="sub" style="font-size:13.5px;margin:4px 0 8px">Questions you reported. They are excluded from practice, scoring and projections until you restore them.</p><div class="scroll"><table class="t">${Object.keys(S.quarantine).map(id=>`<tr><td class="mono">${esc(id)}</td><td>${esc((S.quarantine[id]||{}).note||'')}</td><td><button class="btn sm" data-a="qView" data-v="${esc(id)}">View</button> <button class="btn sm ghost" data-a="unq" data-v="${esc(id)}">Restore</button></td></tr>`).join('')||'<tr><td class="muted">Nothing flagged.</td></tr>'}</table></div></div>
  <details class="card"><summary style="cursor:pointer"><b>Pack schema (version 1)</b></summary><pre class="mono" style="white-space:pre-wrap;font-size:12px;margin-top:8px">${esc(CURR.schemaDoc||'')}</pre></details></div>`;
ACT.importPack=async()=>{let txt=$('#pkText').value.trim();const f=$('#pkFile').files&&$('#pkFile').files[0];if(!txt&&f)txt=await f.text();const msg=$('#pkMsg');if(!txt){msg.textContent='Paste a pack or choose a file.';return}let o;try{o=JSON.parse(txt)}catch(e){msg.textContent='Not valid JSON: '+e.message;return}const r=validatePack(o);if(!r.nq){msg.innerHTML='Nothing importable. '+r.errs.map(esc).join('<br>');return}installPack(r.pack);S.counters.packs=(S.counters.packs||0)+1;toast('Imported '+r.nq+' questions'+(r.np?' in '+r.np+' passages':'')+'.','volt');render();const m2=$('#pkMsg');if(m2&&r.skipped)m2.innerHTML='Skipped '+r.skipped+' items:<br>'+r.errs.map(esc).join('<br>')};
ACT.rmPack=v=>confirmBox('Remove this pack?','Its questions leave the pool. Your answer history stays.','Remove',()=>{IMPORTED=IMPORTED.filter(p=>p.pack!==v);S.packsMeta=S.packsMeta.filter(m=>m.id!==v);lsSet(LS.packs,JSON.stringify(IMPORTED));indexContent();saveNow();render()});
ACT.packReq=()=>{const which=$('#rqPack').value;const led=ledgerMD();const t=`Build the next Ascent to 180 content pack: ${which}.\n\nRules: original questions only (never reproduce or paraphrase real LSAT items), exactly one defensible answer validated by the negation test, truth tables or Venn diagrams where relevant, answer letters balanced across A to E, no em dashes, reason from first principles, every wrong answer gets a trap code and a reason, every question gets a flashcard (back under 40 words). Output pure JSON only, schema_version 1, in this shape:\n\n${CURR.schemaDoc}\n\nMy current data:\n\n${led}`;$('#rqText').value=t;copyText(t,$('#rqText'))};
ACT.unq=v=>{delete S.quarantine[v];indexContent();saveSoon();render()};
ACT.qView=v=>showQuestionModal(v,{});
ACT.reportFlaw=v=>{openModal(`<h2 class="disp" style="font-size:24px">Report a flaw</h2><p class="sub" style="margin:6px 0 10px">What is wrong? Two defensible answers, a wrong key, an unclear stimulus. The question is quarantined: no scoring, no practice, listed under Flagged items in the Library.</p><textarea id="flawNote" rows="4" placeholder="B also weakens, because..."></textarea><div class="row" style="margin-top:10px"><button class="btn primary" data-a="flawGo" data-v="${esc(v)}">Quarantine it</button><button class="btn" data-a="closeModal">Cancel</button></div>`)};
ACT.flawGo=v=>{S.quarantine[v]={t:now(),note:($('#flawNote')||{}).value||''};delete S.cards[v];closeModal();toast('Quarantined. Thanks for keeping the library honest.');checkAch();saveNow();if(VIEW.name!=='play')render()};

/* ---------- Preferences and data ---------- */
VIEWS.prefs=()=>{const s=S.settings,p=S.profile;const seg=(key,opts)=>`<span class="seg">${opts.map(([v,l])=>`<button class="${String(s[key])===String(v)?'on':''}" data-a="setPref" data-v="${v}" data-k="${key}">${l}</button>`).join('')}</span>`;
  return`<div class="stack" style="max-width:980px"><div><div class="eyebrow">Preferences</div><h1 class="disp">Settings and save data</h1></div>
  <div class="card"><h3>Goals</h3><div class="grid g4" style="margin-top:8px"><label class="f">Goal<input type="number" data-bind="profile.goal" data-num value="${p.goal}"></label><label class="f">Floor<input type="number" data-bind="profile.floor" data-num value="${p.floor}"></label><label class="f">Test date<input type="date" data-bind="profile.testDate" value="${esc(p.testDate)}"></label><label class="f">Default climb<select data-bind="profile.minutes" data-num>${[20,45,90].map(m=>`<option value="${m}" ${p.minutes==m?'selected':''}>${m} min</option>`).join('')}</select></label></div></div>
  <div class="card"><h3>Test format</h3><p class="sub" style="font-size:13.5px;margin:4px 0 8px">Current format runs through June 2027. New format starts August 2027. This switches the simulators, pace guides and Test Facts.</p>${seg('format',[['current','Current (4 × 35 min)'],['new','New (RC 52 + LR 45 + LR 45)']])}</div>
  <div class="card"><h3>Mountain and sky</h3><div class="col" style="margin-top:8px"><div class="row between"><span>Scene</span>${seg('scene',[['live','Live'],['still','Still image'],['off','Off']])}</div><div class="row between"><span>Render quality</span>${seg('quality',[['auto','Auto'],['4k','4K (2160p)'],['native','Native'],['high','High'],['medium','Medium'],['low','Low']])}</div><div class="row between"><span>Sky</span>${seg('sky',[['auto','Your local time'],['dawn','Dawn'],['day','Day'],['dusk','Dusk'],['night','Night']])}</div><div class="row between"><span>Game layer during practice</span>${seg('focus',[[false,'Show pitches and O₂'],[true,'Focus mode']])}</div></div><p class="muted" style="font-size:12.5px;margin-top:10px">The mountain is rendered live on your graphics chip. Auto adapts to your graphics chip. Native renders at your screen's full pixel count and 4K renders about 8.3 million pixels (3840 x 2160), which looks sharpest but needs a strong GPU for the Live scene; pair 4K with Still image on most laptops. If a laptop runs warm, choose Low or Still image. Full simulations always hide the game layer.</p></div>
  <div class="card"><h3>Music</h3><div class="grid g2" style="margin-top:8px">${MUSIC.stations.map(st=>`<button class="mapzone" style="grid-template-columns:36px minmax(0,1fr) auto" data-a="musicStation" data-v="${st.id}">${icon('headphones',22)}<div><b>${esc(st.name)}</b><div class="sub" style="font-size:13px">${esc(st.desc)}</div></div>${S.settings.music.station===st.id?`<span class="pill ${MUSIC.playing?'volt':'gold'}">${MUSIC.playing?'Playing':'Selected'}</span>`:''}</button>`).join('')}</div>
   <div class="col" style="margin-top:12px"><div class="row between"><span>Volume</span><input type="range" id="musicVol" min="0" max="100" step="1" value="${Math.round(S.settings.music.vol*100)}" style="width:220px" aria-label="Music volume"></div><div class="row between"><span>During timed sections</span><span class="seg">${[['keep','Keep playing'],['lower','Lower'],['pause','Pause']].map(([v,l])=>`<button class="${S.settings.music.timed===v?'on':''}" data-a="setMusicTimed" data-v="${v}">${l}</button>`).join('')}</span></div><div class="row between"><span>Sound effects</span>${seg('sound',[[false,'Off'],[true,'On']])}</div></div><p class="muted" style="font-size:12.5px;margin-top:10px">Every track is generated live in your browser, so it never repeats exactly and needs no download.</p></div>
  <div class="card"><h3>Reading</h3><div class="col" style="margin-top:8px"><div class="row between"><span>Question and passage surface</span>${seg('theme',[['system','Match my device'],['light','Paper'],['dark','Night slate']])}</div><div class="row between"><span>Text size</span>${seg('fontScale',[[.92,'S'],[1,'M'],[1.1,'L'],[1.25,'XL']])}</div><div class="row between"><span>Reading font</span>${seg('readFont',[['serif','Literata serif'],['lexend','Lexend, reading ease']])}</div><div class="row between"><span>Motion</span>${seg('motion',[['system','System'],['reduce','Reduce']])}</div><div class="row between"><span>Timer by default</span>${seg('showTimer',[[true,'Show'],[false,'Hide']])}</div></div></div>
  <div class="card"><h3>Save data</h3><p class="sub" style="font-size:13.5px;margin:4px 0 10px">Status: ${esc({cloud:'saving to your account, so it follows you across devices',saving:'saving now',local:'saving in this browser only',cloudfail:'cloud save failing, browser save working',fail:'saving failed',starting:'connecting'}[Store.status]||Store.status)}. Last saved ${fmtAgo(Store.lastSave)}. Every answer autosaves.</p>
  <div class="row"><button class="btn primary" data-a="exportSave">Export Save</button><button class="btn" data-a="importSaveOpen">Import Save</button><button class="btn ghost" data-a="resetAll">Reset everything</button></div>${lsGet(LS.bak)?`<div class="row" style="margin-top:10px"><button class="btn" data-a="restoreBak">Restore the backed-up copy</button><span class="muted" style="font-size:12.5px">${esc(bakInfo())}</span></div>`:''}</div></div>`};
function bakInfo(){try{const b=JSON.parse(lsGet(LS.bak));const st=JSON.parse(b.core);return'Level '+levelInfo(st.xp||0).lv+', '+(b.att||[]).length+' answers, saved '+new Date(b.at).toLocaleString()}catch(e){return''}}
ACT.restoreBak=()=>confirmBox('Restore the backed-up copy?','This swaps your current progress for the backed-up copy. Your current progress is backed up first, so you can swap back.','Restore',()=>{try{const b=JSON.parse(lsGet(LS.bak));const cur=JSON.stringify(S),curA=A;S=migrate(JSON.parse(b.core));A=b.att||[];S.attChunks=Math.ceil(A.length/ATT_CHUNK);S.cloudRev=Store.remoteRev||0;S.rev=(Store.remoteRev||0)+1;stashBackup('swapped',cur,curA);SEEN=null;indexContent();applySettings();for(let i=0;i<S.attChunks;i++)Store.dirtyAtt.add(i);saveNow();render();toast('Backed-up copy restored.','volt')}catch(e){toast('That backup could not be read.')}});
ACT.setMusicTimed=v=>{S.settings.music.timed=v;saveSoon();render()};
ACT.setPref=(v,el)=>{const k=el.dataset.k;let val=v;if(v==='true')val=true;else if(v==='false')val=false;else if(k==='fontScale')val=+v;S.settings[k]=val;applySettings();if(k==='ambient')ambient(!!val);saveSoon();render()};
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset.bind)return;const path=t.dataset.bind.split('.');let o=S;for(let i=0;i<path.length-1;i++)o=o[path[i]];let v=t.value;if(t.dataset.num!=null)v=+v;o[path[path.length-1]]=v;saveSoon()});
ACT.exportSave=()=>{S.counters.backup++;checkAch();saveNow();offerFile('ascent-save-'+dayKey()+'.json',exportBlob(),'Save backup')};
ACT.importSaveOpen=()=>openModal(`<h2 class="disp" style="font-size:24px">Import Save</h2><p class="sub" style="margin:6px 0 10px">Paste an export, or choose the .json file. This replaces the current progress on this device and in your cloud save.</p><textarea id="isText" rows="8"></textarea><input type="file" id="isFile" accept=".json,application/json" style="margin-top:8px"><div id="isMsg" class="sub" style="margin-top:6px"></div><div class="row" style="margin-top:10px"><button class="btn primary" data-a="importSaveGo">Replace and restore</button><button class="btn" data-a="closeModal">Cancel</button></div>`);
ACT.importSaveGo=async()=>{let txt=$('#isText').value.trim();const f=$('#isFile').files&&$('#isFile').files[0];if(!txt&&f)txt=await f.text();const err=importSaveText(txt);if(err){$('#isMsg').textContent=err;return}closeModal();toast('Save restored.','volt');render()};
ACT.resetAll=()=>confirmBox('Reset everything?','This erases progress, cards, history and imported packs on this device and in your cloud save. Export first if there is any chance you want it back.','Yes, erase',()=>confirmBox('Really erase?','There is no undo.','Erase now',()=>{const keep=S.settings;S=freshState();S.settings=keep;A=[];S.cloudRev=Store.remoteRev||0;S.rev=(Store.remoteRev||0)+1;IMPORTED=[];lsSet(LS.packs,'[]');indexContent();Store.dirtyAtt.add(0);saveNow();render()}));

/* ---------- Help and Test Facts ---------- */
VIEWS.help=()=>`<div class="stack" style="max-width:980px"><div><div class="eyebrow">Help</div><h1 class="disp">How the climb works</h1></div>${(CURR.help||[]).map(h=>`<div class="card"><h3>${esc(h.t)}</h3><div class="prose" style="margin-top:6px">${h.p.map(x=>`<p>${fmtText(x)}</p>`).join('')}</div></div>`).join('')}<div class="card"><h3>Keyboard</h3><p class="sub">A to E select · Shift + letter or S then letter strikes · 1, 2, 3 confidence · F flag · N next · P back · H highlight selection · T timer · Enter check or next · Space flips flashcards.</p></div></div>`;
VIEWS.facts=()=>{const F=CURR.facts||{};return`<div class="stack" style="max-width:980px"><div><div class="eyebrow">Test Facts</div><h1 class="disp">The real test</h1><p class="sub" style="margin-top:6px">${esc(F.confirm||'')}</p></div>${(F.sections||[]).map(s=>`<div class="card"><h3>${esc(s.t)}</h3><ul class="read" style="margin:8px 0 0 18px">${s.items.map(i=>`<li>${fmtText(i)}</li>`).join('')}</ul></div>`).join('')}</div>`};

/* ---------- global click delegation ---------- */
ACT.fullscreen=()=>{try{if(document.fullscreenElement){document.exitFullscreen()}else{const r=document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(()=>toast('Full screen is not allowed here. Try the browser menu or F11, or open the page in its own tab.'))}}catch(e){toast('Full screen is not available in this view. Try F11 or open the page in its own tab.')}};
document.addEventListener('fullscreenchange',()=>{const fs=!!document.fullscreenElement;document.documentElement.classList.toggle('isfs',fs);const b=document.getElementById('fsbtn');if(b)b.innerHTML=icon(fs?'minimize':'maximize',17)});
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('[data-a]');if(!el)return;if(el.disabled)return;const fn=ACT[el.dataset.a];if(!fn)return;if(el.tagName==='A')e.preventDefault();try{fn(el.dataset.v,el,e)}catch(err){console.error(err);toast('That action failed: '+err.message)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MODAL){closeModal();return}if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.ch[role=button]')&&VIEW.name==='play'){e.preventDefault();choose(e.target.dataset.ch)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S)saveNow();else if(!document.hidden&&S&&!(typeof VIEW!=='undefined'&&VIEW&&VIEW.name==='play'))checkRemote()});

/* ---------- boot ---------- */
let SCENE_ON=false;function start(hotData){if(!SCENE_ON&&typeof SCENE!=='undefined'){const cv=document.getElementById('scene');if(cv){SCENE_ON=true;try{SCENE.init(cv)}catch(e){console.warn(e)}}}loadLocal();S.lastSeenPrev=S.lastSeen;indexContent();applySettings();const h=(location.hash||'').slice(1);if(hotData&&hotData.view&&VIEWS[hotData.view.name])VIEW=hotData.view;else if(VIEWS[h])VIEW={name:h,p:null};if(VIEW.name==='play'&&!S.active)VIEW={name:'home',p:null};
  for(const id in S.quarantine)if(S.cards[id])delete S.cards[id];render();Store.status=Store.localOk?'starting':'fail';renderSave();initCloud();checkAch();snapshotProjection();setTimeout(()=>saveNow(),1500)}
start({});

</script>
